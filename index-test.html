/* ------------------------- DUNGEON SCENE BACKDROP ------------------------- */
/* ============================ 16-BIT DUNGEON ============================
   The backdrop is drawn on the same pixel grid as the sprites — 200x96 stone
   blocks, flagstones in perspective, a voussoir arch and torch sconces — so
   the scene and the characters share one resolution and one palette instead
   of sprites sitting on smooth vector gradients.
   ====================================================================== */
const SCENE_W = 200, SCENE_H = 96;
const SCENE_HOR = 56, SCENE_VPX = 100;
/* The enemy stands in the doorway, so killing it is what opens the way on. */
const SCENE_DOOR_X = 112;
/* Torch anchors. The scene is cropped to the panel, so anything that must stay
   visible on a phone lives inside x 44..156. */
const SCENE_TORCH = [[56,30],[144,30]];

/* Everything in the dungeon falls toward this, not toward grey: shadows go
   cold and blue, and only what the fire reaches keeps its own colour. */
const SCENE_NIGHT = '#07070f';
const SCENE_FIRE  = '#ff9a3d';
const SCENE_COLD  = '#3f5f94';
function mixHex(a, b, t){
  const parse = h => { const c = String(h).replace('#','');
    const n = parseInt(c.length===3 ? c.split('').map(x=>x+x).join('') : c, 16);
    return [(n>>16)&255, (n>>8)&255, n&255]; };
  const A = parse(a), B = parse(b);
  return '#' + [0,1,2].map(i=>clamp(Math.round(A[i]+(B[i]-A[i])*t),0,255).toString(16).padStart(2,'0')).join('');
}
function scenePal(c, trial, isFinal){
  const base = trial ? '#8a3418' : (isFinal ? '#4f8f6a' : (c || '#8a9199'));
  /* lit(amount, warmth): how far a surface climbs out of the dark, and how much
     of that climb is firelight rather than the stone's own colour. */
  /* Away from the fire the stone goes blue, not grey - that is the whole
     difference between a dark room and a washed-out one. */
  const cold = mixHex(base, SCENE_COLD, .45);
  const lit  = (amt, warm)=> mixHex(SCENE_NIGHT, mixHex(cold, SCENE_FIRE, warm||0), amt);
  return {
    /* wall, five steps out of the dark — the torches pick which one a pixel gets */
    a:lit(.07), b:lit(.13), c:lit(.22,.06), d:lit(.35,.16), e:lit(.54,.30),
    m:lit(.05),                                          /* mortar               */
    k:'#05050d',                                         /* the dark beyond      */
    /* floor, always darker than the wall above it so the horizon reads          */
    f:lit(.07), g:lit(.13), h:lit(.22,.10), i:lit(.34,.24),
    j:'#05050c',                                         /* flagstone seam       */
    /* dressed stone: arch ring, buttresses, plinths                             */
    l:lit(.52,.14), n:lit(.36,.08), o:lit(.18),
    /* iron + fire                                                               */
    p:'#181420', q:'#33283a', r:'#ffb347', s:'#ffe9a8',
    /* what gets left on a dungeon floor: timber, iron, bone, rust               */
    W:mixHex(SCENE_NIGHT,'#7d5730',.80), B:mixHex(SCENE_NIGHT,'#7d5730',.56),
    D:mixHex(SCENE_NIGHT,'#7d5730',.32), I:lit(.56,.06), Q:lit(.34), N:'#a85028',
    /* region accents: t/u tint pair, v/x glow pair, y dark, z bone              */
    t:lit(.66,.04), u:lit(.30), v:'#ffe9a8', x:'#ff8c3a', y:'#05050c', z:lit(.74,.02),
  };
}
/* deterministic jitter so the stonework varies but never flickers between frames */
function sceneNoise(x, y){
  let n = Math.sin(x*12.9898 + y*78.233) * 43758.5453;
  return n - Math.floor(n);
}
/* falloff from the torches — this is what gives the flat masonry its depth */
function sceneLum(x, y, lights){
  let best = 0;
  for(let i=0;i<lights.length;i++){
    const L = lights[i];
    const dx = (x - L[0]) / L[2], dy = (y - L[1]) / (L[2]*0.9);
    const d2 = dx*dx + dy*dy;
    const v = 1 / (1 + d2*3.4);
    if(v > best) best = v;
  }
  return best;
}

function pixelDungeon(region, color, isFinal, trial){
  const g = pxGrid(SCENE_W, SCENE_H);
  const HOR = SCENE_HOR, VPX = SCENE_VPX;
  const wallLights = SCENE_TORCH.map(t=>[t[0], t[1]+4, 54]);
  const floorLights = SCENE_TORCH.map(t=>[t[0], HOR+14, 36]);

  /* ---- back wall: running bond, value chosen by torchlight ---- */
  const BW = 16, BH = 8, WALLTOP = 11;
  const steps = ['a','b','c','d','e'];
  for(let y=WALLTOP; y<HOR; y++){
    const row = Math.floor((y-WALLTOP)/BH);
    const off = (row % 2) ? Math.floor(BW/2) : 0;
    for(let x=0; x<SCENE_W; x++){
      const lum = sceneLum(x, y, wallLights);
      if(((y-WALLTOP) % BH) === 0 || ((x+off) % BW) === 0){ g[y][x] = 'm'; continue; }
      const bx = Math.floor((x+off)/BW);
      const jit = (sceneNoise(bx, row) - 0.5) * 0.9;
      let idx = Math.round(lum*6.2 + jit - 0.35);
      if(((y-WALLTOP) % BH) === 1) idx += 1;            /* lit top lip of a course */
      if(((y-WALLTOP) % BH) === BH-1) idx -= 1;         /* shadow under it         */
      g[y][x] = steps[clamp(idx, 0, 4)];
    }
  }

  /* ---- ceiling: near black, with ribs running back to the arch ---- */
  R(g, 0, 0, SCENE_W, WALLTOP, 'k');
  for(let i=-4;i<=4;i++){
    if(!i) continue;
    for(let y=0;y<WALLTOP;y++){
      const t = 1 - y/WALLTOP;
      const x = Math.round(VPX + i*(3 + 20*t*t));
      if(x>=0 && x<SCENE_W) g[y][x] = 'a';
    }
  }
  R(g, 0, WALLTOP-2, SCENE_W, 2, 'o');                  /* cornice */
  R(g, 0, WALLTOP-3, SCENE_W, 1, 'l');
  /* stalactites biting down out of the dark */
  [18, 62, 92, 128, 176].forEach((x,i)=>{
    const len = 4 + ((i*5)%7);
    for(let j=0;j<len;j++){
      const w = Math.max(0, Math.round((len-j)/2.2));
      for(let dx=-w; dx<=w; dx++) if(g[WALLTOP+j] && x+dx>=0 && x+dx<SCENE_W) g[WALLTOP+j][x+dx] = dx===-w ? 'b' : 'a';
    }
  });

  /* ---- buttresses framing the shot ---- */
  [28, 172].forEach(bx=>{
    for(let y=WALLTOP-3; y<HOR+3; y++){
      for(let dx=-6; dx<=6; dx++){
        const x = bx+dx; if(x<0||x>=SCENE_W) continue;
        const lum = sceneLum(x, y, wallLights);
        let key = dx===-6 ? 'o' : (dx===-5 ? 'n' : (dx>=5 ? 'o' : 'l'));
        if(lum < 0.18 && key==='l') key = 'o';
        if((y % 9) === 0) key = 'o';                     /* course joints */
        g[y][x] = key;
      }
    }
    R(g, bx-8, HOR-2, 17, 5, 'o');                       /* plinth */
    R(g, bx-8, HOR-2, 17, 1, 'n');
    R(g, bx-7, WALLTOP-4, 15, 2, 'n');                   /* capital */
  });

  /* ---- the arch: half round, voussoir ring, dark beyond ---- */
  const AX = SCENE_DOOR_X, AR = 26, ATOP = 18, ABOT = HOR;   /* the way out, behind the enemy */
  for(let y=ATOP; y<ABOT; y++){
    const dy = (ATOP + AR) - y;
    const half = dy > 0 ? Math.round(Math.sqrt(Math.max(0, AR*AR - dy*dy))) : AR;
    if(half <= 0) continue;
    for(let x=AX-half-4; x<=AX+half+4; x++){
      if(x<0||x>=SCENE_W) continue;
      const inside = Math.abs(x-AX) <= half;
      const edge = Math.abs(x-AX) - half;
      if(inside){
        /* the passage: a faint glow at the far end so it reads as depth */
        const d = Math.hypot((x-AX)/AR, (y-(ATOP+AR+8))/AR);
        g[y][x] = d < 0.30 ? 'a' : (d < 0.46 ? 'y' : 'k');
      } else if(edge <= 4){
        const seg = Math.floor((y*1.6 + Math.abs(x-AX)*0.8) / 6) % 2;
        g[y][x] = edge >= 4 ? 'o' : (seg ? 'l' : 'n');
      }
    }
  }
  /* keystone */
  R(g, AX-3, ATOP-4, 7, 6, 'n'); R(g, AX-2, ATOP-3, 5, 4, 'l');
  /* The stairwell. There is no door in a dungeon - there is a way further down.
     Each tread behind the last is narrower and darker, so the flight reads as
     dropping away from you into the black. */
  for(let i=0;i<8;i++){
    const yy = ABOT - 5 - i*4;
    const half = Math.max(4, AR - 4 - i*2);
    if(yy < ATOP+6) break;
    const shade = i < 2 ? 'n' : (i < 4 ? 'o' : (i < 6 ? 'y' : 'k'));
    const lip   = i < 2 ? 'l' : (i < 4 ? 'n' : (i < 6 ? 'o' : 'y'));
    R(g, AX-half, yy, half*2+1, 4, shade);       /* the riser */
    R(g, AX-half, yy, half*2+1, 1, lip);         /* its lit nose */
    for(let d=0; d<=1; d++){                      /* the side walls close in */
      const x1 = AX-half-1-d, x2 = AX+half+1+d;
      for(let yy2=yy; yy2<yy+4; yy2++){
        if(!g[yy2]) continue;
        if(x1>=0 && Math.abs(x1-AX) <= AR) g[yy2][x1] = d ? 'y' : 'o';
        if(x2<SCENE_W && Math.abs(x2-AX) <= AR) g[yy2][x2] = d ? 'y' : 'o';
      }
    }
  }
  /* the landing and the first three steps spilling out of the opening */
  for(let i=0;i<3;i++){
    const w = 48 + i*11, yy = HOR - 3 + i*2;
    R(g, AX-Math.floor(w/2), yy, w, 2, i%2 ? 'o' : 'n');
    R(g, AX-Math.floor(w/2), yy, w, 1, 'l');
  }

  /* ---- floor: flagstones on a one point perspective ---- */
  const spAt = (y)=>{ const t = (y - HOR + 1) / (SCENE_H - HOR); return 5 + 30*Math.pow(t, 1.8); };
  const seams = []; { let y = HOR + 3, gap = 3; while(y < SCENE_H){ seams.push(y); y += gap; gap += Math.max(1, Math.round(gap*0.5)); } }
  const fsteps = ['f','g','h','i'];
  for(let y=HOR; y<SCENE_H; y++){
    const t = (y - HOR + 1) / (SCENE_H - HOR);
    const sp = spAt(y);
    let rowIdx = 0; for(let i=0;i<seams.length;i++) if(y >= seams[i]) rowIdx = i+1;
    for(let x=0; x<SCENE_W; x++){
      const col = Math.round((x - VPX)/sp);
      const lum = sceneLum(x, y, floorLights)*1.7 + 0.02 + 0.22*t;
      const jit = sp > 7 ? (sceneNoise(col+7, rowIdx+31) - 0.5) * 0.95 : 0;
      g[y][x] = fsteps[clamp(Math.round(lum*3.6 + jit - 0.45), 0, 3)];
    }
  }
  /* Joints are walked line by line and filled between steps, so a receding seam
     stays one unbroken stroke instead of a dotted diagonal. */
  for(let i=-7;i<=7;i++){
    if(!i) continue;
    let prev = null;
    for(let y=HOR+2; y<SCENE_H; y++){
      const x = Math.round(VPX + i*spAt(y));
      if(prev !== null){
        const lo = Math.min(prev, x), hi = Math.max(prev, x);
        for(let xx=lo; xx<=hi; xx++) if(xx>=0 && xx<SCENE_W) g[y][xx] = 'j';
      } else if(x>=0 && x<SCENE_W) g[y][x] = 'j';
      prev = x;
      if(x < -4 || x > SCENE_W+4) break;
    }
  }
  seams.forEach(y=>{ if(g[y]) for(let x=0;x<SCENE_W;x++) g[y][x] = 'j'; });
  /* contact shadow where the wall meets the ground */
  for(let x=0;x<SCENE_W;x++){ g[HOR][x] = 'j'; if(g[HOR+1]) g[HOR+1][x] = 'f'; }

  /* ---- torch sconces (the flame itself is animated on top) ---- */
  SCENE_TORCH.forEach(([tx,ty])=>{
    R(g, tx-1, ty+5, 3, 8, 'p');                         /* stem     */
    R(g, tx-1, ty+5, 1, 8, 'q');
    R(g, tx-3, ty+3, 7, 3, 'p');                         /* cup      */
    R(g, tx-2, ty+4, 5, 1, 'q');
    R(g, tx-2, ty+13, 5, 2, 'p');                        /* wall bracket */
  });

  /* ---- what the dungeon leaves lying about ---- */
  drawDebris(g, HOR);

  /* ---- region landmarks, painted into the same pixels ---- */
  const fx = REGION_FX[trial ? 11 : (region || 1)];
  if(fx) fx(g, HOR);
  return g;
}

/* Scraps on the flagstones. Nothing here is decoration for its own sake - it is
   the wreckage of whoever came down these stairs before you. Things nearer the
   camera are drawn larger, and the two places the fighters stand are left clear.
   ------------------------------------------------------------------------ */
function drawDebris(g, HOR){
  const put = (x, y, rows)=>{ for(let j=0;j<rows.length;j++) P(g, y+j, x, rows[j]); };

  /* --- far back, small and dim, sitting against the stair landing --- */
  put(56, HOR+5,  ['.II.', 'I..I', '.II.']);            /* a coil of chain */
  put(146, HOR+4, ['QQQ', 'QIQ', '.Q.']);               /* a rusted cap */

  /* --- mid ground, either side of the way down --- */
  /* a sword driven into a crack, hilt standing */
  put(44, HOR+14, ['..II..', '.IIII.', 'QIIIIQ', '..II..',
                   '..II..', '..II..', '..II..', '..I...']);
  /* a split shield, its rim bitten through */
  put(150, HOR+13, ['..QQIIQQ..', '.QIWWWWIQ.', 'QIWW..WWIQ',
                    '.QIWWWWIQ.', '..QQIIQQ..']);
  /* a ribcage picked clean */
  put(76, HOR+13, ['z.z.z.z.z', 'zzzzzzzzz', 'z.z.z.z.z',
                   'zzzzzzzzz', '.z.z.z.z.']);
  put(128, HOR+16, ['.NNN.', 'N...N', 'N...N', '.N.N.']);  /* pot shards */

  /* --- foreground, big enough to read, clear of both fighters --- */
  /* a crate burst open */
  put(58, HOR+21, ['..BBBBBB..', '.BWWWWWWB.', 'BW.DDDD.WB',
                   'BWDDDDDDWB', '.BWWWWWWB.', '..BBBBBB..',
                   '...D..D...']);
  /* a torn sack, spilled */
  put(146, HOR+22, ['..BBBB..', '.BWWWWB.', 'BWWWWWWB',
                    'BWWWWWWB', '.BWWWWB.', '..BBBB..', '...NN...']);
  /* a broken skull */
  put(90, HOR+27, ['..zzzz..', '.zz..zz.', 'zz....zz',
                   'zz.zz.zz', '.zzzzzz.', '..z..z..']);
  put(20, HOR+19, ['DBBBBBBBBBD']);                     /* a fallen board */
  /* a long bone */
  put(176, HOR+17, ['.zzz.', 'zzzzz', '.zzz.', '..z..', '..z..']);
}

/* Each region paints a few landmarks straight into the stone, so the flavour is
   part of the pixel art rather than decals floating over it. */
const REGION_FX = {
  1: (g,H)=>{                                   /* Moldering Crypt: bones, webs */
    const skull=(x,y)=>{ P(g,y,x,'.zzz.'); P(g,y+1,x,'zvvvz'); P(g,y+2,x,'zyvyz'); P(g,y+3,x,'.zvz.'); P(g,y+4,x,'.z.z.'); };
    skull(60,H+6); skull(144,H+11); R(g,60,H+11,5,1,'j'); R(g,144,H+16,5,1,'j');
    [[70,H+13],[124,H+7]].forEach(([x,y])=>{ P(g,y,x,'zzzzzzz'); P(g,y+1,x,'.z...z.'); });
    /* corner webs: four radial threads tied together by quarter arcs */
    const web=(cx,cy,dir)=>{
      const set=(x,y)=>{ x=Math.round(x); y=Math.round(y); if(g[y]&&x>=0&&x<SCENE_W) g[y][x]='z'; };
      const a0=0.10, a1=1.40, R=15;
      for(let i=0;i<4;i++){ const a=a0+(a1-a0)*i/3;
        for(let r=0;r<R;r++) set(cx+dir*r*Math.cos(a), cy+r*Math.sin(a)); }
      [6,10,14].forEach(r=>{ for(let k=0;k<=24;k++){ const a=a0+(a1-a0)*k/24;
        set(cx+dir*r*Math.cos(a), cy+r*Math.sin(a)); } });
    };
    web(34,11,1); web(166,11,-1);
  },
  2: (g,H)=>{                                   /* Sunken Grotto: water, algae  */
    for(let y=H+3;y<SCENE_H;y++) for(let x=0;x<SCENE_W;x++) if(sceneNoise(x,y*3)<0.10) g[y][x]='t';
    [[58,H+10],[112,H+16],[150,H+8]].forEach(([x,y])=>{ const w=9+((x*3)%11);
      P(g,y,x,'t'.repeat(w)); P(g,y+1,x+1,'u'.repeat(Math.max(1,w-2))); });
    [50,74,126,150].forEach((x,i)=>{ const len=5+((i*5)%7); for(let j=0;j<len;j++) if(g[11+j]) g[11+j][x]= j%2?'t':'u'; });
  },
  3: (g,H)=>{                                   /* Ember Foundry: lava cracks   */
    const crack=(x,y,n)=>{ let cx=x; for(let i=0;i<n;i++){ const yy=y+i; if(!g[yy]) break;
      cx += sceneNoise(x+i,i)<0.5?-1:1; if(cx>0&&cx<SCENE_W-1){ g[yy][cx]='v'; g[yy][cx+1]='x'; } } };
    crack(62,H+5,24); crack(138,H+9,18); crack(100,H+24,12);
    [[46,H-8],[154,H-8]].forEach(([x,y])=>{ R(g,x-2,y,5,2,'x'); R(g,x-1,y+2,3,1,'v'); });
  },
  4: (g,H)=>{                                   /* Frostbound Hollow: icicles   */
    [46,60,78,122,140,156].forEach((x,i)=>{ const len=6+((i*4)%9);
      for(let j=0;j<len;j++){ const w=Math.max(0,Math.round((len-j)/3));
        for(let dx=-w;dx<=w;dx++){ const xx=x+dx; if(g[11+j]&&xx>=0&&xx<SCENE_W) g[11+j][xx]= dx===-w?'z':'u'; } } });
    /* frost clusters rather than per pixel salt */
    for(let y=H+2;y<SCENE_H;y++) for(let x=0;x<SCENE_W;x+=2){
      if(sceneNoise(Math.floor(x/3), Math.floor(y/2)) > 0.055) continue;
      g[y][x]='z'; if(x+1<SCENE_W) g[y][x+1]='z';
      if(g[y+1]){ g[y+1][x]='t'; if(x+1<SCENE_W) g[y+1][x+1]='t'; }
    }
  },
  5: (g,H)=>{                                   /* Venomwood: vines, mushrooms  */
    [48,66,118,152].forEach((x,i)=>{ const len=12+((i*6)%15); let cx=x;
      for(let j=0;j<len;j++){ if(!g[11+j]) break; if(j%4===3) cx += sceneNoise(x,j)<0.5?-1:1;
        if(cx>0&&cx<SCENE_W){ g[11+j][cx]='u'; if(j%5===2&&cx+1<SCENE_W) g[11+j][cx+1]='t'; } } });
    const shroom=(x,y)=>{ P(g,y,x,'.vvv.'); P(g,y+1,x,'vxxxv'); P(g,y+2,x,'..u..'); P(g,y+3,x,'..u..'); };
    shroom(56,H+12); shroom(142,H+17); shroom(86,H+27);
  },
  6: (g,H)=>{                                   /* Shattered Ruins: rubble      */
    const crack=(x,y,n)=>{ let cx=x; for(let i=0;i<n;i++){ const yy=y-i; if(!g[yy]) break;
      cx += sceneNoise(x,i)<0.5?-1:1; if(cx>0&&cx<SCENE_W) g[yy][cx]='y'; } };
    crack(58,H-4,22); crack(142,H-6,26); crack(78,H-8,12);
    [[52,H+9],[148,H+13]].forEach(([x,y])=>{ for(let i=0;i<4;i++) P(g,y+i,x-i,'z'.repeat(3+i*2)); });
  },
  7: (g,H)=>{                                   /* Storm Spire: sky breaches    */
    [[52,18],[148,24]].forEach(([x,y])=>{ for(let j=0;j<14;j++){ const w=Math.round(7*Math.sin(Math.PI*j/14));
      for(let dx=-w;dx<=w;dx++){ const xx=x+dx; if(g[y+j]&&xx>=0&&xx<SCENE_W) g[y+j][xx]= Math.abs(dx)===w?'z':'y'; } } });
    const bolt=(x,y)=>{ for(let i=0;i<7;i++){ const xx=x+(i%2?1:0)+Math.floor(i/3); if(g[y+i]&&xx<SCENE_W) g[y+i][xx]='v'; } };
    bolt(52,22); bolt(148,28);
  },
  8: (g,H)=>{                                   /* Shadow Catacombs: niches     */
    [[56,24],[144,24]].forEach(([x,y])=>{
      for(let j=0;j<20;j++){ const w = j<6 ? Math.round(6*Math.sin(Math.PI*0.5*(j/6))) : 6;
        for(let dx=-w;dx<=w;dx++){ const xx=x+dx; if(g[y+j]&&xx>=0&&xx<SCENE_W) g[y+j][xx]= Math.abs(dx)===w?'o':'y'; } }
      P(g,y+16,x-2,'zzzzz'); P(g,y+14,x-1,'zzz'); P(g,y+13,x,'v'); });
  },
  9: (g,H)=>{                                   /* Obsidian Depths: magma seams */
    /* cracks glowing up through the flagstones, riding the same perspective as
       the joints and dimming back toward the horizon */
    [-4.6, -2.1, 0.7, 2.5, 4.5].forEach((lane, i)=>{
      let wob = 0;
      for(let y=H+3; y<SCENE_H; y++){
        const t = (y - H + 1) / (SCENE_H - H);
        const sp = 5 + 30*Math.pow(t, 1.8);
        wob += (sceneNoise(i*13, y) < 0.5 ? -0.4 : 0.4);
        const x = Math.round(SCENE_VPX + lane*sp + wob);
        if(x < 1 || x >= SCENE_W-1) break;
        const hot = t > 0.3;
        g[y][x] = hot ? 'v' : 'x';
        if(hot) g[y][x+1] = 'x';
      }
    });
    /* obsidian shards leaning off the wall, lit down one edge */
    [[50,H-18],[150,H-24]].forEach(([x,y])=>{ for(let j=0;j<16;j++){ const w=Math.max(1,Math.round((16-j)/4));
      for(let dx=-w;dx<=w;dx++){ const xx=x+dx; if(g[y+j]&&xx>=0&&xx<SCENE_W) g[y+j][xx]= dx===-w?'z':(dx===w?'y':'o'); } } });
  },
  10:(g,H)=>{                                   /* Hollow Sanctum: banners      */
    [[40,13],[160,13]].forEach(([x,y])=>{
      R(g,x-6,y,13,2,'t');                                   /* rod          */
      R(g,x-5,y+2,11,22,'u');                                /* cloth        */
      R(g,x-1,y+2,3,22,'t');                                 /* centre band  */
      R(g,x-5,y+2,1,22,'y'); R(g,x+5,y+2,1,22,'y');          /* folds        */
      for(let i=0;i<5;i++){ const w=11-i*2;                  /* swallowtail  */
        P(g,y+24+i,x-5,'u'.repeat(Math.max(0,Math.floor(w/2))));
        P(g,y+24+i,x+1+i,'u'.repeat(Math.max(0,Math.floor(w/2))));
      }
      P(g,y+10,x-2,'.v.'); P(g,y+11,x-3,'vxxxv'); P(g,y+12,x-2,'xvx'); P(g,y+13,x-1,'v');
    });
  },
  11:(g,H)=>{                                   /* Trial: scorched brand        */
    for(let y=12;y<H-4;y++) for(let x=0;x<SCENE_W;x++) if(sceneNoise(x,y+99)<0.045) g[y][x]='y';
    [[58,24],[142,24]].forEach(([x,y])=>{ P(g,y,x-2,'vvvvv'); P(g,y+1,x-1,'xvx'); P(g,y+2,x,'v'); });
  },
};

/* Flames and their light sit above the pixels so they can flicker. */
/* ------------------------------ FIRE ------------------------------------
   The old torch was three stacked rectangles with scale(.9,1.14) pulsing on
   them, which is not a flame - it is a small person breathing. Fire does not
   scale, it changes shape: the tongue leans, a tip tears loose and rises as an
   ember, the base stays put. So it is authored the way every other moving
   thing in this game is - whole frames, swapped - on the same pixel grid as
   the room it is standing in.
   ---------------------------------------------------------------------- */
const FIRE_PAL = {o:'#e0480c', O:'#ff8c1a', y:'#ffc95a', w:'#fff6d8'};
/* 7 wide, 9 tall, base on the bottom row. Six frames, and they do not simply
   alternate - the tongue walks left, tears, and comes back. */
const FIRE_FRAMES = [
  ['...w...', '..wyw..', '..yyy..', '.yOyOy.', '.OOyOO.', 'oOOOOOo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
  ['..w....', '..wy...', '.wyyw..', '.yOyy..', 'yOOyOy.', 'oOOOOOo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
  ['....w..', '...yw..', '..wyyw.', '..yyOy.', '.yOyOOy', 'oOOOOOo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
  ['...o...', '...w...', '..wyw..', '..yyy..', '.yOOOy.', 'oOOOOOo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
  ['..o....', '...ww..', '..yyw..', '.yyOy..', '.yOOOy.', 'oOOOOoo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
  ['....o..', '..ww...', '..wyy..', '..yOyy.', '.yOOOOy', 'ooOOOOo', 'oOOOOOo', '.oOOOo.', '..ooo..'],
];
/* an ember that has left the flame entirely, on its own slower loop */
const FIRE_EMBERS = [
  ['.', 'w', '.'], ['w', '.', '.'], ['.', '.', 'w'], ['.', 'o', '.'],
];
/* rows of characters -> <path> runs, placed in the scene's own coordinates */
function pxPathsAt(rows, x0, y0, pal){
  const by = {};
  rows.forEach((row, j)=>{
    let run = null;
    for(let i=0;i<=row.length;i++){
      const ch = row[i];
      if(run && ch !== run.ch){
        (by[run.ch] = by[run.ch] || []).push(`M${x0+run.i} ${y0+j}h${i-run.i}v1h-${i-run.i}z`);
        run = null;
      }
      if(ch && ch !== '.' && !run) run = {ch, i};
    }
  });
  return Object.keys(by).map(k=>`<path d="${by[k].join('')}" fill="${pal[k]||'#f0f'}"/>`).join('');
}
function sceneTorchFx(){
  const glow = (x,y)=>`<circle class="torch-glow" cx="${x+0.5}" cy="${y+4}" r="34" fill="url(#scGlow)"/>`;
  /* the pool each torch throws on the flagstones */
  const pool = (x)=>`<ellipse class="torch-glow" cx="${x}" cy="${SCENE_HOR+15}" rx="40" ry="15" fill="url(#scGlow)"/>`;
  const flame = (x, y, i)=>{
    const lead = i * 130;                       /* the two torches are not in step */
    let out = `<g class="tflame">`;
    FIRE_FRAMES.forEach((rows, k)=>{
      out += `<g class="tk tk${k}" style="animation-delay:${lead}ms">${pxPathsAt(rows, x-3, y-3, FIRE_PAL)}</g>`;
    });
    out += `</g>`;
    /* two embers leaving it, on a much longer loop so they read as separate */
    out += `<g class="tember" style="animation-delay:${lead}ms">${pxPathsAt(['w'], x-1, y-4, FIRE_PAL)}</g>`;
    out += `<g class="tember slow" style="animation-delay:${lead+700}ms">${pxPathsAt(['o'], x+2, y-3, FIRE_PAL)}</g>`;
    return out;
  };
  return SCENE_TORCH.map(([x])=>pool(x)).join('') +
         SCENE_TORCH.map(([x,y])=>glow(x,y)).join('') +
         SCENE_TORCH.map(([x,y],i)=>flame(x,y,i)).join('');
}

/* ========================= ABOVE GROUND, FLOOR 41+ =========================
   The first forty floors are a dungeon and look like one. After that they are
   not: the Sunken City is a city, the Storm Spire has weather, and standing a
   minotaur in a torchlit corridor with a stalactite over its head was the one
   thing making the second half of the run feel like the first half with bigger
   numbers. From floor 41 the room changes every ten floors and each one is
   built to match what actually lives there.

   These use the same palette keys as the dungeon - a..e back, f..i ground,
   l/n/o dressed stone, t/u tint, v/x glow, y dark, z bone - so every effect
   layered over the scene (the boss entrance dimming, the ultimate cinematic,
   the evolution flash) keeps working without knowing which room it is in.
   ========================================================================= */
const OUT_FIRST_FLOOR = 41;
function outdoorKind(region, trial){
  if(trial) return 0;
  return (region >= 5 && region <= 10) ? region : 0;
}
function isOutdoorFloor(floor){ return !!outdoorKind(regionForFloor(floor||1), false); }

       l:'#a8ae96', n:'#737a64', o:'#474c3d', t:'#8fd05a', u:'#3d6b2c', v:'#f6ffd6', x:'#c2e868',

       l:'#c0c7d3', n:'#7f8695', o:'#474d5a', t:'#8fa8c4', u:'#333e54', v:'#eef5ff', x:'#9fd2ff',

  /* 81-90 Obsidian Depths: a caldera, and the dragon lives in it */
  9:  {sky:['#12060a','#4a1310','#9c2a14'], gnd:['#150909','#573028'], seam:'#0c0506', void:'#080304',

       y:'#030209', z:'#f0e2ff'},
};
function ramp(a, b, n){ return Array.from({length:n}, (_,i)=>mixHex(a, b, i/(n-1))); }
function scenePalOutside(kind){
  const S = OUT_PAL[kind];
  const sky = ramp(S.sky[0], S.sky[1], 3).concat(ramp(S.sky[1], S.sky[2], 3).slice(1));
  const gnd = ramp(S.gnd[0], S.gnd[1], 4);
  return {
    a:sky[0], b:sky[1], c:sky[2], d:sky[3], e:sky[4], m:S.seam, k:S.void,
    f:gnd[0], g:gnd[1], h:gnd[2], i:gnd[3], j:S.seam,
    l:S.l, n:S.n, o:S.o,
    p:'#181420', q:'#33283a', r:'#ffb347', s:'#ffe9a8',
    W:'#7a5c39', B:'#523d27', D:'#33261a', I:mixHex(S.n,'#cfd6e2',.5), Q:S.o, N:'#a85028',
    t:S.t, u:S.u, v:S.v, x:S.x, y:S.y, z:S.z,
  };
}

/* ---- the primitives every outdoor room is built out of ---- */
function outSky(g, HOR, keys){
  for(let y=0; y<HOR; y++){
    const k = keys[clamp(Math.round((y/(HOR-1))*(keys.length-1)), 0, keys.length-1)];
    for(let x=0; x<SCENE_W; x++) g[y][x] = k;
  }
}
/* A silhouette standing on baseY: two sines out of phase plus a little noise,
   so it is ragged rather than corrugated. */
function outRidge(g, baseY, amp, per, seed, key, downTo){
  for(let x=0; x<SCENE_W; x++){
    const h = Math.round(amp*(0.45 + 0.30*Math.sin((x+seed*13)/per) + 0.25*Math.sin((x+seed*7)/(per*0.37)))
                         + amp*0.35*sceneNoise(Math.floor(x/4)+seed, seed));
    for(let y=baseY-h; y<downTo; y++) if(g[y] && y>=0) g[y][x] = key;
  }
}
/* Ground on the same one point perspective as the flagstones, but grained
   rather than jointed - soil, ash and moss have no courses. */
function outGround(g, HOR, keys, opt){
  opt = opt || {};
  const lights = opt.lights || [[SCENE_VPX, HOR + 16, 78]];
  for(let y=HOR; y<SCENE_H; y++){
    const t = (y - HOR + 1) / (SCENE_H - HOR);
    for(let x=0; x<SCENE_W; x++){
      const lum = sceneLum(x, y, lights)*(opt.lit==null?1.3:opt.lit) + (opt.amb==null?0.16:opt.amb) + 0.34*t;
      const jit = (sceneNoise(Math.floor(x/2)+9, Math.floor(y*1.7)) - 0.5) * (opt.grain==null?1.1:opt.grain);
      g[y][x] = keys[clamp(Math.round(lum*(keys.length-1) + jit), 0, keys.length-1)];
    }
  }
}
/* The way on. The enemy stands in it, exactly as it stood in the doorway. */
function outPath(g, HOR, key, edgeKey, opt){
  opt = opt || {};
  for(let y=HOR + (opt.from||0); y<SCENE_H; y++){
    const t = (y - HOR + 1) / (SCENE_H - HOR);
    const w = Math.round((opt.w0==null?3:opt.w0) + (opt.w1==null?40:opt.w1)*Math.pow(t, 1.7));
    for(let d=-w; d<=w; d++){
      const x = SCENE_DOOR_X + d; if(x<0 || x>=SCENE_W) continue;
      g[y][x] = (Math.abs(d) >= w-1) ? edgeKey : key;
    }
  }
}
function outTrunk(g, x, topY, botY, w, key, lit){
  for(let y=topY; y<=botY; y++){
    if(!g[y]) continue;
    const ww = w + Math.round((y-topY)/16);
    for(let d=-ww; d<=ww; d++){
      const xx = x + d + Math.round(2*Math.sin(y/13));
      if(xx<0 || xx>=SCENE_W) continue;
      g[y][xx] = (d === -ww) ? lit : key;
    }
  }
}
/* A lobed radius, not a clean ellipse: three harmonics around the angle so a
   cloud, a canopy and a nebula all come out lumpy. Perfect ovals were making
   every one of them read as a sticker. */
function outBlob(g, cx, cy, rx, ry, key, seed, lobe){
  seed = seed || (cx*0.37 + cy*0.11);
  const L = lobe == null ? 1 : lobe;
  for(let y=cy-ry-3; y<=cy+ry+3; y++){
    if(!g[y] || y<0) continue;
    for(let x=cx-rx-3; x<=cx+rx+3; x++){
      if(x<0 || x>=SCENE_W) continue;
      const dx = (x-cx)/rx, dy = (y-cy)/ry;
      if(!dx && !dy){ g[y][x] = key; continue; }
      const a = Math.atan2(dy, dx);
      const r = 1 - 0.20*L + L*(0.22*Math.sin(a*3 + seed) + 0.13*Math.sin(a*5 - seed*1.7)
                                + 0.09*Math.sin(a*9 + seed*0.6));
      if(dx*dx + dy*dy <= r*r) g[y][x] = key;
    }
  }
}
function outColumn(g, x, topY, botY, w, opt){
  opt = opt || {};
  for(let y=topY; y<=botY; y++){
    if(!g[y]) continue;
    for(let d=-w; d<=w; d++){
      const xx = x+d; if(xx<0 || xx>=SCENE_W) continue;
      g[y][xx] = d === -w ? 'l' : (d === w ? 'o' : (((d+w) % 3) ? 'n' : 'o'));
    }
  }
  if(opt.cap){ R(g, x-w-2, topY-3, w*2+5, 3, 'n'); R(g, x-w-2, topY-3, w*2+5, 1, 'l'); }
  if(opt.base){ R(g, x-w-2, botY-2, w*2+5, 3, 'o'); R(g, x-w-2, botY-2, w*2+5, 1, 'n'); }
}

const OUT_SCENE = {
  /* ---- 41-50 Venomwood Thicket: you are in a wood, in the light ---- */
  5: (g, HOR)=>{
    outSky(g, HOR, ['a','a','b','c','d','e','e']);
    outRidge(g, HOR-1, 17, 21, 2, 'u', HOR);              /* far treeline   */
    outRidge(g, HOR,   9, 11, 7, 'y', HOR);               /* nearer, darker */
    outGround(g, HOR, ['f','g','h','i'], {grain:1.3});
    outPath(g, HOR, 'B', 'D');
    /* the canopy: a lumpy mass across the top built out of small clumps of
       leaf, with the sky showing through where they do not meet */
    for(let i=0;i<26;i++){
      const x = -6 + i*8 + Math.round(6*sceneNoise(i, 3));
      const y = 1 + Math.round(11*sceneNoise(i, 9));
      outBlob(g, x, y, 9 + Math.round(5*sceneNoise(i,1)), 6 + Math.round(4*sceneNoise(i,5)), 'y', i);
      if(i % 2) outBlob(g, x-2, y-2, 6, 4, 'u', i*2);
    }
    /* two trunks framing the shot where the buttresses used to be, each
       carrying its own crown so it reads as one tree rather than two things */
    [[20, 1], [180, 4]].forEach(([x, s])=>{
      for(let k=0;k<7;k++) outBlob(g, x + (k%2?13:-11), 2+k*5, 13, 7, 'y', k+s);
      const inward = x < 100 ? 1 : -1;
      /* Wood, in the timber keys, so the trunk is the one brown thing in a
         frame that is otherwise entirely green. It flares only at the roots. */
      for(let y=14; y<HOR+10; y++){
        const t = clamp((y - (HOR-14)) / 24, 0, 1);
        const w = 3 + Math.round(5*t*t*t);
        const cx = x + Math.round(2.5*Math.sin(y/17));
        for(let d=-w; d<=w; d++){
          const xx = cx+d; if(xx<0 || xx>=SCENE_W || !g[y]) continue;
          g[y][xx] = (d === -w) ? 'W' : (d >= w-1 ? 'D' : (((d+Math.floor(y/3))%4) ? 'B' : 'D'));
        }
      }
      [[26,0.55],[38,0.34]].forEach(([y0,slope],k)=>{     /* a limb reaching in */
        for(let j=0;j<20;j++){
          const xx = x + inward*(3+j), yy = y0 - Math.round(j*slope);
          if(!g[yy] || xx<0 || xx>=SCENE_W) continue;
          g[yy][xx]='B'; if(g[yy+1]) g[yy+1][xx]='D';
          if(j>12 && j%3===0) outBlob(g, xx, yy-3, 7, 5, 'y', j+k);
        }
      });
    });
    /* shafts of sun: wide soft bands leaning in, brightest down the middle */
    [[54,0],[104,1],[146,2]].forEach(([x0,i])=>{
      for(let y=6; y<HOR+10; y++){
        const cx = x0 + Math.round(y*0.40);
        const fade = 1 - (y-6)/(HOR+6);                   /* it thins as it falls */
        for(let d=-6; d<=6; d++){

    [[14,HOR+12],[40,HOR+20],[168,HOR+16],[190,HOR+24]].forEach(([x,y],i)=>{

    });
    /* the city it is named for, sinking into the green */
    outColumn(g, 46, HOR-22, HOR+2, 3, {cap:1, base:1});
    outColumn(g, 156, HOR-14, HOR+4, 3, {base:1});
    R(g, 40, HOR-26, 30, 3, 'o'); R(g, 40, HOR-26, 30, 1, 'n');

  /* ---- 51-60 Shattered Ruins: an open plaza, late in the day ---- */
  6: (g, HOR)=>{

  /* ---- 61-70 Storm Spire: weather, at the top of something very tall ---- */
  7: (g, HOR)=>{

    for(let y=HOR-4; y<SCENE_H; y++){
      const t = (y-HOR+5)/(SCENE_H-HOR+4);

    for(let a=0;a<64;a++){ const th = a/64*Math.PI*2;

    outRidge(g, HOR-1, 15, 33, 4, 'y', HOR);              /* hills */

    [[70,HOR+9],[140,HOR+13]].forEach(([x,y])=>{ P(g,y,x,'.v.'); P(g,y+1,x,'vxv'); P(g,y+2,x,'.v.'); });

  /* ---- 81-90 Obsidian Depths: a caldera, and the dragon lives in it ---- */
  9: (g, HOR)=>{

    [[30,9,44,9],[120,4,50,10],[184,13,34,8],[72,16,38,7]].forEach(([x,y,rx,ry],i)=>{

    outRidge(g, HOR-2, 22, 27, 6, 'o', HOR);              /* the crater wall */
    /* the lava lake behind it, showing through the gaps */
    for(let x=0;x<SCENE_W;x++) for(let y=HOR-4;y<HOR;y++)
      if(g[y][x] !== 'o' && sceneNoise(x, y) < 0.7) g[y][x] = (y > HOR-2) ? 'v' : 'x';
    /* obsidian spires leaning off the rim */
    [[40,HOR-2,20],[168,HOR-2,26],[76,HOR-4,13]].forEach(([x,y,h])=>{
      for(let j=0;j<h;j++){ const w = Math.max(1, Math.round((h-j)/3.2));
        for(let d=-w; d<=w; d++){ const xx=x+d, yy=y-j;
          if(g[yy] && xx>=0 && xx<SCENE_W) g[yy][xx] = d===-w ? 'n' : (d===w ? 'y' : 'o'); } }
    });
    outGround(g, HOR, ['f','g','h','i'], {grain:1.4, lit:1.1, amb:0.10});
    /* the basalt is cracked, and it is glowing through */
    [-4.6, -2.4, 0.5, 2.6, 4.7].forEach((lane, i)=>{
      let wob = 0;
      for(let y=HOR+2; y<SCENE_H; y++){
        const t = (y-HOR+1)/(SCENE_H-HOR), sp = 5 + 30*Math.pow(t, 1.8);
        wob += sceneNoise(i*11, y) < 0.5 ? -0.5 : 0.5;
        const x = Math.round(SCENE_VPX + lane*sp + wob);
        if(x < 1 || x >= SCENE_W-1) break;
        g[y][x] = t > 0.28 ? 'v' : 'x';
        if(t > 0.28) g[y][x+1] = 'x';
      }
    });
    outPath(g, HOR, 'h', 'x', {w0:3, w1:22});
    /* embers going up, thickest near the vents */
    for(let y=HOR-16; y<SCENE_H; y++) for(let x=0; x<SCENE_W; x+=2)
      if(sceneNoise(x*2, y*5) < 0.016) g[y][x] = 'v';

    P(g,HOR+24,58,'..zzzz..'); P(g,HOR+25,58,'.zz..zz.'); P(g,HOR+26,58,'zz.zz.zz');
    P(g,HOR+27,58,'.zzzzzz.');
    P(g,HOR+16,152,'z.z.z.z'); P(g,HOR+17,152,'zzzzzzz'); P(g,HOR+18,152,'z.z.z.z');
  },

  /* ---- 91-100 Hollow Sanctum: no room, and nothing underneath ---- */
  10: (g, HOR)=>{
    outSky(g, HOR, ['a','a','b','b','c','c','d']);
    R(g, 0, HOR, SCENE_W, SCENE_H-HOR, 'k');              /* there is no floor */
    /* stars, and a few that are brighter than stars */
    for(let y=0; y<SCENE_H; y++) for(let x=0; x<SCENE_W; x++)
      if(sceneNoise(x*7, y*3) < 0.022) g[y][x] = sceneNoise(x, y) < 0.3 ? 'z' : 'u';

    [[28, 18], [22, 12], [16, 7]].forEach(([r, n], k)=>{

    [46, 154].forEach((x,i)=>{

    });
  },
};

function pixelOutside(kind){

/* ========================== THINGS THAT LIVE HERE ==========================
   The rooms were beautiful and completely dead - nothing in them moved except
   the two fighters, so a floor read as a painted backdrop rather than a place.
   This is a thin layer of small animals over the top: bats under the ceiling,
   a rat working the wall line, moths in the torchlight, birds crossing the
   canopy, embers coming off the lava. None of it touches the pixel art
   underneath and none of it is in the way of the fight.

   It is built once per room and then re-parented on every render rather than
   rebuilt - moving a live node does not restart a CSS animation, but making a
   new one does, and a bat that teleports back to the wall every time you
   answer a question is worse than no bat.
   ======================================================================= */
const LIFE_PAL = {
  k:'#0a0812', d:'#241d2e', D:'#3a2f46', r:'#4a3527', R:'#6b4d35',
  g:'#6fbf4a', G:'#a8e86b', y:'#ffd05a', w:'#fff6d8', o:'#ff8c1a', e:'#ff5f22',
  b:'#8fa8c4', p:'#c79bff', a:'#5f6ccc', n:'#9aa0a8', s:'#e8f2ff',
};
/* Two frames each, and the wings are the only thing that moves. */
const CRITTERS = {
  bat:    {w:9, h:4, ms:150, f:[['.k.....k.','kkk.k.kkk','.kkkkkkk.','...k.k...'],
                                ['.........','kk..k..kk','.kkkkkkk.','..kk.kk..']]},
  bird:   {w:9, h:4, ms:260, f:[['k.......k','.k.....k.','..kk.kk..','....k....'],
                                ['.........','.........','kk.kkk.kk','...kkk...']]},
  rat:    {w:10,h:4, ms:110, f:[['..ddd.....','.dddddd.DD','dd.dddd...','..d...d...'],
                                ['..ddd.....','.dddddd.DD','dd.dddd...','...d.d....']]},
  moth:   {w:5, h:4, ms:90,  f:[['.y.y.','yyyyy','.yry.','..r..'],
                                ['.....','yy.yy','.yry.','..r..']]},
  flutter:{w:7, h:4, ms:130, f:[['.p...p.','pppppp.','.ppppp.','...w...'],
                                ['..p.p..','.ppppp.','..ppp..','...w...']]},
  leaf:   {w:4, h:3, ms:300, f:[['.GG.','GGGG','.gg.'], ['..G.','.GGg','.g..']]},
  drip:   {w:1, h:2, ms:0,   f:[['b','b']]},
  mote:   {w:1, h:1, ms:0,   f:[['n']]},
  spark:  {w:1, h:1, ms:0,   f:[['w']]},
  ember:  {w:1, h:2, ms:0,   f:[['o','e']]},
  ash:    {w:2, h:1, ms:0,   f:[['nn']]},

/* Sized against the room's own grid, not the screen's. The backdrop is 200
   pixels wide however big the panel is, so one of its pixels is 0.5% of the
   scene - a nine-pixel bat is 4.5%, and stays the right size at any width.
   At a few CSS pixels they were invisible next to art whose pixels are four
   times that. */
function lifeWidthPct(kind, scale){ return CRITTERS[kind].w * 0.5 * (scale || 1); }
function lifeSprite(kind){
  const c = CRITTERS[kind];
  const gs = c.f.map((rows,i)=>`<g class="cf cf${i}">${pxPathsAt(rows, 0, 0, LIFE_PAL)}</g>`).join('');
  return `<svg class="crit${c.f.length>1?' k2':''}" viewBox="0 0 ${c.w} ${c.h}"
    preserveAspectRatio="xMidYMid meet"
    shape-rendering="crispEdges" style="--cms:${c.ms}ms">${gs}</svg>`;
}

function lifePlanFor(kind){ return SCENE_LIFE[kind] || SCENE_LIFE.dungeon; }

/* Deterministic scatter: the same room always lays out the same way, so it is
   a place rather than a lava lamp. */
function buildLifeLayer(kind){ return buildLifePlan(lifePlanFor(kind), kind); }
function buildLifePlan(plan, seedKey){
  const layer = document.createElement('div');
  layer.className = 'scene-life';
  let seed = String(seedKey||'').length;
  plan.forEach(([crit, n, motion, band, dur, scale], gi)=>{
    for(let i=0;i<n;i++){
      seed++;
      const r1 = sceneNoise(seed*7, gi*13), r2 = sceneNoise(seed*3+1, gi*29), r3 = sceneNoise(seed*11, gi*5);
      const top = band[0] + (band[1]-band[0])*r1;
      const secs = dur[0] + (dur[1]-dur[0])*r2;
      const wpct = lifeWidthPct(crit, scale);
      const d = el(`<div class="lf lf-${motion}" style="
        --y:${top.toFixed(1)}%;
        top:${top.toFixed(1)}%;
        left:${(r3*100).toFixed(1)}%;
        width:${wpct.toFixed(2)}%;
        --dur:${secs.toFixed(2)}s;
        --lag:${(-secs*r2).toFixed(2)}s;
        --amp:${(3 + r1*7).toFixed(1)}px;
        --sway:${(r3 < 0.5 ? -1 : 1)};
        opacity:${(0.55 + r3*0.45).toFixed(2)};
      ">${lifeSprite(crit)}</div>`);
      layer.appendChild(d);
    }
  });
  return layer;
}
/* One layer per room, kept alive across renders. */
function sceneLifeLayer(kind){
  if(reducedMotion()) return null;
  if(!App.__life || App.__life.kind !== kind){
    App.__life = {kind, node: buildLifeLayer(kind)};
  }
  return App.__life.node;
}
function dungeonScene(region, color, isFinal, trial){
  /* Above ground there are no sconces to flicker, so the torch layer comes off
     with the stonework rather than being left burning in mid air. */
  const out = outdoorKind(region, trial);
  const pal = out ? scenePalOutside(out) : scenePal(color, trial, isFinal);
  const grid = out ? pixelOutside(out) : pixelDungeon(region, color, isFinal, trial);
  return `<svg class="scene-bg-svg" viewBox="0 0 ${SCENE_W} ${SCENE_H}" preserveAspectRatio="xMidYMid slice"
    shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">

      <stop offset=".45" stop-color="#ff9a3d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/>
    </radialGradient></defs>
    ${pixelPaths(grid, pal)}
    ${out ? '' : `<g shape-rendering="auto">${sceneTorchFx()}</g>`}
  </svg>`;
}

/* ============================== GAMEPLAY HELPERS: LEVEL / STATS ============================== */
function xpToNext(level){ return 40 + (level-1)*22; }
function classProg(){ return App.character.classProgress[App.character.classId]; }
function levelStats(classId, level){
  const c = CLASSES[classId];
  return { hp: c.base.hp + c.growth.hp*(level-1), atk: c.base.atk + c.growth.atk*(level-1), def: c.base.def + c.growth.def*(level-1), energyMax: c.base.energyMax };
}
/* Equipment belongs to whoever is wearing it, not to the save file. Every
   class keeps its own loadout and they do not share: the backpack is common,
   because the party loots together, but a sword hung on the warrior is not
   also on the rogue. One item, one wearer. */
function emptyLoadout(){
  return {weapon:null, head:null, chest:null, gloves:null, boots:null, artifact1:null, artifact2:null};
}
function loadoutFor(classId, ch){
  ch = ch || App.character;
  ch.loadouts = ch.loadouts || {};
  if(!ch.loadouts[classId]) ch.loadouts[classId] = emptyLoadout();
  return ch.loadouts[classId];
}
function equipMap(ch){ ch = ch || App.character; return loadoutFor(ch.classId, ch); }
/* who, if anyone, is already wearing this */
function wornBy(id, ch){
  ch = ch || App.character;
  const lo = ch.loadouts || {};
  for(const cid in lo){ for(const s in lo[cid]) if(lo[cid][s] === id) return cid; }
  return null;
}
function isWornAnywhere(id, ch){ return !!wornBy(id, ch); }
function getEquippedItem(slot){
  const ch = App.character;
  const id = equipMap(ch)[slot];
  if(!id) return null;
  if(slot==='weapon') return ch.weapons.find(w=>w.id===id) || null;
  return ch.armors.find(a=>a.id===id) || null;
}
function artifactSlots(){ return ['artifact1','artifact2']; }
function isArtifactEquipped(key){ const e = equipMap(); return e.artifact1===key || e.artifact2===key; }
function isArtifactActive(key){
  const art = App.character.artifacts[key];
  return !!(art && art.owned && art.charges>0 && isArtifactEquipped(key));
}
function avgMasteryPct(){
  let total=0, count=0;
  App.subjects.forEach(s=> (s.flashcards||[]).forEach(c=>{ total+=(c.mastery||0); count++; }));
  if(!count) return 0;
  return (total/count)/5*100;
}
function combatStats(){
  const ch = App.character;
  const prog = classProg();
  const cls = CLASSES[ch.classId];
  const lvl = levelStats(ch.classId, prog.level);
  let atk=lvl.atk, def=lvl.def, hp=lvl.hp, critChance=5, energyMax=lvl.energyMax, lifestealPct=0;
  let spd = (cls.base.spd || 10) + Math.floor(prog.level/6);   /* a point every six levels */
  let atkPct=0, defPct=0, hpPct=0, energyGainPct=0;
  Object.keys(prog.allocated).forEach(nodeId=>{
    const node = findSkillNode(ch.classId, nodeId);
    if(!node) return;
    const e = node.effect||{};
    if(e.atk) atk+=e.atk;
    if(e.def) def+=e.def;
    if(e.hp) hp+=e.hp;
    if(e.critChance) critChance+=e.critChance;
    if(e.mods){
      atkPct += e.mods.atkPct||0; defPct += e.mods.defPct||0; hpPct += e.mods.hpPct||0;
      critChance += (e.mods.critChancePct||0); lifestealPct += (e.mods.lifestealPct||0); energyGainPct += (e.mods.energyGainPct||0);
    }
  });
  const weapon = getEquippedItem('weapon');
  if(weapon){ atk += weapon.atk; critChance += weapon.critBonus||0; lifestealPct += weapon.lifeBonus||0; }
  ARMOR_SLOTS.forEach(slot=>{ const a=getEquippedItem(slot); if(a){ def+=a.def; spd+=a.spd||0; } });
  atk += ch.strength*2; hp += ch.maxHpBonus*10;
  if(isArtifactActive('titan')){
    if(ch.titanStat==='hp') hpPct+=0.15;
    if(ch.titanStat==='atk') atkPct+=0.12;
    if(ch.titanStat==='def') defPct+=0.12;
    if(ch.titanStat==='energy') energyMax+=1;
  }
  critChance += Math.floor(avgMasteryPct()/20);
  if(typeof omenIs === 'function' && omenIs('witchlight')) critChance += 25;
  let buffAtkPct = 0;                 /* the part of atkPct that is temporary */
  (App.run.buffs||[]).forEach(b=>{
    if(b.stat==='spd') spd += b.amount;
    if(b.stat==='atkPct'){ atkPct += b.amount; buffAtkPct += b.amount; }
    else if(b.stat==='defPct') defPct += b.amount;
    else if(b.stat==='hpPct') hpPct += b.amount;
    else if(b.stat==='critPct') critChance += b.amount;
  });
  if(runBonusActive('might')){ atkPct += 0.25; hpPct += 0.2; }
  if(runBonusActive('hide')){ defPct += 0.35; }
  const atkNoBuff = Math.round(atk*(1+atkPct-buffAtkPct));
  atk = Math.round(atk*(1+atkPct));
  def = Math.round(def*(1+defPct));
  hp = Math.round(hp*(1+hpPct));
  return {atk, atkNoBuff, buffAtkPct, def, maxHp:hp, spd:Math.max(1,Math.round(spd)), critChance:clamp(critChance,0,90), energyMax, lifestealPct, energyGainPct, weapon};
}

  const n = parseFloat(back);
  if(!isNaN(n) && /^-?\d+(\.\d+)?$/.test(String(back).trim())){
    const delta = Math.max(1, Math.round(Math.abs(n)*0.15))||1;

/* ---------- multiplication tables ---------- */
function numDistractors(ans, steps, n){
  const out = [], seen = {};
  seen[ans] = 1;
  shuffle(steps.slice()).forEach(st=>{
    shuffle([ans+st, ans-st]).forEach(v=>{
      if(v>0 && !seen[v] && out.length<n){ seen[v]=1; out.push(v); }
    });
  });
  let k = 1;
  while(out.length<n){ const v = ans + k*7; if(v>0 && !seen[v]){ seen[v]=1; out.push(v); } k++; }
  return out;
}
function buildMulQuestion(diffId){
  const d = DIFFS[diffId] || DIFFS.medium;
  let prompt, correct, steps;
  if(d.id==='easy'){
    const a = randInt(2,5), b = randInt(1,10);
    prompt = a+' × '+b+' = ?'; correct = a*b; steps = [a, b, 1, 2];
  } else if(d.id==='medium'){
    const a = randInt(6,12), b = randInt(2,12);
    if(chance(25)){ prompt = a+' × ? = '+(a*b); correct = b; steps = [1,2,3,4]; }
    else { prompt = a+' × '+b+' = ?'; correct = a*b; steps = [a, b, 1, 10]; }
  } else {
    const form = randInt(1,3);
    if(form===1){ const a=randInt(12,20), b=randInt(7,20); prompt=a+' × '+b+' = ?'; correct=a*b; steps=[a,b,1,10]; }
    else if(form===2){ const a=randInt(6,12), b=randInt(4,9), c=randInt(2,6); prompt=a+' × '+b+' × '+c+' = ?'; correct=a*b*c; steps=[a*b,a*c,b*c,1]; }
    else { const a=randInt(11,19), b=randInt(6,19); prompt='? × '+b+' = '+(a*b); correct=a; steps=[1,2,3,5]; }
  }
  const q = {id:uid(), cardId:null, subjId:null, prompt, correct:String(correct),
             mode: d.id==='hard' ? 'text' : 'mcq', options:[], hintUsed:false, eliminatedIdx:null,
             difficulty:d.id, sourceLabel:'Multiplication Tables'};
  if(q.mode==='mcq') q.options = shuffle([String(correct)].concat(numDistractors(correct, steps, d.opts-1).map(String)));
  return q;
}

/* ---------- flashcard questions ---------- */
function buildCardQuestion(pool, diffId, subj){
  const d = DIFFS[diffId] || DIFFS.medium;
  let cands = pool;
  if(d.id==='easy'){ const known = pool.filter(c=>(c.mastery||0)>=3); if(known.length) cands = known; }
  else if(d.id==='hard'){ const weak = pool.filter(c=>(c.mastery||0)<=1); if(weak.length) cands = weak; }
  const card = pickWeightedCard(cands);
  const others = pool.filter(c=>c.id!==card.id);
  const short = String(card.back).trim().length <= 28;
  let mode = (d.id==='hard' && short) ? 'text' : 'mcq';
  let options = [];
  if(mode==='mcq'){
    const want = d.opts - 1;
    const distractors = shuffle(others.map(c=>c.back)).slice(0, want);
    while(distractors.length < want) distractors.push(scrambleAnswer(card.back));
    options = shuffle([card.back].concat(distractors));
    if(options.length < 2) mode = 'text';
  }
  return {id:uid(), cardId:card.id, subjId: subj ? subj.id : null, prompt:card.front, correct:card.back,
          mode, options, hintUsed:false, eliminatedIdx:null, difficulty:d.id,
          sourceLabel: subj ? subj.name : 'Demo Deck'};
}

/* ---------- where this realm's questions come from ---------- */
function subjectSourcesFor(subj){
  const out = [];
  if(!subj) return out;
  if(subj.builtin==='multiplication') out.push({kind:'mul', subj});
  if(subj.flashcards && subj.flashcards.length) out.push({kind:'cards', subj});
  return out;
}
function questionSources(){
  if(App.profileId===INFINITY_ID){
    let out = [];
    App.subjects.forEach(s=>{ out = out.concat(subjectSourcesFor(s)); });
    if(!out.length) out.push({kind:'cards', subj:null});
    return out;
  }
  const subj = realmSubject();
  const out = subjectSourcesFor(subj);
  if(!out.length) out.push({kind:'cards', subj});
  return out;
}
function realmSourceLabel(){
  const srcs = questionSources();
  if(App.profileId===INFINITY_ID){
    const names = [];
    srcs.forEach(s=>{ const n = s.kind==='mul' ? 'Multiplication' : (s.subj?s.subj.name:'Demo Deck'); if(names.indexOf(n)<0) names.push(n); });
    return names.join(' + ');
  }
  return srcs.map(s=>s.kind==='mul' ? 'Multiplication Tables' : (s.subj?s.subj.name:'Demo Deck')).join(' + ');
}
function buildQuestion(diffId, srcs){
  if(!DIFFS[diffId]) diffId = App.run.difficulty && DIFFS[App.run.difficulty] ? App.run.difficulty : 'medium';
  if(!srcs || !srcs.length) srcs = questionSources();
  const src = pick(srcs);
  if(src.kind==='mul') return buildMulQuestion(diffId);
  const pool = (src.subj && src.subj.flashcards && src.subj.flashcards.length) ? src.subj.flashcards : STARTER_DECK;
  return buildCardQuestion(pool, diffId, (src.subj && src.subj.flashcards && src.subj.flashcards.length) ? src.subj : null);
}
function findCardAnywhere(cardId){
  for(const s of App.subjects){
    const c = (s.flashcards||[]).find(x=>x.id===cardId);
    if(c) return {card:c, subj:s};
  }
  const d = STARTER_DECK.find(x=>x.id===cardId);
  return d ? {card:d, subj:null} : null;
}
function updateCardMastery(cardId, correct){
  if(!cardId) return;                 // generated questions have no card to schedule
  const found = findCardAnywhere(cardId);
  if(!found) return;
  const card = found.card;
  const intervals = [5*60000, 30*60000, 3*3600000, 1*86400000, 3*86400000, 7*86400000];
  if(correct){ card.mastery = clamp((card.mastery||0)+1, 0, 5); card.dueAt = Date.now()+intervals[clamp(card.mastery-1,0,5)]; }
  else { card.mastery = clamp((card.mastery||0)-1, 0, 5); card.dueAt = Date.now(); }
  if(found.subj) saveSubjects();
}

const DEFAULT_INSTRUCTION = 'Produce study notes and flashcards from the SOURCE TEXT below. Reply in EXACTLY this format, no extra commentary:\nNOTES:\n<concise study notes as headings and bullet points, highlighting key terms/definitions/facts>\nFLASHCARDS_JSON:\n<a strict JSON array like [{"q":"...","a":"..."}] with 6-14 short question/answer flashcards testing the material>';
function parseAiAnalysis(raw){
  const idx = raw.indexOf('FLASHCARDS_JSON:');
  let notes = raw, flashcards = [];
  if(idx>=0){
    notes = raw.slice(0, idx).replace(/^NOTES:\s*/i,'').trim();
    const jsonPart = raw.slice(idx+'FLASHCARDS_JSON:'.length);
    const start = jsonPart.indexOf('['), end = jsonPart.lastIndexOf(']');
    if(start>=0 && end>start){
      try{
        const arr = JSON.parse(jsonPart.slice(start,end+1));
        arr.forEach(item=>{ if(item && item.q && item.a) flashcards.push({id:uid(), front:String(item.q), back:String(item.a), mastery:0, dueAt:0}); });
      }catch(e){}
    }
  }
  return {notes, flashcards};
}
function renderUpload(){
  const s = activeSubject();
  const c = el(`<div class="card">
    <h1>Upload to AI — ${escapeHtml(s.name)}</h1>
    <p class="muted">Upload .txt, .md, or .pdf files. Each chunk is analyzed into notes AND flashcards, which then double as combat questions in the Dungeon. Works offline too (a local summarizer kicks in automatically if no AI key is set, or if the AI call fails).</p>
    <div class="row" style="margin:14px 0;"><input type="file" id="up-files" multiple accept=".txt,.md,.pdf"></div>
    <h2>Analysis instruction</h2>
    <textarea id="up-instruction" style="min-height:90px;">${escapeHtml(DEFAULT_INSTRUCTION)}</textarea>
    <div class="checkbox-row" style="margin-top:10px;"><input type="checkbox" id="up-images"><label for="up-images">Also look at page images (PDF only — slower, describes diagrams/figures too; requires an AI key)</label></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="up-start">Analyze &amp; Add to Notes</button>
      <button class="btn secondary" id="up-continue" style="display:none;">Continue Analyzing</button>
    </div>
    <h2 style="margin-top:18px;">Log</h2>
    <div class="log" id="up-log">Idle.</div>
  </div>`);
  const logEl = c.querySelector('#up-log');
  function log(msg){ App.uploadLog.push(msg); logEl.textContent = App.uploadLog.join('\n'); logEl.scrollTop = logEl.scrollHeight; }
  c.querySelector('#up-start').addEventListener('click', async ()=>{
    const files = c.querySelector('#up-files').files;
    if(!files.length){ log('Pick at least one file first.'); return; }
    const instruction = c.querySelector('#up-instruction').value.trim() || DEFAULT_INSTRUCTION;
    const useImages = c.querySelector('#up-images').checked;
    App.uploadLog = []; log('Reading files...');
    c.querySelector('#up-start').disabled = true;
    try{
      const chunks = [];
      for(const f of files){
        log('→ '+f.name);
        if(/\.pdf$/i.test(f.name)){
          const buf = await f.arrayBuffer();
          const {text, doc} = await extractPdfText(buf, (i,n)=>log(`  extracting page ${i}/${n}`));
          chunkWords(text, 3500).forEach(tc=>chunks.push({text:tc, images:[], source:f.name}));
          if(useImages){
            const n = doc.numPages;
            for(let i=1;i<=n;i+=3){
              const imgs = [];
              for(let p=i; p<Math.min(i+3,n+1); p++){ try{ imgs.push(await renderPdfPageToImage(doc,p)); }catch(e){ log('  (page render failed: '+e.message+')'); } }
              chunks.push({text:`[Pages ${i}-${Math.min(i+2,n)} of ${f.name}, rendered as images]`, images:imgs, source:f.name});
            }
          }
        } else {
          const text = await f.text();
          chunkWords(text,3500).forEach(tc=>chunks.push({text:tc, images:[], source:f.name}));
        }
      }
      log(`Prepared ${chunks.length} chunk(s). Starting analysis...`);
      App.uploadQueue = {chunks, idx:0, instruction};
      await processUploadBatch(c, log);
    }catch(err){ log('ERROR: '+err.message); }
    c.querySelector('#up-start').disabled = false;
  });
  c.querySelector('#up-continue').addEventListener('click', async ()=>{
    c.querySelector('#up-continue').disabled = true;
    await processUploadBatch(c, log);
    c.querySelector('#up-continue').disabled = false;
  });
  if(App.uploadLog.length) logEl.textContent = App.uploadLog.join('\n');
  return c;
}
async function processUploadBatch(container, log){
  const q = App.uploadQueue;
  if(!q) return;
  const s = activeSubject();
  const BATCH = 10;
  const end = Math.min(q.chunks.length, q.idx+BATCH);
  for(let i=q.idx; i<end; i++){
    const ch = q.chunks[i];
    log(`Analyzing chunk ${i+1}/${q.chunks.length}${ch.source?(' ('+ch.source+')'):''}...`);
    let result = null;
    try{
      const prompt = `${q.instruction}\n\n---\nSOURCE TEXT:\n${ch.text}`;
      const raw = await callClaude(prompt, ch.images);
      result = parseAiAnalysis(raw);
      if(!result.notes && !result.flashcards.length) throw new Error('empty AI response');
      log('  ✓ AI analysis done ('+result.flashcards.length+' flashcards).');
    }catch(err){
      log('  ⚠ '+err.message+' — using offline generator instead.');
      result = localAnalyze(ch.text);
      log('  ✓ offline analysis done ('+result.flashcards.length+' flashcards).');
    }
    s.notes = (s.notes ? s.notes+'\n\n' : '') + (result.notes||'').trim();
    const existingFronts = new Set(s.flashcards.map(c=>normText(c.front)));
    (result.flashcards||[]).forEach(fc=>{ if(!existingFronts.has(normText(fc.front))){ s.flashcards.push(fc); existingFronts.add(normText(fc.front)); } });
    await saveSubjects();
  }
  q.idx = end;
  const continueBtn = container.querySelector('#up-continue');
  if(q.idx < q.chunks.length){
    log(`Paused after batch — ${q.chunks.length-q.idx} chunk(s) remaining.`);
    if(continueBtn) continueBtn.style.display = '';
  } else {
    log('All chunks analyzed. Notes and flashcards updated — they now appear as combat questions in the Dungeon too.');
    App.uploadQueue = null;
    if(continueBtn) continueBtn.style.display = 'none';
  }
}

function renderQuizPractice(){
  const c = el(`<div class="card"><h1>Quiz Practice</h1><p class="muted">Risk-free practice using the same question engine as the Dungeon — pick a difficulty, exactly like you do each round underground.</p><div class="row quizdiffs" style="margin-top:10px;"></div></div>`);
  const dr = c.querySelector('.quizdiffs');
  DIFF_IDS.forEach(id=>{
    const d = DIFFS[id];
    const b = el(`<button class="btn ${App.quizDiff===id?'':'secondary'}">${d.icon} ${d.label}</button>`);
    b.addEventListener('click', ()=>{ App.quizDiff=id; App.quizCard={q:quizQuestion(id), done:false, result:null}; render(); });
    dr.appendChild(b);
  });
  if(!App.quizCard || App.quizCard.done) App.quizCard = {q: quizQuestion(App.quizDiff), done:false, result:null};
  const qc = App.quizCard;
  const body = el(`<div class="card"></div>`);
  body.appendChild(el(`<h2>${escapeHtml(qc.q.prompt)}</h2>`));
  if(qc.result==null){
    if(qc.q.mode==='mcq'){
      qc.q.options.forEach(opt=>{
        const b = el(`<button class="btn secondary" style="display:block;width:100%;text-align:left;margin-bottom:8px;">${escapeHtml(opt)}</button>`);
        b.addEventListener('click', ()=>{ qc.result = (opt===qc.q.correct); updateCardMastery(qc.q.cardId, qc.result); render(); });
        body.appendChild(b);
      });
    } else {
      const row = el(`<div class="row"><input type="text" id="quiz-ans" placeholder="Type your answer..." style="flex:1;"><button class="btn">Submit</button></div>`);
      const submit = ()=>{ const val = row.querySelector('input').value; qc.result = fuzzyMatch(val, qc.q.correct); updateCardMastery(qc.q.cardId, qc.result); render(); };
      row.querySelector('button').addEventListener('click', submit);
      row.querySelector('input').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
      body.appendChild(row);
    }
  } else {
    body.appendChild(el(`<div class="feedback-msg ${qc.result?'good':'bad'}" style="border-radius:10px;">${qc.result?'✔ Correct!':'✘ Not quite — the answer was: '+escapeHtml(qc.q.correct)}</div>`));
    const next = el(`<button class="btn" style="margin-top:10px;">Next Question</button>`);
    next.addEventListener('click', ()=>{ App.quizCard = {q:quizQuestion(App.quizDiff), done:false, result:null}; render(); });
    body.appendChild(next);
  }
  const outer = el('<div></div>'); outer.appendChild(c); outer.appendChild(body);
  return outer;
}
/* ============================== LOOT ============================== */
function rarityWeightsForRegion(region){
  const t = clamp((region-1)/9,0,1);
  return [ {v:'common',w:58-50*t}, {v:'rare',w:30-6*t}, {v:'epic',w:10+26*t}, {v:'legendary',w:2+30*t} ];
}
function rollRarityForRegion(region){ return weightedPick(rarityWeightsForRegion(region)); }
function makeWeaponInstance(line){ return {id:uid(), kind:'weapon', lineId:line.lineId, classId:line.classId, wtype:line.wtype || WEAPON_TYPE_OF_CLASS[line.classId] || null, rarity:line.rarity, name:line.name, atk:line.atk, critBonus:line.critBonus||0, lifeBonus:line.lifeBonus||0, passive:line.passive||null}; }
function makeArmorInstance(line){ return {id:uid(), kind:'armor', lineId:line.lineId, slot:line.slot, rarity:line.rarity, name:line.name, def:line.def}; }
function rollFloorLoot(floor){
  const ch = App.character;
  const region = regionForFloor(floor);
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const loot = [];
  const goldMult = (runBonusActive('fortune') ? 1.5 : 1) * (omenIs('bloodmoon') ? 1.5 : 1);
  const goldAmt = Math.round((boss ? randInt(25+floor*3, 50+floor*5) : randInt(4+floor, 10+floor*2)) * goldMult);
  App.run.gold = (App.run.gold||0) + goldAmt;
  loot.push({kind:'gold', label:'+'+goldAmt+' gold'});
  const diaAmt = boss ? randInt(3,6) : (chance(14) ? randInt(1,2) : 0);
  if(diaAmt){ ch.gems = (ch.gems||0) + diaAmt; loot.push({kind:'gem', label:'💎 +'+diaAmt+' gems'}); }
  if(boss){ const n = final ? 3 : randInt(1,2); addCore('boss', n); loot.push({kind:'core', label:'+'+n+' Boss Core'+(n>1?'s':''), core:'boss'}); }
  else if(chance(55)){ const n = randInt(1,2); const t = addFloorCore(floor, n); loot.push({kind:'core', label:'+'+n+' '+CORE_TIERS[t].name+(n>1?'s':''), core:t}); }
  const arche = App.run.monster ? App.run.monster.arche : null;
  const matDrops = rollMaterialDrops(floor, arche, boss);
  Object.keys(matDrops).forEach(m=>{ addMaterial(m, matDrops[m]); loot.push({kind:'mat', label:MATERIALS[m].icon+' '+matDrops[m]+'× '+MATERIALS[m].name}); });
  if(chance(boss?70:26)){
    const pid = weightedPick([{v:'hp_small',w:34},{v:'hp_large',w:10},{v:'energy',w:16},{v:'buff_atk',w:9},
      {v:'buff_def',w:9},{v:'buff_crit',w:7},{v:'debuff_atk',w:7},{v:'debuff_def',w:5},{v:'debuff_slow',w:3}]);
    addPotion(pid, 1);
    loot.push({kind:'potion', label:POTIONS[pid].icon+' '+POTIONS[pid].name});
  }
  if(!boss){
    const bookId = MONSTER_BOOKS[App.run.monster ? App.run.monster.arche : ''] || null;
    if(bookId && chance(3) && !(ch.learnedSkills||{})[bookId]){
      ch.books = ch.books || {};
      ch.books[bookId] = (ch.books[bookId]||0) + 1;
      loot.push({kind:'book', label:'📕 Skill Book: '+SKILLS[bookId].name});
    }
  }
  let itemChance = boss ? 70 : 22;
  if(isArtifactActive('fortune')) itemChance = Math.min(100, itemChance*1.15);
  /* a nemesis is carrying something, always, and it is not junk */
  if(App.run.monster && App.run.monster.nemesis) itemChance = 100;
  if(chance(itemChance)){
    const rarity = rollRarityForRegion(region);
    if(chance(50)){
      const opts = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && w.rarity===rarity);
      if(opts.length){ const line=pick(opts); const w=makeWeaponInstance(line); ch.weapons.push(w); markDiscovered(line.lineId); loot.push({kind:'weapon', label:w.name+' ('+rarity+')'}); }
    } else {
      const opts = ARMOR_CATALOG.filter(a=>a.rarity===rarity);
      if(opts.length){ const line=pick(opts); const a=makeArmorInstance(line); ch.armors.push(a); markDiscovered(line.lineId); loot.push({kind:'armor', label:a.name+' ('+rarity+')'}); }
    }
  }
  if(boss){
    const bd = bossDefForFloor(floor);
    if(bd && bd.drop){
      let relicChance = 25;
      if(isArtifactActive('fortune')) relicChance *= 1.15;
      if(chance(relicChance)){
        const d = bd.drop;
        const item = d.kind==='weapon'
          ? {id:uid(), kind:'weapon', lineId:d.lineId, classId:ch.classId, rarity:d.rarity, name:d.name, atk:d.atk, critBonus:d.critBonus||0, lifeBonus:d.lifeBonus||0, relic:true}
          : {id:uid(), kind:'armor', lineId:d.lineId, slot:d.slot, rarity:d.rarity, name:d.name, def:d.def, relic:true};
        (d.kind==='weapon' ? ch.weapons : ch.armors).push(item);
        markDiscovered(d.lineId);
        loot.push({kind:d.kind, label:'★ '+d.name+' — boss relic!'});
      }
    }
    let artChance = 10;
    if(isArtifactActive('fortune')) artChance *= 1.15;
    if(chance(artChance)){
      const notOwned = ARTIFACT_KEYS.filter(k=>!ch.artifacts[k].owned);
      if(notOwned.length){ const key=pick(notOwned); ch.artifacts[key]={owned:true,charges:ARTIFACT_DEFS[key].maxCharges}; markDiscovered('art_'+key); loot.push({kind:'artifact', label:'✨ '+ARTIFACT_DEFS[key].name+'!'}); }
      else { addCore('boss',2); loot.push({kind:'core', label:'+2 Boss Cores (all artifacts already owned)', core:'boss'}); }
    }
    ['fortune','titan'].forEach(k=>{ if(isArtifactEquipped(k) && ch.artifacts[k].owned && ch.artifacts[k].charges>0) ch.artifacts[k].charges--; });
    if(!ch.bossFloorsCleared.includes(floor) && floor<MAX_FLOOR) ch.bossFloorsCleared.push(floor);
  }
  ch.highestFloor = Math.max(ch.highestFloor, floor);
  return loot;
}
function bestiaryKeyFor(monster){
  if(monster.isFinal) return 'boss_final';
  if(monster.isBoss) return 'boss_'+monster.region;
  return 'mon_'+(monster.speciesId || monster.region);
}

const CLASS_FALLBACK_FX = {warrior:{pose:'atk',kind:'slash',hue:'steel',n:1,move:'step'}, rogue:{pose:'atk',kind:'slash',hue:'steel',n:1,move:'step'},
  brawler:{pose:'atk',kind:'hit',hue:'steel',move:'step'}, mage:{pose:'raise',kind:'bolt',hue:'arcane',move:'plant'}, cleric:{pose:'atk',kind:'hit',hue:'holy',move:'step'}};
function skillFx(skill){
  return (skill && SKILL_FX[skill.id]) || CLASS_FALLBACK_FX[App.character.classId] || CLASS_FALLBACK_FX.warrior;
}

function fxBox(els, who){
  const host = who === 'hero' ? els.playerSprite : els.monsterSprite;
  if(!host || !els.scene) return null;
  const s = els.scene.getBoundingClientRect(), b = host.getBoundingClientRect();
  return {x: b.left - s.left + b.width/2, y: b.top - s.top + b.height*0.52,
          foot: b.top - s.top + b.height*0.88, w: b.width, h: b.height};
}
function fxNode(els, cls, x, y, ms, inner){
  if(!els.scene) return null;
  const d = document.createElement('div');
  d.className = 'fx ' + cls;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  if(inner) d.innerHTML = inner;
  els.scene.appendChild(d);
  setTimeout(()=>d.remove(), ms);
  return d;
}
function crescentSvg(){
  const id = artId('cm');
  return `<svg viewBox="0 0 100 100"><defs><mask id="${id}"><rect width="100" height="100" fill="#fff"/>`
       + `<circle cx="62" cy="50" r="34" fill="#000"/></mask></defs>`
       + `<circle cx="46" cy="50" r="34" fill="currentColor" mask="url(#${id})"/></svg>`;
}
function fxRing(els, hue, at, big){
  fxNode(els, 'fx-ring ' + hue + (big?' big':''), at.x, at.y, 600);
}
/* The whole scene jolts on a heavy landing. */
function hexA(hex, a){
  const h = String(hex||'#e0453a').replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function fxShake(els, ms){
  if(!els.scene) return;
  els.scene.classList.remove('shake'); void els.scene.offsetWidth;
  els.scene.classList.add('shake');
  setTimeout(()=>els.scene.classList.remove('shake'), ms || 320);
}

async function playSkillFx(els, skill, opts){
  const fx = skillFx(skill);
  /* A skill that only charges you goes off where you are standing. */
  const at = fxBox(els, fx.selfOnly ? 'hero' : 'monster');
  if(!at) return;
  const big = fx.big || !!(opts && opts.guaranteedCrit);
  const hue = fx.hue;
  switch(fx.kind){
    case 'slash': {
      /* the blade's own arc, thrown from the target's near side */
      fxNode(els, 'fx-trail ' + hue + (big?' big':''), at.x - at.w*0.16, at.y, 380);
      const angles = [-26, 30, -6, 46];
      for(let i = 0; i < (fx.n || 1); i++){
        const d = fxNode(els, 'fx-slash ' + hue + (big?' big':''), at.x, at.y, 420, crescentSvg());
        if(d) d.style.setProperty('--rot', angles[i % angles.length] + 'deg');
        if(i < (fx.n||1) - 1) await sleep(95);
      }
      await sleep(140);
      break;
    }
    case 'hit':
      fxNode(els, 'fx-hit ' + hue + (big?' big':''), at.x, at.y, 340);
      await sleep(160);
      break;
    case 'flurry': {
      for(let i = 0; i < (fx.n || 3); i++){
        const jx = at.x + (i % 2 ? 16 : -14) + (i * 3);
        const jy = at.y + ((i % 3) - 1) * 14;
        fxNode(els, 'fx-hit ' + hue + (big && i === fx.n-1 ? ' big' : ''), jx, jy, 320);
        await sleep(70);
      }
      break;
    }
    case 'bolt': {
      const from = fxBox(els, 'hero');
      const orb = fxNode(els, 'fx-orb trail ' + hue + (big?' big':''),
                         from.x + from.w * 0.26, from.y - from.h * 0.08, 520);
      if(orb){
        const dx = at.x - (from.x + from.w * 0.26), dy = at.y - (from.y - from.h * 0.08);
        orb.style.setProperty('--flyms', (big ? .34 : .28) + 's');
        await sleep(20);
        orb.style.opacity = '1';
        orb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1)`;
      }
      await sleep(big ? 340 : 280);
      fxNode(els, 'fx-hit ' + hue + (big?' big':''), at.x, at.y, 340);
      break;
    }
    case 'nova':
      fxNode(els, 'fx-hit ' + hue + (big?' big':''), at.x, at.y, 340);
      fxRing(els, hue, at, big);
      if(big){ await sleep(90); fxRing(els, hue, at, big); }
      await sleep(180);
      break;
    case 'beam':
      fxNode(els, 'fx-beam ' + hue + (big?' big':''), at.x, at.foot, 560);
      await sleep(200);
      fxNode(els, 'fx-hit ' + hue + (big?' big':''), at.x, at.y, 340);
      break;
    case 'shards': {
      const n = big ? 6 : 4;
      for(let i = 0; i < n; i++){
        fxNode(els, 'fx-shard ' + hue, at.x + (i - (n-1)/2) * 17, at.foot, 520);
        await sleep(45);
      }
      await sleep(120);
      break;
    }
    case 'quake':
      fxNode(els, 'fx-quake ' + hue, at.x, at.foot, 480);
      fxNode(els, 'fx-hit ' + hue + (big?' big':''), at.x, at.y, 340);
      spawnDust(els.scene);
      fxShake(els, big ? 380 : 260);
      await sleep(200);
      break;
  }
  if(fx.ring) fxRing(els, hue, at, true);
  if(fx.self){                                   /* what the skill does to you */
    const me = fxBox(els, 'hero');
    if(me){
      fxNode(els, 'fx-hit ' + fx.self, me.x, me.y, 340);
      fxRing(els, fx.self, me, false);
    }
  }
}

/* How each class closes the distance. Melee walks its weapon in, rushers throw
   their whole body at the enemy, casters stay planted and send the spell. */
const CLASS_COMBAT = {
  warrior:{style:'dash'},
  cleric: {style:'cast', proj:'holy'},
  mage:   {style:'cast', proj:'arcane'},
  rogue:  {style:'rush'},
  brawler:{style:'rush'},
};
function classCombat(classId){ return CLASS_COMBAT[classId || App.character.classId] || CLASS_COMBAT.warrior; }
/* ============================== SKILL MOVEMENT ==============================
   A skill is a movement before it is a number. Backstab does not mean "stab
   harder", it means get behind the thing first; Shield Bash is a shoulder
   going somewhere; Consecrate is a man standing still with his arms up.
   Every skill in SKILL_FX names one of these:

     step     plant a foot forward, swing, recover
     lunge    coil, then spear the point out and snap back
     charge   shoulder or palm first, a hard stop against the target
     barrage  several blows, ground taken on every one of them
     through  a pass straight through it, the cut landing as you cross
     leap     up, across, and down on top of it
     behind   out in a puff, in behind it, turned around
     plant    rooted: the cast gathers into the floor and shoves you back
     invoke   rooted: arms up, the light comes down, nobody moves
   ========================================================================== */

/* Where the enemy actually is on screen right now. Everything below is measured
   rather than guessed, so the same skill reads right on a phone and a desktop. */
function foeReach(els){
  const box = els.playerSprite, mon = els.monsterSprite;
  if(!box || !mon || !els.scene) return null;
  const sr = els.scene.getBoundingClientRect();
  const br = box.getBoundingClientRect(), mr = mon.getBoundingClientRect();
  if(!br.width || !mr.width) return null;
  return {sr, br, mr,
    gap:  Math.max(0, mr.left - br.right),
    hx:   br.left - sr.left + br.width/2,
    hy:   br.top  - sr.top  + br.height*0.55,
    foot: br.bottom - sr.top,
    /* the far shoulder, measured from the hero's own centre */
    past: (mr.right - sr.left + mr.width*0.16) - (br.left - sr.left + br.width/2)};
}
/* One transform the whole vocabulary shares, so moves can hand off to each
   other without fighting over the sprite. */
function adv(box, o){
  if(!box) return;
  if(o.x !== undefined) box.style.setProperty('--adv',  o.x + 'px');
  if(o.y !== undefined) box.style.setProperty('--advy', o.y + 'px');
  if(o.s !== undefined) box.style.setProperty('--advs', o.s);
  if(o.f !== undefined) box.style.setProperty('--advf', o.f);
  box.style.setProperty('--advms', (o.ms == null ? 140 : o.ms) + 'ms');
  box.classList.add('advancing');
}
function stand(box){
  if(!box) return;
  box.classList.remove('advancing','streak','turned','blinkout','behind','leaping');
  ['--adv','--advy','--advs','--advf','--advms','--bx','--lx'].forEach(v=>box.style.removeProperty(v));
}
function puffAt(els, x, y){
  if(!els.scene) return;
  const d = document.createElement('div');
  d.className = 'blinkpuff';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  els.scene.appendChild(d);
  setTimeout(()=>d.remove(), 400);
}

/* --- step: the honest melee beat. A pace in, the blow, a pace back. --- */
async function moveStep(els, cls, pose, skill, opts, fx){
  const g = foeReach(els); if(!g) return false;
  const box = els.playerSprite;
  const reach = g.gap*0.72 + 10;
  if(fx.wind){                          /* heavy cuts rear back before they land */
    heroClipSeq(box, cls, [['walk',150],['raise',230],[pose,300]]);
    adv(box, {x: reach*0.55, ms:170});
    await sleep(180);
    adv(box, {x: reach*0.30, y:-2, ms:170});   /* weight goes back into the swing */
    await sleep(200);
    adv(box, {x: reach, y:0, ms:120});
    await sleep(120);
  }else{
    heroClipSeq(box, cls, [['walk',140],[pose,300]]);
    adv(box, {x: reach, ms:170});
    await sleep(185);
  }
  await playSkillFx(els, skill, opts);
  await sleep(120);
  adv(box, {x:0, y:0, ms:260});
  await sleep(270); stand(box);
  return true;
}
/* --- lunge: a point-first thrust. Coil, spear, recover. --- */
async function moveLunge(els, cls, pose, skill, opts, fx){
  const g = foeReach(els); if(!g) return false;
  const box = els.playerSprite;
  heroClipSeq(box, cls, [['walk',120],[pose,360]]);
  adv(box, {x:-10, ms:120});                       /* coil */
  await sleep(125);
  adv(box, {x: g.gap*0.88 + 14, ms:105});          /* and out */
  await sleep(115);
  await playSkillFx(els, skill, opts);
  await sleep(150);
  adv(box, {x:0, ms:250});
  await sleep(255); stand(box);
  return true;
}
/* --- charge: shoulder, shield or palm first. The stop is the hit. --- */
async function moveCharge(els, cls, pose, skill, opts, fx){
  const g = foeReach(els); if(!g) return false;
  const box = els.playerSprite;
  heroClipSeq(box, cls, [['walk',140],[pose,440]]);
  adv(box, {x:-16, y:2, ms:150});                  /* set the feet */
  await sleep(160);
  adv(box, {x: g.gap*0.92 + 12, y:0, s:1.05, ms:145});   /* drive */
  await sleep(150);
  await playSkillFx(els, skill, opts);
  fxShake(els, 300);
  adv(box, {x: g.gap*0.55, s:1, ms:130});          /* the stop throws you back */
  await sleep(160);
  adv(box, {x:0, y:0, ms:280});
  await sleep(285); stand(box);
  return true;
}
/* --- barrage: every blow buys a pace of ground. --- */
async function moveBarrage(els, cls, pose, skill, opts, fx){
  const g = foeReach(els); if(!g) return false;
  const box = els.playerSprite;
  const n = Math.max(2, fx.n || 3);
  const reach = g.gap*0.72 + 10;
  setArt(box, heroSprite(cls, 'walk'));
  adv(box, {x: reach*0.72, ms:190});               /* close first - the first blow
                                                      has to land in range too */
  await sleep(200);
  const beats = playSkillFx(els, skill, opts);     /* the blows themselves */
  const pace = Math.max(70, Math.round(520/n));
  for(let i=0;i<n;i++){                            /* the feet keep their rhythm */
    adv(box, {x: reach*(0.74 + 0.26*(i+1)/n), y: (i%2 ? -3 : 0), ms:80});
    setArt(box, heroSprite(cls, i % 2 ? 'thrust' : pose));
    await sleep(pace);
  }
  await beats;
  setArt(box, heroSprite(cls, 'idle'));
  adv(box, {x:0, y:0, ms:300});
  await sleep(305); stand(box);
  return true;
}
/* --- through: cross it, cut on the way past, come back out of the dark. --- */
async function movePassThrough(els, cls, pose, skill, opts, fx){
  const g = foeReach(els); if(!g) return false;
  const box = els.playerSprite;
  heroClipSeq(box, cls, [['walk',130],[pose,340]]);
  adv(box, {x:-14, ms:130});
  await sleep(140);
  box.classList.add('streak');
  adv(box, {x: g.past + 16, ms:150});              /* straight through and out */
  await sleep(95);
  await playSkillFx(els, skill, opts);             /* the cut lands as you cross */
  await sleep(70);
  box.classList.remove('streak');
  adv(box, {f:-1, ms:120});                        /* stopped past it, back turned */
  await sleep(300);
  puffAt(els, g.mr.right - g.sr.left, g.mr.top - g.sr.top + g.mr.height*0.55);
  box.classList.add('blinkout');
  await sleep(150);

}
/* --- plant: a caster does not walk. The spell gathers into the floor and
       kicks back out of it. --- */
async function movePlant(els, cls, pose, skill, opts, fx){
  const box = els.playerSprite; if(!box) return false;

/* --- invoke: nobody moves. The arms go up and the light comes down. --- */
async function moveInvoke(els, cls, pose, skill, opts, fx){

/* --- behind: out in a puff, in past the far shoulder, turned around. --- */
async function strikeFromBehind(els, cls, pose, skill, opts){

/* --- leap: overhead blows come down from somewhere. --- */
async function strikeFromAbove(els, cls, pose, skill, opts){
