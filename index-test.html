      ['fl-push',     g=>{ finTower(g, 16, 66, 9, 44, 'D','m','n'); finTower(g, 144, 66, 9, 40, 'D','m','n');
        if(g[10]) for(let x=14;x<148;x++) g[10][x] = 'n';    /* the line they hang from */
        for(let i=0;i<7;i++){ const x = 22 + i*19, len = 13 + (i%3)*4;
          for(let j=0;j<len;j++) for(let d=0;d<7;d++){
            const yy = 11+j, xx = x+d;
            if(!g[yy] || xx>=FIN_W) continue;
            g[yy][xx] = (d===0||d===6) ? 'f' : (j===len-1 ? 'F' : ((d+j)%4 ? 'F':'r'));
          }
          if(g[11+len]) { g[11+len][x+2]='F'; g[11+len][x+4]='F'; } } }],

      ['fl-bob',      g=>{ finCrowd(g, 74, 2, 54, 'K', 9, 2, {arms:1});

    ],
    sprites: [{id:'young', x:80, y:82, w:26, cls:'fs-bob'}],
    life: [['mote', 16, 'lf-fall', [2, 30], [3.5, 7], 1.2]],
  },
  throne: {                                  /* a hall, and a chair in it */
    layers: [
      ['fl-push-far', g=>{ finSky(g, ['K','k','d','d','D','D','m']);
        for(let i=0;i<5;i++){ finTower(g, 12+i*9, 74, 3, 52, 'D','m',null);
                              finTower(g, 148-i*9, 74, 3, 52, 'D','m',null); } }],
      ['fl-flicker',  g=>{ for(let i=0;i<10;i++){ const x = 10 + i*16;
          if(x>52 && x<108) continue;
          for(const y of [26, 42]){ if(g[y]) g[y][x]='o'; if(g[y-1]) g[y-1][x]='y'; } } }],

const __finLayerCache = {};
function finalePanel(id){
  const spec = FIN_ART[id] ? id : 'dark';
  if(!__finLayerCache[spec]){
    const art = FIN_ART[spec];
    let out = art.layers.map(([cls, paint], i)=>{
      const g = finGrid();
      paint(g);
      return `<div class="fl-layer ${cls}" style="z-index:${i};--ld:${i*420}ms">${renderPixels(g, FIN_PAL, false)}</div>`;
    }).join('');
    /* and the people. These are the same sheets you have been looking at for a
       hundred floors, which is most of why the panels became readable: a drawn
       silhouette is a shape, but the warrior is someone you know. */
    (art.sprites || []).forEach((s, i)=>{
      out += `<div class="fin-actor ${s.cls || ''}" style="left:${s.x/FIN_W*100}%;top:${s.y/FIN_H*100}%;`
           + `width:${s.w/FIN_W*100}%;z-index:${20+i};${s.flip?'--ffx:-1;':''}">`
           + heroSprite(s.id, s.clip || 'idle') + '</div>';
    });
    __finLayerCache[spec] = out;
  }
  return __finLayerCache[spec];
}
/* The panels borrow the rooms' own critter motions - the drifting, rising and
   falling are already written and already tuned. */
function finaleLife(id){
  const spec = FIN_ART[id] || FIN_ART.dark;
  return spec.life ? buildLifePlan(spec.life, 'fin' + id) : null;
}


/* ============================ THE MUSIC ============================
   Nobody speaks over the ending. There is just this under it.

   It is generated rather than shipped: a recorded track would be several
   megabytes in a file that is supposed to be one page you can keep offline,
   and the whole game is already drawn from code rather than assets. So it is
   four bars of A minor on a slow loop - a low drone, a pad that swells and
   falls, and a handful of struck notes over the top, none of them landing
   quite on the beat. A delay line gives it the room.

   Browsers will not start audio without a gesture. Getting to the ending
   takes a click, and the ending advances by clicking, so the context is
   resumed on the first of those rather than fought with.
   ================================================================= */
const FinScore = {
  ctx:null, master:null, wet:null, timer:null, bar:0, playing:false, muted:false, ending:false,

  boot(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{ this.ctx = new AC(); }catch(e){ return false; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = 0;
    this.master.connect(c.destination);
    /* a delay line, because a dry sine in a silent room sounds like a test tone */
    const d = c.createDelay(1.0); d.delayTime.value = 0.34;
    const fb = c.createGain(); fb.gain.value = 0.30;
    const wet = c.createGain(); wet.gain.value = 0.26;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900;
    d.connect(fb); fb.connect(d); d.connect(lp); lp.connect(wet); wet.connect(this.master);
    this.wet = d;
    try{ this.muted = localStorage.getItem('sd_finmute') === '1'; }catch(e){}
    return true;
  },

  note(freq, at, dur, type, peak, sendWet){
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain();
    const atk = type === 'sine' ? Math.min(1.4, dur*0.35) : 0.012;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(this.master);
    if(sendWet) g.connect(this.wet);
    o.start(at); o.stop(at + dur + 0.05);
  },

  /* A minor - F - C - G, six seconds a bar, which is slow enough to read over */
  CHORDS: [[110,130.81,164.81], [87.31,110,130.81], [130.81,164.81,196], [98,123.47,146.83]],
  MELODY: [440, 523.25, 587.33, 659.25, 392, 329.63],

  scheduleBar(at){
    const ch = this.CHORDS[this.bar % 4];
    ch.forEach((f,i)=> this.note(f, at + i*0.06, 6.4, 'sine', 0.085, i === 0));
    this.note(55, at, 6.6, 'sine', 0.05, false);                    /* the drone */
    /* two or three struck notes, deliberately off the beat */
    const n = 2 + (this.bar % 2);
    for(let i=0;i<n;i++){
      const r = sceneNoise(this.bar*7 + i, i*13);
      const f = this.MELODY[Math.floor(sceneNoise(this.bar*3+i, 5) * this.MELODY.length) % this.MELODY.length];
      this.note(f, at + 0.8 + r*4.2, 2.4 + r, 'triangle', 0.055, true);
    }
    this.bar++;
  },

  start(){
    /* renderFinale calls this on every page so the browser gets its gesture,
       which means once the piece has begun fading under the last few pages it
       has to refuse to come back - otherwise the next click restarts it. */
    if(this.playing || this.ending || !this.boot()) return;
    const c = this.ctx;
    if(c.state === 'suspended') c.resume().catch(()=>{});
    this.playing = true;
    this.ending = false;
    this.bar = 0;
    let next = c.currentTime + 0.25;
    this.master.gain.cancelScheduledValues(c.currentTime);
    this.master.gain.setValueAtTime(0.0001, c.currentTime);
    this.master.gain.exponentialRampToValueAtTime(this.muted ? 0.0001 : 0.9, c.currentTime + 3.5);
    this.scheduleBar(next); next += 6.5;
    this.timer = setInterval(()=>{
      if(!this.playing) return;
      while(next < this.ctx.currentTime + 4){ this.scheduleBar(next); next += 6.5; }
    }, 900);
  },

  stop(fade){
    this.ending = true;
    if(!this.ctx) return;
    clearInterval(this.timer); this.timer = null;
    this.playing = false;
    const c = this.ctx, t = c.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), t);
    this.master.gain.exponentialRampToValueAtTime(0.0001, t + (fade == null ? 2.4 : fade));
  },

  toggleMute(){
    this.muted = !this.muted;
    try{ localStorage.setItem('sd_finmute', this.muted ? '1' : '0'); }catch(e){}
    if(this.ctx && this.playing){
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), t);
      this.master.gain.exponentialRampToValueAtTime(this.muted ? 0.0001 : 0.9, t + 0.6);
    }
    return this.muted;
  },
};

/* =========================== THE LAST WORD ===========================
   He is not a monster that happens to be at the top of the tower. He is what
   the tower is for. So when he goes down he gets to say why, and the game
   stops being a game for two minutes while he does it.

   Paged rather than scrolled: one thought at a time, advanced by a click or
   the space bar, because a wall of text at the end of a hundred floors is a
   wall of text. The last three pages are not lines he says - they are what
   happens while he stops talking.
   ================================================================== */
const FINALE = [

  {t:'I refused again.', art:'hostage'},

  {t:'I still wanted my revenge. I searched for a month.', art:'fear'},
  {t:'Then a stranger in a hood came to me and said he knew where the king was hiding. I did not think twice. I was the strongest thing alive.', art:'hood'},

  {t:'*The demon slowly closes his eyes. Through them comes a glimpse of light — and in it, a figure. Two figures.*', cls:'stage light', art:'light'},
  {t:'Sarah. Bruno.', cls:'whisper', art:'light'},
  {t:'I will finally see you again.', cls:'whisper', art:'light'},

function startFinale(){
  App.finalePage = 0;
  App.dungeonView = 'finale';
  FinScore.ending = false;          /* a fresh run of the ending starts it over */
  FinScore.start();
  render();
}
function advanceFinale(){
  if(App.dungeonView !== 'finale') return;
  App.finalePage = (App.finalePage || 0) + 1;
  if(App.finalePage >= FINALE.length){
    App.run.active = false;
    App.dungeonView = 'victory';
    FinScore.stop(2.2);
    saveRun(); render();
    return;
  }
  /* the last two pages are the quiet ones - let it fall away under them */
  if(App.finalePage >= FINALE.length - 2) FinScore.stop(6);
  render();
}
function renderFinale(){
  const i = clamp(App.finalePage || 0, 0, FINALE.length - 1);
  const page = FINALE[i];
  const last = i >= FINALE.length - 1;
  const wrap = el(`<div class="finale ${page.cls || ''}">
    <div class="fin-star"></div>
    <div class="fin-panel" key="${page.art || 'dark'}">${finalePanel(page.art)}${
      page.hero ? `<div class="fin-hero">${heroSprite(page.hero, 'hurt')}</div>` : ''}</div>
    <div class="fin-text">${escapeHtml(page.t).replace(/^\*|\*$/g, '')}</div>
    <div class="fin-hint">${last ? 'click to close' : 'click, or press space'}</div>
    <button class="fin-mute" title="music">${FinScore.muted ? '🔇' : '🔊'}</button>
    <div class="fin-dots">${FINALE.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join('')}</div>
  </div>`);
  /* a click anywhere is also the gesture the browser wants before it will
     let anything make a sound */
  FinScore.start();
  const life = finaleLife(page.art || 'dark');
  if(life && !reducedMotion()) wrap.querySelector('.fin-panel').appendChild(life);
  wrap.addEventListener('click', advanceFinale);
  const mb = wrap.querySelector('.fin-mute');
  if(mb) mb.addEventListener('click', (e)=>{ e.stopPropagation(); mb.textContent = FinScore.toggleMute() ? '🔇' : '🔊'; });
  /* one listener, torn down when the page leaves */
  if(App.__finKey) document.removeEventListener('keydown', App.__finKey);
  App.__finKey = (e)=>{
    if(App.dungeonView !== 'finale'){ document.removeEventListener('keydown', App.__finKey); App.__finKey = null; return; }
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advanceFinale(); }
  };
  document.addEventListener('keydown', App.__finKey);
  return wrap;
}

function renderHub(){

  const ch = App.character;
  const cls = CLASSES[ch.classId];
  const prog = classProg();
  const st = combatStats();
  const xpPct = Math.round(prog.xp / xpToNext(prog.level) * 100);
  const evo = prog.evolution ? evolutionName(ch.classId, prog.evolution) : null;

  const hero = el(`<div class="px-panel hero-panel">
    <div class="hero-portrait"><div class="hero-art"></div></div>
    <div class="hero-info">
      <div class="hero-name">${escapeHtml(cls.name)}${evo?` <span class="hero-evo">${escapeHtml(evo)}</span>`:''}</div>
      <div class="hero-sub">Level ${prog.level} · Floor ${ch.highestFloor} of ${MAX_FLOOR} reached</div>
      <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div><span class="xp-num">${prog.xp} / ${xpToNext(prog.level)} XP</span></div>
      <div class="hero-stats">
        <span class="hstat"><b>${st.atk}</b> ATK</span>
        <span class="hstat"><b>${st.def}</b> DEF</span>
        <span class="hstat"><b>${st.maxHp}</b> HP</span>
        <span class="hstat"><b>${Math.round(st.critChance)}%</b> CRIT</span>
        <span class="hstat gem"><b>${ch.gems||0}</b> 💎</span>
      </div>
      ${prog.skillPoints?`<div class="hero-alert">${prog.skillPoints} unspent skill point${prog.skillPoints>1?'s':''} — open Characters</div>`:''}
    </div>
  </div>`);
  setArt(hero.querySelector('.hero-art'), classArt(ch.classId));
  outer.appendChild(hero);

  const realmBar = el(`<div class="px-panel realm-bar">
    <div class="rb-left"><span class="rb-icon">${escapeHtml(realmIcon())}</span>
      <span class="rb-text"><b>${escapeHtml(realmName())}</b><span class="muted">${escapeHtml(realmSourceLabel())}</span></span></div>
  </div>`);
  const switchBtn = el(`<button class="px-btn">⇄ Switch Realm</button>`);
  switchBtn.addEventListener('click', ()=>{ App.dungeonView='select'; render(); });
  realmBar.appendChild(switchBtn);
  outer.appendChild(realmBar);

  const actions = el(`<div class="px-panel"><div class="dg-h2">Descend</div><div class="hub-grid"></div></div>`);
  const grid = actions.querySelector('.hub-grid');
  const runLabel = App.run.active ? 'Continue Run' : 'Enter Dungeon';
  const runSub = App.run.active ? ('Resume floor '+App.run.floor) : 'Start from floor 1';
  [
    ['⚔', runLabel, runSub, 'gold', ()=>{ App.run.active ? (App.dungeonView='battle', render()) : openPartyPicker(); }],
    ['🎒', 'Inventory', 'Gear, stash & artifacts', '', ()=>{ App.dungeonView='inventory'; render(); }],
    ['🔨', 'Craft', 'Forge weapons & armor', '', ()=>{ App.dungeonView='craft'; render(); }],
    ['📖', 'Index', 'Discovered loot & foes', '', ()=>{ App.dungeonView='index'; render(); }],
    ['💎', 'Gem Shop', 'One-run blessings', '', ()=>{ App.dungeonView='gemshop'; render(); }],
  ].forEach(([icon,label,sub,cls2,fn])=>{
    const b = el(`<button class="px-btn hub-tile ${cls2}"><span class="ht-icon">${icon}</span><span class="ht-label">${label}</span><span class="ht-sub">${sub}</span></button>`);
    b.addEventListener('click', fn);
    grid.appendChild(b);
  });
  outer.appendChild(actions);

  if(ch.bossFloorsCleared.length){
    const rush = el(`<div class="px-panel"><div class="dg-h2">Boss Rush — refight a cleared boss (10% artifact drop each time)</div><div class="bossrush-grid"></div></div>`);
    const rg = rush.querySelector('.bossrush-grid');
    ch.bossFloorsCleared.slice().sort((a,b)=>a-b).forEach(f=>{
      const rd = REGIONS[regionForFloor(f)-1];
      const bd = bossDefForFloor(f) || {name:rd.boss, sprite:rd.arche, pal:null};
      const b = el(`<button class="px-btn small boss-tile"><span class="bt-art"></span><span class="bt-name">${escapeHtml(bd.name)}</span><span class="bt-floor">Floor ${f}</span></button>`);
      setArt(b.querySelector('.bt-art'), creatureArt(bd.sprite, rd.color, {boss:true, palKey:bd.pal, still:true}));
      b.addEventListener('click', ()=>enterDungeonLoading(()=>startBossRush(f)));
      rg.appendChild(b);
    });
    outer.appendChild(rush);
  }
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}
function regionTint(color){ return {'--rtint1': shade(color,-0.2)+'55', '--rtint2': shade(color,0.1)+'55'}; }
/* ===================== WHAT YOU ARE LOOKING AT =====================
   The ! over the enemy's shoulder. Everything the floor knows about the thing
   in front of you: what it is made of, what hurts it, what it shrugs off, how
   fast it is, and whether rot takes hold on it at all.
   ================================================================= */
function affinityChips(monster){
  const seen = {};
  const chip = (t, kind)=>{
    if(seen[t]) return '';
    seen[t] = 1;
    const d = dmgType(t);
    return `<span class="affchip ${kind}">${d.icon} ${escapeHtml(d.label)}</span>`;
  };
  const weak = (monster.weak||[]).map(t=>chip(t,'weak')).join('');
  const res  = (monster.resist||[]).map(t=>chip(t,'resist')).join('');
  return {weak: weak || '<span class="affchip none">nothing in particular</span>',
          resist: res || '<span class="affchip none">nothing</span>'};
}

/* What is actually multiplying this hit, in the order it happens. The estimate
   on a skill button already includes every one of these, which is exactly why
   they have to be spelled out - otherwise the bonus is invisible and reads as
   broken. */
function damageBreakdown(skill, st, m){
  const type = skill.type || 'physical';
  const diff = curDiff();
  const passive = CLASSES[App.character.classId].passive;
  const parts = [];

  /* Things already folded into st.atk. They are listed so you can see them,
     but they must not be multiplied in again below. */
  (App.run.buffs||[]).forEach(b=>{
    if(b.stat === 'atkPct' && b.amount) parts.push({label:b.name, pct:b.amount, inAtk:1, good:1});
  });
  if(runBonusActive('might')) parts.push({label:'Might', pct:0.25, inAtk:1, good:1});

  /* From here down this walks the engine step for step, in its order and with
     its rounding, so the number printed is the number dealt. Everything that
     takes damage away is shown too - a hidden reducer under a visible bonus is
     exactly what makes a working bonus look broken. */
  let pierce = skill.defPierce || 0;
  const shatterNext = shatterPierceNext();
  if(shatterNext) pierce = Math.min(1, pierce + shatterNext);
  /* the engine subtracts the unrounded reduction and rounds once; rounding it
     here first drifts by a point, which a hard question then multiplies up */
  const reductionF = defenseBite(st.atk * skill.mult, monsterDef(), pierce);
  let v = Math.max(1, Math.round(st.atk * skill.mult - reductionF));
  if(shatterNext >= 1 && monsterDef() > 0)
    parts.push({label:'TRUE — its armour counts for nothing', flat:1, good:1});
  else if(shatterNext > 0 && monsterDef() > 0)
    parts.push({label:'Shatter ×'+(shatterStacks()+1)+' — ignores '+Math.round(shatterNext*100)+'% armour', flat:1, good:1});
  if(reductionF >= 0.5) parts.push({label:'−'+Math.round(reductionF)+' its defense', flat:1, bad:1});

  if(diff.dmgMult !== 1){
    v = Math.max(1, Math.round(v * diff.dmgMult));
    parts.push({label:diff.label+' question', x:diff.dmgMult, good:diff.dmgMult>1?1:0, bad:diff.dmgMult<1?1:0});
  }
  const aff = skill.noDamage ? 0 : affinity(m, type);
  if(aff > 0){ v = Math.max(1, Math.round(v * WEAK_MULT)); parts.push({label:'WEAK to '+dmgType(type).label, x:WEAK_MULT, good:1}); }
  else if(aff < 0){ v = Math.max(1, Math.round(v * RESIST_MULT)); parts.push({label:'Resists '+dmgType(type).label, x:RESIST_MULT, bad:1}); }

  if(passive === 'ambush'){
    const k = dotStacks();
    if(k){ v = Math.round(v * (1 + venomPerStack()*k)); parts.push({label:'Venomcraft ×'+k, pct:venomPerStack()*k, good:1}); }
    else { v = Math.max(1, Math.round(v * ROGUE_COLD_MULT)); parts.push({label:'No wound open', x:ROGUE_COLD_MULT, bad:1}); }
  }
  if(passive === 'combo'){
    const edge = clamp(st.spd - (m.spd||0), 0, 7);
    if(edge > 0){ v = Math.round(v * (1 + 0.05*edge)); parts.push({label:'Momentum', pct:0.05*edge, good:1}); }
  }
  if(skill.guaranteedCrit){
    const cm = 1.6 + (passive === 'ambush' ? 0.15 : 0);
    v = Math.round(v * cm); parts.push({label:'Guaranteed crit', x:cm, good:1});
  }
  if(passive === 'bulwark'){
    const missing = clamp(1 - (App.run.hp / Math.max(1, st.maxHp)), 0, 1);
    if(missing > 0.5){ const b = bulwarkRage()*((missing-0.5)/0.5); v = Math.round(v * (1+b));
      parts.push({label: hasWeaponPassive('dragonfang') ? 'Dragonfang' : 'Bulwark', pct:b, good:1}); }
  }
  if(passive === 'combo'){
    const c = Math.min(5, App.run.combo||0);
    if(c > 1){ v = Math.round(v * (1 + 0.08*(c-1))); parts.push({label:'Combo ×'+c, pct:0.08*(c-1), good:1}); }
  }
  if(omenIs('thinveil')){ v = Math.round(v * 1.3); parts.push({label:'Thin Veil', pct:0.3, good:1}); }
  if(App.run.frozen){ v = Math.max(1, Math.round(v*0.5)); parts.push({label:'Frozen', x:0.5, bad:1}); }
  if(m.braced){ v = Math.max(1, Math.round(v*0.5)); parts.push({label:'Braced', x:0.5, bad:1}); }
  /* and whatever the boss is doing about it right now */
  if(m.isBoss){
    const after = bossModifyIncomingDamage(v, (skill.cost||0) > 0);
    if(after !== v){
      const r = after / Math.max(1, v);
      parts.push({label:(m.abilityName || 'Boss armour'), x:Math.round(r*100)/100, bad:r<1, good:r>1});
      v = after;
    }
  }
  const baseAtk = (st.atkNoBuff != null ? st.atkNoBuff : st.atk);
  return {base: Math.max(1, Math.round(baseAtk * skill.mult)), parts, est: Math.max(1, v), aff};
}
function breakdownHtml(bd){
  if(!bd.parts.length) return '';
  const bits = bd.parts.map(pp=>{
    const v = pp.flat ? '' : (pp.x != null ? '×'+pp.x : '+'+Math.round(pp.pct*100)+'%');
    const cls = pp.bad ? ' bad' : (pp.good ? ' good' : '');
    return `<span class="bdpart${cls}">${escapeHtml(pp.label)} ${v}</span>`;
  }).join('<span class="bdop">→</span>');
  return `<span class="bdline"><span class="bdbase">${bd.base} base</span><span class="bdop">→</span>${bits}</span>`;
}
function renderBattle(){
  const run = App.run;
  if(!run.monster){ const d=el('<div class="px-panel">No active battle.</div>'); return d; }
  const m = run.monster;
  const st = combatStats();
  const outer = document.createDocumentFragment();
  const rd = REGIONS[m.region-1];
  const passive = CLASSES[App.character.classId].passive;
  let passiveTag = '';
  if(passive==='combo'){
    const edge = clamp(st.spd - (m.spd||0), 0, 7);
    const bits = [];
    if((run.combo||0)>1) bits.push(`Combo ×${Math.min(5,run.combo)} +${Math.min(40,(Math.min(5,run.combo)-1)*8)}%`);
    if(edge>0) bits.push(`Momentum +${edge*5}%`);
    if(bits.length) passiveTag = `<span class="buff-tag">${bits.join(' · ')}</span>`;
    const sk = shatterStacks();
    passiveTag += sk >= SHATTER_MAX
      ? `<span class="buff-tag shatter">🛡 SHATTERED · true damage</span>`
      : `<span class="buff-tag shatter">🛡 Shatter ×${sk} · next blow ignores ${Math.round(shatterPierceNext()*100)}% armour</span>`;
  }
  if(passive==='bulwark'){
    const st0 = combatStats();
    const missing = clamp(1 - (run.hp / Math.max(1, st0.maxHp)), 0, 1);
    const bonus = missing > 0.5 ? Math.round(30 * ((missing - 0.5) / 0.5)) : 0;
    passiveTag = `<span class="buff-tag">Bulwark −15% taken${bonus ? ' · +' + bonus + '% dmg' : ''}</span>`;
  }
  if(passive==='attune') passiveTag = `<span class="buff-tag">Attunement · crit spells refund ⚡</span>`;
  if(passive==='ambush'){
    const k = dotStacks();
    passiveTag = run.openedFloor
      ? `<span class="buff-tag">Venomcraft${k?' +'+(12*k)+'% dmg':''} · crits +15%</span>`
      : `<span class="buff-tag">Ambush ready · next strike crits</span>`;
  }
  if(passive==='grace') passiveTag = `<span class="buff-tag">Grace · +4% HP per correct answer</span>`;
  if(passive==='rage'){
    const missing = Math.round(clamp(1-(run.hp/Math.max(1,st.maxHp)),0,1)*45);
    if(missing>2) passiveTag = `<span class="buff-tag">Rage +${missing}% dmg</span>`;
  }
  const stacks = dotStacks();
  const stackTag = stacks
    ? `<span class="buff-tag debuff">🩸 Wounds ×${stacks} · ${dotTickTotal()}/turn</span>` : '';
  const spdEdge = st.spd - (m.spd||0);
  const spdTag = `<span class="buff-tag spd${spdEdge>0?' good':(spdEdge<0?' bad':'')}">⚡ SPD ${st.spd} vs ${m.spd||0}</span>`;
  /* what is currently eating you, and what it has put on itself */
  const woundTag = ['poison','playerBurn','playerBleed'].map(k=>{
    const d = run[k];
    if(!d || !(d.turnsLeft>0)) return '';
    const w = {poison:'🧪 Poisoned', playerBurn:'🔥 Burning', playerBleed:'🩸 Bleeding'}[k];
    return `<span class="buff-tag debuff">${w} ${d.perTurn}/turn · ${d.turnsLeft}t</span>`;
  }).join('');
  const gearTag = (m.gear||[]).length
    ? `<span class="buff-tag debuff">🛡 Armoured ×${m.gear.length}</span>` : '';
  const braceTag = m.braced ? `<span class="buff-tag debuff">Braced — next hit halved</span>` : '';
  const om = omen();
  const omenTag = om ? `<span class="buff-tag omen ${om.tone}" title="${escapeHtml(om.desc)}">${om.icon} ${escapeHtml(om.name)}</span>` : '';
  const nemTag = m.nemesis ? `<span class="buff-tag omen bad">☠ NEMESIS</span>` : '';
  const buffTags = passiveTag + omenTag + nemTag + spdTag + stackTag + gearTag + woundTag + braceTag
    + (run.buffs||[]).map(b=>`<span class="buff-tag${b.amount<0?' debuff':''}${b.glow?' charged':''}">${escapeHtml(b.name)} ${
        b.permanent ? (b.stacks>1 ? '×'+b.stacks : '∞') : (b.turns+'t')}</span>`).join('')
    + (run.monsterBuffs||[]).map(b=>`<span class="buff-tag debuff">${escapeHtml(b.name)} ${b.turns}t</span>`).join('')
    + (run.monsterDebuffs||[]).map(b=>`<span class="buff-tag debuff">${escapeHtml(b.name)} ${b.turns}t</span>`).join('');
  outer.appendChild(el(`<div class="px-panel battle-head" style="margin-bottom:0;">
    <div class="dg-h2" style="margin:0;">${m.gauntlet
      ? (m.dwarf ? 'THE HERO HIMSELF — Durin Brasshand' : 'Stage '+(run.dwarf?run.dwarf.stage:1)+' / 5 — The Dwarf\'s Trial')
      : 'Floor '+run.floor+' / '+MAX_FLOOR+' — '+escapeHtml((m.bandName||bandForFloor(run.floor).name))+' '+(m.isFinal?'★ FINAL BOSS':(m.isBoss?'★ BOSS':''))+(run.bossRush?' (Boss Rush)':'')}</div>
    <div class="head-right"><span class="run-gold">${run.gold||0} 🪙</span>${buffTags}</div>
  </div>`));

  /* which room this is decides how it is lit, and two of the outdoor ones are
     still night: a necropolis and a caldera are outside, not bright */
  const outK = m.gauntlet ? 0 : outdoorKind(m.region, false);
  const sceneCls = 'battle-scene' + (outK ? ' sc-out sc-r' + outK : '')
    + ((outK === 8 || outK === 9 || outK === 10) ? ' sc-night' : '')
    + ((m.phase || 1) >= 2 ? ' ph2' : '');
  const scene = el(`<div class="${sceneCls}"><div class="scene-bg"></div><div class="scene-dark"></div><div class="scene-light"></div><div class="scene-haze"></div>
    <div class="combatant player">
      <div class="namebar">${CLASSES[App.character.classId].name.toUpperCase()}${

      <div class="hpbar-wrap"><div class="hpbar-outer"><div class="hpbar-bg"></div><div class="hpbar-fill"></div><div class="hpbar-num"></div></div></div>
      <div class="sprite-box"></div>
      <div class="energy-row"></div>
    </div>
    <div class="combatant monster${m.isBoss?' boss':''}${m.isFinal?' smallboss':''}">
      ${m.isBoss?'':'<div class="namebar'+(m.elite?' elite':'')+'">'+escapeHtml(m.name)+(m.roleLabel?'<span class="rolebadge role-'+m.role+'">'+escapeHtml(m.roleLabel)+'</span>':'')+'</div><div class="hpbar-wrap hp-monster"><div class="hpbar-outer"><div class="hpbar-bg"></div><div class="hpbar-fill"></div><div class="hpbar-num"></div></div></div>'}
      <div class="sprite-box"><div class="sprite-flip mirror"></div></div>
      <div class="energy-row mon-energy${m.isBoss?' hidden-row':''}"></div>
    </div>
    <button class="intel-btn" title="What is this thing? Weaknesses, speed, the lot.">!</button>
    ${m.isBoss?`<div class="boss-bar-top"><div class="bname">${escapeHtml(m.name)}</div><div class="hpbar-wrap hp-monster"><div class="hpbar-outer"><div class="hpbar-bg"></div><div class="hpbar-fill"></div><div class="hpbar-num"></div></div></div><div class="energy-row mon-energy"></div>${bossUltimateFor()?`<div class="bu-meter${bossChargeReady()?' full':''}"><span class="bu-mlabel">${bossChargeReady()?'⚠ '+escapeHtml(BOSS_ULTIMATE[m.bossFloor].name)+' READY':escapeHtml(BOSS_ULTIMATE[m.bossFloor].name)+' — '+bossCharge()+'/'+BOSS_CHARGE_MAX+' mistakes'}</span><span class="bu-pips">${Array.from({length:BOSS_CHARGE_MAX},(_,i)=>'<i class="'+(i<bossCharge()?'on':'')+'"></i>').join('')}</span></div>`:''}</div>${m.abilityName?`<div class="boss-ability"><b>${escapeHtml(m.abilityName)}</b> — ${escapeHtml(m.abilityDesc||'')}</div>`:''}`:''}
  </div>`);
  Object.entries(regionTint(m.isFinal?'#4f9a6a':rd.color)).forEach(([k,v])=>scene.style.setProperty(k,v));
  /* a boss floor should not feel like the nine before it */
  if(m.isBoss){
    scene.classList.add('bossroom');
    const ent = bossEntranceFor(m.bossFloor);
    scene.style.setProperty('--bossaura', hexA(ent ? ent.hue : '#e0453a', 0.16));
    for(let i=0;i<14;i++){
      const d = el('<div class="bossmote"></div>');
      d.style.left = (6 + Math.random()*88) + '%';
      d.style.top  = (58 + Math.random()*36) + '%';
      d.style.animationDuration = (4.5 + Math.random()*4) + 's';
      d.style.animationDelay = (-Math.random()*6) + 's';
      scene.appendChild(d);
    }
  }
  setArt(scene.querySelector('.scene-bg'), m.gauntlet ? dungeonScene(11, '#a83a24', false, true) : dungeonScene(m.region, m.color, m.isFinal));
  /* and the things that live in it. The same node is moved across on every
     render, never rebuilt, so a bat mid-flight stays mid-flight. */
  const lifeKind = m.gauntlet ? 'dungeon' : (outdoorKind(m.region, false) || 'dungeon');
  const life = sceneLifeLayer(lifeKind);
  if(life) scene.insertBefore(life, scene.querySelector('.scene-dark'));
  setArt(scene.querySelector('.combatant.player .sprite-box'), classArt(App.character.classId));
  setArt(scene.querySelector('.combatant.monster .sprite-flip'), monsterSprite(m));
  updateHpBar(scene.querySelector('.combatant.player .hpbar-fill'), scene.querySelector('.combatant.player .hpbar-num'), run.hp, st.maxHp);
  updateHpBar(scene.querySelector('.hp-monster .hpbar-fill'), scene.querySelector('.hp-monster .hpbar-num'), m.hp, m.maxHp);
  const erow = scene.querySelector('.combatant.player .energy-row');
  for(let i=0;i<st.energyMax;i++) erow.appendChild(el(`<div class="energy-seg${i<run.energy?' filled':''}">${i<run.energy?'⚡':''}</div>`));
  const merow = scene.querySelector('.mon-energy');
  if(merow){
    for(let i=0;i<m.energyMax;i++) merow.appendChild(el(`<div class="energy-seg mini${i<m.energy?' mfilled':''}"></div>`));
  }
  const ibtn = scene.querySelector('.intel-btn');
  if(ibtn){
    if(App.showIntel) ibtn.classList.add('on');
    ibtn.addEventListener('click', ()=>{ App.showIntel = !App.showIntel; render(); });
  }
  /* a charged fist or a blessed mace shows it */
  const chargeBuff = activeChargeBuff();
  if(chargeBuff){
    const box = scene.querySelector('.combatant.player .sprite-box');
    box.classList.add('charged');
    box.style.setProperty('--chg', 'var(--fx-'+chargeBuff.glow+')');
    box.appendChild(el(`<div class="hand-glow ${chargeBuff.glow} c-${App.character.classId}"></div>`));
  }
  outer.appendChild(scene);
  if(App.showIntel){
    const card = monsterIntelCard();
    card.querySelector('.intel-x').addEventListener('click', ()=>{ App.showIntel = false; render(); });
    outer.appendChild(card);
  }
  if(isStunned()){
    outer.appendChild(el(`<div class="px-panel" style="margin-top:0;padding:8px 18px;"><span class="stun-tag">✸ ${escapeHtml(m.name)} CANNOT ACT — ${m.stunTurns} turn${m.stunTurns>1?'s':''} left</span></div>`));

  const controls = el(`<div class="controls-panel"></div>`);
  if(App.run.bossNote){
    controls.appendChild(el(`<div class="boss-note">⚠ ${escapeHtml(App.run.bossNote)}</div>`));

  }
  let phase = App.currentPhase;
  if((phase==='question'||phase==='reveal') && !App.currentQuestion) phase = 'difficulty';
  if(phase==='entrance'){

  } else if(phase==='opening'){
    controls.appendChild(el(`<div class="feedback-msg bad">⚡ <b>${escapeHtml(m.name)}</b> is faster than you — Speed ${m.spd||0} against your ${st.spd}. It gets the first swing.</div>`));

    const body = el(`<div class="qbody diff-pick">

      <div class="qtext">+1 ⚡ — pick how hard you want this question.</div>
    </div>`);
    const grid = el(`<div class="diffbtns"></div>`);
    DIFF_IDS.forEach(id=>{

    const row = el(`<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;"></div>`);
    const inv = el(`<button class="px-btn">🎒 Inventory</button>`);
    inv.addEventListener('click', ()=>{ App.itemsFrom=phase; App.currentPhase='items'; render(); });
    row.appendChild(inv);
    const flee = el(`<button class="px-btn red">Flee to Town</button>`); flee.addEventListener('click', fleeRun); row.appendChild(flee);
    controls.appendChild(row);
  } else if(phase==='question'){

    const d = DIFFS[q.difficulty] || DIFFS.medium;
    const body = el(`<div class="qbody"><span class="qtag"><b class="qdiff ${d.id}">${d.icon} ${d.label}</b> ${q.mode==='mcq'?'Multiple Choice':'Type the Answer'} — ${escapeHtml(q.sourceLabel||realmName())}</span><div class="qtext">${escapeHtml(q.prompt)}</div></div>`);

        const b = el(`<button class="skillbtn${skill.ultimate?' ult':''}${skill.monster?' learned':''}${skill.noDamage?' buff':''}${cd>0?' cooling':''}" ${afford?'':'disabled'}>

          <span class="sest">${skill.noDamage?'no damage':('~'+est+' dmg')} · ${cost===0?'free':(cost+' ⚡')}

        if(afford) b.addEventListener('click', ()=>useSkillById(skill.id));
        grid.appendChild(b);
      });
      controls.appendChild(grid);
      /* who else is down here, how hurt they are, and what it costs to bring
         them forward. The cost is the whole mechanic, so it is on the button. */
      if(benchedHeroes().length){
        const bench = el(`<div class="bench"><div class="bench-h">The bench — stepping up costs your turn, and it swings at them on the way in</div><div class="bench-row"></div></div>`);
        const br = bench.querySelector('.bench-row');
        benchedHeroes().forEach(cid=>{
          const hs = heroState(cid);

            <span class="bb-name">${escapeHtml(CLASSES[cid].name)}${hs.down?' <span class="bb-out">DOWN</span>':''}</span>
            <span class="bb-hp"><span class="bb-hpfill" style="width:${Math.round(pct*100)}%"></span></span>
            <span class="bb-num">${hs.down?'out until the next floor':hs.hp+' / '+hs.maxHp}</span>
            <span class="bb-weak">✖ ${escapeHtml(weak.name)}</span>
          </button>`);
          setArt(b.querySelector('.bb-art'), classArt(cid));
          if(!hs.down) b.addEventListener('click', ()=>switchHero(cid));
          br.appendChild(b);
        });
        controls.appendChild(bench);
      }
      const row = el(`<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;"></div>`);
      const inv = el(`<button class="px-btn">🎒 Inventory</button>`);
      inv.addEventListener('click', ()=>{ App.itemsFrom=phase; App.currentPhase='items'; render(); });
      row.appendChild(inv);
      const flee = el(`<button class="px-btn red">Flee to Town</button>`);
      flee.addEventListener('click', fleeRun);
      row.appendChild(flee);
      controls.appendChild(row);
    } else {
      const grid = el(`<div class="item-grid"></div>`);
      let any = false;
      POTION_IDS.forEach(id=>{
        const n = potionCount(id);
        if(n<=0) return;
        any = true;
        const p = POTIONS[id];
        const card = el(`<div class="item-card potion-card"><span class="iname">${p.icon} ${escapeHtml(p.name)} ×${n}</span><span class="istat">${escapeHtml(p.desc)}</span></div>`);
        const b = el(`<button class="btn-pixel-sm primary" style="margin-top:8px;">Use</button>`);
        b.addEventListener('click', ()=>usePotionInCombat(id));
        card.appendChild(b);
        grid.appendChild(card);
      });
      if(!any) grid.appendChild(el(`<div class="muted">No potions — monsters drop them, and the merchant sells them.</div>`));
      controls.appendChild(grid);
      const from = App.itemsFrom==='skillmenu' ? 'skillmenu' : (App.itemsFrom==='difficulty' ? 'difficulty' : 'postattack');
      const back = el(`<button class="px-btn gold" style="margin-top:12px;">« ${from==='skillmenu'?'Back to skills':'Back'}</button>`);
      back.addEventListener('click', ()=>{ App.currentPhase = from; render(); });
      controls.appendChild(back);
    }
  } else if(phase==='postattack'){
    controls.appendChild(el(`<div class="feedback-msg ${App.lastAnswerCorrect?'good':'bad'}">${App.lastAnswerCorrect?'✔ You struck the enemy!':'✘ The enemy struck back!'}</div>`));
    const row = el(`<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;"></div>`);
    const cont = el(`<button class="px-btn gold">Continue</button>`); cont.addEventListener('click', startNewTurn); row.appendChild(cont);
    const inv = el(`<button class="px-btn">🎒 Inventory</button>`);
    inv.addEventListener('click', ()=>{ App.itemsFrom=phase; App.currentPhase='items'; render(); });
    row.appendChild(inv);
    const flee = el(`<button class="px-btn red">Flee to Town</button>`); flee.addEventListener('click', fleeRun); row.appendChild(flee);
    controls.appendChild(row);
  }
  outer.appendChild(controls);
  const out = el('<div></div>'); out.appendChild(outer);
  return out;
}

/* ============================== INVENTORY (paperdoll / backpack / stash / shrine) ============================== */
function itemStatLine(it){
  if(it.kind==='weapon'){ let s=`+${it.atk} ATK`; if(it.critBonus) s+=`, +${it.critBonus}% crit`; if(it.lifeBonus) s+=`, +${it.lifeBonus}% lifesteal`; return s; }
  return `+${it.def} DEF`;
}
function findItem(id){ const ch=App.character; return ch.weapons.find(w=>w.id===id) || ch.armors.find(a=>a.id===id) || null; }
function equipItem(slot, id){
  /* take it off whoever has it first - it is one object, not a licence */
  const prev = wornBy(id);
  if(prev){ const p = loadoutFor(prev); Object.keys(p).forEach(s=>{ if(p[s]===id) p[s]=null; }); }
  equipMap()[slot] = id;
  const it = findItem(id);
  if(it) markDiscovered(it.lineId);
  App.slotPicker = null; saveCharacter(); render();
}
function unequipSlot(slot){ equipMap()[slot] = null; render_and_save(); }
function render_and_save(){ saveCharacter(); render(); }
function moveToStash(id, kind){
  const ch = App.character;
  Object.keys(ch.loadouts||{}).forEach(cid=>{ const lo = ch.loadouts[cid];
    Object.keys(lo).forEach(slot=>{ if(lo[slot]===id) lo[slot]=null; }); });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(item) ch.stash.push(item);
  saveCharacter(); render();
}
function moveToBackpack(id){
  const ch = App.character;
  const item = ch.stash.find(i=>i.id===id);
  if(!item) return;
  ch.stash = ch.stash.filter(i=>i.id!==id);
  if(item.kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  saveCharacter(); render();
}
function salvageItem(id, kind){
  const ch = App.character;
  Object.keys(ch.loadouts||{}).forEach(cid=>{ const lo = ch.loadouts[cid];
    Object.keys(lo).forEach(slot=>{ if(lo[slot]===id) lo[slot]=null; }); });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(!item) return;
  const idx = RARITY_ORDER.indexOf(item.rarity);
  const n = (idx>=0?idx+1:1);
  addMaterial(item.kind==='weapon'?'iron':'leather', n);
  addMaterial('cloth', 1);
  if(idx>=2) addFloorCore(App.character.highestFloor||1, 1);
  saveCharacter(); render();
}
function equipArtifact(key, slotName){
  const ch = App.character;
  if(!ch.artifacts[key].owned) return;
  if(isArtifactEquipped(key)) return;
  equipMap(ch)[slotName] = key;
  saveCharacter(); render();
}
function unequipArtifactSlot(slotName){ equipMap()[slotName]=null; saveCharacter(); render(); }
function rechargeArtifact(key, useBossCore){
  const ch = App.character;
  const art = ch.artifacts[key];
  const cap = artifactChargeCap(key);
  if(!art.owned || art.charges>=cap) return;
  if(useBossCore){
    if(coreCount('boss')<1) return;
    ch.cores.boss--;
    art.charges = Math.min(cap, art.charges + 3);
  } else {
    if(totalCorePower(false) < 3) return;
    spendCorePower(3);
    art.charges++;
  }
  saveCharacter(); render();
}
function pickTitanStat(stat){ if(App.character.titanStat) return; App.character.titanStat=stat; saveCharacter(); render(); }

/* ============================== CRAFT ============================== */
const CRAFT_COST = {
  common:   {mats:{iron:3, wood:2}, cores:{}, minFloor:1},
  rare:     {mats:{iron:6, cloth:4, leather:3}, cores:{tier:'t1', count:3}, minFloor:1},
  epic:     {mats:{iron:12, leather:8, cloth:6}, cores:{tier:'t2', count:4}, minFloor:40, regionMat:5},
  legendary:{mats:{iron:22, leather:14}, cores:{tier:'t3', count:5, boss:3}, minFloor:70, regionMat:10, blueprint:true},
};
function blueprintId(lineId){ return 'bp_'+lineId; }
function hasBlueprint(lineId){ return !!(App.character.blueprints||{})[blueprintId(lineId)]; }
function blueprintItemCount(lineId){ return (App.character.blueprintItems||{})[lineId] || 0; }
function grantBlueprintItem(lineId, n){
  const bi = App.character.blueprintItems = App.character.blueprintItems || {};
  bi[lineId] = (bi[lineId]||0) + (n||1);
}
function lineById(lineId){ return weaponLine(lineId) || armorLine(lineId); }
function useBlueprintItem(lineId){
  const ch = App.character;
  if(blueprintItemCount(lineId) <= 0) return;
  ch.blueprintItems[lineId]--;
  if(ch.blueprintItems[lineId] <= 0) delete ch.blueprintItems[lineId];
  ch.blueprints = ch.blueprints || {};
  ch.blueprints[blueprintId(lineId)] = true;
  const line = lineById(lineId);
  App.craftNote = 'Recipe learned: ' + (line ? line.name : lineId) + ' — it now appears at the forge.';
  saveCharacter(); render();
}
function legendaryLines(){
  return WEAPON_CATALOG.filter(w=>w.rarity==='legendary').concat(ARMOR_CATALOG.filter(a=>a.rarity==='legendary'));
}
function craftRequirement(line){
  const cost = CRAFT_COST[line.rarity];
  const need = {mats:Object.assign({}, cost.mats), cores:Object.assign({}, cost.cores)};
  if(cost.regionMat){
    const sigPool = ['bone','ember','frost','venom','stone','feather','ectoplasm','magma','ash','slime'];
    const idx = (line.lineId.length + (line.slot? line.slot.length : line.classId.length)) % sigPool.length;
    need.mats[sigPool[idx]] = (need.mats[sigPool[idx]]||0) + cost.regionMat;
  }
  return need;
}
function canAffordCraft(line){
  const need = craftRequirement(line);
  const cost = CRAFT_COST[line.rarity];
  if(App.character.highestFloor < cost.minFloor-1) return false;
  if(cost.blueprint && !hasBlueprint(line.lineId)) return false;
  if(need.cores.boss && coreCount('boss') < need.cores.boss) return false;
  if(need.cores.count && coresAtOrAbove(need.cores.tier) < need.cores.count) return false;
  return Object.keys(need.mats).every(m=>matCount(m) >= need.mats[m]);
}
function craftCostLabel(line){
  const need = craftRequirement(line);
  const parts = Object.keys(need.mats).map(m=>`${MATERIALS[m].icon}${need.mats[m]}`);
  if(need.cores.count) parts.push(need.cores.count+'× '+CORE_TIERS[need.cores.tier].name+(need.cores.tier==='t4'?'':' or better'));
  if(need.cores.boss) parts.push(need.cores.boss+'× Boss Core');
  return parts.join(' · ');
}
function craftItem(lineId, kind){
  const ch = App.character;
  const line = kind==='weapon' ? weaponLine(lineId) : armorLine(lineId);
  if(!line || !canAffordCraft(line)) return;
  const need = craftRequirement(line);
  Object.keys(need.mats).forEach(m=>{ ch.materials[m] -= need.mats[m]; });
  if(need.cores.boss) ch.cores.boss -= need.cores.boss;
  if(need.cores.count) spendCoresAtOrAbove(need.cores.tier, need.cores.count);
  const item = kind==='weapon' ? makeWeaponInstance(line) : makeArmorInstance(line);
  if(kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  markDiscovered(line.lineId);
  App.craftNote = 'Forged: '+item.name;
  saveCharacter(); render();
}
function renderCraft(){
  const ch = App.character;
  const outer = document.createDocumentFragment();
  const matLine = MATERIAL_IDS.filter(m=>matCount(m)>0).map(m=>`<span class="mat-chip">${MATERIALS[m].icon} ${MATERIALS[m].name} ×${matCount(m)}</span>`).join('');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CRAFT</div>
    <p>Forge gear from what the dungeon gives up — ore, timber, cloth, hide, the parts monsters leave behind, and the <b>cores</b> torn out of them. Brighter cores come from deeper floors and stand in for duller ones. Legendary gear needs its <b>blueprint</b> and Boss Cores.</p>
    <div class="mat-line">${CORE_ORDER.filter(t=>coreCount(t)>0).map(t=>`<span class="core-chip">${coreIcon(t,18)} ${CORE_TIERS[t].name} ×${coreCount(t)}</span>`).join('') || '<span class="muted">No cores yet.</span>'}</div>
    <div class="mat-line">${matLine || '<span class="muted">No materials yet — clear floors to gather them.</span>'}</div>
  </div>`));
  if(App.craftNote){ outer.appendChild(el(`<div class="px-panel"><div class="feedback-msg good">${escapeHtml(App.craftNote)}</div></div>`)); App.craftNote = null; }

  function recipeRow(line, kind){
    const cost = CRAFT_COST[line.rarity];
    const need = craftRequirement(line);
    const locked = ch.highestFloor < cost.minFloor-1;
    const needsBp = cost.blueprint && !hasBlueprint(line.lineId);
    const afford = canAffordCraft(line);
    const statTxt = kind==='weapon'
      ? itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus})
      : ('+'+line.def+' DEF');
    const row = el(`<div class="recipe-row">
      <span class="rarity-${line.rarity}">${escapeHtml(line.name)} <span class="muted-dark">(${line.rarity}) — ${statTxt}</span>
        <span class="recipe-cost">${craftCostLabel(line)}</span></span>
      <span class="recipe-action"></span></div>`);
    const right = row.querySelector('.recipe-action');
    if(locked) right.textContent = 'Requires Floor '+cost.minFloor;
    else {
      const b = el(`<button class="px-btn small" ${afford?'':'disabled'}>Forge</button>`);
      b.addEventListener('click', ()=>craftItem(line.lineId, kind));
      right.appendChild(b);
    }
    return row;
  }

  const known = line => line.rarity!=='legendary' || hasBlueprint(line.lineId);
  const wpanel = el(`<div class="px-panel"><div class="dg-h2">Weapons — ${CLASSES[ch.classId].name} (${CLASSES[ch.classId].weaponType})</div></div>`);
  WEAPON_CATALOG.filter(w=>w.classId===ch.classId).filter(known).forEach(line=>wpanel.appendChild(recipeRow(line,'weapon')));
  outer.appendChild(wpanel);

  const apanel = el(`<div class="px-panel"><div class="dg-h2">Armor</div></div>`);
  ARMOR_CATALOG.filter(known).forEach(line=>apanel.appendChild(recipeRow(line,'armor')));
  outer.appendChild(apanel);

  const bps = Object.keys(ch.blueprints||{});
  const carried = Object.keys(ch.blueprintItems||{});
  const bpPanel = el(`<div class="px-panel"><div class="dg-h2">Learned Legendary Recipes</div><div class="item-grid"></div></div>`);
  const bg = bpPanel.querySelector('.item-grid');
  if(carried.length) bg.appendChild(el(`<div class="muted">You are carrying ${carried.length} unread blueprint${carried.length>1?'s':''} — study ${carried.length>1?'them':'it'} in your Inventory to add ${carried.length>1?'those recipes':'that recipe'} here.</div>`));
  if(!bps.length) bg.appendChild(el(`<div class="muted">No legendary recipes yet. Legendary schematics are carried by a certain dwarf — help him and he may part with one.</div>`));
  legendaryLines().forEach(line=>{
    if(!hasBlueprint(line.lineId)) return;
    bg.appendChild(el(`<div class="item-card"><span class="iname rarity-legendary">📜 ${escapeHtml(line.name)}</span><span class="istat">Blueprint learned — forge it above.</span></div>`));
  });
  outer.appendChild(bpPanel);

  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

/* One line of what a creature is made of, for the Bestiary card. */
function traitLine(tr){
  const nm = t=>dmgType(t).icon + ' ' + dmgType(t).label;
  const bits = [];
  bits.push(tr.family);
  bits.push('Weak: ' + ((tr.weak||[]).map(nm).join(', ') || '—'));
  bits.push('Resists: ' + ((tr.resist||[]).map(nm).join(', ') || '—'));
  if(tr.dot === 'immune') bits.push('No wounds take hold');
  else if(tr.dot === 'tough') bits.push('Wounds barely hold');
  else if(tr.dot === 'frail') bits.push('Wounds take badly');
  return bits.join(' · ');
}
/* ============================== INDEX (discovery bestiary/catalog) ============================== */

function indexCard(discovered, artMarkup, name, rarityClass, desc, extra){
  const card = el(`<div class="index-card${discovered?'':' undiscovered'}"></div>`);
  const holder = el('<div class="idx-art"></div>');
  holder.innerHTML = artMarkup;

    });
  } else if(App.indexTab==='armor'){
    ARMOR_CATALOG.forEach(line=>{
      const d = isDiscovered(line.lineId);
      grid.appendChild(indexCard(d, armorArt(line.slot, line.rarity), line.name, 'rarity-'+line.rarity,
        `${capitalize(line.slot)} armor, ${line.rarity}. +${line.def} DEF${line.spd?`, +${line.spd} SPD`:''}.`, 'Drop chance: '+RARITY_DROPCHANCE_DISPLAY[line.rarity]));
    });
  } else if(App.indexTab==='relics'){
    BOSS_FLOORS.forEach(f=>{
      const bd = BOSS_DEFS[f];
      const d = bd.drop;
      const disc = isDiscovered(d.lineId);
      const art = d.kind==='weapon' ? weaponArt(ch.classId, d.rarity) : armorArt(d.slot, d.rarity);
      grid.appendChild(indexCard(disc, art, d.name, 'rarity-'+d.rarity, d.desc,
        'Drops from '+bd.name+' (Floor '+f+') — 25%'));
    });
  } else if(App.indexTab==='artifacts'){
    ARTIFACT_KEYS.forEach(key=>{
      const d = isDiscovered('art_'+key);
      const def = ARTIFACT_DEFS[key];
      grid.appendChild(indexCard(d, artifactArt(key), def.name, 'rarity-legendary', def.desc, 'Drop chance: 10% from any 10th-floor boss (repeatable)'));
    });
  } else {
    FLOOR_BANDS.forEach((band, bi)=>{
      const rd = REGIONS[Math.min(9, Math.floor(band.from/10))];
      rosterForBand(bi).forEach(sp=>{
        const d = isDiscovered('mon_'+sp.id);
        const role = MONSTER_ROLES[sp.role] || MONSTER_ROLES.grunt;
        grid.appendChild(indexCard(d, creatureArt(sp.arche, rd.color, {still:true, tint:sp.tint}), sp.name,
          '', `${role.label} of ${band.name} (floors ${band.from}-${band.to}). ${role.note}`,
          traitLine(traitsFor(sp, sp.arche))));
      });
      /* the bosses that stand inside this band */
      for(let f = band.from - 1 + (band.from === 1 ? 11 : 1); f <= band.to; f++){
        if(f % 10 !== 0) continue;
        const bd = BOSS_DEFS[f]; if(!bd) continue;
        const brd = REGIONS[Math.min(9, f/10 - 1)];
        const key = f === 100 ? 'boss_final' : 'boss_'+(f/10);
        grid.appendChild(indexCard(isDiscovered(key),
          creatureArt(bd.sprite, brd.color, {boss:true, palKey:bd.pal, still:true}), bd.name,
          f === 100 ? 'rarity-legendary' : 'rarity-epic',
          `Floor ${f} boss. ${bd.abilityName}: ${bd.abilityDesc}`,
          traitLine(traitsFor(bd, brd.arche))));
      }
    });
  }
  outer.appendChild(panel);
  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

function rollDwarfStock(){
  const ch = App.character;
  const stock = [];
  const unlearned = legendaryLines().filter(l=>!hasBlueprint(l.lineId) && blueprintItemCount(l.lineId)===0);
  if(unlearned.length && chance(35)){
    const line = pick(unlearned);
    stock.push({type:'blueprint', lineId:line.lineId, name:'📜 Blueprint: '+line.name,
      desc:'A sealed schematic. Study it in your inventory to unlock the recipe.', price:randInt(420, 780), precious:true});
  }
  const rarePool = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && (w.rarity==='epic'||w.rarity==='legendary'))
    .concat(ARMOR_CATALOG.filter(a=>a.rarity==='epic'||a.rarity==='legendary'));
  shuffle(rarePool).slice(0, 2).forEach(line=>{
    const precious = line.rarity==='legendary';
    stock.push({type:'gear', lineId:line.lineId, kind:line.kind, name:(line.kind==='weapon'?'⚔ ':'🛡 ')+line.name,
      desc:(line.kind==='weapon'? itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus}) : '+'+line.def+' DEF')
        + (precious ? ' — "This one\'s dear to me, lad. It\'ll cost you."' : ''),
      price: precious ? randInt(500, 900) : randInt(180, 340), precious});
  });
  stock.push({type:'cores', tier:'boss', amount:randInt(2,4), name:'Boss Cores', desc:'Dense cores — good for the forge.', price:randInt(150,260)});
  const matId = pickMaterialId(App.run.floor||1);
  stock.push({type:'mat', matId, amount:randInt(6,12), name:MATERIALS[matId].icon+' '+MATERIALS[matId].name, desc:'Bulk crafting stock.', price:randInt(90,170)});
  return stock;
}
function dwarfBuy(idx){
  const s = App.run.dwarf.stock;
  const item = s[idx];
  if(!item || item.sold) return;
  if((App.run.gold||0) < item.price){ App.run.bossNote = 'The dwarf shakes his head. "Not enough coin."'; render(); return; }
  App.run.gold -= item.price;
  const ch = App.character;
  if(item.type==='blueprint') grantBlueprintItem(item.lineId);
  else if(item.type==='gear'){
    const line = item.kind==='weapon' ? weaponLine(item.lineId) : armorLine(item.lineId);
    const it = item.kind==='weapon' ? makeWeaponInstance(line) : makeArmorInstance(line);
    (item.kind==='weapon'? ch.weapons : ch.armors).push(it);
    markDiscovered(line.lineId);
  }
  else if(item.type==='cores') addCore(item.tier||'boss', item.amount);
  else if(item.type==='mat') addMaterial(item.matId, item.amount);
  item.sold = true;
  saveCharacter(); saveRun(); render();
}

function rollMerchantStock(floor){
  const ch = App.character;
  const stock = [];
  const potPool = shuffle(POTION_IDS).slice(0, 3);
  potPool.forEach(id=>{
    const p = POTIONS[id];
    stock.push({type:'potion', id, name:p.icon+' '+p.name, desc:p.desc, price:Math.round(p.price*(0.85+Math.random()*0.4))});
  });
  if(chance(60)){ const t = coreTierForFloor(floor); stock.push({type:'cores', tier:t, amount:randInt(3,7), name:CORE_TIERS[t].name+'s', desc:CORE_TIERS[t].desc+' Recharges artifacts and binds crafted gear.', price:randInt(60,120)}); }
  if(chance(45)){ const id=pickMaterialId(floor||1); stock.push({type:'mat', matId:id, amount:randInt(3,8), name:MATERIALS[id].icon+' '+MATERIALS[id].name, desc:'Crafting material.', price:randInt(50,110)}); }
  const learnable = Object.keys(MONSTER_BOOKS).map(k=>MONSTER_BOOKS[k])
    .filter(sid=>{ const s=SKILLS[sid]; return s && (!s.classes || s.classes.indexOf(ch.classId)>=0) && !(ch.learnedSkills||{})[sid]; });
  if(learnable.length && chance(70)){
    const sid = pick(learnable);
    stock.push({type:'book', id:sid, name:'📕 '+SKILLS[sid].name+' — Skill Book', desc:SKILLS[sid].desc+' (usable by your class)', price:randInt(140,260)});
  }
  return stock;
}
function merchantBuy(idx){
  const m = App.run.merchant;
  if(!m) return;
  const item = m.stock[idx];
  if(!item || item.sold) return;
  if((App.run.gold||0) < item.price){ App.run.bossNote = 'Not enough gold.'; render(); return; }
  App.run.gold -= item.price;
  const ch = App.character;
  if(item.type==='potion') addPotion(item.id, 1);
  else if(item.type==='cores') addCore(item.tier||'t1', item.amount);
  else if(item.type==='mat') addMaterial(item.matId, item.amount);
  else if(item.type==='book'){ ch.learnedSkills = ch.learnedSkills||{}; ch.learnedSkills[item.id] = true; }
  item.sold = true;
  saveCharacter(); saveRun(); render();
}
function learnBookFromBag(sid){
  const ch = App.character;
  if(!(ch.books||{})[sid]) return;
  const s = SKILLS[sid];
  if(s.classes && s.classes.indexOf(ch.classId)<0) return;
  ch.books[sid]--;
  ch.learnedSkills = ch.learnedSkills||{};
  ch.learnedSkills[sid] = true;
  saveCharacter(); render();
}
function leaveMerchant(){
  App.run.merchant = null;
  const floor = App.run.floor;
  saveRun();
  startFloor(floor+1);
}
function renderMerchant(){
  const m = App.run.merchant;
  const c = el(`<div class="dg-wrap"></div>`);
  c.appendChild(el(`<div class="px-panel merchant-panel">
    <div class="dg-h1">A MYSTERIOUS MERCHANT</div>
    <p>A hooded figure blocks the stair, wares spread on a stone slab. "Coin only, friend — it doesn't leave the dungeon anyway."</p>
    <div class="gold-line">Your gold this run: <b>${App.run.gold||0}</b> 🪙</div>
  </div>`));
  const panel = el(`<div class="px-panel"><div class="item-grid"></div></div>`);
  const grid = panel.querySelector('.item-grid');
  m.stock.forEach((item,i)=>{
    const card = el(`<div class="item-card${item.sold?' sold':''}">
      <span class="iname ${item.type==='book'?'rarity-legendary':'rarity-rare'}">${escapeHtml(item.name)}${item.amount?' ×'+item.amount:''}</span>
      <span class="istat">${escapeHtml(item.desc)}</span>
      <span class="istat" style="color:var(--gold);">${item.price} gold</span></div>`);
    if(item.sold) card.appendChild(el(`<div class="istat" style="margin-top:8px;color:var(--jade);">Purchased</div>`));
    else {
      const b = el(`<button class="btn-pixel-sm primary" style="margin-top:8px;" ${(App.run.gold||0)<item.price?'disabled':''}>Buy</button>`);
      b.addEventListener('click', ()=>merchantBuy(i));
      card.appendChild(b);
    }
    grid.appendChild(card);
  });
  c.appendChild(panel);
  if(App.run.bossNote){ c.appendChild(el(`<div class="px-panel"><div class="feedback-msg bad">${escapeHtml(App.run.bossNote)}</div></div>`)); App.run.bossNote=null; }
  const go = el(`<button class="px-btn gold" style="margin:0 0 18px;">Continue to Floor ${App.run.floor+1} »</button>`);
  go.addEventListener('click', leaveMerchant);
  c.appendChild(go);
  return c;
}

/* ============================== CHARACTERS (class select + skill tree) ============================== */
function canAllocate(node, prog){
  if(prog.allocated[node.id]) return false;
  if(prog.skillPoints < node.cost) return false;
  if(node.tier===3 && prog.evolution && prog.evolution!==node.branch) return false;
  return node.requires.every(r=>prog.allocated[r]);
}
function allocateNode(nodeId){
  const ch = App.character; const prog = classProg();
  const node = findSkillNode(ch.classId, nodeId);
  if(!canAllocate(node, prog)) return;
  prog.allocated[nodeId] = true;
  prog.skillPoints -= node.cost;
  if(node.tier===3) prog.evolution = node.branch;
  saveCharacter(); render();
}
function resetSkillTree(){
  const prog = classProg();
  let refund = 0;
  Object.keys(prog.allocated).forEach(id=>{ const n=findSkillNode(App.character.classId,id); if(n) refund+=n.cost; });
  prog.allocated = {}; prog.evolution = null; prog.skillPoints += refund;
  saveCharacter(); render();
}
function selectClass(classId){ App.character.classId = classId; saveCharacter(); render(); }
function renderCharactersScreen(){
  const ch = App.character;
  const outer = el('<div class="dg-wrap"></div>');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CHARACTERS</div><p>Pick a class — each keeps its own level and skill tree, so you can freely switch and experiment.</p>
    <p class="muted">You are building the hero of <b>${escapeHtml(realmIcon()+' '+realmName())}</b>. Levels and skill trees belong to this realm alone — switch realms from <b>Play</b> and you build a separate hero there.</p></div>`));

  const cgrid = el(`<div class="px-panel"><div class="class-grid"></div></div>`);
  const cg = cgrid.querySelector('.class-grid');
  Object.values(CLASSES).forEach(cls=>{
    const prog = ch.classProgress[cls.id];
    const card = el(`<div class="class-card${ch.classId===cls.id?' active':''}"><div class="cc-art"></div><span class="cname">${cls.name}</span>${prog.evolution?`<span class="cevo">${evolutionName(cls.id,prog.evolution)}</span>`:''}<span class="istat">Lv ${prog.level}</span><span class="idesc">${cls.role}</span>${cls.passiveDesc?`<span class="idesc passive-line">${escapeHtml(cls.passiveDesc)}</span>`:''}</div>`);
    setArt(card.querySelector('.cc-art'), classArt(cls.id));
    const b = el(`<button class="px-btn small" style="margin-top:8px;">${ch.classId===cls.id?'Active':'Select'}</button>`);
    if(ch.classId!==cls.id) b.addEventListener('click', ()=>selectClass(cls.id));
    else b.disabled = true;
    card.appendChild(b);
    cg.appendChild(card);
  });
  outer.appendChild(cgrid);

  const prog = classProg();
  const tree = el(`<div class="px-panel"><div class="dg-h2">${CLASSES[ch.classId].name} Skill Tree — ${prog.skillPoints} skill point(s) available</div></div>`);
  [1,2,3].forEach(tier=>{
    const row = el(`<div class="tree-tier"><div class="tt-label">TIER ${tier}${tier===3?' — EVOLUTION (pick one)':''}</div><div class="tree-row"></div></div>`);
    const rowEl = row.querySelector('.tree-row');
    CLASSES[ch.classId].tree.filter(n=>n.tier===tier).forEach(node=>{
      const allocated = !!prog.allocated[node.id];
      const available = canAllocate(node, prog);
      const locked = !allocated && !available;
      const btn = el(`<button class="node-btn ${allocated?'allocated':''} ${locked?'locked':''}"><span class="nname">${node.name}</span><span class="ndesc">${node.desc}</span><span class="ncost">${allocated?'Allocated':('Cost: '+node.cost+' pt'+(node.requires.length?' · requires: '+node.requires.map(r=>findSkillNode(ch.classId,r).name).join(', '):''))}</span></button>`);
      if(available) btn.addEventListener('click', ()=>allocateNode(node.id));
      else if(!allocated) btn.disabled = true;
      rowEl.appendChild(btn);
    });
    tree.appendChild(row);
  });
  const learned = Object.keys(ch.learnedSkills||{}).filter(id=>{ const s=SKILLS[id]; return s && (!s.classes || s.classes.indexOf(ch.classId)>=0); });
  if(learned.length){
    const lp = el(`<div class="tree-tier"><div class="tt-label">LEARNED MONSTER SKILLS</div><div class="tree-row"></div></div>`);
    const lr = lp.querySelector('.tree-row');
    learned.forEach(id=>{
      const s = SKILLS[id];
      lr.appendChild(el(`<div class="node-btn allocated"><span class="nname">${escapeHtml(s.name)}</span><span class="ndesc">${escapeHtml(s.desc)}</span><span class="ncost">${s.cost} energy · from a skill book</span></div>`));
    });
    tree.appendChild(lp);
  }
  const resetBtn = el(`<button class="px-btn red">Reset Skill Tree (Free)</button>`);
  resetBtn.addEventListener('click', resetSkillTree);
  tree.appendChild(resetBtn);
  outer.appendChild(tree);
  return outer;
}

/* ============================== BOOTSTRAP ============================== */
async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    App.subjects = defaultSubjects();
    App.activeSubjectId = App.subjects[0].id;
    App.discovered = App.discovered || {};
    App.profiles = {};
    App.profileId = App.subjects[0].id;
    const p = realmData(App.profileId);
    App.character = p.character;
    App.run = p.run;
    App.dungeonView = 'select';
  }
  render();
}
init();
</script>

<script id="devjs">
/* ------------------------------------------------------------------ TEST BUILD
   None of this exists in the real game. It is generated by tools/maketest.py
   and it writes to its own storage keys, so nothing done here reaches a real
   save. ------------------------------------------------------------------- */
const DEV = {god:false, autoCorrect:false};

/* God mode catches the death itself rather than the hit. The first version of
   this restored health AFTER the monster's turn resolved, which was too late -
   handleDeath had already run inside it, knocked the hero out and pulled the
   next one off the bench, so the health went back onto the wrong character and
   a few swings later the run was over anyway. Wrapping handleDeath instead
   means every source is covered (poison, a boss ultimate, a party wipe) and
   damage still lands and still shows, which is what you want to be looking at
   while you test. You simply do not die. */
const __devDeath = handleDeath;
handleDeath = async function(){
  if(!DEV.god) return __devDeath.apply(this, arguments);
  const st = combatStats();
  App.run.hp = st.maxHp;
  if(partyList().length){
    const h = heroState(partyActiveId());
    h.hp = st.maxHp; h.maxHp = st.maxHp; h.down = false;
  }
  App.run.poison = {turnsLeft:0, perTurn:0};
  App.run.playerBurn = {turnsLeft:0, perTurn:0};
  App.run.playerBleed = {turnsLeft:0, perTurn:0};
  App.run.bossNote = 'God mode — that would have killed you.';
  App.currentPhase = 'postattack';
  const els = getBattleEls();
  if(els.playerHpFill) updateHpBar(els.playerHpFill, els.playerHpNum, App.run.hp, st.maxHp);
  await saveRun();
  render();
};

/* Always-correct: whatever option you click is submitted as the right one, so
   you can drive a fight at speed without reading a question. It goes through
   the real submitAnswer, so energy, combo, mastery and XP all still happen -
   an auto-answer that skipped those would be testing a different game. */
const __devSubmit = submitAnswer;
submitAnswer = async function(raw){
  if(DEV.autoCorrect && App.currentQuestion) raw = App.currentQuestion.correct;
  return __devSubmit.call(this, raw);
};

function devMsg(t){ const m = document.getElementById('devmsg'); if(m) m.textContent = t; }
function devInRun(){ return App.run && App.run.active && App.run.monster; }

async function devKill(){
  if(!devInRun()) return devMsg('not in a fight');
  const m = App.run.monster;
  m.hp = 0;
  const els = getBattleEls();
  if(els.monsterHpFill) updateHpBar(els.monsterHpFill, els.monsterHpNum, 0, m.maxHp);
  devMsg('killed ' + m.name);
  await handleVictory();
}
function devFloor(n){
  n = clamp(parseInt(n,10) || 1, 1, MAX_FLOOR);
  if(!App.run || !App.run.active){
    const party = (App.character.lastParty || []).concat([App.character.classId]);
    startRun(party);
  }
  App.topTab = 'play';
  startFloor(n);
  devMsg('floor ' + n);
}
/* The next floor ending in a zero. From the hub it starts at floor 10. */
function devBoss(){
  const at = (App.run && App.run.active) ? App.run.floor : 0;
  let next = (Math.floor(at / 10) + 1) * 10;
  if(next > MAX_FLOOR) next = MAX_FLOOR;
  devFloor(next);
  devMsg('boss floor ' + next);
}
function devHeal(){
  if(!App.run) return;
  if(partyList().length) partyHealAll(1);
  else App.run.hp = combatStats().maxHp;
  App.run.energy = combatStats().energyMax;
  render(); devMsg('party topped up');
}
function devLevels(n){
  for(let i=0;i<n;i++) grantXp(2000);
  let guard = 0;
  for(;;){
    const prog = classProg();
    const next = (CLASSES[App.character.classId].tree||[]).find(t=>!prog.allocated[t.id] && canAllocate(t, prog));
    if(!next || guard++ > 60) break;
    allocateNode(next.id);
  }
  render(); devMsg('level ' + classProg().level + ', points spent');
}
function devRich(){
  App.character.gems = (App.character.gems||0) + 500;
  if(App.run) App.run.gold = (App.run.gold||0) + 5000;
  MATERIAL_IDS.forEach(m=>addMaterial(m, 50));
  saveCharacter(); render(); devMsg('+5000 gold, +500 gems, +50 of every material');
}
function devGear(){
  const ch = App.character;
  Object.keys(CLASSES).forEach(c=>{
    const w = WEAPON_CATALOG.find(x=>x.classId===c && x.rarity==='legendary');
    if(w){ const it = makeWeaponInstance(w); ch.weapons.push(it); loadoutFor(c, ch).weapon = it.id; }
    ARMOR_SLOTS.forEach(s=>{
      const a = ARMOR_CATALOG.find(x=>x.slot===s && x.rarity==='legendary');
      if(a){ const it = makeArmorInstance(a); ch.armors.push(it); loadoutFor(c, ch)[s] = it.id; }
    });
  });
  saveCharacter(); render(); devMsg('everyone in full legendary');
}
function devOmen(id){
  if(!devInRun()) return devMsg('not in a fight');
  App.run.omen = id || null;
  render();
  if(id) showOmenCard();
  devMsg(id ? ('omen: ' + OMENS[id].name) : 'omen cleared');
}
function devNemesis(){
  if(!devInRun()) return devMsg('not in a fight');
  /* a nemesis never rolls on a boss floor, so ask a floor that is not one */
  let f = Math.max(NEMESIS_MIN_FLOOR, App.run.floor);
  while(isBossFloor(f) && f < MAX_FLOOR) f++;
  if(isBossFloor(f)) f = NEMESIS_MIN_FLOOR + 1;
  let m = null, t = 0;
  while(!m && t++ < 8000){ const g = generateMonster(f, App.character.ngPlus); if(g.nemesis) m = g; }
  if(!m) return devMsg('could not roll one');
  App.run.monster = m;
  render(); devMsg(m.name);
}
function devWipe(){
  if(!confirm('Wipe this TEST build\'s save? The real game is untouched.')) return;
  try{ Object.keys(localStorage).filter(k=>k.indexOf('sdtest_')===0).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload();
}

function devPanel(){
  document.body.appendChild(el('<div id="devbar"></div>'));
  const p = el(`<div id="devpanel">
    <h4><span>⚑ TEST BUILD</span><span id="devtog">–</span></h4>
    <div id="devbody">
      <button id="dvkill">☠  Instant kill</button>
      <button id="dvauto">✔  Always correct: off</button>
      <div class="dvrow"><input id="dvfloor" type="number" min="1" max="${MAX_FLOOR}" value="45"><button id="dvgo">Go</button></div>
      <button id="dvboss">👑  Skip to next boss floor</button>
      <button id="dvgod">🛡  God mode: off</button>
      <button id="dvheal">✚  Heal party + energy</button>
      <div class="dvsep"></div>
      <div class="dvrow"><select id="dvomen"><option value="">— force an omen —</option></select></div>
      <button id="dvnem">☠  Make it a Nemesis</button>
      <div class="dvsep"></div>
      <button id="dvlv">↑  +10 levels (and spend them)</button>
      <button id="dvgear">⚔  Full legendary, everyone</button>
      <button id="dvrich">🪙  Gold, gems, materials</button>
      <div class="dvsep"></div>
      <button id="dvwipe">🗑  Wipe this test save</button>
      <div id="devmsg"></div>
      <div class="dvnote">Keys: <b>K</b> kill · <b>A</b> always-correct · <b>B</b> next boss · <b>G</b> god mode. Click the pink bar to collapse — it stays collapsed.<br>Saves to <b>sdtest_</b> keys, so your real game is untouched.</div>
    </div>
  </div>`);
  document.body.appendChild(p);
  const sel = p.querySelector('#dvomen');
  Object.keys(OMENS).forEach(id=>{
    sel.appendChild(el(`<option value="${id}">${OMENS[id].icon} ${OMENS[id].name}</option>`));
  });
  /* It sits over the difficulty buttons when it is open, so once you collapse
     it, it stays collapsed - across reloads too. */
  const setMin = (min)=>{
    p.classList.toggle('min', min);
    p.querySelector('#devtog').textContent = min ? '+' : '–';
    try{ localStorage.setItem('sdtest_devmin', min ? '1' : '0'); }catch(e){}
  };
  let startMin = false;
  try{ startMin = localStorage.getItem('sdtest_devmin') === '1'; }catch(e){}
  setMin(startMin);
  p.querySelector('h4').addEventListener('click', ()=>setMin(!p.classList.contains('min')));
  p.querySelector('#dvkill').addEventListener('click', devKill);
  p.querySelector('#dvgo').addEventListener('click', ()=>devFloor(p.querySelector('#dvfloor').value));
  p.querySelector('#dvfloor').addEventListener('keydown', e=>{ if(e.key==='Enter') devFloor(e.target.value); });
  const gb = p.querySelector('#dvgod');
  gb.addEventListener('click', ()=>{
    DEV.god = !DEV.god;
    gb.textContent = '🛡  God mode: ' + (DEV.god ? 'ON' : 'off');
    gb.classList.toggle('on', DEV.god);
  });
  const ab = p.querySelector('#dvauto');
  ab.addEventListener('click', ()=>{
    DEV.autoCorrect = !DEV.autoCorrect;
    ab.textContent = '✔  Always correct: ' + (DEV.autoCorrect ? 'ON' : 'off');
    ab.classList.toggle('on', DEV.autoCorrect);
    devMsg(DEV.autoCorrect ? 'any answer you pick counts as right' : 'answers count for real again');
  });
  p.querySelector('#dvboss').addEventListener('click', devBoss);
  p.querySelector('#dvheal').addEventListener('click', devHeal);
  sel.addEventListener('change', e=>devOmen(e.target.value));
  p.querySelector('#dvnem').addEventListener('click', devNemesis);
  p.querySelector('#dvlv').addEventListener('click', ()=>devLevels(10));
  p.querySelector('#dvgear').addEventListener('click', devGear);
  p.querySelector('#dvrich').addEventListener('click', devRich);
  p.querySelector('#dvwipe').addEventListener('click', devWipe);
  /* K kills, G toggles god mode - faster than reaching for the panel */
  document.addEventListener('keydown', e=>{
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.key === 'k' || e.key === 'K') devKill();
    if(e.key === 'g' || e.key === 'G') gb.click();
    if(e.key === 'a' || e.key === 'A') ab.click();
    if(e.key === 'b' || e.key === 'B') devBoss();
  });
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', devPanel);
else devPanel();
</script>
