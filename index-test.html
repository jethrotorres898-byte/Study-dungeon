/* ======================= HOW A MONSTER ATTACKS =======================
   The heroes stopped teleporting at things a while ago; the monsters were
   still doing it, sliding 26 pixels sideways on one shared keyframe whatever
   they were. They now cross the room the way their body suggests: a swarm
   pounces, a brute winds up and drives, a caster plants and throws, anything
   with wings goes over the top, and the rest step in and swing.
   ==================================================================== */
const FLYING_ARCHES = {harpy:1, wisp:1, roc:1, imp:1, wraith:1};
function monsterMoveKind(m){
  if(!m) return 'maul';
  if(m.role === 'caster') return 'hurl';     /* wings or not, it stays back */
  if(FLYING_ARCHES[m.arche]) return 'swoop';
  if(m.role === 'brute' || m.role === 'armored') return 'slam';
  if(m.role === 'swift' || m.role === 'swarm') return 'pounce';
  return 'maul';
}
/* The last boss is drawn on the hero rig, not the creature one: he is a man,
   he is your size, and he is on screen longer than anything else in the game.
   Everything that draws a monster goes through here so the swap is one branch
   rather than five, and his second phase is just a different sheet. */
function monsterSheetId(m){
  if(!m || !m.isFinal) return null;
  return (m.phase || 1) >= 2 ? 'malakor2' : 'malakor';
}
function monsterSprite(m, clip){
  const hero = monsterSheetId(m);
  if(hero) return heroSprite(hero, clip || 'idle');
  return creatureArt(m.arche, m.color, Object.assign(monsterArtOpts(m), clip ? {clip} : {}));
}
function monsterArtOpts(m){
  return {boss:(m.isBoss && !m.isFinal) || m.elite || m.evolved || m.nemesis,
          palKey:m.palKey, tint:m.tint, gear:m.gear || null};
}
/* Swap the creature over to another clip for a while, then back to idle. */
function monsterClip(els, clip, ms){
  const m = App.run.monster;
  const host = els.monsterSprite && els.monsterSprite.querySelector('.sprite-flip');
  if(!host || !m) return;
  setArt(host, monsterSprite(m, clip));
  if(ms) setTimeout(()=>{
    const h2 = getBattleEls().monsterSprite;
    const f2 = h2 && h2.querySelector('.sprite-flip');
    if(f2 && App.run.monster) setArt(f2, monsterSprite(App.run.monster));
  }, ms);
}
/* Where you are, measured from where it is. It travels the other way. */
function heroReach(els){
  const box = els.monsterSprite, hero = els.playerSprite;
  if(!box || !hero || !els.scene) return null;
  const sr = els.scene.getBoundingClientRect();
  const br = box.getBoundingClientRect(), hr = hero.getBoundingClientRect();
  if(!br.width || !hr.width) return null;
  return {sr, br, hr,
    gap: Math.max(0, br.left - hr.right),
    hx: hr.left - sr.left + hr.width/2,
    hy: hr.top  - sr.top  + hr.height*0.52,
    mx: br.left - sr.left + br.width/2,
    my: br.top  - sr.top  + br.height*0.52,
    top: br.top - sr.top};
}
/* the blow landing on you */
function monsterImpact(els, g, big){
  if(!g) return;
  fxNode(els, 'fx-hit blood' + (big?' big':''), g.hx, g.hy, 340);
  if(big) fxRing(els, 'blood', {x:g.hx, y:g.hy}, true);
}
/* ------------------------- WHEN HE MOVES THE TOWER -------------------------
   The last boss does not walk over and hit you. He does not have to - the room
   is his. So his attacks come with the floor doing something: the whole scene
   shears sideways for a frame, chains of his own seals rip up out of the
   flagstones, and on a charged blow the light inverts and comes back wrong.
   ------------------------------------------------------------------------ */
function isPrimordial(m){ return !!(m && m.isFinal); }
async function towerLurch(els, big){
  const scene = els.scene;
  if(!scene || reducedMotion()) return;
  scene.classList.add(big ? 'tw-heave' : 'tw-shear');
  /* seals tearing out of the floor between the two of you */
  const host = scene.querySelector('.be-cam') || scene;
  const n = big ? 7 : 4;
  for(let i=0;i<n;i++){
    const s = el('<div class="tw-seal"></div>');
    s.style.left = (24 + (i*(52/n)) + Math.random()*7).toFixed(1) + '%';
    s.style.top  = (58 + Math.random()*22).toFixed(1) + '%';
    s.style.setProperty('--sd', (i*55) + 'ms');
    s.style.setProperty('--sh', (18 + Math.random()*26).toFixed(0) + 'px');
    host.appendChild(s);
    setTimeout(()=>s.remove(), 900 + i*55);
  }
  setTimeout(()=>scene.classList.remove('tw-heave', 'tw-shear'), big ? 760 : 460);
}
async function monsterAttackIntro(els, charged){
  const m = App.run.monster;
  const box = els.monsterSprite;
  if(!m || !box) return;
  const g = heroReach(els);
  const kind = monsterMoveKind(m);
  const big = !!charged;
  if(isPrimordial(m)) towerLurch(els, big);

  if(charged){                                   /* it gathers first, visibly */
    monsterClip(els, 'atk', 520);
    await playAnim(box, 'telegraph', 520);
  }
  if(!g){ monsterClip(els, 'atk', 340); await playAnim(box, 'lunge', 340); monsterImpact(els, heroReach(els), big); return; }

  const reach = g.gap * (big ? 0.96 : 0.86) + 12;
  try{
    if(kind === 'hurl'){
      /* it does not come to you - it plants and throws */
      monsterClip(els, 'atk', 620);
      adv(box, {x: 14, y: 3, ms: 190});            /* rock back into the throw */
      await sleep(200);
      adv(box, {x: -6, y: 0, ms: 110});
      const orb = fxNode(els, 'fx-orb trail blood' + (big?' big':''), g.mx - g.br.width*0.2, g.my, 560);
      if(orb){
        orb.style.setProperty('--flyms', (big?.36:.3) + 's');
        await sleep(20);
        orb.style.opacity = '1';
        orb.style.transform = `translate(calc(-50% + ${g.hx - (g.mx - g.br.width*0.2)}px), calc(-50% + ${g.hy - g.my}px)) scale(1.1)`;
      }
      await sleep(big ? 340 : 290);
      monsterImpact(els, g, big);
    } else if(kind === 'swoop'){
      /* up over the room and down on top of you */
      monsterClip(els, 'move');
      box.style.setProperty('--advms', '0ms');
      adv(box, {x: 0, y: 0, ms: 0});
      await sleep(20);
      adv(box, {x: -reach*0.45, y: -Math.min(64, g.top + 34), ms: 260});
      await sleep(270);
      monsterClip(els, 'atk', 460);
      adv(box, {x: -reach, y: 4, ms: 190});
      await sleep(195);
      monsterImpact(els, g, big);
      fxShake(els, big ? 360 : 260);
    } else if(kind === 'slam'){
      /* a long wind-up, then all of it at once */
      monsterClip(els, 'atk', 900);                /* the gather is frame one */
      adv(box, {x: 22, y: 2, s: 0.97, ms: 240});   /* haul back */
      await sleep(250);
      adv(box, {x: -reach, y: 0, s: 1.05, ms: 150});
      await sleep(155);
      monsterImpact(els, g, true);
      fxShake(els, big ? 420 : 320);
      adv(box, {x: -reach*0.55, s: 1, ms: 140});
      await sleep(150);
    } else if(kind === 'pounce'){
      /* coils, then crosses the gap in one */
      monsterClip(els, 'atk', 700);
      adv(box, {x: 12, y: 4, s: 0.94, ms: 150});
      await sleep(160);
      adv(box, {x: -reach, y: -6, s: 1.04, ms: 120});
      await sleep(125);
      monsterImpact(els, g, big);
      adv(box, {y: 0, s: 1, ms: 110});
      await sleep(110);
    } else {
      /* walk it in, then swing */
      monsterClip(els, 'move');
      adv(box, {x: 10, ms: 140});
      await sleep(150);
      monsterClip(els, 'atk', 560);
      adv(box, {x: -reach, ms: 160});
      await sleep(170);
      monsterImpact(els, g, big);
    }
    await sleep(120);
    adv(box, {x: 0, y: 0, s: 1, ms: 280});
    await sleep(285);
  } finally {
    stand(box);
  }
}
const SKILL_MOVES = {
  step:    moveStep,
  lunge:   moveLunge,
  charge:  moveCharge,
  barrage: moveBarrage,
  through: movePassThrough,
  plant:   movePlant,
  invoke:  moveInvoke,
  behind:  strikeFromBehind,
  leap:    strikeFromAbove,
};
/* Run a skill's movement. Whatever happens the hero ends up standing where it
   started - a thrown error must never leave someone parked inside the enemy. */
async function performSkillMove(els, cls, pose, skill, opts, fx){
  const fn = SKILL_MOVES[fx.move];
  if(!fn) return false;
  try{
    return await fn(els, cls, pose, skill, opts, fx);
  }catch(e){
    return false;
  }finally{
    stand(els.playerSprite);
  }
}
async function playerAttackIntro(els, isSkill, opts, skill){
  const fx = skillFx(skill);
  const cls = App.character.classId;
  /* A skill can override how its class fights: a mage's Staff Strike is a melee
     blow, not a spell, so it walks the staff in rather than casting on the spot. */
  const style = fx.style === 'melee'
    ? (classCombat().style === 'rush' ? 'rush' : 'dash')
    : classCombat().style;
  const pose = fx.pose || 'atk';
  stand(els.playerSprite);
  if(await performSkillMove(els, cls, pose, skill, opts, fx)) return;
  if(style==='cast'){
    heroClipSeq(els.playerSprite, cls, [[pose, 460]]);
    const cast = playAnim(els.playerSprite, 'cast', 460);
    await sleep(190);                       // the staff comes up first
    await playSkillFx(els, skill, opts);
    await cast;
    return;
  }
  if(style==='rush'){
    /* close the gap on the walk cycle, then throw the blow */
    heroClipSeq(els.playerSprite, cls, [['walk', 210], [pose, 250]]);
    const rush = playAnim(els.playerSprite, 'rush', 440);
    await sleep(215);                       // land the hit at the end of the lunge
    await playSkillFx(els, skill, opts);
    return rush;
  }
  heroClipSeq(els.playerSprite, cls, [['walk', 130], [pose, 210]]);
  const dash = playAnim(els.playerSprite, 'dash', 320);
  await sleep(140);
  await playSkillFx(els, skill, opts);
  return dash;
}
/* Ultimate: the hero gathers the hit first. The scene drops away, motes pull in
   out of the dark, an aura winds up around them and the name lands — then the
   charge breaks and the skill itself does the talking. No cutaway, no versus
   panel: the release runs straight into the normal attack, which already knows
   how to draw this particular skill. */
function reducedMotion(){
  try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}
async function playUltimateCinematic(skill){
  const els = getBattleEls();
  const m = App.run.monster;
  if(!m || !els.scene) return;
  const hue = skillFx(skill).hue || 'ember';
  const quick = reducedMotion();
  const hero = fxBox(els, 'hero');
  if(!hero) return;

  const charge = el(`<div class="ult-charge fx ${hue}"><div class="uc-dim"></div></div>`);
  els.scene.appendChild(charge);

  /* a pillar of light standing up under the hero, and rings winding inward */
  const pillar = document.createElement('div');
  pillar.className = 'uc-pillar';
  pillar.style.left = hero.x + 'px'; pillar.style.top = hero.foot + 'px';
  charge.appendChild(pillar);
  for(let i = 0; i < 3; i++){
    const a2 = document.createElement('div');
    a2.className = 'uc-aura';
    a2.style.left = hero.x + 'px'; a2.style.top = hero.y + 'px';
    a2.style.animationDelay = (i * 0.26) + 's';
    charge.appendChild(a2);
  }
  /* motes dragged in from the edges of the room */
  const motes = quick ? 0 : 26;
  for(let i = 0; i < motes; i++){
    const d = document.createElement('div');
    d.className = 'ult-mote';
    const ang = Math.random() * Math.PI * 2, r = 90 + Math.random() * 150;
    d.style.left = hero.x + 'px'; d.style.top = hero.y + 'px';
    d.style.setProperty('--dx', Math.cos(ang) * r + 'px');
    d.style.setProperty('--dy', Math.sin(ang) * r * 0.6 + 'px');
    d.style.setProperty('--ms', (0.55 + Math.random() * 0.5) + 's');
    d.style.animationDelay = (Math.random() * 0.5) + 's';
    charge.appendChild(d);
  }
  const title = el(`<div class="ult-title fx ${hue}">${escapeHtml(skill.name)}</div>`);
  els.scene.appendChild(title);

  /* the hero tightens up while the charge builds */
  heroClipSeq(els.playerSprite, App.character.classId, [[skillFx(skill).pose || 'atk', quick ? 200 : 900]]);
  if(els.playerSprite){
    els.playerSprite.classList.add('charging');
    els.playerSprite.style.setProperty('--fx3', getComputedStyle(charge).getPropertyValue('--fx3'));
  }
  fxShake(els, quick ? 120 : 900);

  await sleep(quick ? 240 : 980);

  /* release */
  charge.classList.add('go');
  els.scene.appendChild(el('<div class="ult-flashout"></div>'));
  fxShake(els, 320);
  await sleep(quick ? 80 : 260);
  if(els.playerSprite) els.playerSprite.classList.remove('charging');
  charge.remove(); title.remove();
  els.scene.querySelectorAll('.ult-flashout').forEach(n=>setTimeout(()=>n.remove(), 400));
}
function triggerWeaponIcon(host, classId){
  if(!host) return;
  const sw = document.createElement('div');
  sw.className = 'giant-sword';
  sw.innerHTML = weaponArt(classId, 'legendary');
  host.appendChild(sw);
  requestAnimationFrame(()=>sw.classList.add('go'));
  setTimeout(()=>sw.remove(), 750);
}
function triggerImpact(host){
  if(!host) return;
  const b = document.createElement('div');
  b.className = 'impact-burst';
  host.appendChild(b);
  requestAnimationFrame(()=>b.classList.add('go'));
  setTimeout(()=>b.remove(), 500);
}

/* ============================== COMBAT ORCHESTRATION ============================== */
/* Defense is flat subtraction, which is readable - "it ate 46 of your swing" -
   but flat subtraction against a stat that grows with the floor while your
   attack flattens out at level 40 and legendary gear has one ending: by floor
   90 armour was eating 87% of every blow, damage per turn was FALLING from
   floor 70 to floor 90 while monster health kept climbing, and a cleric needed
   36 turns to finish a floor it cleared in 11 at floor 10. So the subtraction
   stays, and it is capped: armour can take most of a hit, never nearly all of
   it. Piercing still matters - it comes off before the cap, so the brawler is
   still the answer to a plated thing, just no longer the only one. */
const DEF_MAX_BITE = 0.60;
function defenseBite(raw, monsterDef, defPierce){
  return Math.min((monsterDef||0)*(1-(defPierce||0)), Math.max(0, raw)*DEF_MAX_BITE);
}
function computeHit(atk, mult, monsterDef, defPierce){
  const variance = 0.85+Math.random()*0.3;
  const raw = atk*mult*variance;
  return Math.max(1, Math.round(raw - defenseBite(raw, monsterDef, defPierce)));
}
function enterDungeonLoading(afterFn){
  App.dungeonView = 'loading';
  render();
  let pct = 0;
  const bar = document.querySelector('.pxbar-fill');
  const t = setInterval(()=>{
    pct += 8+Math.random()*10;
    if(bar) bar.style.width = Math.min(100,pct)+'%';
    if(pct>=100){ clearInterval(t); afterFn(); }
  }, 90);
}

/* =========================== THE PARTY ===========================
   You do not take a hero down there any more, you take three, and the one in
   front is the only one the monster can reach. Each carries their own health:
   a bench is safe, but it is not a hospital - nobody heals back there. Coming
   forward costs you the turn, and the thing across the room gets a free swing
   at whoever just arrived. That is the whole tension. Swapping the warrior in
   to eat a charged attack is a real decision because the swap itself is what
   you are paying, and swapping out a hero at 4 HP means fighting the rest of
   the floor two-handed.

   Everything downstream of here still reads App.character.classId and
   App.run.hp, exactly as it did when there was one hero: those two are a live
   mirror of whoever is standing in front. Switching writes the outgoing hero's
   health back to the bench and loads the incoming one's. That is deliberately
   the smallest possible seam - the damage pipeline, the skill tree, the
   loadouts and the save format never have to know a party exists.
   =============================================================== */
const PARTY_SIZE = 3;
const PARTY_REVIVE_PCT = 0.35;   /* a hero who went down is back next floor    */

function partyList(){
  const p = (App.run && App.run.party) || [];
  return p.filter(c=>CLASSES[c]);
}
function partyActiveId(){ return App.character.classId; }
function heroState(classId){
  App.run.heroes = App.run.heroes || {};
  if(!App.run.heroes[classId]) App.run.heroes[classId] = {hp:0, maxHp:0, down:false};
  return App.run.heroes[classId];
}
/* maxHp for a class that is not currently the active one - combatStats() reads
   App.character.classId, so we borrow it for the length of the call. */
function statsAs(classId){
  const was = App.character.classId;
  App.character.classId = classId;
  let st;
  try{ st = combatStats(); } finally { App.character.classId = was; }
  return st;
}
function heroesAlive(){ return partyList().filter(c=>!heroState(c).down); }
function benchedHeroes(){ return partyList().filter(c=>c !== partyActiveId()); }

/* Write the front-line hero's live health back to the bench. */
function stowActiveHero(){
  const id = partyActiveId();
  if(!partyList().length) return;
  const h = heroState(id);
  h.maxHp = App.run.maxHp || combatStats().maxHp;
  h.hp = clamp(App.run.hp, 0, h.maxHp);
  if(h.hp <= 0) h.down = true;
}
/* Bring one forward: their health becomes the run's health. */
function drawHeroForward(classId){
  App.character.classId = classId;
  const st = combatStats();
  const h = heroState(classId);
  if(!h.maxHp) h.maxHp = st.maxHp;
  h.maxHp = st.maxHp;                       /* gear or a level may have moved it */
  if(!h.hp && !h.down) h.hp = st.maxHp;
  App.run.maxHp = st.maxHp;
  App.run.hp = clamp(h.hp, 0, st.maxHp);
  App.run.slot = Math.max(0, partyList().indexOf(classId));
}
function partyInit(ids){
  const list = (ids || []).filter(c=>CLASSES[c]).slice(0, PARTY_SIZE);
  App.run.party = list.length ? list : [App.character.classId];
  App.run.heroes = {};
  App.run.party.forEach(c=>{
    const st = statsAs(c);
    App.run.heroes[c] = {hp:st.maxHp, maxHp:st.maxHp, down:false};
  });
  drawHeroForward(App.run.party[0]);
}
/* Between floors: the fallen get up, but not all the way. */
function partyBetweenFloors(){
  partyList().forEach(c=>{
    const h = heroState(c);
    const st = statsAs(c);
    h.maxHp = st.maxHp;
    if(h.down){ h.down = false; h.hp = Math.max(1, Math.round(st.maxHp * PARTY_REVIVE_PCT)); }
    h.hp = clamp(h.hp, 0, h.maxHp);
  });
  const cur = heroState(partyActiveId());
  App.run.hp = cur.hp; App.run.maxHp = cur.maxHp;
}
/* Anything that heals the whole party between floors - resting, a checkpoint -
   should reach the bench too, or the bench is a death sentence. */
function partyHealAll(pct){
  partyList().forEach(c=>{
    const h = heroState(c);
    const st = statsAs(c);
    h.maxHp = st.maxHp;
    h.hp = clamp(h.hp + Math.round(st.maxHp * pct), h.down ? 1 : 0, st.maxHp);
    if(h.hp > 0) h.down = false;
  });
  const cur = heroState(partyActiveId());
  App.run.hp = cur.hp; App.run.maxHp = cur.maxHp;
}
function canSwitchTo(classId){
  return partyList().indexOf(classId) >= 0
      && classId !== partyActiveId()
      && !heroState(classId).down;
}
/* The swap itself. It is your action, and it is not a free look at the board:
   whatever you bring in eats a swing on the way past. */
async function switchHero(classId, opts){
  opts = opts || {};
  if(!canSwitchTo(classId)) return false;
  stowActiveHero();
  const outgoing = CLASSES[partyActiveId()].name;
  drawHeroForward(classId);
  App.run.bossNote = outgoing + ' falls back — ' + CLASSES[classId].name + ' steps up.';
  /* a swap does not carry the last hero's momentum or their opening shot */
  App.run.combo = 0;
  App.run.shatter = 0;
  App.currentQuestion = null;
  await saveRun(); await saveCharacter();
  if(opts.free){ App.currentPhase = 'difficulty'; render(); return true; }
  App.currentPhase = 'postattack';
  render();
  await resolveMonsterHit();               /* the turn you spent, spent */
  return true;
}
/* Called when the hero in front hits zero. Returns true if somebody else can
   take over, false if that was the last of them. */
function partyFallBack(){
  if(!partyList().length) return false;
  const id = partyActiveId();
  const h = heroState(id);
  h.hp = 0; h.down = true;
  const next = heroesAlive();
  if(!next.length) return false;
  drawHeroForward(next[0]);
  App.run.combo = 0; App.run.shatter = 0;
  App.run.bossNote = CLASSES[id].name + ' goes down. ' + CLASSES[partyActiveId()].name
    + ' drags them clear and takes their place.';
  return true;
}
function startRun(ids){
  const ch = App.character;
  const active = [];
  Object.keys(ch.runBonuses||{}).forEach(id=>{ if(ch.runBonuses[id]>0 && RUN_BONUSES[id]){ active.push(id); ch.runBonuses[id]--; } });
  App.run = Object.assign(defaultRun(), {active:true, floor:1, energy:0, gold:0, activeBonuses:active});
  if(active.indexOf('insight')>=0) App.run.freeHints = 3;
  /* three go down, not one. Whoever was picked first leads. */
  partyInit(ids && ids.length ? ids : (ch.lastParty || []).concat([ch.classId]));
  saveCharacter();
  saveRun();
  startFloor(1);
}
function startBossRush(floor){
  App.run = Object.assign(defaultRun(), {active:true, floor, energy:0, gold:0, bossRush:true, bossRushFloor:floor});
  partyInit((App.character.lastParty || []).concat([App.character.classId]));
  saveRun();
  startFloor(floor);
}
function startFloor(floor){
  App.run.floor = floor;
  if(partyList().length){
    stowActiveHero();
    partyBetweenFloors();
  } else {
    const st0 = combatStats();
    App.run.maxHp = st0.maxHp;
    App.run.hp = Math.min(App.run.hp, st0.maxHp);
  }
  const st = combatStats();
  App.run.monster = generateMonster(floor, App.character.ngPlus);
  App.run.openedFloor = false;          // the rogue's ambush is per floor
  App.run.dots = []; App.run.cooldowns = {}; App.run.shatter = 0; App.run.bossCharge = 0;
  App.run.poison = {turnsLeft:0, perTurn:0}; App.run.playerBurn = {turnsLeft:0, perTurn:0};
  App.run.playerBleed = {turnsLeft:0, perTurn:0}; App.run.monsterBuffs = [];
  App.run.frozen = false; App.run.bossTurn = 0; App.run.bossNote = null; App.run.hintsSealed = false;
  App.run.shieldPct = 0; App.run.nullifyNextWrong = false;
  /* The floor gets its own roll, after the monster exists so an omen that
     changes the monster has something to change. */
  App.run.omen = App.run.bossRush ? null : rollOmen(floor);
  if(omenIs('gravecache')){
    App.run.energy = combatStats().energyMax;
    App.run.shieldPct = 0.35;
  }
  if(omenIs('thewatcher') && App.run.monster){
    const mm = App.run.monster;
    mm.cunning = Math.min(0.9, (mm.cunning || 0.18) * 2);
    mm.wits = Math.max(mm.wits || 0, 0.8);
    if(!mm.kit || !mm.kit.length) mm.kit = monsterKitFor(mm.role || 'brute', mm.isBoss, 3);
    mm.braced = 1;
  }
  markDiscovered(bestiaryKeyFor(App.run.monster));
  App.dungeonView = 'battle';
  saveRun(); saveCharacter();
  /* Speed decides who opens. If it is quicker than you, it does not wait for
     you to answer anything - it is already swinging. */
  /* a boss gets an arrival before anybody swings */
  if(bossEntranceFor(floor) && App.run.monster.isBoss && !App.run.bossRush){
    App.currentPhase = 'entrance';
    render();
    playBossEntrance(floor).then(showOmenCard);
    return;
  }
  /* whichever beat opens the floor gets to finish before the omen is read */
  if((App.run.monster.spd||0) > st.spd){ playOpeningStrike().then(showOmenCard); return; }
  startNewTurn();
  showOmenCard();
}
/* The floor's own announcement. It is not a modal - you can already see the
   room behind it - but it is on screen long enough to be read. */
function showOmenCard(){
  const om = omen();
  if(!om || reducedMotion()) return;
  const els = getBattleEls();
  if(!els.scene) return;
  const card = el(`<div class="omen-card ${om.tone}">
    <span class="oc-icon">${om.icon}</span>
    <span class="oc-name">${escapeHtml(om.name.toUpperCase())}</span>
    <span class="oc-line">${escapeHtml(om.line)}</span>
    <span class="oc-desc">${escapeHtml(om.desc)}</span>
  </div>`);
  els.scene.appendChild(card);
  setTimeout(()=>{ card.classList.add('out'); setTimeout(()=>card.remove(), 320); }, 2400);
}
/* The floor opens with whoever is quicker. Nothing you can answer stops this. */
async function playOpeningStrike(){
  const m = App.run.monster;
  App.currentPhase = 'opening';
  render();
  const els = getBattleEls();
  if(els.scene && !reducedMotion()){
    const card = el(`<div class="first-strike">
      <span class="fs-lead">IT MOVES FIRST</span>
      <span class="fs-body">${escapeHtml(m.name)} · Speed ${m.spd||0} against your ${combatStats().spd}</span>
      <span class="fs-sub">You do not get a question. It is already swinging.</span>
    </div>`);
    els.scene.appendChild(card);
    setTimeout(()=>card.remove(), 1700);
  }
  await sleep(1450);
  if(App.dungeonView !== 'battle' || !App.run.monster) return;
  App.lastAnswerCorrect = false;
  App.run.bossNote = m.name + ' struck first — Speed ' + (m.spd||0) + ' against your ' + combatStats().spd + '. Boots would fix that.';
  await resolveMonsterHit();
}
function startNewTurn(){
  if(App.run.monster && App.run.monster.hp<=0){ handleVictory(); return; }
  const st0 = combatStats();
  App.run.energy = clamp((App.run.energy||0) + (omenIs('quickening') ? 2 : 1), 0, st0.energyMax);
  tickBuffTimers();
  const DOT_WORD = {poison:'Poison', playerBurn:'Burning', playerBleed:'Bleeding'};
  ['poison','playerBurn','playerBleed'].forEach(k=>{
    const dot = App.run[k];
    if(dot && dot.turnsLeft>0){
      App.run.hp = clamp(App.run.hp - dot.perTurn, 0, st0.maxHp);
      dot.turnsLeft--;
      App.run.bossNote = DOT_WORD[k]+' -'+dot.perTurn+' HP';
    }
  });
  if(App.run.monster && (App.run.monster.skillCd||0) > 0) App.run.monster.skillCd--;
  if(App.run.hp<=0){ handleDeath(); return; }
  if(App.run.monster && App.run.monster.isBoss){
    const note = bossTurnTick();
    if(note) App.run.bossNote = note;
  }
  tickCooldowns();
  if(App.run.monster && (App.run.monster.stunTurns||0) > 0) App.run.monster.stunTurns--;
  /* every open wound ticks, and they stack */
  const rot = dotTickTotal();
  if(rot > 0){
    const m = App.run.monster;
    m.hp = clamp(m.hp - rot, 0, m.maxHp);
    App.run.dots = activeDots().map(d=>Object.assign({}, d, {turnsLeft:d.turnsLeft-1})).filter(d=>d.turnsLeft>0);
    App.run.bossNote = dotStacks()
      ? ('Wounds ×'+dotStacks()+' — '+rot+' enemy HP')
      : ('Last wound closes — '+rot+' enemy HP');
    saveRun();
    if(m.hp<=0){ handleVictory(); return; }
  }
  if(App.run.hintsSealed && (App.run.bossTurn||0) % 3 !== 0) App.run.hintsSealed = false;
  App.currentQuestion = null;
  App.run.difficulty = null;
  App.currentPhase = 'difficulty';
  render();
}
function chooseDifficulty(id){
  if(!DIFFS[id]) id = 'medium';
  App.run.difficulty = id;
  App.currentQuestion = buildQuestion(id);
  if(App.run.freeHintNext){ applyHintToQuestion(App.currentQuestion); App.run.freeHintNext = false; }
  App.currentPhase = 'question';
  saveRun();
  render();
}
function applyHintToQuestion(q){
  q.hintUsed = true;
  if(q.mode==='mcq'){
    if(q.eliminatedIdx==null){
      const wrongIdxs = q.options.map((v,i)=>i).filter(i=>q.options[i]!==q.correct);
      if(wrongIdxs.length) q.eliminatedIdx = pick(wrongIdxs);
    }
  } else {
    q.hintText = String(q.correct).slice(0, Math.max(1,Math.ceil(String(q.correct).length*0.3)));
  }
}
function useHintArtifact(){
  const q = App.currentQuestion;
  if(App.run.hintsSealed){ App.run.bossNote = 'Your hints are sealed this turn.'; render(); return; }
  if(!q || q.hintUsed) return;
  if(App.run.freeHints>0){ App.run.freeHints--; applyHintToQuestion(q); saveRun(); render(); return; }
  if(!isArtifactActive('lens')) return;
  App.character.artifacts.lens.charges--;
  applyHintToQuestion(q);
  saveCharacter();
  render();
}
async function submitAnswer(rawValue){
  const q = App.currentQuestion;
  if(!q) return;
  const correct = q.mode==='mcq' ? (rawValue===q.correct) : fuzzyMatch(rawValue, q.correct);
  App.lastAnswerCorrect = correct;
  App.currentPhase = 'reveal';
  render();
  await sleep(500);
  updateCardMastery(q.cardId, correct);
  App.character.totalAnswered++;
  if(correct){
    App.character.correctAnswerCount++;
    grantXp(Math.max(1, Math.round((4+(chance(25)?2:0)) * curDiff().xpMult)));
    App.run.combo = (App.run.combo||0)+1;
    const eb = curDiff().energyBonus||0;
    /* Grace: the cleric knits itself back together as it answers. */
    if(CLASSES[App.character.classId].passive === 'grace'){
      const stg = combatStats();
      const healed = Math.max(1, Math.round(stg.maxHp * 0.04));
      const before = App.run.hp;
      App.run.hp = clamp(App.run.hp + healed, 0, stg.maxHp);
      const got = App.run.hp - before;
      if(got > 0){
        const els = getBattleEls();
        updateHpBar(els.playerHpFill, els.playerHpNum, App.run.hp, stg.maxHp);
        showFloatingNumber(els.playerHost, '+' + got, false);
      }
    }
    if(eb>0){
      const st0 = combatStats(), before = App.run.energy||0;
      App.run.energy = clamp(before+eb, 0, st0.energyMax);
      const gained = App.run.energy - before;
      App.run.bossNote = gained>0 ? ('+'+gained+' bonus ⚡ for taking the hard question') : 'Energy already full';
    }
  }
  else {
    App.run.combo = 0;
    windBossCharge();          /* the boss is counting these */
  }
  await saveCharacter();
  if(correct){ App.currentPhase = 'skillmenu'; render(); }
  else if(bossChargeReady()) await resolveBossUltimate();
  else await resolveMonsterHit();
}
/* A buff skill still has to do everything a skill does to you - it just never
   touches the enemy. */
async function applySkillSelfEffects(opts, st, els){
  const notes = [];
  if(opts.healPct){
    const before = App.run.hp;
    App.run.hp = clamp(App.run.hp + Math.round(st.maxHp*opts.healPct), 0, st.maxHp);
    const got = App.run.hp - before;
    if(got > 0){
      updateHpBar(els.playerHpFill, els.playerHpNum, App.run.hp, st.maxHp);
      showFloatingNumber(els.playerHost, '+'+got, false, true);
    }
  }
  if(opts.buffSelf){
    App.run.buffs = (App.run.buffs||[]).filter(b=>b.name !== opts.buffSelf.name)
      .concat([Object.assign({}, opts.buffSelf, {turns:opts.buffSelf.turns+1})]);
    notes.push(opts.buffSelf.name + ' — ' + opts.buffSelf.turns + ' turns');
  }
  if(opts.shieldPct) App.run.shieldPct = opts.shieldPct;
  if(opts.nullifyNextWrong) App.run.nullifyNextWrong = true;
  if(opts.freeHintNext) App.run.freeHintNext = true;
  if(opts.cooldown) setCooldown(opts.id, opts.cooldown);
  if(notes.length) App.run.bossNote = notes.join(' · ');
}
async function resolvePlayerHit(mult, opts, isSkill, moreHits, skill){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  await playerAttackIntro(battleEls, isSkill, opts, skill || (opts && SKILLS[opts.id]));
  const passive = CLASSES[App.character.classId].passive;
  /* A pure buff is not an attack: it charges you and that is the whole turn. */
  if(opts.noDamage){
    await applySkillSelfEffects(opts, st, battleEls);
    tickMonsterEnergy(false);
    await sleep(320);
    await saveRun(); await saveCharacter();
    App.currentPhase = 'postattack';
    render();
    return;
  }
  /* Armour-piercing belongs to one class. The mage used to shred it too,
     which left the brawler's whole identity doing a job someone else did
     better from across the room. */
  let pierce = opts.defPierce || 0;
  /* Shatter: the brawler cracks armour off with every blow, and at five stacks
     there is nothing left between his fist and the thing wearing it. */
  const shatter = shatterLandBlow();
  if(shatter) pierce = Math.min(1, pierce + shatter);
  const type = opts.type || 'physical';
  let dmg = computeHit(st.atk, mult, monsterDef(), pierce);
  dmg = Math.max(1, Math.round(dmg * curDiff().dmgMult));
  /* What it is made of. Weak: half again. Resistant: half. Nothing else. */
  const aff = affinity(m, type);
  if(aff) dmg = Math.max(1, Math.round(dmg * (aff > 0 ? weakMultFor(type, m) : RESIST_MULT)));
  /* Venomcraft: the rogue is paid for every wound still open on the thing -
     and charged for the fact that there are none yet. */
  if(passive === 'ambush'){
    const stacks = dotStacks();
    if(stacks) dmg = Math.round(dmg * (1 + venomPerStack()*stacks));
    else dmg = Math.max(1, Math.round(dmg * ROGUE_COLD_MULT));
  }
  /* Momentum: the brawler beats anything slower than he is. */
  if(passive === 'combo'){
    const edge = clamp(st.spd - (m.spd||0), 0, 7);
    if(edge > 0) dmg = Math.round(dmg * (1 + 0.05*edge));
  }
  /* Ambush: the rogue opens every floor with a guaranteed critical. */
  const ambush = passive === 'ambush' && !App.run.openedFloor;
  App.run.openedFloor = true;
  let crit = false;
  const critMult = 1.6 + (passive === 'ambush' ? 0.15 : 0);
  if(opts.guaranteedCrit || ambush){ crit = true; dmg = Math.round(dmg*critMult); }
  else if(chance(st.critChance)){ crit = true; dmg = Math.round(dmg*critMult); }
  /* Bulwark: the warrior hits harder the closer it gets. */
  if(passive === 'bulwark'){
    const missing = clamp(1 - (App.run.hp / Math.max(1, st.maxHp)), 0, 1);
    if(missing > 0.5) dmg = Math.round(dmg * (1 + bulwarkRage() * ((missing - 0.5) / 0.5)));
  }
  /* Attunement again: a critical spell pays for part of itself. */
  if(passive === 'attune' && crit && isSkill){
    const st2 = combatStats();
    App.run.energy = clamp((App.run.energy||0) + 1, 0, st2.energyMax);
  }
  if(opts.executeBelowPct && (m.hp/m.maxHp) < opts.executeBelowPct){ dmg = Math.round(dmg*opts.executeMult); }
  if(passive==='rage' || opts.ragePower){
    const missing = clamp(1 - (App.run.hp / Math.max(1,st.maxHp)), 0, 1);
    dmg = Math.round(dmg * (1 + 0.45*missing));
  }
  if(passive==='combo'){
    const combo = Math.min(5, App.run.combo||0);
    if(combo>1) dmg = Math.round(dmg * (1 + 0.08*(combo-1)));
  }
  if(omenIs('thinveil')) dmg = Math.round(dmg * 1.3);
  if(App.run.frozen){ dmg = Math.max(1, Math.round(dmg*0.5)); App.run.frozen = false; }
  /* Brace: it saw this coming and set itself. One blow, then it is spent. */
  if(m.braced){ dmg = Math.max(1, Math.round(dmg*0.5)); m.braced = 0; }
  if(m.isBoss) dmg = bossModifyIncomingDamage(dmg, isSkill);
  let heal = 0;
  if(st.lifestealPct>0) heal += Math.round(dmg*st.lifestealPct/100);
  if(opts.lifestealBonus) heal += Math.round(dmg*opts.lifestealBonus/100);
  if(opts.healPct) heal += Math.round(st.maxHp*opts.healPct);
  if(opts.selfDmgPct){ App.run.hp = clamp(App.run.hp - Math.round(App.run.hp*opts.selfDmgPct), 1, st.maxHp); }
  m.hp = clamp(m.hp - dmg, 0, m.maxHp);
  const brokeSeals = m.isFinal && (m.phase || 1) < 2 && m.hp > 0 && m.hp <= m.maxHp * 0.5;
  const notes = [];
  if(aff > 0) notes.push('WEAK to ' + dmgType(type).label + ' — ×' + WEAK_MULT);
  else if(aff < 0) notes.push('Resists ' + dmgType(type).label + ' — half damage');
  /* Execute blows every open wound at once before it lays its own. */
  if(opts.consumeDots){
    const boom = detonateDots();
    if(boom > 0){
      m.hp = clamp(m.hp - boom, 0, m.maxHp);
      notes.push('Detonated ' + boom + ' from open wounds');
      showFloatingNumber(battleEls.monsterHost, '-'+boom, true);
    }
  }
  if(opts.dot && hasWeaponPassive('infernalruin') && opts.dot.type === 'fire'){
    opts = Object.assign({}, opts, {dot: Object.assign({}, opts.dot, {turns: opts.dot.turns + 2})});
  }
  if(opts.dot){ const n = applyDot(opts.dot); if(n) notes.push(n); }
  if(opts.stunTurns){ const n = stunMonster(opts.stunTurns, 'stunned'); if(n) notes.push(n); }
  if(opts.paralyzePct && chance(opts.paralyzePct)){ const n = stunMonster(1, 'paralysed'); if(n) notes.push(n); }
  if(opts.cooldown) setCooldown(opts.id, opts.cooldown);
  if(opts.drainMonsterEnergy){ m.energy = Math.max(0, m.energy - opts.drainMonsterEnergy); }
  if(opts.energyGain){ App.run.energy = clamp(App.run.energy + opts.energyGain, 0, st.energyMax); }
  if(opts.buffSelf){ App.run.buffs = (App.run.buffs||[]).concat([Object.assign({}, opts.buffSelf, {turns:opts.buffSelf.turns+1})]); }
  if(opts.shieldPct){ App.run.shieldPct = opts.shieldPct; }
  if(opts.nullifyNextWrong){ App.run.nullifyNextWrong = true; }
  if(opts.freeHintNext){ App.run.freeHintNext = true; }
  if(opts.energyRefundOnCrit && crit){ App.run.energy = clamp(App.run.energy+opts.energyRefundOnCrit, 0, st.energyMax); }
  if(heal>0) App.run.hp = clamp(App.run.hp+heal, 0, st.maxHp);
  const reflected = m.isBoss ? bossAfterPlayerHit(dmg) : {};
  triggerImpact(battleEls.monsterHost);

  if(canEvolve() && chance(EVOLVE_CHANCE)){

/* It comes apart, hangs there as light, and puts itself back together bigger. */
async function playEvolution(){
  const els = getBattleEls();
  const host = els.monsterSprite;
  const m = App.run.monster;
  if(!m) return;
  if(reducedMotion()){ const r = evolveMonster(); App.run.bossNote = r ? (r.was + ' EVOLVED into ' + r.now + '!') : null; await saveRun(); return; }
  if(els.scene) els.scene.classList.add('evo-dark');
  if(host) host.classList.add('evo-break');
  const at = fxBox(els, 'monster');
  if(at && els.scene){
    for(let i=0;i<10;i++){
      const d = document.createElement('div');
      d.className = 'evo-mote';
      const a = (i/10)*Math.PI*2, r = 46 + (i%3)*14;
      d.style.left = (at.x + Math.cos(a)*r) + 'px';
      d.style.top  = (at.y + Math.sin(a)*r) + 'px';
      d.style.setProperty('--mx', (-Math.cos(a)*r) + 'px');
      d.style.setProperty('--my', (-Math.sin(a)*r) + 'px');
      d.style.animationDelay = (i*26) + 'ms';
      els.scene.appendChild(d);
      setTimeout(()=>d.remove(), 1200);
    }
  }
  await sleep(620);
  /* the swap happens inside the white, so the shapes never cross-fade */
  if(at && els.scene) fxNode(els, 'fx-hit blood big', at.x, at.y, 520);
  fxShake(els, 520);
  const res = evolveMonster();
  render();
  const els2 = getBattleEls();
  if(els2.scene) els2.scene.classList.add('evo-dark');
  if(els2.monsterSprite) els2.monsterSprite.classList.add('evo-rise');
  await sleep(760);
  if(els2.scene) els2.scene.classList.remove('evo-dark');
  if(els2.monsterSprite) els2.monsterSprite.classList.remove('evo-rise');
  App.run.bossNote = res ? (res.was + ' EVOLVED — it is ' + res.now + ' now.') : null;
  await saveRun();
}
/* ========================== EVOLUTION ==========================
   A cornered thing occasionally stops being what it was. Once a monster is
   under 30% health there is a 5% chance per hit that it comes apart and puts
   itself back together as something worse - not a boss, but most of the way
   there: it heals to full on a bigger pool, hits harder, moves faster and
   takes the shape of a heavier sprite. It only ever happens once per fight.
   ============================================================== */
const EVOLVE_BELOW = 0.30, EVOLVE_CHANCE = 5;
const EVOLVE_HP = 2.2, EVOLVE_ATK = 1.45, EVOLVE_DEF = 1.35, EVOLVE_SPD = 1.2;
/* what each ordinary body turns into when it stops holding itself back */
const EVOLVE_FORM = {
  skeleton:  {sprite:'warden',    title:'Bonelord'},
  wraith:    {sprite:'reaper',    title:'Dread'},
  leech:     {sprite:'matriarch', title:'Broodmother'},
  imp:       {sprite:'golem',     title:'Infernal'},
  wisp:      {sprite:'overseer',  title:'Unbound'},
  stalker:   {sprite:'matriarch', title:'Apex'},
  automaton: {sprite:'colossus',  title:'Colossal'},
  harpy:     {sprite:'roc',       title:'Skytyrant'},
  hound:     {sprite:'dragon',    title:'Hellborn'},
  cultist:   {sprite:'devourer',  title:'Ascended'},
  serpent:   {sprite:'dragon',    title:'Elder'},
  golem:     {sprite:'colossus',  title:'Colossal'},
  roc:       {sprite:'dragon',    title:'Elder'},
  reaper:    {sprite:'tyrant',    title:'Deathless'},
  dragon:    {sprite:'tyrant',    title:'Elder'},
};
function evolveFormFor(arche){ return EVOLVE_FORM[arche] || {sprite:'warden', title:'Risen'}; }
function canEvolve(){
  const m = App.run && App.run.monster;
  return !!(m && !m.isBoss && !m.evolved && !m.gauntlet && m.hp > 0
            && (m.hp / Math.max(1, m.maxHp)) < EVOLVE_BELOW);
}
/* Rebuild the thing in place. Returns what it became, or null. */
function evolveMonster(){
  const m = App.run.monster;
  if(!m) return null;
  const form = evolveFormFor(m.arche);
  const was = m.name;
  m.evolved = true;
  m.maxHp = Math.round(m.maxHp * EVOLVE_HP);
  m.hp    = m.maxHp;                       /* it comes back whole */
  m.atk   = Math.round(m.atk * EVOLVE_ATK);
  m.def   = Math.round(m.def * EVOLVE_DEF);
  m.spd   = Math.round((m.spd||10) * EVOLVE_SPD);
  m.energy = 0;
  m.energyMax = clamp((m.energyMax||3) + 1, 2, 5);
  m.arche = form.sprite;
  m.palKey = null;
  m.name = form.title + ' ' + was;
  m.roleLabel = 'Evolved';
  m.roleNote = 'It stopped holding itself back. Nearly a boss, and it came back whole.';
  m.stunTurns = 0;
  App.run.dots = [];                       /* every wound closes over */
  return {was, now:m.name};
}

  80: {hue:'#c9b8ff', reveal:'fade', cue:'The torches are going out one by one.', beats:[

  90: {hue:'#ff9a3d', reveal:'dig', cue:'The floor is getting hot.', beats:[

};
function bossEntranceFor(floor){ return BOSS_ENTRANCE[floor] || null; }

/* ---- the player ---- */
/* Where the monster stands, as a percentage of the scene - the spawn point. */
function spawnPoint(els){
  const box = els.monsterSprite, scene = els.scene;
  if(!box || !scene) return {x:62, y:76};
  const sr = scene.getBoundingClientRect(), br = box.getBoundingClientRect();
  if(!sr.width || !br.width) return {x:62, y:76};
  return {x: ((br.left - sr.left + br.width/2) / sr.width) * 100,
          y: ((br.top  - sr.top  + br.height*0.62) / sr.height) * 100,
          footY: ((br.bottom - sr.top - br.height*0.10) / sr.height) * 100};
}
function beNode(scene, cls, x, y, html){
  const d = document.createElement('div');
  d.className = cls;
  if(x != null) d.style.left = x + '%';
  if(y != null) d.style.top = y + '%';
  if(html) d.innerHTML = html;
  scene.appendChild(d);
  return d;
}
async function playBossEntrance(floor){
  const script = bossEntranceFor(floor);
  const els = getBattleEls();
  const scene = els.scene;
  const m = App.run.monster;
  if(!script || !scene || !m || reducedMotion()){ startNewTurn(); return; }

  const host = beNode(scene, 'bossent');
  const cam  = beNode(host, 'be-cam');
  scene.classList.add('be-on');
  if(els.monsterSprite) els.monsterSprite.classList.add('be-hidden');
  const junk = [];

  let camZoom = 1;

  const step = async (b)=>{
    if(b.delay) await sleep(b.delay);
    /* A beat can name the spawn point instead of a coordinate I guessed. The
       nudge has to be divided by the zoom: the camera scales .be-cam about that
       same point, so an untouched dx of -13% lands at -24% once the lens is in
       and the prop ends up on the hero's side of the room. */
    if(b.at === 'spawn'){
      const sp = spawnPoint(els);
      const z = Math.max(0.01, camZoom);
      b = Object.assign({}, b, {x: sp.x + (b.dx || 0)/z, y: sp.y + (b.dy || 0)/z});
    }
    switch(b.t){
      case 'dark':
        scene.classList.add(b.deep ? 'be-dark-deep' : 'be-dark');
        await sleep(420); break;
      case 'zoom': {
        /* Aim at where the thing will actually stand, measured off its own
           sprite, rather than a percentage I guessed at. A beat can still nudge
           from there with dx/dy. */
        const at = spawnPoint(els);
        scene.style.setProperty('--bex', (at.x + (b.dx || 0)) + '%');
        scene.style.setProperty('--bey', (at.y + (b.dy || 0)) + '%');
        scene.style.setProperty('--bez', b.z);
        camZoom = b.z || 1;
        scene.classList.add('be-zoom');
        await sleep(b.ms || 800); break;
      }
      case 'crack': {
        for(let i=0;i<(b.n||6);i++){
          const c = beNode(cam, 'be-crack', b.x, b.y);
          c.style.setProperty('--cr', (i/(b.n||6))*360 + 'deg');
          c.style.setProperty('--cw', (5 + (i%3)*3.5) + '%');
          c.style.background = b.hue;
          c.style.animationDelay = (i*40) + 'ms';
          junk.push(c);
        }
        await sleep(420); break;
      }
      case 'motes': {
        for(let i=0;i<(b.n||12);i++){
          const d = beNode(cam, 'be-mote' + (b.dir==='in' ? ' inward' : ''), b.x, b.y);
          const a = (i/(b.n||12))*Math.PI*2, r = 40 + (i%4)*22;
          d.style.setProperty('--mx', Math.cos(a)*r + 'px');
          d.style.setProperty('--my', (b.dir==='up' ? -Math.abs(Math.sin(a)*r) - 20 : Math.sin(a)*r) + 'px');
          d.style.background = b.hue;
          d.style.animationDelay = (i*34) + 'ms';
          junk.push(d);
        }
        await sleep(500); break;
      }
      case 'sweep': {
        const d = beNode(cam, 'be-sweep');
        d.style.background = 'linear-gradient(90deg,transparent,' + b.hue + ',transparent)';
        d.style.animationDuration = (b.ms || 700) + 'ms';
        junk.push(d);
        await sleep((b.ms || 700) * 0.55); break;
      }
      case 'prop': {
        const d = beNode(cam, 'be-prop from-' + (b.from || 'below'), b.x, b.y, bossProp(b.id));
        d.style.setProperty('--ps', b.scale || 2);
        d.style.animationDuration = (b.ms || 700) + 'ms';
        junk.push(d);
        await sleep((b.ms || 700) * 0.6); break;
      }
      case 'flash': {
        const d = beNode(host, 'be-flash');
        d.style.background = b.hue;
        d.style.animationDuration = (b.ms || 240) + 'ms';
        setTimeout(()=>d.remove(), (b.ms || 240) + 60);
        await sleep((b.ms || 240) * 0.7); break;
      }
      case 'shake': fxShake(els, b.ms || 400); await sleep((b.ms || 400) * 0.6); break;
      case 'hold':  await sleep(b.ms || 300); break;
      /* A voice out of an empty room. The camera has nothing to look at yet,
         which is the point - he talks to you before you are allowed to see
         him. 'say' is the same thing once he is standing there. */
      case 'line': case 'say': {
        const node = el(`<div class="be-line${b.t === 'say' ? ' said' : ''}">${escapeHtml(b.text)}</div>`);
        scene.appendChild(node);
        junk.push(node);
        await sleep(b.ms || 2200);
        node.classList.add('out');
        await sleep(340);
        /* taken out rather than left faded in place - three of these stack up
           on the same spot and the one underneath is still in the document */
        node.remove();
        break;
      }
      case 'reveal': {
        const how = b.how || script.reveal || 'arrive';
        /* Dig: the camera stays down on the spot and the boss climbs out of it,
           clearing the ground a piece at a time - the head, then the shoulders,
           then the rest of it - with the floor throwing dirt the whole way. It
           is the only reveal that happens before the camera pulls back, because
           the point is watching it come up. */
        if(how === 'dig'){
          const at = spawnPoint(els);
          const mound = beNode(cam, 'be-mound', at.x, at.footY);
          junk.push(mound);
          if(els.monsterSprite){
            els.monsterSprite.classList.remove('be-hidden');
            els.monsterSprite.classList.add('be-digging');
          }
          for(let i=0;i<5;i++){
            for(let k=0;k<5;k++){
              const d = beNode(cam, 'be-dirt', at.x, at.footY);
              const a = -Math.PI*0.15 - Math.random()*Math.PI*0.7;
              const r = 22 + Math.random()*30;
              d.style.setProperty('--mx', Math.cos(a)*r + 'px');
              d.style.setProperty('--my', Math.sin(a)*r + 'px');
              junk.push(d);
              setTimeout(()=>d.remove(), 900);
            }
            fxShake(els, 240);
            await sleep(330);
          }
          await sleep(360);
          scene.classList.remove('be-zoom', 'be-dark', 'be-dark-deep');
          junk.forEach(n=>n.classList.add('be-out'));
          await sleep(300);
          els.monsterSprite && els.monsterSprite.classList.remove('be-digging');
        } else {
          scene.classList.remove('be-zoom', 'be-dark', 'be-dark-deep');
          junk.forEach(n=>n.classList.add('be-out'));
          await sleep(260);
          if(els.monsterSprite){
            els.monsterSprite.classList.remove('be-hidden');
            els.monsterSprite.classList.add(how === 'drop' ? 'be-drop'
              : how === 'fade' ? 'be-fade'
              : how === 'assemble' ? 'be-assemble' : 'be-arrive');
          }
        }
        const card = beNode(host, 'be-title', null, null,
          `<span class="be-name">${escapeHtml(m.name)}</span>
           <span class="be-sub">${escapeHtml(m.abilityName || '')}${m.abilityName ? ' — ' : ''}${escapeHtml(m.abilityDesc || '')}</span>`);
        card.style.setProperty('--bec', script.hue);
        await sleep(1750);
        card.classList.add('be-out');
        await sleep(260);
        break;
      }
    }
  };

  try{
    const cue = beNode(host, 'be-cue', null, null, escapeHtml(script.cue || ''));
    cue.style.setProperty('--bec', script.hue);
    setTimeout(()=>cue.classList.add('be-out'), 2200);
    for(const b of script.beats){
      /* the view changed, or a re-render swapped the scene out from under us */
      if(App.dungeonView !== 'battle' || !scene.isConnected) break;
      await step(b);
    }
  }catch(e){
    /* An entrance is never worth losing the fight over, so it always falls
       through to the battle - but it must not fail silently either, or a dead
       cutscene looks exactly like a short one. */
    console.error('boss entrance failed on floor ' + floor + ':', e);
    App.__entranceError = String(e && e.stack || e);
  }

  scene.classList.remove('be-on', 'be-zoom', 'be-dark', 'be-dark-deep');
  ['--bex','--bey','--bez'].forEach(v=>scene.style.removeProperty(v));
  if(els.monsterSprite) els.monsterSprite.classList.remove('be-hidden','be-arrive','be-digging','be-drop','be-fade','be-assemble');
  host.remove();
  if(App.dungeonView !== 'battle' || !App.run.monster) return;
  const st = combatStats();
  if((App.run.monster.spd || 0) > st.spd){ playOpeningStrike(); return; }
  startNewTurn();
}
/* ====================== ROT, STACKS AND STUNS ======================
   A wound that keeps bleeding is its own system now. Up to three stacks sit on
   the enemy at once, each ticking for three rounds, and how well they take hold
   depends on what the thing is made of - a skeleton has nothing to poison and a
   golem has nothing to bleed.
   ================================================================= */
const MAX_DOTS = 3;
function dotGrip(monster){
  const g = DOT_GRIP[(monster && monster.dot) || 'normal'];
  return g == null ? 1 : g;
}
function activeDots(){ return (App.run.dots || []).filter(d=>d.turnsLeft > 0); }
function dotStacks(){ return activeDots().length; }
/* Nightfall: the rogue's legendary buys room for one more open wound, and
   pays better for every one of them. */
function dotCap(){ return MAX_DOTS + (hasWeaponPassive('nightfall') ? 1 : 0); }
function venomPerStack(){ return hasWeaponPassive('nightfall') ? 0.16 : 0.12; }
/* Dragonfang: the warrior's floor bonus, doubled. */
function bulwarkRage(){ return hasWeaponPassive('dragonfang') ? 0.60 : 0.30; }
/* Returns a short line for the log, or null if it did not take. */
function applyDot(spec, potency){
  const m = App.run.monster;
  if(!m || !spec) return null;
  const grip = dotGrip(m);
  if(grip <= 0) return m.name + ' cannot be ' + (spec.type === 'bleed' ? 'made to bleed' : 'poisoned');
  App.run.dots = activeDots();
  const want = Math.max(1, spec.stacks || 1);
  let laid = 0;
  for(let i = 0; i < want; i++){
    const per = Math.max(1, Math.round(m.maxHp * spec.pct * grip * (potency||1) / spec.turns));
    if(App.run.dots.length >= dotCap()){
      /* full - refresh the weakest stack instead of dropping the hit */
      let worst = 0;
      App.run.dots.forEach((d,j)=>{ if(d.perTurn < App.run.dots[worst].perTurn) worst = j; });
      App.run.dots[worst] = {type:spec.type, turnsLeft:spec.turns, perTurn:per};
    } else {
      App.run.dots.push({type:spec.type, turnsLeft:spec.turns, perTurn:per});
    }
    laid++;
  }
  const lab = dmgType(spec.type).label;
  return lab + ' ×' + dotStacks() + (grip > 1 ? ' (it takes badly)' : (grip < 1 ? ' (it barely holds)' : ''));
}
/* Execute blows every stack at once. */
function detonateDots(){
  const m = App.run.monster;
  const list = activeDots();
  if(!m || !list.length) return 0;
  let total = 0;
  list.forEach(d=>{ total += d.perTurn * d.turnsLeft; });
  App.run.dots = [];
  return total;
}
function dotTickTotal(){ return activeDots().reduce((n,d)=>n+d.perTurn, 0); }
/* Stun and paralysis are the same thing wearing two names. */
function stunMonster(turns, word){
  const m = App.run.monster;
  if(!m) return null;
  m.stunTurns = Math.max(m.stunTurns || 0, turns);
  return m.name + ' is ' + (word || 'stunned') + '!';
}
function isStunned(){ const m = App.run.monster; return !!(m && (m.stunTurns||0) > 0); }
function skillCooldown(id){ return (App.run.cooldowns && App.run.cooldowns[id]) || 0; }
function setCooldown(id, turns){
  App.run.cooldowns = App.run.cooldowns || {};
  App.run.cooldowns[id] = turns + 1;      /* it ticks down at the top of the next turn */
}
function tickCooldowns(){
  const cd = App.run.cooldowns || {};
  Object.keys(cd).forEach(k=>{ cd[k] = Math.max(0, cd[k] - 1); if(!cd[k]) delete cd[k]; });
}
/* The buff a class charges itself with, if one is running. */
function activeChargeBuff(){
  return (App.run.buffs || []).find(b=>b.glow) || null;
}
function monsterDebuffMult(stat){
  let mult = 1;
  (App.run.monsterDebuffs||[]).forEach(d=>{ if(d.stat===stat) mult += d.amount; });
  /* Rally and the rest ride the same rail, pointing the other way. */
  (App.run.monsterBuffs||[]).forEach(b=>{ if(b.stat===stat) mult += b.amount; });
  return Math.max(0.2, mult);
}
function monsterAtk(){
  const om = omenIs('bloodmoon') ? 1.45 : 1;
  return Math.max(1, Math.round((App.run.monster.atk||1) * monsterDebuffMult('atkPct') * om));
}
function monsterDef(){ return Math.max(0, Math.round((App.run.monster.def||0) * monsterDebuffMult('defPct'))); }
function tickBuffTimers(){
  ['buffs','monsterDebuffs','monsterBuffs'].forEach(k=>{
    App.run[k] = (App.run[k]||[]).map(b=>Object.assign({}, b, {turns:b.turns-1})).filter(b=>b.turns>0);
  });
}
function usePotion(id, inBattle){
  const p = POTIONS[id];
  if(!p || potionCount(id)<=0) return false;
  App.character.potions[id]--;
  const st = combatStats();
  if(p.kind==='heal'){ App.run.hp = clamp(App.run.hp + p.amount, 0, st.maxHp); App.run.bossNote = '+'+p.amount+' HP'; }
  else if(p.kind==='energy'){ App.run.energy = clamp(App.run.energy + p.amount, 0, st.energyMax); App.run.bossNote = '+'+p.amount+' Energy'; }
  else if(p.kind==='buff'){ App.run.buffs = (App.run.buffs||[]).concat([{stat:p.stat, amount:p.amount, turns:p.turns+1, name:p.name}]); App.run.bossNote = p.name+' active'; }
  else if(p.kind==='debuff'){
    if(p.stat==='drain'){ if(App.run.monster) App.run.monster.energy = Math.max(0, App.run.monster.energy - p.amount); App.run.bossNote = 'Enemy charge drained'; }
    else { App.run.monsterDebuffs = (App.run.monsterDebuffs||[]).concat([{stat:p.stat, amount:p.amount, turns:p.turns+1, name:p.name}]); App.run.bossNote = p.name+' applied'; }
  }
  saveCharacter(); saveRun();
  return true;
}
function tickMonsterEnergy(wasAttack){
  const m = App.run.monster;
  if(!m) return false;
  m.energy++;
  if(m.energy>=m.energyMax){ m.energy=0; return true; }
  return false;
}
/* ---------------------------- THE SECOND PHASE ----------------------------
   Half health and the seals the four sages left on him give out. He does not
   grow: he is the same man, the same size, standing in the same place - the
   light he has been holding in for a thousand years simply stops being held.
   The sheet swaps, the room goes with him, and he hits appreciably harder.
   -------------------------------------------------------------------------- */
async function checkBossPhase(){
  const m = App.run.monster;
  if(!m || !m.isFinal || (m.phase || 1) >= 2) return false;
  if(m.hp > m.maxHp * 0.5 || m.hp <= 0) return false;
  m.phase = 2;
  m.atk = Math.round(m.atk * 1.35);
  m.spd = Math.round(m.spd * 1.15);
  m.cunning = Math.min(0.75, (m.cunning || 0.3) + 0.2);
  m.wits = 1;
  m.braced = 0;
  App.run.bossNote = 'The seals give out.';
  const els = getBattleEls();
  if(els.scene && !reducedMotion()){
    els.scene.classList.add('ph2-break');
    const card = el(`<div class="be-line said">Ah. There it goes.</div>`);
    els.scene.appendChild(card);
    towerLurch(els, true);
    await sleep(900);
    /* the sheet changes under the flash, so the swap is never seen happening */
    const host = els.monsterSprite && els.monsterSprite.querySelector('.sprite-flip');
    if(host) setArt(host, monsterSprite(m));
    await sleep(1100);
    card.classList.add('out');
    setTimeout(()=>card.remove(), 340);
    els.scene.classList.remove('ph2-break');
    els.scene.classList.add('ph2');
  } else {
    const host = els.monsterSprite && els.monsterSprite.querySelector('.sprite-flip');
    if(host) setArt(host, monsterSprite(m));
    if(els.scene) els.scene.classList.add('ph2');
  }
  await saveRun();
  return true;
}

/* The fifth mistake. It stops trading and does the whole thing at once. */
async function resolveBossUltimate(){
  const els = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  const ult = bossUltimateFor();
  if(!m || !ult){ await resolveMonsterHit(); return; }
  App.run.bossCharge = 0;

  if(els.scene && !reducedMotion()){
    els.scene.classList.add('bu-dark');
    const card = el(`<div class="bu-card">
      <span class="bu-lead">${escapeHtml(m.name)} — FULLY CHARGED</span>
      <span class="bu-name">${escapeHtml(ult.name)}</span>
      <span class="bu-line">${escapeHtml(ult.line)}</span>
    </div>`);
    els.scene.appendChild(card);
    if(els.monsterSprite) els.monsterSprite.classList.add('bu-wind');
    await sleep(1150);
    card.classList.add('be-out');
    setTimeout(()=>card.remove(), 300);
    els.scene.classList.remove('bu-dark');
    if(els.monsterSprite) els.monsterSprite.classList.remove('bu-wind');
  }

  const hits = ult.hits || 1;
  let total = 0;
  for(let i=0;i<hits;i++){
    await monsterAttackIntro(els, true);
    let dmg = Math.max(1, Math.round(monsterAtk() * ult.mult * (0.92+Math.random()*0.16) - st.def*0.4));
    dmg = Math.max(1, Math.round(dmg * curDiff().takeMult));
    if(omenIs('thinveil')) dmg = Math.round(dmg * 1.3);
    if(CLASSES[App.character.classId].passive === 'bulwark') dmg = Math.max(1, Math.round(dmg*0.85));
    if(App.run.nullifyNextWrong){ dmg = 0; App.run.nullifyNextWrong = false; }
    else if(App.run.shieldPct > 0){ dmg = Math.round(dmg*(1-App.run.shieldPct)); App.run.shieldPct = 0; }
    App.run.hp = clamp(App.run.hp - dmg, 0, st.maxHp);
    total += dmg;
    fxShake(els, 420);
    heroClipSeq(els.playerSprite, App.character.classId, [['hurt', 300]]);
    await playAnim(els.playerSprite, 'hitflash', 300);
    updateHpBar(els.playerHpFill, els.playerHpNum, App.run.hp, st.maxHp);
    showFloatingNumber(els.playerHost, '-'+dmg+(hits>1?' ×'+(i+1):''), true);
    if(App.run.hp <= 0) break;
    if(i < hits-1) await sleep(260);
  }

  const notes = [ult.name + ' — ' + total + ' damage' ];
  if(ult.drain){ const before = App.run.energy||0;
    App.run.energy = clamp(before - ult.drain, 0, st.energyMax);
    if(before - App.run.energy > 0) notes.push('drained ' + (before-App.run.energy) + ' ⚡'); }
  if(ult.burnTurns){ App.run.playerBurn = {turnsLeft:ult.burnTurns,
    perTurn: Math.max(1, Math.round(st.maxHp*ult.burnPct))}; notes.push('burning for ' + ult.burnTurns + ' turns'); }
  if(ult.frozen){ App.run.frozen = true; notes.push('your next hit is halved'); }
  if(ult.sealHints){ App.run.hintsSealed = true; notes.push('hints sealed'); }
  if(ult.healPct){ const h = Math.round(m.maxHp*ult.healPct);
    m.hp = clamp(m.hp + h, 0, m.maxHp); notes.push('it healed ' + h);
    updateHpBar(els.monsterHpFill, els.monsterHpNum, m.hp, m.maxHp); }
  App.run.bossNote = notes.join(' · ');

  await sleep(420);
  await saveRun();
  if(App.run.hp <= 0){ await handleDeath(); return; }
  App.currentPhase = 'postattack';
  render();
}
async function resolveMonsterHit(){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  if(isStunned()){
    m.stunTurns--;
    if(battleEls.monsterSprite) await playAnim(battleEls.monsterSprite, 'hitflash', 300);
    showFloatingNumber(battleEls.monsterHost, 'STUNNED', true);
    App.run.bossNote = m.name + ' loses its turn.';
    await sleep(520);
    await saveRun();
    App.currentPhase = 'postattack';
    render();
    return;
  }
  /* Deep enough, and it spends the turn on something better than a swing. */
  const act = monsterChooseSkill();
  let skillNote = null, skillMult = 1;
  if(act){
    m.skillCd = 2;
    skillNote = act.s.run(m, st) || null;
    skillMult = act.s.mult || 1;
    if(battleEls.monsterSprite){          /* it gathers rather than swings */
      monsterClip(battleEls, 'atk', 620);
      await playAnim(battleEls.monsterSprite, 'telegraph', 620);
    }
    showFloatingNumber(battleEls.monsterHost, act.s.name.toUpperCase(), true);
    App.run.bossNote = (skillNote || (m.name + ' — ' + act.s.name)) + ' (' + skillTell(m, act.id, act.s) + ')';
    updateHpBar(battleEls.monsterHpFill, battleEls.monsterHpNum, m.hp, m.maxHp);
    await sleep(560);
    if(act.s.skipHit){
      await saveRun();
      App.currentPhase = 'postattack';
      render();
      return;
    }
  }
  const charged = tickMonsterEnergy(true);
  await monsterAttackIntro(battleEls, charged);
  let dmg = Math.max(1, Math.round(monsterAtk()*skillMult*(0.85+Math.random()*0.3) - st.def*0.5));
  dmg = Math.max(1, Math.round(dmg * curDiff().takeMult));
  if(omenIs('thinveil')) dmg = Math.round(dmg * 1.3);
  if(charged) dmg = Math.round(dmg*1.6);
  let hits = 1, bossNotes = [];
  if(m.isBoss){ const mod = bossModifyOutgoingDamage(dmg, charged); dmg = mod.dmg; hits = mod.hits; bossNotes = mod.notes; }
  /* Bulwark: the warrior simply takes less. Frailty: the mage takes more. */
  if(CLASSES[App.character.classId].passive === 'bulwark') dmg = Math.max(1, Math.round(dmg * 0.85));
  dmg = Math.max(1, Math.round(dmg * mageFrailtyMult('physical')));
  let nullified = false, shielded = false;
  if(App.run.nullifyNextWrong){ dmg = 0; hits = 1; nullified = true; App.run.nullifyNextWrong = false; }
  else if(App.run.shieldPct>0){ dmg = Math.round(dmg*(1-App.run.shieldPct)); shielded = true; App.run.shieldPct = 0; }
  const totalDmg = dmg*hits;
  App.run.hp = clamp(App.run.hp - totalDmg, 0, st.maxHp);
  if(m.isBoss && !nullified) bossNotes = bossNotes.concat(bossAfterMonsterHit(totalDmg, charged));
  if(battleEls.scene) battleEls.scene.classList.add('shake');
  heroClipSeq(battleEls.playerSprite, App.character.classId, [['hurt', 300]]);
  await playAnim(battleEls.playerSprite, 'hitflash', 300);
  updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp);
  showFloatingNumber(battleEls.playerHost, nullified?'Blocked!':(charged?('-'+totalDmg+' CHARGED!'):('-'+totalDmg+(hits>1?' ×'+hits:''))), charged);
  if(bossNotes.length){ App.run.bossNote = bossNotes.join(' · '); updateHpBar(battleEls.monsterHpFill, battleEls.monsterHpNum, m.hp, m.maxHp); }
  if(skillNote) App.run.bossNote = skillNote + (bossNotes.length ? ' · ' + bossNotes.join(' · ') : '');
  await sleep(450);
  if(battleEls.scene) battleEls.scene.classList.remove('shake');
  await saveRun();
  if(App.run.hp<=0){ await handleDeath(); return; }
  App.currentPhase = 'postattack';
  render();
}
async function useSkillById(skillId){
  const skill = SKILLS[skillId];
  if(!skill) return;
  if(skillCooldown(skillId) > 0) return;
  const cost = skill.cost||0;
  if((App.run.energy||0) < cost) return;
  App.run.energy -= cost;
  const battleEls = getBattleEls();
  if(skill.ultimate) await playUltimateCinematic(skill);
  const hits = skill.hits || 1;
  for(let i=0;i<hits;i++){
    if(App.run.monster.hp<=0) break;
    await resolvePlayerHit(skill.mult, skill, cost>0, i<hits-1, skill);
  }
}

/* The enemy was standing in front of the stairs. Once it is down, the way below
   is lit and the hero actually takes it: over to the foot of the steps, up onto
   the landing, then down into the dark. Screen positions come from the scene's
   own coordinates so the hero lands on the steps at any panel size. */
function scenePoint(scene, sx, sy){
  const r = scene.getBoundingClientRect();
  const sc = Math.max(r.width/SCENE_W, r.height/SCENE_H);   /* the bg is 'slice' fitted */
  return {x: r.width/2 + (sx - SCENE_W/2)*sc, y: r.height/2 + (sy - SCENE_H/2)*sc, sc};
}
async function playVictoryExit(){
  const els = getBattleEls();
  if(!els.scene || App.dungeonView !== 'battle') return;
  if(reducedMotion()){ await sleep(120); return; }
  if(els.monsterSprite){
    els.monsterSprite.classList.add('dying');
    const host = els.monsterSprite.closest('.combatant');
    if(host) host.classList.add('slain');       // the name and bar go with it
  }
  await sleep(430);
  const glow = el('<div class="door-glow"></div>');
  els.scene.appendChild(glow);
  await sleep(220);

  const box = els.playerSprite;
  if(box){
    const sr = els.scene.getBoundingClientRect(), br = box.getBoundingClientRect();
    const footX = br.left - sr.left + br.width/2, footY = br.bottom - sr.top;
    /* the foot of the steps, then the landing itself */
    const p1 = scenePoint(els.scene, SCENE_DOOR_X, SCENE_HOR + 12);
    const p2 = scenePoint(els.scene, SCENE_DOOR_X, SCENE_HOR - 2);
    box.style.setProperty('--wx', (p1.x - footX) + 'px');
    box.style.setProperty('--wy', (p1.y - footY) + 'px');
    box.style.setProperty('--sx', (p2.x - footX) + 'px');
    box.style.setProperty('--sy', (p2.y - footY) + 'px');
    heroClipSeq(box, App.character.classId, [['walk', 1500]]);
    box.classList.add('exiting');
  }
  await sleep(1420);
}
/* ------------------------- THE WAY HE GOES OUT -------------------------
   Everything else in the tower falls over and you take the stairs. He does
   not. The camera goes in on him, he stays on his feet for a while, and he
   talks - and what he says turns into the flashback. You do not get the
   victory card until he has finished.
   --------------------------------------------------------------------- */
const BOSS_LAST_WORDS = [
  'Ah.',
  'A thousand years, and it is a student who does it.',
  'Then let me tell you what you have killed.',
];
async function playBossDeath(){
  const els = getBattleEls();
  const m = App.run.monster;
  App.currentPhase = 'dying';
  if(!els.scene || reducedMotion()){ startFinale(); return; }
  render();
  const els2 = getBattleEls();
  const scene = els2.scene;
  if(!scene){ startFinale(); return; }

  /* in on him, and hold there */
  const at = spawnPoint(els2);
  scene.style.setProperty('--bex', at.x + '%');
  scene.style.setProperty('--bey', (at.y - 4) + '%');
  scene.style.setProperty('--bez', 2.4);
  scene.classList.add('be-on', 'be-zoom', 'be-dark');
  const host = els2.monsterSprite;
  if(host){
    host.classList.add('dying');
    const flip = host.querySelector('.sprite-flip');
    if(flip) setArt(flip, monsterSprite(m, 'hurt'));
  }
  await sleep(1400);

  for(const line of BOSS_LAST_WORDS){
    const node = el(`<div class="be-line said">${escapeHtml(line)}</div>`);
    scene.appendChild(node);
    await sleep(2300);
    node.classList.add('out');
    await sleep(340);
    node.remove();
  }
  await sleep(500);
  scene.classList.add('be-dark-deep');
  await sleep(900);
  startFinale();
}

/* Training used to hand out +25% Attack or +35% Defense in one go, for the
   rest of the run, at every one of the ten checkpoints - and because the
   buffs were concatenated rather than merged, picking the same one twice
   stacked it. Ten drills was +250% Attack, permanently, for clicking the
   middle button. It is a drill between floors now: a small, real gain that
   adds up over a run instead of replacing the run. */
const TRAIN_BUFFS = [
  {stat:'atkPct',  amount:0.04, name:'Battle Trance',   label:'+4% Attack'},
  {stat:'defPct',  amount:0.06, name:'Stone Stance',    label:'+6% Defense'},
  {stat:'hpPct',   amount:0.04, name:'Second Wind',     label:'+4% Max HP'},
  {stat:'critPct', amount:3,    name:'Killer Instinct', label:'+3% Crit chance'},
];
function doRest(){
  const st = combatStats();
  const before = App.run.hp;
  const healed = Math.max(1, Math.round(st.maxHp*0.45));
  partyHealAll(0.45);
  App.run.hp = clamp(Math.max(App.run.hp, before + healed), 0, st.maxHp);
  App.run.poison = {turnsLeft:0, perTurn:0};
  App.run.playerBurn = {turnsLeft:0, perTurn:0};
  App.run.playerBleed = {turnsLeft:0, perTurn:0};
  App.checkpointResult = {title:'You make camp', lines:[
    'You bind your wounds and sleep by the embers.',
    'Recovered '+(App.run.hp-before)+' HP — now '+App.run.hp+' / '+st.maxHp+'.',
    'Poison and burning have worn off.']};
  saveRun(); render();
}
function doTrain(){
  const buff = pick(TRAIN_BUFFS);
  App.run.buffs = App.run.buffs || [];
  /* merged rather than concatenated, so the same drill twice is one tag that
     says x2 instead of two identical tags quietly doubling up */
  const cur = App.run.buffs.find(b=>b.name === buff.name);
  if(cur){ cur.amount += buff.amount; cur.stacks = (cur.stacks||1) + 1; }
  else App.run.buffs.push({stat:buff.stat, amount:buff.amount, turns:9999,
                           name:buff.name, stacks:1, permanent:true});
  const now = App.run.buffs.find(b=>b.name === buff.name);
  const total = buff.stat === 'critPct' ? ('+'+now.amount+'% Crit chance')
                                        : ('+'+Math.round(now.amount*100)+'% '+
                                           ({atkPct:'Attack', defPct:'Defense', hpPct:'Max HP'}[buff.stat]));
  App.checkpointResult = {title:'You drill in the dark', lines:[
    'Between floors you train against the stone. A drill is a drill — it makes you a little better, not a different person.',
    '<b>'+buff.name+'</b> — '+buff.label+(now.stacks>1 ? (' (drilled ×'+now.stacks+' — now '+total+')') : ', for the rest of this run')+'.']};
  saveRun(); render();
}

  }

  const pid = pick(['hp_large','buff_atk','buff_def','buff_crit','energy']);

  const prog = (ch && ch.classProgress && ch.classProgress[classId]) || freshClassProgress();
  const gear = ch ? ((ch.weapons||[]).length + (ch.armors||[]).length) : 0;
  const touched = !!ch && ((ch.highestFloor||0)>0 || gear>0 || (prog.level||1)>1 || (ch.gems||0)>0 || !!(run && run.active));
  return {
    started: touched,
    classId, level: prog.level||1,
    highestFloor: (ch && ch.highestFloor) || 0,
    gems: (ch && ch.gems) || 0,
    gear,
    runActive: !!(run && run.active),
    runFloor: (run && run.floor) || 1,
  };
}

/* ========================= THE ENDING, DRAWN =========================
   Panels, not prose on a black screen: one picture a beat, in colour, with
   enough movement in it to feel alive - a slow push in on the art, particles
   drifting through it, light that breathes. Nobody speaks. The text sits under
   the picture and you read it at your own pace, and there is music behind it.

   Drawn on the same pixel grid as everything else in the game (160x90 here)
   so the ending looks like it belongs to the thing you just played rather
   than like a cutscene bolted onto it.
   ================================================================== */
const FIN_W = 160, FIN_H = 90;
const FIN_PAL = {
  k:'#07060e', K:'#030206', d:'#161228', D:'#241d3e', m:'#3a2f5c', M:'#57497f',
  w:'#e9e3ff', W:'#ffffff', g:'#8d84a8', s:'#c6bce4',
  r:'#c72b3a', R:'#ff5a5a', o:'#ff8c3a', y:'#ffd166', Y:'#fff3c4',
  b:'#2a4a7a', B:'#4a7ac4', c:'#8fd0ff',
  e:'#2f6b47', E:'#5aa86a',
  p:'#6b3f9f', P:'#a06bd8', f:'#3a1020', F:'#7a1f2b',
  n:'#6b5a44', N:'#a8916b',
};
function finGrid(){ return pxGrid(FIN_W, FIN_H); }
function finSky(g, keys){
  for(let y=0;y<FIN_H;y++){
    const k = keys[clamp(Math.round((y/(FIN_H-1))*(keys.length-1)),0,keys.length-1)];
    for(let x=0;x<FIN_W;x++) g[y][x] = k;
  }
}
function finGround(g, y0, key, edge){
  for(let y=y0;y<FIN_H;y++) for(let x=0;x<FIN_W;x++) g[y][x] = key;
  if(edge) for(let x=0;x<FIN_W;x++){
    const h = y0 - Math.round(2*Math.sin(x/9) + 2*sceneNoise(Math.floor(x/4),1));
    for(let y=h;y<y0;y++) if(g[y]) g[y][x] = edge;
  }
}
/* A person, small, in silhouette: a head, a gap at the neck, then shoulders.
   The first version was one tapering bar, and a row of them read as a fence -
   the two pixels of daylight at the neck are the whole difference between a
   post and a man, and every crowd in this ending is built out of them. */
function finFigure(g, x, y, h, key, opts){
  opts = opts || {};
  const hw = Math.max(1, Math.round(h/11));
  const r = hw, cy = y - h + r;
  for(let j=-r;j<=r;j++) for(let d=-r;d<=r;d++){
    if(d*d + j*j > r*r + r) continue;
    const yy = cy + j, xx = x + d;
    if(g[yy] && xx>=0 && xx<FIN_W) g[yy][xx] = key;
  }
  const top = cy + r + 2;
  for(let yy=top; yy<=y; yy++){
    const t = (yy - top) / Math.max(1, y - top);
    const w = t < 0.12 ? hw : (t < 0.72 ? hw + 1 : hw);
    for(let d=-w; d<=w; d++){
      const xx = x + d;
      if(g[yy] && xx>=0 && xx<FIN_W) g[yy][xx] = key;
    }
  }
  if(opts.arm){                       /* a raised arm, and whatever is in it */
    for(let j=0;j<Math.round(h*0.45);j++){
      const xx = x + hw + 1 + Math.round(j*0.35), yy = top + 1 - j;
      if(g[yy] && xx>=0 && xx<FIN_W) g[yy][xx] = key;
    }
  }
  if(opts.blade){
    const bx = x + hw + 2;
    for(let j=0;j<Math.round(h*0.8);j++){
      const yy = cy - r - 2 - j;
      if(g[yy]) { g[yy][bx] = opts.blade; if(g[yy][bx+1]!==undefined) g[yy][bx+1] = opts.blade; }
    }
  }
  /* One horn. He is not a demon by birth and the missing second one is how
     you are supposed to know. */
  if(opts.horns){
    [[r,0],[r,-2],[r-1,-4],[r-1,-6],[r-2,-8]].forEach(([dx,dy])=>{
      const yy = cy - r + dy, xx = x + dx;
      if(g[yy] && xx>=0 && xx<FIN_W) g[yy][xx] = opts.horns;
    });
  }
}
/* A sword hanging point down. Five white pixels in a column is a scratch on
   the screen; a blade with a guard and a grip on it is a threat. */
function finBlade(g, x, tipY, len, a, b){
  for(let j=0;j<len;j++){ const yy = tipY - j;
    if(!g[yy]) continue;
    g[yy][x] = a; if(x+1 < FIN_W) g[yy][x+1] = b;
  }
  const gy = tipY - len;
  for(let d=-3; d<=4; d++) if(g[gy] && x+d>=0 && x+d<FIN_W) g[gy][x+d] = b;
  for(let j=1;j<=4;j++) if(g[gy-j]){ g[gy-j][x] = b; if(x+1<FIN_W) g[gy-j][x+1] = b; }
  if(g[gy-5]){ g[gy-5][x] = a; if(x+1<FIN_W) g[gy-5][x+1] = a; }
}
/* A straight run of pixels between two points, dashed so it reads as light
   travelling rather than as a drawn line. */
function finLine(g, x0, y0, x1, y1, a, b){
  const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
  for(let i=0;i<=n;i++){
    const x = Math.round(x0 + (x1-x0)*i/n), y = Math.round(y0 + (y1-y0)*i/n);
    if(g[y] && x>=0 && x<FIN_W) g[y][x] = (i % 7 < 5) ? a : b;
  }
}
function finRays(g, cx, cy, n, key, len){
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + 0.2;
    for(let r=4;r<len;r++){
      const x = Math.round(cx + Math.cos(a)*r), y = Math.round(cy + Math.sin(a)*r*0.6);
      if(g[y] && x>=0 && x<FIN_W && sceneNoise(x,y) < 0.7) g[y][x] = key;
    }
  }
}

/* Panels are built in layers, and every layer moves on its own timing. A still
   picture with a slow zoom on it is a slideshow; what makes it read as a
   moving picture is that the rays turn while the ground holds, the debris
   keeps travelling outward after the flash, the candles flicker out of step
   and there is always something small drifting through the frame. */
/* Panels are a background you can name, with the game's own characters standing
   in them. The first version was silhouettes on banded gradients and you could
   not tell a throne room from a forest; the fix was not more animation, it was
   building things that are recognisably things - a throne with steps up to it,
   a gate with towers, a castle skyline - and then putting the sprites you have
   been playing with for a hundred floors into the shot, at a readable size,
   lit and casting shadows. Every layer still moves on its own timing. */
function finSlab(g, x, y, w, h, key){ R(g, x, y, w, h, key); }
function finTower(g, x, base, w, h, a, b, cap){
  for(let j=0;j<h;j++){
    const yy = base - j, ww = Math.max(2, w - Math.floor(j/9));
    for(let d=-ww; d<=ww; d++){
      const xx = x + d;
      if(g[yy] && xx>=0 && xx<FIN_W) g[yy][xx] = (d === -ww) ? b : (d === ww ? b : a);
    }
  }
  if(cap) for(let d=-w-2; d<=w+2; d++){ const xx = x+d;
    if(g[base-h] && xx>=0 && xx<FIN_W){ g[base-h][xx] = cap; if(g[base-h-1]) g[base-h-1][xx] = cap; } }
}
function finArch(g, cx, base, r, a, b){
  for(let t=0;t<=90;t++){
    const th = Math.PI*(t/90);
    const x = Math.round(cx - r*Math.cos(th)), y = Math.round(base - r*Math.sin(th)*0.95);
    for(let d=0; d<3; d++) if(g[y+d] && x>=0 && x<FIN_W) g[y+d][x] = d ? b : a;
  }
  for(let j=0;j<r;j++){
    [cx-r, cx+r].forEach(x=>{ for(let d=0;d<3;d++) if(g[base-j] && x+d>=0 && x+d<FIN_W) g[base-j][x+d] = d ? b : a; });
  }
}
function finSkyline(g, base, key, seed){
  for(let i=0;i<14;i++){
    const x = -4 + i*13 + Math.round(5*sceneNoise(i, seed));
    const w = 4 + Math.round(4*sceneNoise(i, seed+3));
    const h = 8 + Math.round(22*sceneNoise(i, seed+7));
    for(let j=0;j<h;j++) for(let d=0;d<w;d++){
      const xx = x+d; if(g[base-j] && xx>=0 && xx<FIN_W) g[base-j][xx] = key;
    }
    if(sceneNoise(i, seed+11) < 0.4)               /* a spire on some of them */
      for(let j=h;j<h+7;j++) if(g[base-j] && x+w/2 < FIN_W) g[base-j][Math.round(x+w/2)] = key;
  }
}
/* A crowd is two ranks, not one: small heads at the horizon and big ones down
   at the bottom edge where the frame cuts them off. One even row of identical
   people at the same distance reads as a fence, however many of them there are. */
function finCrowd(g, base, x0, x1, key, n, seed, opts){
  opts = opts || {};
  for(let i=0;i<n;i++){
    const x = x0 + Math.round((x1-x0) * i/(n-1)) + Math.round(4*sceneNoise(i,seed)) - 2;
    const back = (i % 2) === 0;
    const y = base + (back ? 0 : 7 + Math.round(4*sceneNoise(i,seed+2)));
    const h = (back ? 11 : 18) + Math.round(5*sceneNoise(i,seed+5));
    finFigure(g, x, y, h, key, {arm: opts.arms ? (i % 3 === 0 ? 1 : 0) : 0});
  }
}
/* The four who sealed him: an order, so one design in four robes, each with a
   staff whose light meets the other three over his head. They were silhouettes
   with a stick, and "the same four who stood beside me when we killed the Demon
   King" deserves faces. */
const FIN_SAGES = [[16,80,26,'sagea'],[46,74,22,'sageb'],[114,74,22,'sagec'],[144,80,26,'saged']];
const FIN_ART = {
  hero: {                  /* dawn, the thing he killed, and him - not you */
    layers: [
      ['fl-push-far', g=>{ finSky(g, ['b','b','B','B','c','y','Y']); finSkyline(g, 62, 'd', 2); }],
      ['fl-spin',     g=>finRays(g, 80, 44, 16, 'Y', 56)],
      ['fl-push',     g=>{ finGround(g, 66, 'd', 'm');
        for(let i=0;i<9;i++) outBlob(g, 10+i*19, 70+((i*3)%6), 8, 3, 'D', i);
        outBlob(g, 112, 70, 22, 5, 'k', 3);                 /* what is left of it */
        for(let i=0;i<5;i++){ const x=104+i*6; for(let j=0;j<9;j++) if(g[70-j]) g[70-j][x]='K'; } }],
    ],
    sprites: [{id:'young', x:44, y:78, w:26, cls:'fs-breathe'}],
    life: [['mote', 12, 'lf-rise', [40, 88], [4, 8], 1.4]],

  crowd: {                                   /* a street, and everyone in it */
    layers: [
