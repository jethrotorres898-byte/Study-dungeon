.afftag.weak{background:rgba(143,216,58,.2);color:#cdf58e;border:1px solid rgba(143,216,58,.55);}
.afftag.resist{background:rgba(224,69,58,.18);color:#ffb2ab;border:1px solid rgba(224,69,58,.5);}
.cdtag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;
  background:rgba(120,130,160,.22);color:#b9c4dc;border:1px solid rgba(150,165,200,.4);}
.skillbtn.cooling{opacity:.5;}
.skillbtn.buff .stag{background:rgba(63,208,234,.25);color:#bff1ff;}
.buff-tag.spd.good{border-color:rgba(143,216,58,.5);color:#cdf58e;}
.buff-tag.spd.bad{border-color:rgba(224,69,58,.5);color:#ffb2ab;}
.buff-tag.charged{border-color:rgba(255,208,90,.65);color:#ffe9a8;
  box-shadow:0 0 10px rgba(255,208,90,.35) inset;}
.stun-tag{color:#a9ecff;font-weight:700;letter-spacing:.08em;
  text-shadow:0 0 12px rgba(63,208,234,.7);animation:stunPulse 1.1s ease-in-out infinite;}
@keyframes stunPulse{0%,100%{opacity:.72;}50%{opacity:1;}}
/* the ! over the enemy's shoulder */
.intel-btn{position:absolute;top:8px;right:8px;z-index:9;width:28px;height:28px;padding:0;
  border-radius:50%;cursor:pointer;font:700 15px/1 system-ui,sans-serif;
  background:rgba(24,20,34,.86);color:#ffd05a;border:2px solid rgba(255,208,90,.7);
  box-shadow:0 0 12px rgba(255,208,90,.3);animation:intelNudge 2.6s ease-in-out infinite;}
.intel-btn:hover,.intel-btn.on{background:#ffd05a;color:#1a1626;animation:none;}
@keyframes intelNudge{0%,88%,100%{transform:translateY(0);}92%{transform:translateY(-3px);}96%{transform:translateY(-1px);}}
.affchip.gear{background:rgba(174,184,201,.16);border-color:rgba(174,184,201,.5);color:#d6dcE8;}
.affchip.kit{background:rgba(255,208,90,.14);border-color:rgba(255,208,90,.45);color:#ffd05a;}
.affchip.kit.spent{opacity:.45;}
.intel-card{position:relative;z-index:2;margin:0 0 10px;
  background:rgba(14,12,22,.97);border:2px solid rgba(255,208,90,.45);border-radius:6px;
  padding:10px 14px 12px;box-shadow:0 10px 26px rgba(0,0,0,.5);
  font-size:11px;line-height:1.45;color:#d7d2e6;text-align:left;
  animation:intelIn .16s ease-out;}
@media (min-width:700px){
  .intel-card{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px;align-items:start;}
  .intel-head,.intel-name,.intel-note{grid-column:1 / -1;}
  .intel-foot,.intel-ability{grid-column:1 / -1;}
}
@keyframes intelIn{from{opacity:0;transform:translateY(-6px);}}
.intel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.intel-stage{font-size:9px;letter-spacing:.08em;color:#9b93b8;text-transform:uppercase;}
.intel-x{background:none;border:0;color:#9b93b8;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;}
.intel-x:hover{color:#fff;}
.intel-name{font-size:13px;font-weight:700;color:#ffe9a8;margin:4px 0 2px;}
.intel-fam{font-size:9px;letter-spacing:.08em;color:#9b93b8;margin-left:6px;text-transform:uppercase;}
.intel-note{color:#9b93b8;font-style:italic;margin-bottom:6px;}
.intel-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:6px 0;}
.intel-grid>div{display:flex;justify-content:space-between;gap:6px;}
.intel-k{color:#9b93b8;font-size:9px;letter-spacing:.07em;text-transform:uppercase;flex:0 0 auto;padding-top:2px;}
.intel-v{color:#efeaff;font-weight:700;}
.intel-row{display:flex;gap:8px;align-items:flex-start;margin-top:5px;}
.intel-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:1;}
.affchip{padding:1px 6px;border-radius:3px;font-size:9.5px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);white-space:nowrap;}
.affchip.weak{color:#cdf58e;border-color:rgba(143,216,58,.55);background:rgba(143,216,58,.12);}
.affchip.resist{color:#ffb2ab;border-color:rgba(224,69,58,.5);background:rgba(224,69,58,.1);}
.affchip.none{color:#7d7795;font-style:italic;}
.affchip.dot-frail{color:#cdf58e;border-color:rgba(143,216,58,.5);}
.affchip.dot-tough{color:#ffd9a0;border-color:rgba(255,160,60,.45);}
.affchip.dot-immune{color:#ffb2ab;border-color:rgba(224,69,58,.5);}
.intel-foot{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.1);color:#9b93b8;font-size:10px;}
.intel-foot b.good{color:#cdf58e;} .intel-foot b.bad{color:#ffb2ab;}
.intel-ability{margin-top:7px;padding:6px 8px;border-radius:4px;font-size:10px;
  background:rgba(255,208,90,.09);border:1px solid rgba(255,208,90,.25);color:#e8dcc0;}
/* a charged fist or a blessed mace throws light of its own */
.combatant.player .sprite-box.charged svg{filter:drop-shadow(0 10px 14px rgba(0,0,0,.6)) drop-shadow(0 0 9px var(--chg,#ffd05a));}
.hand-glow{position:absolute;width:26px;height:26px;border-radius:50%;pointer-events:none;z-index:4;
  transform:translate(-50%,-50%);mix-blend-mode:screen;
  animation:handPulse 1.5s ease-in-out infinite;}
.hand-glow.holy  {background:radial-gradient(circle,rgba(255,232,160,.95) 0 18%,rgba(255,208,90,.45) 46%,transparent 72%);}
.hand-glow.ember {background:radial-gradient(circle,rgba(255,214,150,.95) 0 18%,rgba(255,122,40,.5) 46%,transparent 72%);}
.hand-glow.arcane{background:radial-gradient(circle,rgba(214,251,255,.95) 0 18%,rgba(63,208,234,.5) 46%,transparent 72%);}
/* where the light actually sits: the mace head, the staff orb, the fists */
.hand-glow.c-cleric {left:74%;top:26%;width:30px;height:30px;}
.hand-glow.c-mage   {left:72%;top:24%;width:30px;height:30px;}
.hand-glow.c-brawler{left:64%;top:56%;width:24px;height:24px;}
.hand-glow.c-warrior{left:70%;top:34%;}
.hand-glow.c-rogue  {left:70%;top:56%;}
@keyframes handPulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.9);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.14);}}
/* the arithmetic behind a hit, spelled out on the button */
.bdline{display:block;margin-top:5px;font-size:9px;line-height:1.7;letter-spacing:.02em;
  color:#9b93b8;display:flex;flex-wrap:wrap;align-items:center;gap:3px;}
.bdbase{color:#c9c2e0;}
.bdop{opacity:.45;padding:0 1px;}
.bdpart{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);color:#d9d3ea;white-space:nowrap;}
.bdpart.good{background:rgba(143,216,58,.15);border-color:rgba(143,216,58,.45);color:#cdf58e;}
.bdpart.bad{background:rgba(224,69,58,.14);border-color:rgba(224,69,58,.45);color:#ffb2ab;}
/* --- evolution: it comes apart, hangs as light, and reassembles bigger --- */
.battle-scene.evo-dark .scene-bg,.battle-scene.evo-dark .scene-light,
.battle-scene.evo-dark .scene-haze{filter:brightness(.42) saturate(.5);transition:filter .3s;}
.combatant.monster .sprite-box.evo-break{animation:evoBreak .62s cubic-bezier(.4,0,.7,1) forwards;}
@keyframes evoBreak{
  0%  {filter:none;transform:scale(1);}
  30% {filter:brightness(2.4) saturate(0);transform:scale(1.04) translateY(-2px);}
  60% {filter:brightness(4) saturate(0);transform:scale(.9) translateY(4px);}
  100%{filter:brightness(9) saturate(0);transform:scale(.62) translateY(10px);opacity:.15;}}
.combatant.monster .sprite-box.evo-rise{animation:evoRise .76s cubic-bezier(.2,1.5,.4,1) forwards;}
@keyframes evoRise{
  0%  {filter:brightness(9) saturate(0);transform:scale(.6);opacity:.2;}
  35% {filter:brightness(3) saturate(.4);transform:scale(1.22);opacity:1;}
  70% {filter:brightness(1.3);transform:scale(.97);}
  100%{filter:none;transform:scale(1);}}
.evo-mote{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fff 0 35%,rgba(224,69,58,.9) 60%,transparent 78%);
  transform:translate(-50%,-50%);animation:evoMote .8s ease-in forwards;}
@keyframes evoMote{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  25%{opacity:1;}
  100%{opacity:0;transform:translate(calc(-50% + var(--mx,0px)),calc(-50% + var(--my,0px))) scale(1.5);}}
.rolebadge.role-evolved,.buff-tag.evolved{color:#ffb2ab;border-color:rgba(224,69,58,.6);
  background:rgba(224,69,58,.14);}
/* the faster thing announcing itself before you have answered anything */
.first-strike{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:14;
  display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;
  padding:10px 22px;border-radius:5px;text-align:center;
  background:rgba(12,8,16,.9);border:2px solid rgba(224,69,58,.75);
  box-shadow:0 0 34px rgba(224,69,58,.4), 0 10px 30px rgba(0,0,0,.6);
  animation:fsIn 1.7s cubic-bezier(.2,1.4,.4,1) forwards;}
.fs-lead{font-size:15px;font-weight:800;letter-spacing:.16em;color:#ff6a5a;
  text-shadow:0 0 14px rgba(224,69,58,.8);}
.fs-body{font-size:11px;letter-spacing:.05em;color:#ffd9d4;}
.fs-sub{font-size:9.5px;letter-spacing:.04em;color:#a89a9a;font-style:italic;}
@keyframes fsIn{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(.7);}
  12% {opacity:1;transform:translate(-50%,-50%) scale(1.06);}
  20% {transform:translate(-50%,-50%) scale(1);}
  80% {opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-56%) scale(.96);}}
@media (max-width:520px){ .first-strike{padding:8px 14px;} .fs-lead{font-size:12.5px;} }
.buff-tag.shatter{border-color:rgba(255,208,90,.55);color:#ffe9a8;background:rgba(255,208,90,.1);}
/* ---------------------- boss entrances ---------------------- */
.bossent{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden;}
/* letterbox, so it reads as a cut rather than a glitch */
.bossent::before,.bossent::after{content:'';position:absolute;left:0;right:0;height:11%;
  background:#05040a;z-index:3;animation:beBar .5s cubic-bezier(.3,0,.2,1) forwards;}
.bossent::before{top:0;} .bossent::after{bottom:0;}
@keyframes beBar{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.bossent::before{transform-origin:top;} .bossent::after{transform-origin:bottom;}
.be-cam{position:absolute;inset:0;}
/* nothing about the boss is on screen until it is */
.battle-scene.be-on .boss-bar-top,
.battle-scene.be-on .boss-ability,
.battle-scene.be-on .intel-btn,
.battle-scene.be-on .combatant.monster .namebar,
.battle-scene.be-on .combatant.monster .hpbar-wrap,
.battle-scene.be-on .combatant.monster .energy-row{opacity:0;transition:opacity .3s;}
/* the camera pushes in on the scene and the props ride with it */
.battle-scene.be-zoom .scene-bg,.battle-scene.be-zoom .scene-light,
.battle-scene.be-zoom .scene-haze,.battle-scene.be-zoom .be-cam{
  transform:scale(var(--bez,2));transform-origin:var(--bex,50%) var(--bey,78%);
  transition:transform 1s cubic-bezier(.3,0,.2,1);}
.battle-scene .scene-bg,.battle-scene .scene-light,.battle-scene .scene-haze,.battle-scene .be-cam{
  transition:transform .7s cubic-bezier(.3,0,.2,1);}
.battle-scene.be-dark .scene-bg,.battle-scene.be-dark .scene-light{filter:brightness(.4) saturate(.6);transition:filter .45s;}
.battle-scene.be-dark-deep .scene-bg,.battle-scene.be-dark-deep .scene-light{filter:brightness(.16) saturate(.3);transition:filter .6s;}
.combatant.monster .sprite-box.be-hidden{opacity:0;}
/* Coming up out of the floor. The box clips at ground level and the creature
   climbs through it - head, shoulders, then the rest - so you watch it arrive
   instead of watching it appear. */
.combatant.monster .sprite-box.be-digging{overflow:hidden;}
.combatant.monster .sprite-box.be-digging .sprite-flip{
  animation:beDig 2.1s cubic-bezier(.5,.05,.55,1) forwards;}
@keyframes beDig{
  0%  {transform:translateY(96%) scaleX(-1);}
  14% {transform:translateY(74%) scaleX(-1);}   /* the head clears */
  26% {transform:translateY(78%) scaleX(-1);}   /* and slips back */
  42% {transform:translateY(48%) scaleX(-1);}   /* shoulders */
  54% {transform:translateY(53%) scaleX(-1);}
  72% {transform:translateY(18%) scaleX(-1);}   /* it gets an arm down */
  84% {transform:translateY(22%) scaleX(-1);}
  100%{transform:translateY(0) scaleX(-1);}}
/* the disturbed floor it is coming through */
.be-mound{position:absolute;width:74px;height:16px;z-index:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(60,48,34,.95) 0 46%,rgba(30,24,16,.7) 70%,transparent 86%);
  animation:beMound .5s ease-out forwards;}
@keyframes beMound{from{opacity:0;transform:translate(-50%,-50%) scale(.3);}}
.be-dirt{position:absolute;width:4px;height:4px;z-index:3;background:#6b5a3e;
  transform:translate(-50%,-50%);animation:beDirt .85s cubic-bezier(.2,.7,.5,1) forwards;}
@keyframes beDirt{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(.5);}
  15% {opacity:1;}
  100%{opacity:0;transform:translate(calc(-50% + var(--mx,0px)),calc(-50% + var(--my,0px) + 26px)) scale(.7);}}
/* the other ways a thing can turn up */
.combatant.monster .sprite-box.be-drop{animation:beDrop .8s cubic-bezier(.5,0,.6,1) forwards;}
@keyframes beDrop{
  0%  {opacity:0;transform:translateY(-190px) scale(calc(var(--mscale,1)*1.15));}
  62% {opacity:1;transform:translateY(0) scale(calc(var(--mscale,1)*.94));}
  78% {transform:translateY(-14px) scale(calc(var(--mscale,1)*1.03));}
  100%{opacity:1;transform:translateY(0) scale(var(--mscale,1));}}
.combatant.monster .sprite-box.be-fade{animation:beFade 1.15s ease-out forwards;}
@keyframes beFade{
  0%  {opacity:0;filter:blur(7px) brightness(2.4);transform:scale(calc(var(--mscale,1)*1.3));}
  55% {opacity:.7;filter:blur(2px) brightness(1.5);}
  100%{opacity:1;filter:none;transform:scale(var(--mscale,1));}}
.combatant.monster .sprite-box.be-assemble{animation:beAssemble 1.05s steps(1,end) forwards;}
@keyframes beAssemble{
  0%  {opacity:0;transform:translateY(30px) scale(calc(var(--mscale,1)*.5));}
  22% {opacity:1;transform:translateY(18px) scale(calc(var(--mscale,1)*.68));}
  46% {transform:translateY(8px) scale(calc(var(--mscale,1)*.84));}
  70% {transform:translateY(0) scale(calc(var(--mscale,1)*1.06));filter:brightness(1.8);}
  100%{opacity:1;transform:translateY(0) scale(var(--mscale,1));filter:none;}}
.combatant.monster .sprite-box.be-arrive{animation:beArrive .9s cubic-bezier(.2,1.5,.35,1) forwards;}
@keyframes beArrive{
  0%  {opacity:0;transform:translateY(26px) scale(calc(var(--mscale,1)*.72));filter:brightness(3);}
  45% {opacity:1;filter:brightness(1.7);}
  70% {transform:translateY(0) scale(calc(var(--mscale,1)*1.07));}
  100%{opacity:1;transform:translateY(0) scale(var(--mscale,1));filter:none;}}
/* props */
.be-prop{position:absolute;transform:translate(-50%,-50%);z-index:2;
  width:64px;height:64px;pointer-events:none;}
.be-prop svg{width:100%;height:100%;image-rendering:pixelated;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.7));}
.be-prop.from-below{animation:bePropUp .7s cubic-bezier(.25,1.3,.4,1) forwards;}
@keyframes bePropUp{from{opacity:0;transform:translate(-50%,10%) scale(calc(var(--ps,2)*.5));}
  to{opacity:1;transform:translate(-50%,-50%) scale(var(--ps,2));}}
.be-prop.from-above{animation:bePropDown .7s cubic-bezier(.25,1.3,.4,1) forwards;}
@keyframes bePropDown{from{opacity:0;transform:translate(-50%,-160%) scale(calc(var(--ps,2)*.8));}
  to{opacity:1;transform:translate(-50%,-50%) scale(var(--ps,2));}}
.be-prop.from-side{animation:bePropSide .8s cubic-bezier(.3,.9,.3,1) forwards;}
@keyframes bePropSide{from{opacity:0;transform:translate(-190%,-50%) scale(var(--ps,2));}
  to{opacity:1;transform:translate(-50%,-50%) scale(var(--ps,2));}}
.be-prop.from-fade{animation:bePropFade .9s ease-out forwards;}
@keyframes bePropFade{from{opacity:0;transform:translate(-50%,-50%) scale(calc(var(--ps,2)*1.5));filter:blur(4px);}
  to{opacity:1;transform:translate(-50%,-50%) scale(var(--ps,2));filter:none;}}
/* floor cracks radiating from a point */
.be-crack{position:absolute;height:2px;width:var(--cw,9%);z-index:2;opacity:.75;
  transform-origin:0 50%;transform:translate(0,-50%) rotate(var(--cr,0deg)) scaleX(0);
  box-shadow:0 0 8px currentColor;animation:beCrack .42s ease-out forwards;}
@keyframes beCrack{to{transform:translate(0,-50%) rotate(var(--cr,0deg)) scaleX(1);}}
.be-mote{position:absolute;width:5px;height:5px;border-radius:50%;z-index:2;
  transform:translate(-50%,-50%);animation:beMote .8s ease-out forwards;}
@keyframes beMote{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  20%{opacity:1;}
  100%{opacity:0;transform:translate(calc(-50% + var(--mx,0px)),calc(-50% + var(--my,0px))) scale(.8);}}
.be-mote.inward{animation-name:beMoteIn;}
@keyframes beMoteIn{0%{opacity:0;transform:translate(calc(-50% + var(--mx,0px)),calc(-50% + var(--my,0px))) scale(.9);}
  25%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(.3);}}
.be-sweep{position:absolute;left:-30%;top:58%;width:60%;height:26%;z-index:2;
  filter:blur(3px);animation:beSweep .7s ease-in-out forwards;}
@keyframes beSweep{from{transform:translateX(0);}to{transform:translateX(230%);}}
.be-flash{position:absolute;inset:0;z-index:4;mix-blend-mode:screen;
  animation:beFlash .24s ease-out forwards;}
@keyframes beFlash{0%{opacity:0;}25%{opacity:.85;}100%{opacity:0;}}
/* the line at the top and the name card at the end */
.be-cue{position:absolute;left:50%;top:15.5%;transform:translateX(-50%);z-index:5;
  font-size:11px;letter-spacing:.09em;font-style:italic;color:var(--bec,#d7d2e6);
  text-shadow:0 2px 10px #000,0 0 16px rgba(0,0,0,.9);white-space:nowrap;
  animation:beCueIn .6s ease-out;}
@keyframes beCueIn{from{opacity:0;transform:translateX(-50%) translateY(-6px);}}
.be-title{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  padding:0 18px;animation:beTitle .7s cubic-bezier(.2,1.4,.4,1);}
.be-name{font-size:26px;font-weight:800;letter-spacing:.12em;color:var(--bec,#fff);
  text-shadow:0 0 26px var(--bec,#fff),0 4px 14px #000;}
.be-sub{font-size:10.5px;letter-spacing:.05em;color:#d7d2e6;max-width:340px;line-height:1.5;
  text-shadow:0 2px 8px #000;}
@keyframes beTitle{from{opacity:0;transform:translate(-50%,-50%) scale(.82);letter-spacing:.3em;}}
.be-out{animation:beOut .26s ease-in forwards !important;}
@keyframes beOut{to{opacity:0;}}
@media (max-width:520px){ .be-name{font-size:18px;} .be-cue{font-size:9.5px;} .be-sub{font-size:9.5px;} }
/* ---- a boss floor feels like one ---- */
.battle-scene.bossroom::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 58%, transparent 34%, var(--bossaura,rgba(224,69,58,.12)) 78%, rgba(4,3,8,.62) 100%);
  animation:bossBreathe 5.5s ease-in-out infinite;}
@keyframes bossBreathe{0%,100%{opacity:.75;}50%{opacity:1;}}
.battle-scene.bossroom .scene-light{filter:saturate(1.25) contrast(1.1);}
.battle-scene.bossroom .scene-haze{opacity:.9;}
/* embers/motes drifting through a boss room */
.bossmote{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;z-index:3;
  background:var(--bossaura,#e0453a);opacity:.55;animation:bossMote linear infinite;}
@keyframes bossMote{0%{transform:translateY(0) scale(.7);opacity:0;}
  15%{opacity:.6;} 85%{opacity:.4;}
  100%{transform:translateY(-120px) scale(1.1);opacity:0;}}
/* ---- the ultimate ---- */
.bu-meter{margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bu-mlabel{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#b9a8c4;}
.bu-meter.full .bu-mlabel{color:#ff8a7a;font-weight:800;
  text-shadow:0 0 12px rgba(224,69,58,.8);animation:buPulse 1s ease-in-out infinite;}
@keyframes buPulse{0%,100%{opacity:.75;}50%{opacity:1;}}
.bu-pips{display:flex;gap:4px;}
.bu-pips i{width:22px;height:5px;border-radius:2px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);transition:background .3s,box-shadow .3s;}
.bu-pips i.on{background:linear-gradient(90deg,#e0453a,#ff8a5a);border-color:rgba(255,138,90,.7);
  box-shadow:0 0 9px rgba(224,69,58,.7);}
.bu-meter.full .bu-pips i{background:linear-gradient(90deg,#ff5a3a,#ffd05a);
  box-shadow:0 0 13px rgba(255,138,60,.9);}
.battle-scene.bu-dark .scene-bg,.battle-scene.bu-dark .scene-light{filter:brightness(.3) saturate(.5);transition:filter .3s;}
.combatant.monster .sprite-box.bu-wind{animation:buWind 1.15s cubic-bezier(.4,0,.6,1);}
@keyframes buWind{
  0%  {transform:scale(var(--mscale,1));filter:none;}
  55% {transform:scale(calc(var(--mscale,1)*1.1)) translateX(10px);
       filter:brightness(2.1) drop-shadow(0 0 22px rgba(255,90,60,.95));}
  100%{transform:scale(calc(var(--mscale,1)*1.04));filter:brightness(1.4);}}
.bu-card{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:16;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:0 16px;
  pointer-events:none;animation:buCard .55s cubic-bezier(.2,1.5,.4,1);}
.bu-lead{font-size:9.5px;letter-spacing:.16em;color:#ff8a7a;text-transform:uppercase;
  text-shadow:0 0 12px rgba(224,69,58,.9),0 2px 8px #000;}
.bu-name{font-size:28px;font-weight:800;letter-spacing:.1em;color:#fff3e0;
  text-shadow:0 0 30px rgba(255,120,60,.95),0 4px 16px #000;}
.bu-line{font-size:10.5px;font-style:italic;color:#e0d4d0;max-width:330px;text-shadow:0 2px 8px #000;}
@keyframes buCard{from{opacity:0;transform:translate(-50%,-50%) scale(.75);letter-spacing:.34em;}}
@media (max-width:520px){ .bu-name{font-size:19px;} .bu-pips i{width:15px;} }
.fx{position:absolute;pointer-events:none;z-index:7;transform:translate(-50%,-50%);}
.fx.steel  {--fx1:#ffffff;--fx2:#c3d0e4;--fx3:rgba(200,220,255,.85);}
.fx.ember  {--fx1:#fff0c0;--fx2:#ff7a28;--fx3:rgba(255,122,40,.9);}
.fx.arcane {--fx1:#e6fbff;--fx2:#3fd0ea;--fx3:rgba(63,208,234,.9);}
.fx.holy   {--fx1:#fff8dc;--fx2:#ffd05a;--fx3:rgba(255,208,90,.9);}
.fx.venom  {--fx1:#eaffd0;--fx2:#8fd83a;--fx3:rgba(143,216,58,.9);}
.fx.frost  {--fx1:#eafcff;--fx2:#6fd0ec;--fx3:rgba(111,208,236,.9);}
.fx.shadow {--fx1:#e8dcff;--fx2:#9a6bff;--fx3:rgba(154,107,255,.9);}
.fx.blood  {--fx1:#ffd4d0;--fx2:#e0453a;--fx3:rgba(224,69,58,.9);}

/* --- a crescent sweeping through the target --- */
.fx-slash{width:112px;height:112px;filter:drop-shadow(0 0 10px var(--fx3));
  animation:fxSlash .34s cubic-bezier(.2,.7,.4,1) forwards;}
.fx-slash.big{width:158px;height:158px;}
.fx-slash svg{width:100%;height:100%;display:block;}
.fx-slash{color:var(--fx1);}
@keyframes fxSlash{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.35);}
  22%{opacity:1;}
  60%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.1);}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.4);}}

/* --- an impact spark where a fist or a bolt connects --- */
.fx-hit{width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle,var(--fx1) 0 18%,var(--fx2) 34%,transparent 70%);
  animation:fxHit .3s ease-out forwards;}
.fx-hit.big{width:96px;height:96px;}
@keyframes fxHit{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);}
  20%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7);}}

/* --- expanding shockwave rings --- */
.fx-ring{width:40px;height:40px;border-radius:50%;border:3px solid var(--fx2);
  box-shadow:0 0 18px var(--fx3), inset 0 0 12px var(--fx3);
  animation:fxRing .56s cubic-bezier(.15,.75,.3,1) forwards;}
.fx-ring.big{border-width:4px;}
@keyframes fxRing{0%{opacity:.95;transform:translate(-50%,-50%) scale(.2);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(4.6);}}

/* --- a column of light dropped onto the target --- */
.fx-beam{width:64px;height:300px;transform-origin:50% 100%;
  background:linear-gradient(180deg,transparent,var(--fx3) 22%,var(--fx1) 92%);
  filter:blur(1px) drop-shadow(0 0 16px var(--fx3));
  animation:fxBeam .5s ease-out forwards;}
.fx-beam.big{width:96px;}
/* the column an invocation stands in: narrow, behind the sprite, and never
   bright enough to swallow the person calling it down */
.fx-pillar{width:34px;height:132px;transform-origin:50% 100%;z-index:2;
  background:linear-gradient(180deg,transparent,var(--fx3) 55%,var(--fx1) 100%);
  opacity:.42;filter:blur(3px);
  animation:fxPillar .9s ease-out forwards;}
@keyframes fxPillar{0%{opacity:0;transform:translate(-50%,-100%) scaleY(.15);}
  22%{opacity:.5;transform:translate(-50%,-100%) scaleY(1);}
  70%{opacity:.42;}
  100%{opacity:0;transform:translate(-50%,-100%) scaleY(1.08) scaleX(1.3);}}
@keyframes fxBeam{0%{opacity:0;transform:translate(-50%,-100%) scaleY(.1);}
  18%{opacity:1;transform:translate(-50%,-100%) scaleY(1);}
  100%{opacity:0;transform:translate(-50%,-100%) scaleY(1) scaleX(1.5);}}

/* --- shards driven up out of the floor --- */
.fx-shard{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-bottom:34px solid var(--fx2);filter:drop-shadow(0 0 8px var(--fx3));
  transform-origin:50% 100%;animation:fxShard .46s cubic-bezier(.1,.9,.3,1) forwards;}
@keyframes fxShard{0%{opacity:0;transform:translate(-50%,-4%) scaleY(0);}
  30%{opacity:1;transform:translate(-50%,-100%) scaleY(1.1);}
  70%{opacity:1;transform:translate(-50%,-100%) scaleY(1);}
  100%{opacity:0;transform:translate(-50%,-120%) scaleY(1);}}

/* --- a heavy slam: the ground takes it --- */
.fx-quake{width:190px;height:34px;border-radius:50%;
  background:radial-gradient(ellipse,var(--fx1) 0 12%,var(--fx3) 40%,transparent 72%);
  animation:fxQuake .44s ease-out forwards;}
@keyframes fxQuake{0%{opacity:0;transform:translate(-50%,-50%) scale(.2,.4);}
  16%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9,1);}}

/* --- the projectile itself, shaped by its school --- */
.fx-orb{width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,var(--fx1),var(--fx2) 52%,transparent 78%);
  box-shadow:0 0 18px 6px var(--fx3);
  transition:transform var(--flyms,.32s) cubic-bezier(.35,0,.7,1), opacity .1s linear;}
.fx-orb.big{width:38px;height:38px;}
.fx-orb.trail::after{content:'';position:absolute;right:60%;top:50%;width:60px;height:5px;
  transform:translateY(-50%);border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--fx3));}

/* --- the ultimate: gather, then let go --------------------------------- */
.ult-charge{position:absolute;inset:0;z-index:8;pointer-events:none;}
.ult-charge .uc-dim{position:absolute;inset:0;background:rgba(3,2,8,.78);opacity:0;
  animation:ucDim .62s ease-out forwards;}
@keyframes ucDim{to{opacity:1;}}
.ult-charge.go .uc-dim{animation:ucUndim .34s ease-in forwards;}
@keyframes ucUndim{to{opacity:0;}}
.ult-mote{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--fx1);
  box-shadow:0 0 10px 3px var(--fx3);transform:translate(-50%,-50%);
  animation:ucMote var(--ms,.8s) cubic-bezier(.4,0,.3,1) forwards;}
@keyframes ucMote{0%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4);}
  20%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(.2);}}
.uc-aura{position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid var(--fx2);
  box-shadow:0 0 22px var(--fx3);transform:translate(-50%,-50%);
  animation:ucAura 1s cubic-bezier(.2,.8,.3,1) infinite;}
@keyframes ucAura{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6);}
  55%{opacity:.9;}100%{opacity:0;transform:translate(-50%,-50%) scale(.35);}}
.uc-pillar{position:absolute;width:96px;height:240px;transform:translate(-50%,-100%);
  background:linear-gradient(180deg,transparent,var(--fx3) 40%,var(--fx1));
  filter:blur(3px);opacity:0;animation:ucPillar .9s ease-out forwards;}
@keyframes ucPillar{0%{opacity:0;transform:translate(-50%,-100%) scaleY(.2) scaleX(.4);}
  70%{opacity:.85;transform:translate(-50%,-100%) scaleY(1) scaleX(1);}
  100%{opacity:.5;}}
.ult-title{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:9;
  font-family:var(--display,inherit);font-size:clamp(22px,4.6vw,46px);letter-spacing:.22em;
  color:#fff;text-shadow:0 0 22px var(--fx3),0 3px 0 rgba(0,0,0,.7);white-space:nowrap;
  animation:ucTitle 1.15s cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes ucTitle{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);letter-spacing:.5em;}
  26%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:.22em;}
  78%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08);}}
.ult-flashout{position:absolute;inset:0;z-index:9;background:#fff;opacity:0;
  animation:ucFlash .4s ease-out forwards;}
@keyframes ucFlash{0%{opacity:0;}10%{opacity:.92;}100%{opacity:0;}}
@media (prefers-reduced-motion:reduce){
  .fx,.ult-charge,.ult-title,.ult-flashout{animation-duration:.01s!important;}
}

<body>
<div class="cave-fx" aria-hidden="true"></div>
<div id="root"></div>
<script>
/* ============================== STORAGE ============================== */
const Storage = {
  async get(key, fallback){
    try{
      if(window.storage && typeof window.storage.get==='function'){
        const v = await window.storage.get('sdtest_'+key);
        return (v===undefined||v===null) ? fallback : v;
      }
    }catch(e){}
    try{
      const raw = localStorage.getItem('sdtest_'+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{
      if(window.storage && typeof window.storage.set==='function'){
        await window.storage.set('sdtest_'+key, value);
        return;
      }
    }catch(e){}
    try{ localStorage.setItem('sdtest_'+key, JSON.stringify(value)); }catch(e){}
  }
};

/* ============================== UTILS ============================== */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function randInt(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(pct){ return Math.random()*100 < pct; }
function weightedPick(items){ // items: [{v, w}]
  const total = items.reduce((s,i)=>s+i.w,0);
  let r = Math.random()*total;
  for(const it of items){ if(r<it.w) return it.v; r-=it.w; }
  return items[items.length-1].v;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wordCount(s){ return (String(s||'').trim().match(/\S+/g)||[]).length; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function playAnim(element, className, durationMs){
  return new Promise(resolve=>{
    if(!element){ resolve(); return; }
    element.classList.add(className);
    setTimeout(()=>{ element.classList.remove(className); resolve(); }, durationMs);
  });
}
function capitalize(s){ return String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normText(s){ return String(s||'').toLowerCase().trim().replace(/[.,!?;:'"()\-]/g,'').replace(/\s+/g,' '); }
function fuzzyMatch(input, correct){
  const a = normText(input), b = normText(correct);
  if(!a) return false;
  if(a===b) return true;
  const aw = new Set(a.split(' ').filter(w=>w.length>2));
  const bw = new Set(b.split(' ').filter(w=>w.length>2));
  if(bw.size===0) return a===b;
  let hit=0; bw.forEach(w=>{ if(aw.has(w)) hit++; });
  return hit/bw.size >= 0.7;
}

/* ============================== AI CALL (Claude API, user-supplied key) ============================== */
let API_KEY_CACHE = null;
async function getApiKey(){
  if(API_KEY_CACHE!==null) return API_KEY_CACHE;
  API_KEY_CACHE = await Storage.get('apiKey','');
  return API_KEY_CACHE;
}
async function setApiKey(k){ API_KEY_CACHE = k||''; await Storage.set('apiKey', API_KEY_CACHE); }
async function callClaude(userText, imageParts){
  const apiKey = await getApiKey();
  if(!apiKey) throw new Error('No API key set — add one in Study \u2192 AI Settings to enable live AI notes/flashcards. Using the offline generator instead.');
  try{
    const content = [];
    if(imageParts && imageParts.length){
      for(const img of imageParts){
        content.push({type:'image', source:{type:'base64', media_type:'image/png', data: img}});
      }
    }
    content.push({type:'text', text:userText});
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens:1400,
        messages:[{role:'user', content}]
      })
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('AI request failed ('+res.status+'): '+t.slice(0,200));
    }
    const data = await res.json();
    const blk = (data.content||[]).find(b=>b.type==='text');
    return blk ? blk.text : '';
  }catch(err){
    throw new Error('AI call error: '+(err && err.message ? err.message : String(err)));
  }
}

/* ============================== PDF EXTRACTION ============================== */
if(window.pdfjsLib){
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
}
async function extractPdfText(arrayBuffer, onProgress){
  const doc = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
    if(onProgress) onProgress(i, doc.numPages);
  }
  return {text, doc};
}
async function renderPdfPageToImage(doc, pageNum, scale){
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({scale: scale||1.3});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport}).promise;
  return canvas.toDataURL('image/png').split(',')[1];
}
function chunkWords(text, wordsPerChunk){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const chunks = [];
  for(let i=0;i<words.length;i+=wordsPerChunk){
    chunks.push(words.slice(i,i+wordsPerChunk).join(' '));
  }
  return chunks.length ? chunks : [''];
}

/* ============================== LOCAL (OFFLINE) STUDY ANALYZER ============================== */
const STOPWORDS = new Set('a an the of to in on for and or but is are was were be been being this that these those it its as at by with from not no yes you your i we our they their he she his her them can will would should could may might into out about over under above below than then so such very more most also just only than'.split(' '));
function splitSentences(text){
  return String(text||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z0-9])/).map(s=>s.trim()).filter(s=>s.length>0);
}
function localAnalyze(text){
  const sentences = splitSentences(text).filter(s=>{ const wc=wordCount(s); return wc>=4 && wc<=42; });
  const freq = {};
  sentences.forEach(s=>{
    s.toLowerCase().match(/[a-z0-9']+/g)?.forEach(w=>{ if(!STOPWORDS.has(w) && w.length>2) freq[w]=(freq[w]||0)+1; });
  });
  const scored = sentences.map((s,idx)=>{
    const words = s.toLowerCase().match(/[a-z0-9']+/g)||[];
    const score = words.reduce((sum,w)=>sum+(freq[w]||0),0) / Math.max(1,words.length);
    return {s, idx, score};
  });
  const topN = clamp(Math.round(sentences.length*0.4), 4, 18);
  const top = scored.slice().sort((a,b)=>b.score-a.score).slice(0,topN).sort((a,b)=>a.idx-b.idx);
  const notes = top.length ? top.map(t=>'• '+t.s).join('\n') : (text||'').slice(0,600);

  // term:definition pattern flashcards
  const flashcards = [];
  const lines = String(text||'').split(/\n+/);
  lines.forEach(line=>{
    const m = line.match(/^\s*([A-Z][A-Za-z0-9 '\-]{2,40})\s*[:\-–]\s*(.{6,160})$/);
    if(m && flashcards.length<20){ flashcards.push({id:uid(), front:'Define/explain: '+m[1].trim(), back:m[2].trim(), mastery:0, dueAt:0}); }
  });
  // cloze-deletion fallback from top sentences
  if(flashcards.length<6){
    top.forEach(t=>{
      if(flashcards.length>=16) return;
      const words = t.s.match(/[A-Za-z][A-Za-z0-9'\-]{3,}/g)||[];
      if(!words.length) return;
      const candidates = words.filter(w=>!STOPWORDS.has(w.toLowerCase()));
      if(!candidates.length) return;
      const target = candidates.reduce((a,b)=> b.length>a.length?b:a);
      const re = new RegExp('\\b'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
      if(!re.test(t.s)) return;
      const blanked = t.s.replace(re, '_____');
      flashcards.push({id:uid(), front:'Fill in the blank: '+blanked, back:target, mastery:0, dueAt:0});
    });
  }
  return {notes, flashcards};
}

/* ============================== GAME DATA: CLASSES / SKILLS ============================== */
const SKILLS = {
  /* --- Warrior: slow, heavy, and the only one who can stop a turn dead --- */
  warrior_slash:     {id:'warrior_slash',     name:'Slash',             cost:0, mult:1.0, type:'physical', desc:'A clean sword stroke.'},
  warrior_bash:      {id:'warrior_bash',      name:'Shield Bash',       cost:2, mult:1.5, type:'physical', stunTurns:1, shieldPct:0.4, desc:'Slam with the shield — STUNS for 1 turn and cuts the next enemy hit by 40%.'},
  warrior_cleave:    {id:'warrior_cleave',    name:'Cleave',            cost:3, mult:1.9, type:'physical', dot:{type:'bleed', turns:3, pct:0.10}, desc:'A deep cut — applies a bleed stack.'},

  warrior_guardian:  {id:'warrior_guardian',  name:"Guardian's Wrath",  cost:5, mult:2.4, type:'holy', shieldPct:0.6, stunTurns:1, ultimate:true, desc:'ULTIMATE — a holy shielding blow; STUNS, and the next enemy hit is cut by 60%.'},
  /* --- Mage: a buff, a paralysing bolt, and fire --- */
  mage_strike:       {id:'mage_strike',       name:'Staff Strike',      cost:0, mult:1.0, type:'physical', desc:'A cracking blow from the staff.'},
  mage_focus:        {id:'mage_focus',        name:'Arcane Focus',      cost:2, mult:0,   type:'lightning', noDamage:true, cooldown:5,
                      buffSelf:{stat:'atkPct', amount:0.35, turns:5, name:'Arcane Focus', glow:'arcane'},
                      desc:'BUFF — +35% Attack for 5 turns — long enough to carry an ultimate. 5-turn cooldown.'},
  mage_lightning:    {id:'mage_lightning',    name:'Lightning Strike',  cost:3, mult:1.8, type:'lightning', paralyzePct:20, desc:'A forked bolt — 20% chance to PARALYSE for a turn.'},
  mage_fireball:     {id:'mage_fireball',     name:'Fireball',          cost:5, mult:3.0, type:'fire', dot:{type:'fire', turns:3, pct:0.15}, ultimate:true, desc:'ULTIMATE — a burst of fire that leaves it burning for 3 turns.'},
  mage_meteor:       {id:'mage_meteor',       name:'Meteor',            cost:5, mult:3.2, type:'fire', dot:{type:'fire', turns:3, pct:0.18}, ultimate:true, desc:'ULTIMATE — a falling rock that sets the whole floor alight.'},
  mage_arcaneblade:  {id:'mage_arcaneblade',  name:'Arcane Blade',      cost:5, mult:2.7, type:'lightning', paralyzePct:35, energyRefundOnCrit:2, ultimate:true, desc:'ULTIMATE — a spell-forged blade; 35% PARALYSE, and crits refund energy.'},
  /* --- Rogue: stack the rot, then cash it in --- */
  rogue_stab:        {id:'rogue_stab',        name:'Quick Stab',        cost:0, mult:1.0, type:'physical', desc:'A fast, low blow.'},
  rogue_poison:      {id:'rogue_poison',      name:'Poisoned Blade',    cost:2, mult:1.3, type:'poison', dot:{type:'poison', turns:3, pct:0.10}, desc:'Coats the wound — applies a poison stack (3 turns).'},

function currentSkillSet(){
  const ch = App.character;
  const prog = classProg();
  const cs = CLASS_SKILLS[ch.classId];
  let ult = cs.ult;
  if(prog.evolution==='A' && prog.allocated[ch.classId+'_t3_A']) ult = cs.ultA;
  if(prog.evolution==='B' && prog.allocated[ch.classId+'_t3_B']) ult = cs.ultB;
  const list = [SKILLS[cs.basic], SKILLS[cs.two], SKILLS[cs.three], SKILLS[ult]];
  Object.keys(ch.learnedSkills||{}).forEach(id=>{
    const s = SKILLS[id];
    if(s && (!s.classes || s.classes.indexOf(ch.classId)>=0)) list.push(s);
  });
  return list;
}

   with a different name; gauntlets are the piece that actually matters to a
   character who swings something. Boots carry the Speed, which is what decides
   who moves first, and they carry armour with it - a heavy pair is still a
   real trade against a light one. */
const ARMOR_SLOTS = ['head','chest','gloves','boots'];
const ARMOR_NAME_PREFIX = {common:'Tattered', rare:'Iron', epic:'Runic', legendary:'Celestial'};

function buildWeaponCatalog(){
  const list = [];
  Object.keys(WEAPON_NAME_LINES).forEach(classId=>{
    WEAPON_NAME_LINES[classId].forEach((name,i)=>{
      const rarity = RARITY_ORDER[i];
      const mult = RARITY_MULT[rarity];
      const wt = weaponTypeFor(classId);
      const pas = rarity === 'legendary' ? WEAPON_PASSIVES[classId] : null;
      list.push({
        lineId:'w_'+classId+'_'+rarity, kind:'weapon', classId, rarity, name, wtype: wt.id,
        atk: Math.round(6*mult), critBonus: RARITY_BONUS[rarity].crit, lifeBonus: RARITY_BONUS[rarity].life,
        passive: pas ? pas.id : null,
        floorMin: RARITY_FLOOR_MIN[rarity],
        desc: `${wt.name}. Only a ${CLASSES[classId].name} can hold it. +${Math.round(6*mult)} Attack${RARITY_BONUS[rarity].crit?`, +${RARITY_BONUS[rarity].crit}% Crit`:''}${RARITY_BONUS[rarity].life?`, +${RARITY_BONUS[rarity].life}% Lifesteal`:''}.${pas?` ${pas.name}: ${pas.desc}`:''}`,
      });
    });
  });
  return list;
}

    RARITY_ORDER.forEach(rarity=>{
      const mult = RARITY_MULT[rarity];
      const name = ARMOR_NAME_PREFIX[rarity]+' '+ARMOR_SLOT_LABEL[slot];
      const def = Math.max(1, Math.round(4*mult*ARMOR_SLOT_DEF[slot]));
      const spd = Math.round(2*mult*ARMOR_SLOT_SPD[slot]);
      list.push({
        lineId:'a_'+slot+'_'+rarity, kind:'armor', slot, rarity, name,
        def, spd, pierceResist: RARITY_BONUS[rarity].pierce,
        floorMin: RARITY_FLOOR_MIN[rarity],
        desc: `${capitalize(slot)} armor. +${def} Defense${spd?`, +${spd} Speed`:''}.`,
      });
    });
  });
  return list;
}

/* ======================= DAMAGE TYPES, WEAKNESS, SPEED =======================
   Every skill deals one type of damage, and every creature has things that hurt
   it and things it shrugs off. Hit a weakness and the blow lands for half again
   as much; hit a resistance and it lands for half. That is the whole rule - a
   fireball into something that only fears lightning does ordinary damage, no
   more and no less.

   Speed decides who swings first. If the thing across the room is faster than
   you, it opens the fight before you have answered a single question.
   ========================================================================== */
const DMG_TYPES = {
  physical: {label:'Physical',  icon:'⚔', hue:'steel'},
  holy:     {label:'Holy',      icon:'✦', hue:'holy'},
  fire:     {label:'Fire',      icon:'🔥', hue:'ember'},
  lightning:{label:'Lightning', icon:'⚡', hue:'arcane'},
  frost:    {label:'Frost',     icon:'❄', hue:'frost'},
  poison:   {label:'Poison',    icon:'☠', hue:'venom'},
  bleed:    {label:'Bleed',     icon:'🩸', hue:'blood'},
  shadow:   {label:'Shadow',    icon:'☾', hue:'shadow'},
};
const WEAK_MULT = 1.5, RESIST_MULT = 0.5;
/* Aureate Judgment: the cleric's legendary is specifically an anti-undead
   weapon, so holy against the undead stops being merely effective. */
function weakMultFor(type, m){
  return (type === 'holy' && m && m.family === 'Undead' && hasWeaponPassive('aureate')) ? 2 : WEAK_MULT;
}
function dmgType(id){ return DMG_TYPES[id] || DMG_TYPES.physical; }

/* How much a rotting wound takes hold. Some things have no blood to poison. */
const DOT_GRIP = {frail:1.5, normal:1.0, tough:0.5, immune:0};
const DOT_LABEL = {frail:'Frail to poison & bleed', normal:'Normal to poison & bleed',
                   tough:'Shrugs off poison & bleed', immune:'Immune to poison & bleed'};

/* What a body is made of decides most of this, so the archetype carries the
   defaults and a species only overrides what makes it its own thing. */
const MONSTER_FAMILY = {
  skeleton: {family:'Undead',    weak:['holy'],              resist:['poison','bleed'],          dot:'tough'},
  wraith:   {family:'Undead',    weak:['holy'],              resist:['physical','poison','bleed'], dot:'immune'},
  leech:    {family:'Vermin',    weak:['fire','holy'],       resist:['frost'],                   dot:'frail'},
  imp:      {family:'Demon',     weak:['holy','frost'],      resist:['fire','shadow'],           dot:'normal'},
  wisp:     {family:'Spirit',    weak:['lightning'],         resist:['physical','frost'],        dot:'tough'},
  stalker:  {family:'Beast',     weak:['fire','bleed'],      resist:['poison'],                  dot:'frail'},
  automaton:{family:'Construct', weak:['lightning'],         resist:['poison','bleed','shadow'], dot:'immune'},
  harpy:    {family:'Beast',     weak:['lightning','bleed'], resist:[],                          dot:'frail'},
  hound:    {family:'Beast',     weak:['frost','bleed'],     resist:['fire'],                    dot:'normal'},
  cultist:  {family:'Human',     weak:['holy','bleed'],      resist:['shadow'],                  dot:'frail'},
};
const FAMILY_FALLBACK = {family:'Aberration', weak:['holy'], resist:[], dot:'normal'};
function familyFor(arche){ return MONSTER_FAMILY[arche] || FAMILY_FALLBACK; }
/* A species inherits its body, then says what is different about it. */
function traitsFor(sp, arche){
  const base = familyFor(arche || (sp && sp.arche));
  return {
    family: (sp && sp.family) || base.family,
    weak:   (sp && sp.weak)   || base.weak,
    resist: (sp && sp.resist) || base.resist,
    dot:    (sp && sp.dot)    || base.dot,
  };
}
/* -1 resisted, 0 plain, +1 weak. A type listed on both sides cancels out. */
function affinity(monster, type){
  if(!monster || !type) return 0;
  const w = (monster.weak||[]).indexOf(type) >= 0;
  const r = (monster.resist||[]).indexOf(type) >= 0;
  if(w && r) return 0;
  return w ? 1 : (r ? -1 : 0);
}
function affinityMult(monster, type){
  const a = affinity(monster, type);
  return a > 0 ? WEAK_MULT : (a < 0 ? RESIST_MULT : 1);
}
function affinityWord(a){ return a > 0 ? 'WEAK' : (a < 0 ? 'RESIST' : ''); }

/* ------------------------------- SPEED -------------------------------
   Rogue first, brawler behind it, then the casters, and the warrior last -
   he is carrying most of a forge on his back. Boots are the only gear that
   moves it. Monsters take theirs from their role: a swarm skitters, a plated
   thing does not. */
const MONSTER_ROLE_SPD = {swift:1.45, swarm:1.32, grunt:1.0, caster:0.94, brute:0.80, armored:0.70};
function monsterSpeedForFloor(floor, roleId, boss){
  const base = 9 + floor*0.055;
  const r = MONSTER_ROLE_SPD[roleId] != null ? MONSTER_ROLE_SPD[roleId] : 1;
  return Math.max(1, Math.round(base * (boss ? 1.12 : r)));
}
function playerSpeed(){ return combatStats().spd; }
/* Positive means you are the faster one. */
function speedEdge(){
  const m = App.run && App.run.monster;
  if(!m) return 0;
  return playerSpeed() - (m.spd || 0);
}

function monsterStatsForFloor(floor, ngPlus){
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const ngMult = 1 + (ngPlus||0)*0.5;
  let hp = (30 + floor*7) * ngMult, atk = (4 + floor*1.15) * ngMult, def = (1 + floor*0.35) * ngMult;
  if(boss){ hp*=2.8; atk*=1.7; def*=1.5; }

/* ========================= WHAT THE DEPTHS LEARN =========================
   A floor-90 grunt used to be a floor-3 grunt with bigger numbers, which is
   the one thing a hundred-floor dungeon cannot afford: the fight stops being
   a fight and becomes arithmetic. So the things down there do what the player
   does. They put armour on, and they stop only swinging.

   Two curves, both driven by depth alone so it is legible from the floor
   number: GEAR is how many pieces it is wearing, and CUNNING is how often it
   spends a turn on something cleverer than a hit - and, separately, how well
   it picks. A shallow monster that rolls a skill picks at random. A deep one
   reads the board first: it mends when it is dying, it braces when you are
   buffed, and it drains your Energy precisely when you have been saving it
   for an ultimate. That last one is the whole idea - it has watched people
   get stronger and it knows what they are saving for.
   ====================================================================== */
const MON_GEAR_FLOOR = 18;      /* nothing wears armour above this */
const MON_SKILL_FLOOR = 12;     /* nothing has a kit above this */

function monsterGearCount(floor, boss, elite){
  if(floor < MON_GEAR_FLOOR) return 0;
  let n = 1 + Math.floor((floor - MON_GEAR_FLOOR) / 22);   /* a piece every 22 floors */
  if(boss) n += 1;
  else if(elite) n += 1;
  return clamp(n, 0, 4);
}
/* 0 at the skill floor, and never a coin flip: a monster that acts half the
   time stops being a fight and becomes a slot machine. */
function monsterCunning(floor, boss){
  if(floor < MON_SKILL_FLOOR) return 0;
  const t = (floor - MON_SKILL_FLOOR) / (MAX_FLOOR - MON_SKILL_FLOOR);
  return clamp(0.14 + t * 0.26 + (boss ? 0.1 : 0), 0, 0.5);
}
/* How well it picks once it has decided to act. Same curve, different job. */
function monsterWits(floor, boss){
  if(floor < MON_SKILL_FLOOR) return 0;
  const t = (floor - MON_SKILL_FLOOR) / (MAX_FLOOR - MON_SKILL_FLOOR);
  return clamp(0.2 + t * 0.75 + (boss ? 0.15 : 0), 0, 1);
}

/* Who knows what. Brutes wind up, casters pick you apart, swarms bleed you,

const MON_KIT_BY_ROLE = {

function monsterKitFor(role, boss, count){
  const base = (MON_KIT_BY_ROLE[role] || MON_KIT_BY_ROLE.grunt).slice();
  if(boss) base.unshift('mend', 'disrupt');
  const out = [];
  base.forEach(id=>{ if(out.indexOf(id) < 0 && out.length < count) out.push(id); });
  return out;
}

/* Does it act this turn, and with what. */
/* The generic tells are written for things with teeth. He is a man in a coat
   who has been alone for a thousand years and is enjoying himself. */
const FINAL_TELL = {
  brace:   'he does not trouble himself to move',
  rally:   'he smiles, and it reaches his eye',
  mend:    'the wound simply decides not to have happened',
  disrupt: 'he takes it from you, and looks apologetic',
  sunder:  'he taps your guard aside like a held door',
  rend:    'he opens you up without hurrying',
  crush:   'he stops being polite',
};
function skillTell(m, id, s){ return (m.isFinal && FINAL_TELL[id]) || s.tell; }
function monsterChooseSkill(){
  const m = App.run.monster;
  if(!m || !m.kit || !m.kit.length) return null;
  if((m.skillCd||0) > 0) return null;
  if(Math.random() >= (m.cunning||0)) return null;
  const st = combatStats();
  const live = m.kit.map(id=>({id, s:MON_SKILLS[id]})).filter(o=>o.s && o.s.ok(m, st));
  if(!live.length) return null;
  /* wits decides whether it reads the board or just picks something */
  if(Math.random() < (m.wits||0)){
    live.sort((a,b)=>b.s.score(m, st) - a.s.score(m, st));
    return live[0];
  }
  return live[Math.floor(Math.random()*live.length)];
}

/* ======================= WHAT SOMETIMES HAPPENS =======================
   By floor thirty the shape of a floor is known: pick a difficulty, answer,
   swing, get swung at. Knowing the shape is fine - it is the game - but a run
   that is ninety floors of exactly that has nothing to tell you about
   afterwards. So two things are allowed to happen that usually do not.

   An OMEN lands on the floor itself and changes the rules of it for as long
   as you are standing there. A NEMESIS is not a rule change; it is a specific
   monster that should not be there, wearing everything and knowing everything,
   and it is worth what it costs you.

   Both are rare on purpose. An event that fires every third floor is a
   mechanic; one that fires every eleventh is a story.
   ==================================================================== */
const OMEN_MIN_FLOOR = 31;          /* nothing before here                 */
const OMEN_DEEP_FLOOR = 61;         /* the stranger half of the pool        */
const OMEN_CHANCE = 9;              /* per cent, mid floors                 */
const OMEN_CHANCE_DEEP = 13;        /* per cent, deep floors                */
const NEMESIS_MIN_FLOOR = 56;
const NEMESIS_CHANCE = 4;

const OMENS = {

function omenPoolFor(floor){
  return Object.keys(OMENS).filter(id=>floor >= OMENS[id].min);
}
function rollOmen(floor){
  if(floor < OMEN_MIN_FLOOR) return null;
  if(App.run.gauntlet || App.run.dwarf) return null;
  if(!chance(floor >= OMEN_DEEP_FLOOR ? OMEN_CHANCE_DEEP : OMEN_CHANCE)) return null;
  const pool = omenPoolFor(floor);
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
function omen(){ return App.run && App.run.omen ? OMENS[App.run.omen] : null; }
function omenIs(id){ return App.run && App.run.omen === id; }

/* Titles for the thing that should not be on this floor. */
const NEMESIS_TITLES = ['the Unbroken','the Gravemaker','the Long Hunger','the Hollow Crown',
  'the Last Word','the Sundering','the Patient','the Nine Wounds','the Quiet Ruin','the Undimmed'];
function nemesisTitleFor(floor){ return NEMESIS_TITLES[floor % NEMESIS_TITLES.length]; }
function generateMonster(floor, ngPlus){
  const region = regionForFloor(floor);
  const rd = REGIONS[region-1];
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const bd = boss ? bossDefForFloor(floor) : null;
  const sp = boss ? null : speciesForFloor(floor);
  const role = sp ? (MONSTER_ROLES[sp.role] || MONSTER_ROLES.grunt) : null;
  const elite = !boss && isEliteFloor(floor);
  const s = monsterStatsForFloor(floor, ngPlus);
  let hp = s.hp, atk = s.atk, def = s.def, eMax = monsterEnergyMaxForFloor(floor);
  if(role){
    hp  = Math.max(1, Math.round(hp  * role.hp));
    atk = Math.max(1, Math.round(atk * role.atk));
    def = Math.max(0, Math.round(def * role.def));
    eMax = clamp(eMax + role.energy, 2, 5);
  }
  if(elite){ hp = Math.round(hp*1.4); atk = Math.round(atk*1.2); def = Math.round(def*1.15); }
  /* Once in a while the floor fields something that has no business on it. */
  const nemesis = !boss && floor >= NEMESIS_MIN_FLOOR && chance(NEMESIS_CHANCE);
  if(nemesis){ hp = Math.round(hp*2.3); atk = Math.round(atk*1.3); def = Math.round(def*1.2); }
  /* Armour, worn rather than granted: each piece is a real stat and a real
     band of steel on the sprite, so a plated thing looks plated. The one thing
     down here that does not wear any is the last one - a primordial demon who
     moves the tower at will does not go looting breastplates, and the banding
     was painting him in somebody else's steel. He carries the same numbers in
     his own body instead, so the intel panel stays honest either way. */
  const gear = final ? [] : MON_GEAR.slice(0, nemesis ? 4 : monsterGearCount(floor, boss, elite));
  if(final){
    hp  = Math.round(hp  * 1.12);
    atk = Math.round(atk * 1.14);
    def = Math.round(def * 1.80);
  }
  gear.forEach(p=>{
    if(p.hp)  hp  = Math.round(hp  * (1 + p.hp));
    if(p.atk) atk = Math.round(atk * (1 + p.atk));
    if(p.def) def = Math.round(def * (1 + p.def));
  });
  const prefix = elite ? ELITE_PREFIX[floor % ELITE_PREFIX.length] + ' ' : '';
  const name = bd ? bd.name : prefix + sp.name;
  const arche = bd ? bd.sprite : sp.arche;
  /* what hurts it, what it shrugs off, and how fast it is */
  const tr = bd ? traitsFor(bd, rd.arche) : traitsFor(sp, sp.arche);
  const band = bandForFloor(floor);
  let spd = monsterSpeedForFloor(floor, sp ? sp.role : null, boss);
  gear.forEach(p=>{ if(p.spd) spd = Math.round(spd * (1 + p.spd)); });
  if(final) spd = Math.round(spd * 1.16);
  const cunning = nemesis ? Math.min(0.62, monsterCunning(floor, boss) + 0.15) : monsterCunning(floor, boss);
  const kit = cunning > 0 ? monsterKitFor(sp ? sp.role : 'brute', boss, nemesis ? 5 : (boss ? 4 : 2 + (elite?1:0))) : [];
  return {name: nemesis ? (name + ', ' + nemesisTitleFor(floor)) : name,
    hp, maxHp:hp, atk, def, spd,
    gear: gear.map(p=>p.id), cunning, wits: nemesis ? 1 : monsterWits(floor, boss), kit,
    skillCd:0, braced:0, mended:false, nemesis, phase:1,
    family:tr.family, weak:tr.weak, resist:tr.resist, dot:tr.dot,
    region, regionName:rd.name,
    color: final?'#8dff9f':rd.color, arche, palKey: bd ? bd.pal : null,
    tint: sp ? sp.tint : null, speciesId: sp ? sp.id : null,
    role: sp ? sp.role : null, roleLabel: role ? role.label : null, roleNote: role ? role.note : null,
    elite: !!elite, bossFloor: boss ? floor : null,
    bandName: band.name,
    abilityName: bd ? bd.abilityName : null, abilityDesc: bd ? bd.abilityDesc : null,
    isBoss:boss, isFinal:final, energy:0, energyMax:eMax};
}

/* ---- ability hooks ---- */
function bossAbility(){
  const m = App.run.monster;
  if(m && m.gauntletAbility) return m.gauntletAbility;
  if(!m || !m.isBoss) return null;
  const d = bossDefForFloor(m.bossFloor || m.floor);
  return d ? d.ability : null;
}
function bossModifyIncomingDamage(dmg, isSkill){
  const ab = bossAbility();
  if(ab==='heroOfOld') return Math.max(1, Math.round(dmg*0.5));
  if(ab==='boneArmor' && (App.run.bossTurn||0) % 2 === 0) return Math.max(1, Math.round(dmg*0.55));
  if(ab==='stoneskin') return Math.max(1, Math.round(dmg*(isSkill?1.6:1)) - (isSkill?0:8));
  return dmg;
}
function bossAfterPlayerHit(dmg){
  const ab = bossAbility();
  const st = combatStats();
  if(ab==='moltenCore'){
    const back = Math.max(1, Math.round(dmg*0.2));
    App.run.hp = clamp(App.run.hp - back, 0, st.maxHp);
    return {reflect:back};
  }
  return {};
}
function bossUnbound(){
  const m = App.run.monster;
  return bossAbility()==='devour' && m && m.hp/m.maxHp < 0.5;
}
function bossModifyOutgoingDamage(dmg, charged){
  const ab = bossAbility();
  const m = App.run.monster;
  let hits = 1, notes = [];
  if(ab==='devour' && bossUnbound()){ dmg = Math.round(dmg*1.45); notes.push('Unbound!'); }
  if(ab==='stormcall' && charged){ hits = 2; notes.push('Stormcall — twice!'); }
  if(ab==='heroOfOld' && charged){ hits = 2; notes.push('Twin axes!'); }
  if(ab==='darkRitual'){ dmg = Math.round(dmg * (1 + 0.08*(App.run.bossTurn||0))); }
  if(ab==='infernalBreath' && m && m.hp/m.maxHp < 0.3){ dmg = Math.round(dmg*1.5); notes.push('Enraged!'); }
  return {dmg, hits, notes};
}
function bossAfterMonsterHit(totalDamage, charged){
  const ab = bossAbility();
  const m = App.run.monster;
  const notes = [];
  if(ab==='soulHarvest' && m){
    const heal = Math.max(1, Math.round(totalDamage*0.3));
    m.hp = clamp(m.hp + heal, 0, m.maxHp);
    notes.push('+'+heal+' drained');
  }
  if(ab==='venom'){ App.run.poison = {turnsLeft:2, perTurn: Math.max(2, Math.round(totalDamage*0.25))}; notes.push('Poisoned!'); }
  if(ab==='deepFreeze' && charged){ App.run.frozen = true; notes.push('Frozen!'); }
  if(ab==='infernalBreath' && charged){ App.run.playerBurn = {turnsLeft:3, perTurn: Math.max(3, Math.round(totalDamage*0.2))}; notes.push('Burning!'); }
  if(ab==='devour' && bossUnbound() && charged){ App.run.playerBurn = {turnsLeft:2, perTurn: Math.max(3, Math.round(totalDamage*0.18))}; notes.push('Seared!'); }
  return notes;
}
function bossTurnTick(){
  const ab = bossAbility();
  App.run.bossTurn = (App.run.bossTurn||0) + 1;
  if(ab==='devour' && App.run.bossTurn % 3 === 0){
    const m = App.run.monster;
    const heal = Math.max(5, Math.round(m.maxHp*0.05));
    m.hp = clamp(m.hp + heal, 0, m.maxHp);
    App.run.hintsSealed = true;
    return 'Malakor takes the floor back — +'+heal+' HP, and the tower stops helping you!';
  }
  if(ab==='heroOfOld'){
    const m = App.run.monster;
    if(m && m.hp/m.maxHp < 0.5 && !App.run.dwarfHealed){
      App.run.dwarfHealed = true;
      const heal = Math.round(m.maxHp*0.25);
      m.hp = clamp(m.hp + heal, 0, m.maxHp);
      return 'Durin drains a draught — +'+heal+' HP!';
    }
  }
  if(ab==='constrict' && App.run.bossTurn % 3 === 0){
    App.run.energy = Math.max(0, App.run.energy - 2);
    return 'Constricted — 2 Energy drained!';
  }
  return null;
}

/* Recipes eat far more iron than anything else, so the commons are weighted by
   what the forge actually asks for, and stacks grow with depth so late recipes
   stay reachable. Signature materials only come from the family that carries them. */
const COMMON_MAT_WEIGHTS = [{v:'iron',w:38},{v:'leather',w:23},{v:'cloth',w:21},{v:'wood',w:18}];
function pickCommonMat(){ return weightedPick(COMMON_MAT_WEIGHTS); }
function matDepthBonus(floor){ return clamp(Math.floor((floor||1)/25), 0, 3); }
function pickMaterialId(floor){
  if(chance(68)) return pickCommonMat();
  const reach = clamp(regionForFloor(floor||1), 1, REGIONS.length);
  const sigs = REGIONS.slice(0, reach).map(r=>MONSTER_MATERIALS[r.arche]).filter(Boolean);
  return sigs.length ? pick(sigs) : pickCommonMat();
}
function rollMaterialDrops(floor, arche, boss){
  const drops = {};
  const depth = matDepthBonus(floor);
  const sig = MONSTER_MATERIALS[arche];
  if(sig && chance(boss?95:58)) drops[sig] = randInt(1, boss?4:2) + depth;
  const picks = (boss?3:1) + (chance(50)?1:0) + (floor>=50?1:0);
  for(let i=0;i<picks;i++){
    const id = pickCommonMat();
    drops[id] = (drops[id]||0) + randInt(1, boss?3:2) + depth;
  }
  return drops;
}

function totalCorePower(includeBoss){
  return CORE_ORDER.reduce((sum,t)=>{
    if(t==='boss' && !includeBoss) return sum;
    return sum + coreCount(t)*CORE_TIERS[t].power;
  }, 0);
}
function tierRank(t){ return ['t1','t2','t3','t4','boss'].indexOf(t); }
function coresAtOrAbove(tier){
  const min = tierRank(tier);
  return CORE_ORDER.reduce((n,t)=> (tierRank(t)>=min && t!=='boss') ? n+coreCount(t) : n, 0);
}
function spendCoresAtOrAbove(tier, count){
  // spends the dullest qualifying cores first, keeping the bright ones back
  const ch = App.character, min = tierRank(tier);
  let left = count;
  for(const t of ['t1','t2','t3','t4']){
    if(tierRank(t) < min) continue;
    const take = Math.min(left, coreCount(t));
    ch.cores[t] -= take;
    left -= take;
    if(left<=0) break;
  }
  return left<=0;
}
function spendCorePower(amount){
  // drains the dullest cores first so the bright ones stay for legendary work
  const ch = App.character;
  let left = amount;
  for(const t of ['t1','t2','t3','t4']){
    while(left > 0 && coreCount(t) > 0){
      ch.cores[t]--;
      left -= CORE_TIERS[t].power;
    }
    if(left <= 0) break;
  }
  return left <= 0;
}

function backfill(target, defaults, nested){
  if(!target || typeof target!=='object') return JSON.parse(JSON.stringify(defaults));

    else if(defaults[k] && typeof defaults[k]==='object' && !Array.isArray(defaults[k]) && typeof target[k]==='object'){

function migrateCharacter(character){
  character = backfill(character, defaultCharacter());
  if(!CLASSES[character.classId]) character.classId = 'warrior';
  if(character.crystals){ addCoreTo(character,'t1', character.crystals); delete character.crystals; }
  if(character.diamonds){ character.gems = (character.gems||0) + character.diamonds; delete character.diamonds; }
  if(character.cores && character.cores.monster){ addCoreTo(character,'t1', character.cores.monster); delete character.cores.monster; }
  if(character.scrap){ character.materials = character.materials||{}; character.materials.iron = (character.materials.iron||0) + character.scrap; delete character.scrap; }
  /* greaves became gauntlets: move whatever was in the old slot across rather
     than orphaning it in the backpack with nowhere to go */
  if(character.equipped && 'legs' in character.equipped){
    if(character.equipped.legs && !character.equipped.gloves) character.equipped.gloves = character.equipped.legs;
    delete character.equipped.legs;
  }
  /* one shared loadout became one per class: whatever was worn belongs to
     whoever was wearing it, which is the class the save was last on */
  if(character.equipped){
    character.loadouts = character.loadouts || {};
    const cid = CLASSES[character.classId] ? character.classId : 'warrior';
    character.loadouts[cid] = Object.assign(emptyLoadout(), character.loadouts[cid] || {}, character.equipped);
    delete character.equipped;
  }
  character.loadouts = character.loadouts || {};
  (character.armors || []).forEach(a=>{
    if(a && a.slot === 'legs'){
      a.slot = 'gloves';
      a.lineId = (a.lineId || '').replace('a_legs_', 'a_gloves_');
      if(/Greaves$/.test(a.name || '')) a.name = a.name.replace(/Greaves$/, 'Gauntlets');
    }
  });
  scrubCountMaps(character);
  if(character.discovered){ Object.assign(App.discovered, character.discovered); delete character.discovered; }
  // the Index is global: reads/writes on any character hit the one shared map,
  // and it is non-enumerable so it never gets copied into a realm's save blob.
  Object.defineProperty(character, 'discovered', {
    get(){ return App.discovered || (App.discovered = {}); },
    enumerable:false, configurable:true,
  });
  return character;
}

async function loadAll(){
  const subjects = await Storage.get('subjects', null);
  App.subjects = (subjects && subjects.length) ? subjects.map(normalizeSubject) : defaultSubjects();
  if(!App.subjects.some(s=>s.builtin==='multiplication')){
    // older saves had a single empty placeholder subject — give them Mathematics
    const placeholder = App.subjects.length===1 && !App.subjects[0].flashcards.length && !App.subjects[0].notes;
    if(placeholder) App.subjects = defaultSubjects();
    else App.subjects = defaultSubjects().concat(App.subjects);
  }
  await getApiKey();

  App.discovered = (await Storage.get('discovered', null)) || {};
  let profiles = await Storage.get('profiles', null);
  if(!profiles){
    // migrate the old single-character save into the realm that was being played
    profiles = {};
    const legacyChar = await Storage.get('character', null);
    const legacyRun = await Storage.get('run', null);
    if(legacyChar){
      const legacyActive = await Storage.get('activeSubjectId', null);
      const target = (legacyActive && App.subjects.find(s=>s.id===legacyActive)) ? legacyActive : App.subjects[0].id;
      profiles[target] = {character: legacyChar, run: legacyRun || defaultRun()};
    }
  }
  App.profiles = profiles;
  Object.keys(App.profiles).forEach(k=>{
    const c = App.profiles[k] && App.profiles[k].character;
    if(c && c.discovered) Object.assign(App.discovered, c.discovered);
  });

  App.activeSubjectId = await Storage.get('activeSubjectId', App.subjects[0].id);
  if(!App.subjects.find(s=>s.id===App.activeSubjectId)) App.activeSubjectId = App.subjects[0].id;

  let pid = await Storage.get('profileId', null);
  if(pid!==INFINITY_ID && !App.subjects.find(s=>s.id===pid)) pid = null;
  App.profileId = pid || App.subjects[0].id;
  const p = realmData(App.profileId);
  App.character = p.character;
  App.run = p.run;
  App.dungeonView = 'select';
  await saveProfiles(); await saveDiscovered();
}

/* ============================== PIXEL ART ENGINE ==============================
   Hand-authored sprites. Each sprite is a small grid of palette keys drawn with
   pixel-exact runs; the renderer adds a 1px dark outline and paints at integer
   scale so everything stays crisp.
   ========================================================================== */
function shade(hex, pct){
  const c = String(hex||'#888').replace('#','');
  const num = parseInt(c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  const t = pct<0?0:255, p = Math.abs(pct);
  r = Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
let __artSeq = 0;
function artId(prefix){ return prefix+(++__artSeq); }
function pxGrid(w,h){ const g=Array.from({length:h},()=>Array(w).fill('.')); g.w=w; g.h=h; return g; }
function P(g,y,x,str){ for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch==='.'||ch===' ') continue; if(g[y] && x+i>=0 && x+i<g.w) g[y][x+i]=ch; } }
function R(g,x,y,w,h,ch){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++){ if(g[j] && i>=0 && i<g.w) g[j][i]=ch; } }
function pxFromRows(rows, w, h){
  const g = pxGrid(w, h);
  for(let y=0;y<rows.length && y<h;y++) P(g, y, 0, rows[y]);
  return g;
}
function renderPixels(grid, palette, outline){
  const w=grid.w, h=grid.h;
  const out = outline===false ? null : (outline||'#0b0910');
  const cells = [];
  const filled=(x,y)=> y>=0&&y<h&&x>=0&&x<w&&grid[y][x]!=='.';
  let svg = `<svg class="pxart" viewBox="${out?-1:0} ${out?-1:0} ${w+(out?2:0)} ${h+(out?2:0)}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">`;
  if(out){
    let d = '';
    const ring = (x,y)=> !filled(x,y) && (filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1)||
      filled(x-1,y-1)||filled(x+1,y-1)||filled(x-1,y+1)||filled(x+1,y+1));
    for(let y=-1;y<=h;y++){
      let x = -1;
      while(x <= w){
        if(!ring(x,y)){ x++; continue; }
        let n = 1;
        while(ring(x+n, y)) n++;
        d += n === 1 ? `M${x} ${y}h1v1h-1z` : `M${x} ${y}h${n}v1h-${n}z`;

}
/* One rect per pixel is the obvious way and the wrong one: a 36x36 creature
   becomes hundreds of sub-paths, and forty of them on the Index screen is half
   a megabyte of live SVG. Runs of the same colour on a row collapse into a
   single rect instead. */
function runPaths(grid, palette, filter){
  const byColor = {};
  for(let y=0;y<grid.h;y++){
    let x = 0;
    while(x < grid.w){
      const k = grid[y][x];
      if(k === '.' || (filter && !filter(k))){ x++; continue; }
      let n = 1;
      while(x + n < grid.w && grid[y][x+n] === k) n++;
      const col = palette[k] || '#ff00ff';
      (byColor[col] = byColor[col] || []).push(n === 1
        ? `M${x} ${y}h1v1h-1z`
        : `M${x} ${y}h${n}v1h-${n}z`);
      x += n;
    }
  }
  return Object.keys(byColor).map(col=>`<path d="${byColor[col].join('')}" fill="${col}"/>`).join('');
}
function pixelPaths(grid, palette){ return runPaths(grid, palette); }
function setArt(host, markup){ if(host) host.innerHTML = markup; }

/* ============================== RIGGED SPRITES ==============================
   A rig is one pixel grid cut into named parts. Each part becomes its own <g>
   with a pivot in viewBox units, so CSS can rotate a shoulder or a jaw without
   the rest of the body following. Outlines are computed against the WHOLE grid,
   so the seams between parts stay invisible while the silhouette keeps its
   1px border.
   parts: [{name, x, y, w, h, px, py}]  — px/py are the joint, in grid units.
   Earlier entries render first (further back). Cells claimed by an earlier part
   are not redrawn by a later one, so parts may overlap freely.
   ========================================================================== */

function heroSheet(classId){ return HERO_SHEET[classId] || HERO_SHEET.warrior; }
function heroFrame(sh, idx){
  return renderPixels(pxFromRows(sh.px[idx], SPR_W, SPR_H), sh.pal, sh.pal.k);
}
/* Every frame of the clip is rendered once and the stack is cross-faded by
   CSS with hard stops, so playback costs nothing at runtime. */
function heroSprite(classId, clip){
  const sh = heroSheet(classId);
  const name = clip || 'idle';
  const ids = sh.clips[name] || sh.clips.idle;
  let out = `<div class="spr spr-${name} n${ids.length}">`;
  ids.forEach((id,i)=>{ out += `<div class="sf s${i}">${heroFrame(sh,id)}</div>`; });
  return out + '</div>';
}
function classArt(classId, clip){ return heroSprite(classId || App.character.classId, clip); }
/* Run a short list of clips back to back, then settle on idle. */
function heroClipSeq(host, classId, steps){
  if(!host) return;
  let t = 0;
  steps.forEach(([clip, ms])=>{ const at = t; setTimeout(()=>setArt(host, heroSprite(classId, clip)), at); t += ms; });
  setTimeout(()=>setArt(host, heroSprite(classId, 'idle')), t);
}
/* Swap the whole sprite over to another clip for a while, then fall back. */
function playHeroClip(host, classId, clip, ms, thenClip){
  if(!host) return;
  setArt(host, heroSprite(classId, clip));
  if(ms) setTimeout(()=>{ setArt(host, heroSprite(classId, thenClip || 'idle')); }, ms);
}

    if(CRE_GLOW_KEYS.indexOf(k) >= 0 || k === 'K'){ out[k] = pal[k]; return; }
    const c = String(pal[k]||'#888').replace('#','');
    const n = parseInt(c.length===3 ? c.split('').map(x=>x+x).join('') : c, 16);

function creSheet(kind){ return CRE_SHEET[kind] || CRE_SHEET.skeleton; }
/* Two species can share an archetype - a crypt skeleton and a drowned one - so
   a tint pulls the body toward another hue while the eyes keep their glow. */
const __creTint = {};
function tintPal(pal, hue){
  const key = hue + '|' + JSON.stringify(pal);
  if(__creTint[key]) return __creTint[key];
  const out = {};
  Object.keys(pal).forEach(k=>{
    out[k] = (CRE_GLOW_KEYS.indexOf(k) >= 0 || k === 'K') ? pal[k] : mixHex(pal[k], hue, 0.34);
  });

/* Armour is banded onto whatever is already there: for each piece we take the
   rows it belongs on, and repaint only the cells that were filled anyway. The
   silhouette never changes, so this works on a skeleton, a slug and a dragon
   alike, and it tracks every frame because it is applied per frame. */
/* The widest unbroken run on the row, not its whole extent: a reaper holds a
   staff out to one side and a dragon carries a wing, and neither should come
   back wearing a strip of plate. */
function creRowSpan(g, y){
  const row = g[y]; if(!row) return null;
  let best = null, s = -1;
  for(let x=0;x<=g.w;x++){
    const on = x < g.w && row[x] !== '.';
    if(on && s < 0) s = x;
    else if(!on && s >= 0){
      if(!best || (x-1-s) > (best[1]-best[0])) best = [s, x-1];
      s = -1;
    }
  }
  return best;
}
function creMassRows(g){
  const rows = [];
  for(let y=0;y<g.h;y++) if(creRowSpan(g, y)) rows.push(y);
  return rows;

function creBand(g, y0, y1, chars){
  for(let y=Math.max(0,y0); y<=Math.min(g.h-1,y1); y++){
    const sp = creRowSpan(g, y); if(!sp) continue;
    const ch = chars[(y - y0) % chars.length];
    const row = g[y];
    for(let x=sp[0];x<=sp[1];x++){
      /* eyes, fire and gold stay lit; steel goes over the body only */
      if(row[x] === '.' || 'BEWKFfGg'.indexOf(row[x]) >= 0) continue;
      row[x] = (x === sp[0] || x === sp[1]) ? 'v' : ch;
    }
    const mid = Math.round((sp[0]+sp[1])/2);
    if(y === y0 + 1 && row[mid] === 'M') row[mid] = 'V';   /* one rivet */
  }
}
function creGear(g, gear){
  const rows = creMassRows(g);
  if(rows.length < 8) return;
  const top = rows[0], bot = rows[rows.length-1], span = bot - top;
  (gear||[]).forEach(id=>{
    if(id === 'helm')   creBand(g, top + Math.round(span*0.05), top + Math.round(span*0.14), ['M','m','M']);
    if(id === 'plate')  creBand(g, top + Math.round(span*0.38), top + Math.round(span*0.50), ['M','m','m','M']);
    if(id === 'bracer') creBand(g, top + Math.round(span*0.58), top + Math.round(span*0.64), ['m','M']);
    if(id === 'greave') creBand(g, bot - Math.round(span*0.10), bot - 1, ['m','M','m']);

const CRE_STEEL = {M:'#aeb8c9', m:'#5d6678', v:'#2b3040', V:'#e8b64c'};
function creFrame(sh, idx, pal, crown, gear){
  const g = pxFromRows(sh.px[idx], CRE_W, CRE_H);
  if(gear && gear.length) creGear(g, gear);
  if(crown){                                   /* a broken circlet for a boss */
    const lo = sh.crown[0], hi = sh.crown[1], top = sh.crown[2];
    const cx = Math.round((lo + hi) / 2);
    if(top >= 3){
      P(g, top-3, cx-4, 'G.G.G.G.G');
      P(g, top-2, cx-4, 'GGGGGGGGG');

function creatureArt(kind, color, opts){
  opts = opts || {};
  const sh = creSheet(kind);
  let pal = sh.pal;
  if(opts.palKey && typeof BOSS_PALETTES!=='undefined' && BOSS_PALETTES[opts.palKey]){
    pal = Object.assign({}, pal, BOSS_PALETTES[opts.palKey]);
  }
  if(opts.boss) pal = bossPalette(pal);
  if(opts.tint) pal = tintPal(pal, opts.tint);
  pal = duskPal(pal);
  const name = opts.clip || 'idle';
  const ids = sh.clips[name] || sh.clips.idle;

     once and an animated sheet each would be half a megabyte of live SVG. */
  const gear = opts.gear || null;

  ids.forEach((id,i)=>{ out += `<div class="sf s${i}">${creFrame(sh, id, pal, !!opts.boss, gear)}</div>`; });
