/* ============================== GAMEPLAY HELPERS: LEVEL / STATS ============================== */
function xpToNext(level){ return 40 + (level-1)*22; }
function classProg(){ return App.character.classProgress[App.character.classId]; }
function levelStats(classId, level){
  const c = CLASSES[classId];
  return { hp: c.base.hp + c.growth.hp*(level-1), atk: c.base.atk + c.growth.atk*(level-1), def: c.base.def + c.growth.def*(level-1), energyMax: c.base.energyMax };
}
function getEquippedItem(slot){
  const ch = App.character;
  const id = ch.equipped[slot];
  if(!id) return null;
  if(slot==='weapon') return ch.weapons.find(w=>w.id===id) || null;
  return ch.armors.find(a=>a.id===id) || null;
}
function artifactSlots(){ return ['artifact1','artifact2']; }
function isArtifactEquipped(key){ return App.character.equipped.artifact1===key || App.character.equipped.artifact2===key; }
function isArtifactActive(key){
  const art = App.character.artifacts[key];
  return !!(art && art.owned && art.charges>0 && isArtifactEquipped(key));
}
function avgMasteryPct(){
  let total=0, count=0;
  App.subjects.forEach(s=> (s.flashcards||[]).forEach(c=>{ total+=(c.mastery||0); count++; }));
  if(!count) return 0;
  return (total/count)/5*100;
}
function combatStats(){
  const ch = App.character;
  const prog = classProg();
  const cls = CLASSES[ch.classId];
  const lvl = levelStats(ch.classId, prog.level);
  let atk=lvl.atk, def=lvl.def, hp=lvl.hp, critChance=5, energyMax=lvl.energyMax, lifestealPct=0;
  let atkPct=0, defPct=0, hpPct=0, energyGainPct=0;
  Object.keys(prog.allocated).forEach(nodeId=>{
    const node = findSkillNode(ch.classId, nodeId);
    if(!node) return;
    const e = node.effect||{};
    if(e.atk) atk+=e.atk;
    if(e.def) def+=e.def;
    if(e.hp) hp+=e.hp;
    if(e.critChance) critChance+=e.critChance;
    if(e.mods){
      atkPct += e.mods.atkPct||0; defPct += e.mods.defPct||0; hpPct += e.mods.hpPct||0;
      critChance += (e.mods.critChancePct||0); lifestealPct += (e.mods.lifestealPct||0); energyGainPct += (e.mods.energyGainPct||0);
    }
  });
  const weapon = getEquippedItem('weapon');
  if(weapon){ atk += weapon.atk; critChance += weapon.critBonus||0; lifestealPct += weapon.lifeBonus||0; }
  ['head','chest','legs'].forEach(slot=>{ const a=getEquippedItem(slot); if(a) def+=a.def; });
  atk += ch.strength*2; hp += ch.maxHpBonus*10;
  if(isArtifactActive('titan')){
    if(ch.titanStat==='hp') hpPct+=0.15;
    if(ch.titanStat==='atk') atkPct+=0.12;
    if(ch.titanStat==='def') defPct+=0.12;
    if(ch.titanStat==='energy') energyMax+=1;
  }
  critChance += Math.floor(avgMasteryPct()/20);
  (App.run.buffs||[]).forEach(b=>{
    if(b.stat==='atkPct') atkPct += b.amount;
    else if(b.stat==='defPct') defPct += b.amount;
    else if(b.stat==='hpPct') hpPct += b.amount;
    else if(b.stat==='critPct') critChance += b.amount;
  });
  if(runBonusActive('might')){ atkPct += 0.25; hpPct += 0.2; }
  if(runBonusActive('hide')){ defPct += 0.35; }
  atk = Math.round(atk*(1+atkPct));
  def = Math.round(def*(1+defPct));
  hp = Math.round(hp*(1+hpPct));
  return {atk, def, maxHp:hp, critChance:clamp(critChance,0,90), energyMax, lifestealPct, energyGainPct, weapon};
}
function ultimateSkillId(){ const s = currentSkillSet(); return s[3] ? s[3].id : null; }
function activeSkillId(){
  const ch = App.character;
  const prog = classProg();
  const node2 = findSkillNode(ch.classId, ch.classId+'_t2_skill');
  const baseSkill = prog.allocated[node2.id] ? node2.effect.unlockSkill : null;
  if(!baseSkill) return null;
  if(prog.evolution){
    const evoNode = findSkillNode(ch.classId, ch.classId+'_t3_'+prog.evolution);
    if(evoNode && prog.allocated[evoNode.id]) return evoNode.effect.evoSkill;
  }
  return baseSkill;
}
function artifactChargeCap(key){
  let cap = ARTIFACT_DEFS[key].maxCharges;
  const prog = App.character.classProgress.rogue;
  if(App.character.classId==='rogue' && prog.evolution==='B' && prog.allocated['rogue_t3_B']) cap += 1;
  return cap;
}
function grantXp(amount){
  const prog = classProg();
  prog.xp += amount;
  while(prog.xp >= xpToNext(prog.level)){
    prog.xp -= xpToNext(prog.level);
    prog.level++;
    prog.skillPoints++;
  }
}

function scrambleAnswer(back){
  const n = parseFloat(back);
  if(!isNaN(n) && /^-?\d+(\.\d+)?$/.test(String(back).trim())){
    const delta = Math.max(1, Math.round(Math.abs(n)*0.15))||1;
    return String(Math.round(n + (chance(50)?1:-1)*randInt(1,delta+2)));
  }
  const words = String(back).split(' ');
  if(words.length>1) return shuffle(words).join(' ');
  return back+' (variant)';
}
function cardWeight(card){
  const now = Date.now();
  const dueBonus = (card.dueAt||0) <= now ? 40 : 4;
  return dueBonus + (5-(card.mastery||0))*8 + 1;
}
function pickWeightedCard(pool){
  return weightedPick(pool.map(c=>({v:c, w:cardWeight(c)})));
}

/* ---------- multiplication tables ---------- */
function numDistractors(ans, steps, n){
  const out = [], seen = {};
  seen[ans] = 1;
  shuffle(steps.slice()).forEach(st=>{
    shuffle([ans+st, ans-st]).forEach(v=>{
      if(v>0 && !seen[v] && out.length<n){ seen[v]=1; out.push(v); }
    });
  });
  let k = 1;
  while(out.length<n){ const v = ans + k*7; if(v>0 && !seen[v]){ seen[v]=1; out.push(v); } k++; }
  return out;
}
function buildMulQuestion(diffId){
  const d = DIFFS[diffId] || DIFFS.medium;
  let prompt, correct, steps;
  if(d.id==='easy'){
    const a = randInt(2,5), b = randInt(1,10);
    prompt = a+' × '+b+' = ?'; correct = a*b; steps = [a, b, 1, 2];
  } else if(d.id==='medium'){
    const a = randInt(6,12), b = randInt(2,12);
    if(chance(25)){ prompt = a+' × ? = '+(a*b); correct = b; steps = [1,2,3,4]; }
    else { prompt = a+' × '+b+' = ?'; correct = a*b; steps = [a, b, 1, 10]; }
  } else {
    const form = randInt(1,3);
    if(form===1){ const a=randInt(12,20), b=randInt(7,20); prompt=a+' × '+b+' = ?'; correct=a*b; steps=[a,b,1,10]; }
    else if(form===2){ const a=randInt(6,12), b=randInt(4,9), c=randInt(2,6); prompt=a+' × '+b+' × '+c+' = ?'; correct=a*b*c; steps=[a*b,a*c,b*c,1]; }
    else { const a=randInt(11,19), b=randInt(6,19); prompt='? × '+b+' = '+(a*b); correct=a; steps=[1,2,3,5]; }
  }
  const q = {id:uid(), cardId:null, subjId:null, prompt, correct:String(correct),
             mode: d.id==='hard' ? 'text' : 'mcq', options:[], hintUsed:false, eliminatedIdx:null,
             difficulty:d.id, sourceLabel:'Multiplication Tables'};
  if(q.mode==='mcq') q.options = shuffle([String(correct)].concat(numDistractors(correct, steps, d.opts-1).map(String)));
  return q;
}

/* ---------- flashcard questions ---------- */
function buildCardQuestion(pool, diffId, subj){
  const d = DIFFS[diffId] || DIFFS.medium;
  let cands = pool;
  if(d.id==='easy'){ const known = pool.filter(c=>(c.mastery||0)>=3); if(known.length) cands = known; }
  else if(d.id==='hard'){ const weak = pool.filter(c=>(c.mastery||0)<=1); if(weak.length) cands = weak; }
  const card = pickWeightedCard(cands);
  const others = pool.filter(c=>c.id!==card.id);
  const short = String(card.back).trim().length <= 28;
  let mode = (d.id==='hard' && short) ? 'text' : 'mcq';
  let options = [];
  if(mode==='mcq'){
    const want = d.opts - 1;
    const distractors = shuffle(others.map(c=>c.back)).slice(0, want);
    while(distractors.length < want) distractors.push(scrambleAnswer(card.back));
    options = shuffle([card.back].concat(distractors));
    if(options.length < 2) mode = 'text';
  }
  return {id:uid(), cardId:card.id, subjId: subj ? subj.id : null, prompt:card.front, correct:card.back,
          mode, options, hintUsed:false, eliminatedIdx:null, difficulty:d.id,
          sourceLabel: subj ? subj.name : 'Demo Deck'};
}

/* ---------- where this realm's questions come from ---------- */
function subjectSourcesFor(subj){
  const out = [];
  if(!subj) return out;
  if(subj.builtin==='multiplication') out.push({kind:'mul', subj});
  if(subj.flashcards && subj.flashcards.length) out.push({kind:'cards', subj});
  return out;
}
function questionSources(){
  if(App.profileId===INFINITY_ID){
    let out = [];
    App.subjects.forEach(s=>{ out = out.concat(subjectSourcesFor(s)); });
    if(!out.length) out.push({kind:'cards', subj:null});
    return out;
  }
  const subj = realmSubject();
  const out = subjectSourcesFor(subj);
  if(!out.length) out.push({kind:'cards', subj});
  return out;
}
function realmSourceLabel(){
  const srcs = questionSources();
  if(App.profileId===INFINITY_ID){
    const names = [];
    srcs.forEach(s=>{ const n = s.kind==='mul' ? 'Multiplication' : (s.subj?s.subj.name:'Demo Deck'); if(names.indexOf(n)<0) names.push(n); });
    return names.join(' + ');
  }
  return srcs.map(s=>s.kind==='mul' ? 'Multiplication Tables' : (s.subj?s.subj.name:'Demo Deck')).join(' + ');
}
function buildQuestion(diffId, srcs){
  if(!DIFFS[diffId]) diffId = App.run.difficulty && DIFFS[App.run.difficulty] ? App.run.difficulty : 'medium';
  if(!srcs || !srcs.length) srcs = questionSources();
  const src = pick(srcs);
  if(src.kind==='mul') return buildMulQuestion(diffId);
  const pool = (src.subj && src.subj.flashcards && src.subj.flashcards.length) ? src.subj.flashcards : STARTER_DECK;
  return buildCardQuestion(pool, diffId, (src.subj && src.subj.flashcards && src.subj.flashcards.length) ? src.subj : null);
}
function findCardAnywhere(cardId){
  for(const s of App.subjects){
    const c = (s.flashcards||[]).find(x=>x.id===cardId);
    if(c) return {card:c, subj:s};
  }
  const d = STARTER_DECK.find(x=>x.id===cardId);
  return d ? {card:d, subj:null} : null;
}
function updateCardMastery(cardId, correct){
  if(!cardId) return;                 // generated questions have no card to schedule
  const found = findCardAnywhere(cardId);
  if(!found) return;
  const card = found.card;
  const intervals = [5*60000, 30*60000, 3*3600000, 1*86400000, 3*86400000, 7*86400000];
  if(correct){ card.mastery = clamp((card.mastery||0)+1, 0, 5); card.dueAt = Date.now()+intervals[clamp(card.mastery-1,0,5)]; }
  else { card.mastery = clamp((card.mastery||0)-1, 0, 5); card.dueAt = Date.now(); }
  if(found.subj) saveSubjects();
}

const DEFAULT_INSTRUCTION = 'Produce study notes and flashcards from the SOURCE TEXT below. Reply in EXACTLY this format, no extra commentary:\nNOTES:\n<concise study notes as headings and bullet points, highlighting key terms/definitions/facts>\nFLASHCARDS_JSON:\n<a strict JSON array like [{"q":"...","a":"..."}] with 6-14 short question/answer flashcards testing the material>';
function parseAiAnalysis(raw){
  const idx = raw.indexOf('FLASHCARDS_JSON:');
  let notes = raw, flashcards = [];
  if(idx>=0){
    notes = raw.slice(0, idx).replace(/^NOTES:\s*/i,'').trim();
    const jsonPart = raw.slice(idx+'FLASHCARDS_JSON:'.length);
    const start = jsonPart.indexOf('['), end = jsonPart.lastIndexOf(']');
    if(start>=0 && end>start){
      try{
        const arr = JSON.parse(jsonPart.slice(start,end+1));
        arr.forEach(item=>{ if(item && item.q && item.a) flashcards.push({id:uid(), front:String(item.q), back:String(item.a), mastery:0, dueAt:0}); });
      }catch(e){}
    }
  }
  return {notes, flashcards};
}

              chunks.push({text:`[Pages ${i}-${Math.min(i+2,n)} of ${f.name}, rendered as images]`, images:imgs, source:f.name});
            }

async function processUploadBatch(container, log){
  const q = App.uploadQueue;
  if(!q) return;
  const s = activeSubject();
  const BATCH = 10;
  const end = Math.min(q.chunks.length, q.idx+BATCH);
  for(let i=q.idx; i<end; i++){
    const ch = q.chunks[i];
    log(`Analyzing chunk ${i+1}/${q.chunks.length}${ch.source?(' ('+ch.source+')'):''}...`);
    let result = null;
    try{
      const prompt = `${q.instruction}\n\n---\nSOURCE TEXT:\n${ch.text}`;
      const raw = await callClaude(prompt, ch.images);
      result = parseAiAnalysis(raw);
      if(!result.notes && !result.flashcards.length) throw new Error('empty AI response');
      log('  ✓ AI analysis done ('+result.flashcards.length+' flashcards).');
    }catch(err){
      log('  ⚠ '+err.message+' — using offline generator instead.');
      result = localAnalyze(ch.text);
      log('  ✓ offline analysis done ('+result.flashcards.length+' flashcards).');
    }
    s.notes = (s.notes ? s.notes+'\n\n' : '') + (result.notes||'').trim();
    const existingFronts = new Set(s.flashcards.map(c=>normText(c.front)));
    (result.flashcards||[]).forEach(fc=>{ if(!existingFronts.has(normText(fc.front))){ s.flashcards.push(fc); existingFronts.add(normText(fc.front)); } });
    await saveSubjects();
  }
  q.idx = end;
  const continueBtn = container.querySelector('#up-continue');
  if(q.idx < q.chunks.length){
    log(`Paused after batch — ${q.chunks.length-q.idx} chunk(s) remaining.`);
    if(continueBtn) continueBtn.style.display = '';
  } else {
    log('All chunks analyzed. Notes and flashcards updated — they now appear as combat questions in the Dungeon too.');
    App.uploadQueue = null;
    if(continueBtn) continueBtn.style.display = 'none';
  }
}

function rarityWeightsForRegion(region){
  const t = clamp((region-1)/9,0,1);
  return [ {v:'common',w:58-50*t}, {v:'rare',w:30-6*t}, {v:'epic',w:10+26*t}, {v:'legendary',w:2+30*t} ];
}
function rollRarityForRegion(region){ return weightedPick(rarityWeightsForRegion(region)); }
function makeWeaponInstance(line){ return {id:uid(), kind:'weapon', lineId:line.lineId, classId:line.classId, rarity:line.rarity, name:line.name, atk:line.atk, critBonus:line.critBonus||0, lifeBonus:line.lifeBonus||0}; }
function makeArmorInstance(line){ return {id:uid(), kind:'armor', lineId:line.lineId, slot:line.slot, rarity:line.rarity, name:line.name, def:line.def}; }
function rollFloorLoot(floor){
  const ch = App.character;
  const region = regionForFloor(floor);
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const loot = [];
  const goldMult = runBonusActive('fortune') ? 1.5 : 1;
  const goldAmt = Math.round((boss ? randInt(25+floor*3, 50+floor*5) : randInt(4+floor, 10+floor*2)) * goldMult);
  App.run.gold = (App.run.gold||0) + goldAmt;
  loot.push({kind:'gold', label:'+'+goldAmt+' gold'});
  const diaAmt = boss ? randInt(3,6) : (chance(14) ? randInt(1,2) : 0);
  if(diaAmt){ ch.gems = (ch.gems||0) + diaAmt; loot.push({kind:'gem', label:'💎 +'+diaAmt+' gems'}); }
  if(boss){ const n = final ? 3 : randInt(1,2); addCore('boss', n); loot.push({kind:'core', label:'+'+n+' Boss Core'+(n>1?'s':''), core:'boss'}); }
  else if(chance(55)){ const n = randInt(1,2); const t = addFloorCore(floor, n); loot.push({kind:'core', label:'+'+n+' '+CORE_TIERS[t].name+(n>1?'s':''), core:t}); }
  const arche = App.run.monster ? App.run.monster.arche : null;
  const matDrops = rollMaterialDrops(floor, arche, boss);
  Object.keys(matDrops).forEach(m=>{ addMaterial(m, matDrops[m]); loot.push({kind:'mat', label:MATERIALS[m].icon+' '+matDrops[m]+'× '+MATERIALS[m].name}); });
  if(chance(boss?70:26)){
    const pid = weightedPick([{v:'hp_small',w:34},{v:'hp_large',w:10},{v:'energy',w:16},{v:'buff_atk',w:9},
      {v:'buff_def',w:9},{v:'buff_crit',w:7},{v:'debuff_atk',w:7},{v:'debuff_def',w:5},{v:'debuff_slow',w:3}]);
    addPotion(pid, 1);
    loot.push({kind:'potion', label:POTIONS[pid].icon+' '+POTIONS[pid].name});
  }
  if(!boss){
    const bookId = MONSTER_BOOKS[App.run.monster ? App.run.monster.arche : ''] || null;
    if(bookId && chance(3) && !(ch.learnedSkills||{})[bookId]){
      ch.books = ch.books || {};
      ch.books[bookId] = (ch.books[bookId]||0) + 1;
      loot.push({kind:'book', label:'📕 Skill Book: '+SKILLS[bookId].name});
    }
  }
  let itemChance = boss ? 70 : 22;
  if(isArtifactActive('fortune')) itemChance = Math.min(100, itemChance*1.15);
  if(chance(itemChance)){
    const rarity = rollRarityForRegion(region);
    if(chance(50)){
      const opts = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && w.rarity===rarity);
      if(opts.length){ const line=pick(opts); const w=makeWeaponInstance(line); ch.weapons.push(w); markDiscovered(line.lineId); loot.push({kind:'weapon', label:w.name+' ('+rarity+')'}); }
    } else {
      const opts = ARMOR_CATALOG.filter(a=>a.rarity===rarity);
      if(opts.length){ const line=pick(opts); const a=makeArmorInstance(line); ch.armors.push(a); markDiscovered(line.lineId); loot.push({kind:'armor', label:a.name+' ('+rarity+')'}); }
    }
  }
  if(boss){
    const bd = bossDefForFloor(floor);
    if(bd && bd.drop){
      let relicChance = 25;
      if(isArtifactActive('fortune')) relicChance *= 1.15;
      if(chance(relicChance)){
        const d = bd.drop;
        const item = d.kind==='weapon'
          ? {id:uid(), kind:'weapon', lineId:d.lineId, classId:ch.classId, rarity:d.rarity, name:d.name, atk:d.atk, critBonus:d.critBonus||0, lifeBonus:d.lifeBonus||0, relic:true}
          : {id:uid(), kind:'armor', lineId:d.lineId, slot:d.slot, rarity:d.rarity, name:d.name, def:d.def, relic:true};
        (d.kind==='weapon' ? ch.weapons : ch.armors).push(item);
        markDiscovered(d.lineId);
        loot.push({kind:d.kind, label:'★ '+d.name+' — boss relic!'});
      }
    }
    let artChance = 10;
    if(isArtifactActive('fortune')) artChance *= 1.15;
    if(chance(artChance)){
      const notOwned = ARTIFACT_KEYS.filter(k=>!ch.artifacts[k].owned);
      if(notOwned.length){ const key=pick(notOwned); ch.artifacts[key]={owned:true,charges:ARTIFACT_DEFS[key].maxCharges}; markDiscovered('art_'+key); loot.push({kind:'artifact', label:'✨ '+ARTIFACT_DEFS[key].name+'!'}); }
      else { addCore('boss',2); loot.push({kind:'core', label:'+2 Boss Cores (all artifacts already owned)', core:'boss'}); }
    }
    ['fortune','titan'].forEach(k=>{ if(isArtifactEquipped(k) && ch.artifacts[k].owned && ch.artifacts[k].charges>0) ch.artifacts[k].charges--; });
    if(!ch.bossFloorsCleared.includes(floor) && floor<MAX_FLOOR) ch.bossFloorsCleared.push(floor);
  }
  ch.highestFloor = Math.max(ch.highestFloor, floor);
  return loot;
}
function bestiaryKeyFor(monster){
  if(monster.isFinal) return 'boss_final';
  if(monster.isBoss) return 'boss_'+monster.region;
  return 'mon_'+monster.region;
}

/* How each class closes the distance. Melee walks its weapon in, rushers throw
   their whole body at the enemy, casters stay planted and send the spell. */
const CLASS_COMBAT = {
  warrior:{style:'dash'},
  cleric: {style:'cast', proj:'holy'},
  mage:   {style:'cast', proj:'arcane'},
  rogue:  {style:'rush'},
  brawler:{style:'rush'},
};
function classCombat(classId){ return CLASS_COMBAT[classId || App.character.classId] || CLASS_COMBAT.warrior; }
function flyProjectile(els, kind, big){
  return new Promise(resolve=>{
    const scene = els.scene, from = els.playerSprite, to = els.monsterSprite;
    if(!scene || !from || !to){ resolve(); return; }
    const s = scene.getBoundingClientRect(), a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const orb = document.createElement('div');
    orb.className = 'projectile ' + (kind||'arcane') + (big?' big':'');
    const x0 = a.left - s.left + a.width*0.74, y0 = a.top - s.top + a.height*0.34;
    orb.style.left = x0+'px'; orb.style.top = y0+'px';
    scene.appendChild(orb);
    const dx = (b.left - s.left + b.width*0.5) - x0;
    const dy = (b.top - s.top + b.height*0.5) - y0;
    requestAnimationFrame(()=>{
      orb.style.opacity = '1';
      orb.style.transform = 'translate('+dx+'px,'+dy+'px) scale(1.15)';
    });
    setTimeout(()=>{ orb.remove(); resolve(); }, 330);
  });
}
async function playerAttackIntro(els, isSkill, opts){
  const c = classCombat();
  if(c.style==='cast'){
    const cast = playAnim(els.playerSprite, 'cast', 460);
    await sleep(210);                       // the staff comes up first
    await flyProjectile(els, c.proj, isSkill);
    await cast;
    return;
  }
  if(c.style==='rush'){
    const rush = playAnim(els.playerSprite, 'rush', 440);
    await sleep(230);                       // land the hit at the end of the lunge
    triggerSlash(els.slashfx, !!opts.guaranteedCrit);
    return rush;
  }
  const dash = playAnim(els.playerSprite, 'dash', 320);
  await sleep(150);
  triggerSlash(els.slashfx, !!opts.guaranteedCrit);
  return dash;
}

/* ============================== COMBAT ORCHESTRATION ============================== */
function computeHit(atk, mult, monsterDef, defPierce){
  const variance = 0.85+Math.random()*0.3;
  const raw = atk*mult*variance;
  const reduction = (monsterDef||0)*(1-(defPierce||0));
  return Math.max(1, Math.round(raw-reduction));
}

  }, 90);
}

  App.run = Object.assign(defaultRun(), {active:true, floor:1, energy:0, gold:0, activeBonuses:active});
  if(active.indexOf('insight')>=0) App.run.freeHints = 3;

  App.run.shieldPct = 0; App.run.nullifyNextWrong = false;

function startNewTurn(){
  if(App.run.monster && App.run.monster.hp<=0){ handleVictory(); return; }
  const st0 = combatStats();
  App.run.energy = clamp((App.run.energy||0) + 1, 0, st0.energyMax);
  tickBuffTimers();
  ['poison','playerBurn'].forEach(k=>{
    const dot = App.run[k];
    if(dot && dot.turnsLeft>0){
      App.run.hp = clamp(App.run.hp - dot.perTurn, 0, st0.maxHp);
      dot.turnsLeft--;
      App.run.bossNote = (k==='poison'?'Poison':'Burning')+' -'+dot.perTurn+' HP';
    }
  });
  if(App.run.hp<=0){ handleDeath(); return; }
  if(App.run.monster && App.run.monster.isBoss){
    const note = bossTurnTick();
    if(note) App.run.bossNote = note;
  }
  if(App.run.burn && App.run.burn.turnsLeft>0){
    const m = App.run.monster;
    m.hp = clamp(m.hp - App.run.burn.perTurn, 0, m.maxHp);
    App.run.burn.turnsLeft--;
    App.run.bossNote = (App.run.burn.label||'burn').replace(/^./,c=>c.toUpperCase())+' -'+App.run.burn.perTurn+' enemy HP';
    saveRun();
    if(m.hp<=0){ handleVictory(); return; }
  }
  if(App.run.hintsSealed && (App.run.bossTurn||0) % 3 !== 0) App.run.hintsSealed = false;
  App.currentQuestion = null;
  App.run.difficulty = null;
  App.currentPhase = 'difficulty';
  render();
}
function chooseDifficulty(id){
  if(!DIFFS[id]) id = 'medium';
  App.run.difficulty = id;
  App.currentQuestion = buildQuestion(id);
  if(App.run.freeHintNext){ applyHintToQuestion(App.currentQuestion); App.run.freeHintNext = false; }
  App.currentPhase = 'question';
  saveRun();
  render();
}
function applyHintToQuestion(q){
  q.hintUsed = true;
  if(q.mode==='mcq'){
    if(q.eliminatedIdx==null){
      const wrongIdxs = q.options.map((v,i)=>i).filter(i=>q.options[i]!==q.correct);
      if(wrongIdxs.length) q.eliminatedIdx = pick(wrongIdxs);
    }
  } else {
    q.hintText = String(q.correct).slice(0, Math.max(1,Math.ceil(String(q.correct).length*0.3)));
  }
}
function useHintArtifact(){
  const q = App.currentQuestion;
  if(App.run.hintsSealed){ App.run.bossNote = 'Your hints are sealed this turn.'; render(); return; }
  if(!q || q.hintUsed) return;
  if(App.run.freeHints>0){ App.run.freeHints--; applyHintToQuestion(q); saveRun(); render(); return; }
  if(!isArtifactActive('lens')) return;
  App.character.artifacts.lens.charges--;

  saveCharacter();
  render();
}
async function submitAnswer(rawValue){
  const q = App.currentQuestion;
  if(!q) return;
  const correct = q.mode==='mcq' ? (rawValue===q.correct) : fuzzyMatch(rawValue, q.correct);
  App.lastAnswerCorrect = correct;
  App.currentPhase = 'reveal';
  render();
  await sleep(500);
  updateCardMastery(q.cardId, correct);
  App.character.totalAnswered++;
  if(correct){
    App.character.correctAnswerCount++;
    grantXp(Math.max(1, Math.round((4+(chance(25)?2:0)) * curDiff().xpMult)));
    App.run.combo = (App.run.combo||0)+1;
    const eb = curDiff().energyBonus||0;
    if(eb>0){
      const st0 = combatStats(), before = App.run.energy||0;
      App.run.energy = clamp(before+eb, 0, st0.energyMax);
      const gained = App.run.energy - before;
      App.run.bossNote = gained>0 ? ('+'+gained+' bonus ⚡ for taking the hard question') : 'Energy already full';
    }
  }
  else App.run.combo = 0;
  await saveCharacter();
  if(correct){ App.currentPhase = 'skillmenu'; render(); }
  else await resolveMonsterHit();
}
async function resolvePlayerHit(mult, opts, isSkill, moreHits){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  await playerAttackIntro(battleEls, isSkill, opts);
  let dmg = computeHit(st.atk, mult, monsterDef(), opts.defPierce);
  dmg = Math.max(1, Math.round(dmg * curDiff().dmgMult));
  let crit = false;
  if(opts.guaranteedCrit){ crit = true; dmg = Math.round(dmg*1.6); }
  else if(chance(st.critChance)){ crit = true; dmg = Math.round(dmg*1.6); }
  if(opts.executeBelowPct && (m.hp/m.maxHp) < opts.executeBelowPct){ dmg = Math.round(dmg*opts.executeMult); }
  const passive = CLASSES[App.character.classId].passive;
  if(passive==='rage' || opts.ragePower){
    const missing = clamp(1 - (App.run.hp / Math.max(1,st.maxHp)), 0, 1);
    dmg = Math.round(dmg * (1 + 0.45*missing));
  }
  if(passive==='combo'){
    const combo = Math.min(5, App.run.combo||0);
    if(combo>1) dmg = Math.round(dmg * (1 + 0.08*(combo-1)));
  }
  if(App.run.frozen){ dmg = Math.max(1, Math.round(dmg*0.5)); App.run.frozen = false; }
  if(m.isBoss) dmg = bossModifyIncomingDamage(dmg, isSkill);
  let heal = 0;
  if(st.lifestealPct>0) heal += Math.round(dmg*st.lifestealPct/100);
  if(opts.lifestealBonus) heal += Math.round(dmg*opts.lifestealBonus/100);
  if(opts.healPct) heal += Math.round(st.maxHp*opts.healPct);
  if(opts.selfDmgPct){ App.run.hp = clamp(App.run.hp - Math.round(App.run.hp*opts.selfDmgPct), 1, st.maxHp); }
  m.hp = clamp(m.hp - dmg, 0, m.maxHp);
  if(opts.burnTurns){ App.run.burn = {turnsLeft:opts.burnTurns, perTurn: Math.max(1,Math.round(m.maxHp*opts.burnPct/opts.burnTurns)), label:opts.burnLabel||'burn'}; }
  if(opts.drainMonsterEnergy){ m.energy = Math.max(0, m.energy - opts.drainMonsterEnergy); }
  if(opts.energyGain){ App.run.energy = clamp(App.run.energy + opts.energyGain, 0, st.energyMax); }
  if(opts.buffSelf){ App.run.buffs = (App.run.buffs||[]).concat([Object.assign({}, opts.buffSelf, {turns:opts.buffSelf.turns+1})]); }
  if(opts.shieldPct){ App.run.shieldPct = opts.shieldPct; }
  if(opts.nullifyNextWrong){ App.run.nullifyNextWrong = true; }
  if(opts.freeHintNext){ App.run.freeHintNext = true; }
  if(opts.energyRefundOnCrit && crit){ App.run.energy = clamp(App.run.energy+opts.energyRefundOnCrit, 0, st.energyMax); }
  if(heal>0) App.run.hp = clamp(App.run.hp+heal, 0, st.maxHp);
  const reflected = m.isBoss ? bossAfterPlayerHit(dmg) : {};
  triggerImpact(battleEls.monsterHost);
  await playAnim(battleEls.monsterSprite, 'hitflash', 300);
  if(reflected.reflect){ showFloatingNumber(battleEls.playerHost, '-'+reflected.reflect+' reflect', false); updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp); }
  updateHpBar(battleEls.monsterHpFill, battleEls.monsterHpNum, m.hp, m.maxHp);
  if(heal>0) updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp);
  showFloatingNumber(battleEls.monsterHost, '-'+dmg, crit);
  if(heal>0) showFloatingNumber(battleEls.playerHost, '+'+heal, false, true);
  tickMonsterEnergy(false);
  await sleep(400);
  await saveRun(); await saveCharacter();
  if(m.hp<=0){ await handleVictory(); return; }
  if(moreHits) return;
  App.currentPhase = 'postattack';
  render();
}
function monsterDebuffMult(stat){
  let mult = 1;
  (App.run.monsterDebuffs||[]).forEach(d=>{ if(d.stat===stat) mult += d.amount; });
  return Math.max(0.2, mult);
}
function monsterAtk(){ return Math.max(1, Math.round((App.run.monster.atk||1) * monsterDebuffMult('atkPct'))); }
function monsterDef(){ return Math.max(0, Math.round((App.run.monster.def||0) * monsterDebuffMult('defPct'))); }
function tickBuffTimers(){
  ['buffs','monsterDebuffs'].forEach(k=>{
    App.run[k] = (App.run[k]||[]).map(b=>Object.assign({}, b, {turns:b.turns-1})).filter(b=>b.turns>0);
  });
}
function usePotion(id, inBattle){
  const p = POTIONS[id];
  if(!p || potionCount(id)<=0) return false;
  App.character.potions[id]--;
  const st = combatStats();
  if(p.kind==='heal'){ App.run.hp = clamp(App.run.hp + p.amount, 0, st.maxHp); App.run.bossNote = '+'+p.amount+' HP'; }
  else if(p.kind==='energy'){ App.run.energy = clamp(App.run.energy + p.amount, 0, st.energyMax); App.run.bossNote = '+'+p.amount+' Energy'; }
  else if(p.kind==='buff'){ App.run.buffs = (App.run.buffs||[]).concat([{stat:p.stat, amount:p.amount, turns:p.turns+1, name:p.name}]); App.run.bossNote = p.name+' active'; }
  else if(p.kind==='debuff'){
    if(p.stat==='drain'){ if(App.run.monster) App.run.monster.energy = Math.max(0, App.run.monster.energy - p.amount); App.run.bossNote = 'Enemy charge drained'; }
    else { App.run.monsterDebuffs = (App.run.monsterDebuffs||[]).concat([{stat:p.stat, amount:p.amount, turns:p.turns+1, name:p.name}]); App.run.bossNote = p.name+' applied'; }
  }
  saveCharacter(); saveRun();
  return true;
}
function tickMonsterEnergy(wasAttack){
  const m = App.run.monster;
  if(!m) return false;
  m.energy++;
  if(m.energy>=m.energyMax){ m.energy=0; return true; }
  return false;
}
async function resolveMonsterHit(){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  const charged = tickMonsterEnergy(true);
  if(charged) await playAnim(battleEls.monsterSprite, 'telegraph', 600);
  await playAnim(battleEls.monsterSprite, 'lunge', 340);
  let dmg = Math.max(1, Math.round(monsterAtk()*(0.85+Math.random()*0.3) - st.def*0.5));
  dmg = Math.max(1, Math.round(dmg * curDiff().takeMult));
  if(charged) dmg = Math.round(dmg*1.6);
  let hits = 1, bossNotes = [];
  if(m.isBoss){ const mod = bossModifyOutgoingDamage(dmg, charged); dmg = mod.dmg; hits = mod.hits; bossNotes = mod.notes; }
  let nullified = false, shielded = false;
  if(App.run.nullifyNextWrong){ dmg = 0; hits = 1; nullified = true; App.run.nullifyNextWrong = false; }
  else if(App.run.shieldPct>0){ dmg = Math.round(dmg*(1-App.run.shieldPct)); shielded = true; App.run.shieldPct = 0; }
  const totalDmg = dmg*hits;
  App.run.hp = clamp(App.run.hp - totalDmg, 0, st.maxHp);
  if(m.isBoss && !nullified) bossNotes = bossNotes.concat(bossAfterMonsterHit(totalDmg, charged));
  if(battleEls.scene) battleEls.scene.classList.add('shake');
  await playAnim(battleEls.playerSprite, 'hitflash', 300);
  updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp);
  showFloatingNumber(battleEls.playerHost, nullified?'Blocked!':(charged?('-'+totalDmg+' CHARGED!'):('-'+totalDmg+(hits>1?' ×'+hits:''))), charged);
  if(bossNotes.length){ App.run.bossNote = bossNotes.join(' · '); updateHpBar(battleEls.monsterHpFill, battleEls.monsterHpNum, m.hp, m.maxHp); }
  await sleep(450);
  if(battleEls.scene) battleEls.scene.classList.remove('shake');
  await saveRun();
  if(App.run.hp<=0){ await handleDeath(); return; }
  App.currentPhase = 'postattack';
  render();
}
async function useSkillById(skillId){
  const skill = SKILLS[skillId];
  if(!skill) return;
  const cost = skill.cost||0;
  if((App.run.energy||0) < cost) return;
  App.run.energy -= cost;
  const battleEls = getBattleEls();
  if(skill.ultimate) triggerWeaponIcon(battleEls.monsterHost, App.character.classId);
  const hits = skill.hits || 1;
  for(let i=0;i<hits;i++){
    if(App.run.monster.hp<=0) break;
    await resolvePlayerHit(skill.mult, skill, cost>0, i<hits-1);
  }
}

}

function grantRubbleFind(floor){

function doSearchFloor(){

function rollGoldenChest(){
  const ch = App.character;
  const lines = ['A gilded chest sits half-buried in the rubble. The lock gives way.'];
  const rarity = chance(55) ? 'legendary' : 'epic';
  if(chance(50)){
    const opts = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && w.rarity===rarity);
    if(opts.length){ const line=pick(opts); const it=makeWeaponInstance(line); ch.weapons.push(it); markDiscovered(line.lineId); lines.push('⚔ <b>'+it.name+'</b> ('+rarity+')'); }
  } else {
    const opts = ARMOR_CATALOG.filter(a=>a.rarity===rarity);
    if(opts.length){ const line=pick(opts); const it=makeArmorInstance(line); ch.armors.push(it); markDiscovered(line.lineId); lines.push('🛡 <b>'+it.name+'</b> ('+rarity+')'); }
  }
  const gold = randInt(150, 320), dia = randInt(5, 10), cores = randInt(2, 4);
  App.run.gold = (App.run.gold||0) + gold;
  ch.gems = (ch.gems||0) + dia;
  addCore('boss', cores);
  const matId = pickMaterialId(App.run.floor||1), matN = randInt(4,9) + matDepthBonus(App.run.floor||1);
  addMaterial(matId, matN);
  lines.push('🪙 '+gold+' gold · 💎 '+dia+' gems · '+cores+' Boss Cores');
  lines.push(MATERIALS[matId].icon+' '+matN+'× '+MATERIALS[matId].name);
  const pid = pick(['hp_large','buff_atk','buff_def','buff_crit','energy']);
  addPotion(pid,2);
  lines.push(POTIONS[pid].icon+' '+POTIONS[pid].name+' ×2');
  if(chance(10)){
    const notOwned = ARTIFACT_KEYS.filter(k=>!ch.artifacts[k].owned);
    if(notOwned.length){ const key=pick(notOwned); ch.artifacts[key]={owned:true, charges:ARTIFACT_DEFS[key].maxCharges}; markDiscovered('art_'+key); lines.push('✨ <b>'+ARTIFACT_DEFS[key].name+'</b> — an artifact!'); }
  }
  return {title:'GOLDEN CHEST!', golden:true, lines};
}

function realmSummary(id){

/* ============================== INVENTORY (paperdoll / backpack / stash / shrine) ============================== */
function itemStatLine(it){
  if(it.kind==='weapon'){ let s=`+${it.atk} ATK`; if(it.critBonus) s+=`, +${it.critBonus}% crit`; if(it.lifeBonus) s+=`, +${it.lifeBonus}% lifesteal`; return s; }
  return `+${it.def} DEF`;
}
function findItem(id){ const ch=App.character; return ch.weapons.find(w=>w.id===id) || ch.armors.find(a=>a.id===id) || null; }
function equipItem(slot, id){
  App.character.equipped[slot] = id;
  const it = findItem(id);
  if(it) markDiscovered(it.lineId);
  App.slotPicker = null; saveCharacter(); render();
}
function unequipSlot(slot){ App.character.equipped[slot] = null; render_and_save(); }
function render_and_save(){ saveCharacter(); render(); }
function moveToStash(id, kind){
  const ch = App.character;
  Object.keys(ch.equipped).forEach(slot=>{ if(ch.equipped[slot]===id) ch.equipped[slot]=null; });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(item) ch.stash.push(item);
  saveCharacter(); render();
}
function moveToBackpack(id){
  const ch = App.character;
  const item = ch.stash.find(i=>i.id===id);
  if(!item) return;
  ch.stash = ch.stash.filter(i=>i.id!==id);
  if(item.kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  saveCharacter(); render();
}
function salvageItem(id, kind){
  const ch = App.character;
  Object.keys(ch.equipped).forEach(slot=>{ if(ch.equipped[slot]===id) ch.equipped[slot]=null; });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(!item) return;
  const idx = RARITY_ORDER.indexOf(item.rarity);
  const n = (idx>=0?idx+1:1);
  addMaterial(item.kind==='weapon'?'iron':'leather', n);
  addMaterial('cloth', 1);
  if(idx>=2) addFloorCore(App.character.highestFloor||1, 1);
  saveCharacter(); render();
}
function equipArtifact(key, slotName){
  const ch = App.character;
  if(!ch.artifacts[key].owned) return;
  if(isArtifactEquipped(key)) return;
  ch.equipped[slotName] = key;
  saveCharacter(); render();
}
function unequipArtifactSlot(slotName){ App.character.equipped[slotName]=null; saveCharacter(); render(); }
function rechargeArtifact(key, useBossCore){
  const ch = App.character;
  const art = ch.artifacts[key];
  const cap = artifactChargeCap(key);
  if(!art.owned || art.charges>=cap) return;
  if(useBossCore){
    if(coreCount('boss')<1) return;
    ch.cores.boss--;
    art.charges = Math.min(cap, art.charges + 3);
  } else {
    if(totalCorePower(false) < 3) return;
    spendCorePower(3);
    art.charges++;
  }
  saveCharacter(); render();
}

/* ============================== CRAFT ============================== */
const CRAFT_COST = {
  common:   {mats:{iron:3, wood:2}, cores:{}, minFloor:1},
  rare:     {mats:{iron:6, cloth:4, leather:3}, cores:{tier:'t1', count:3}, minFloor:1},
  epic:     {mats:{iron:12, leather:8, cloth:6}, cores:{tier:'t2', count:4}, minFloor:40, regionMat:5},
  legendary:{mats:{iron:22, leather:14}, cores:{tier:'t3', count:5, boss:3}, minFloor:70, regionMat:10, blueprint:true},
};
function blueprintId(lineId){ return 'bp_'+lineId; }
function hasBlueprint(lineId){ return !!(App.character.blueprints||{})[blueprintId(lineId)]; }
function blueprintItemCount(lineId){ return (App.character.blueprintItems||{})[lineId] || 0; }
function grantBlueprintItem(lineId, n){
  const bi = App.character.blueprintItems = App.character.blueprintItems || {};
  bi[lineId] = (bi[lineId]||0) + (n||1);
}
function lineById(lineId){ return weaponLine(lineId) || armorLine(lineId); }
function useBlueprintItem(lineId){
  const ch = App.character;
  if(blueprintItemCount(lineId) <= 0) return;
  ch.blueprintItems[lineId]--;
  if(ch.blueprintItems[lineId] <= 0) delete ch.blueprintItems[lineId];
  ch.blueprints = ch.blueprints || {};
  ch.blueprints[blueprintId(lineId)] = true;
  const line = lineById(lineId);
  App.craftNote = 'Recipe learned: ' + (line ? line.name : lineId) + ' — it now appears at the forge.';
  saveCharacter(); render();
}
function legendaryLines(){
  return WEAPON_CATALOG.filter(w=>w.rarity==='legendary').concat(ARMOR_CATALOG.filter(a=>a.rarity==='legendary'));
}
function craftRequirement(line){
  const cost = CRAFT_COST[line.rarity];
  const need = {mats:Object.assign({}, cost.mats), cores:Object.assign({}, cost.cores)};
  if(cost.regionMat){
    const sigPool = ['bone','ember','frost','venom','stone','feather','ectoplasm','magma','ash','slime'];
    const idx = (line.lineId.length + (line.slot? line.slot.length : line.classId.length)) % sigPool.length;
    need.mats[sigPool[idx]] = (need.mats[sigPool[idx]]||0) + cost.regionMat;
  }
  return need;
}
function canAffordCraft(line){
  const need = craftRequirement(line);
  const cost = CRAFT_COST[line.rarity];
  if(App.character.highestFloor < cost.minFloor-1) return false;
  if(cost.blueprint && !hasBlueprint(line.lineId)) return false;
  if(need.cores.boss && coreCount('boss') < need.cores.boss) return false;
  if(need.cores.count && coresAtOrAbove(need.cores.tier) < need.cores.count) return false;
  return Object.keys(need.mats).every(m=>matCount(m) >= need.mats[m]);
}
function craftCostLabel(line){
  const need = craftRequirement(line);
  const parts = Object.keys(need.mats).map(m=>`${MATERIALS[m].icon}${need.mats[m]}`);
  if(need.cores.count) parts.push(need.cores.count+'× '+CORE_TIERS[need.cores.tier].name+(need.cores.tier==='t4'?'':' or better'));
  if(need.cores.boss) parts.push(need.cores.boss+'× Boss Core');
  return parts.join(' · ');
}
function craftItem(lineId, kind){
  const ch = App.character;
  const line = kind==='weapon' ? weaponLine(lineId) : armorLine(lineId);
  if(!line || !canAffordCraft(line)) return;
  const need = craftRequirement(line);
  Object.keys(need.mats).forEach(m=>{ ch.materials[m] -= need.mats[m]; });
  if(need.cores.boss) ch.cores.boss -= need.cores.boss;
  if(need.cores.count) spendCoresAtOrAbove(need.cores.tier, need.cores.count);
  const item = kind==='weapon' ? makeWeaponInstance(line) : makeArmorInstance(line);
  if(kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  markDiscovered(line.lineId);
  App.craftNote = 'Forged: '+item.name;
  saveCharacter(); render();
}
function renderCraft(){
  const ch = App.character;
  const outer = document.createDocumentFragment();
  const matLine = MATERIAL_IDS.filter(m=>matCount(m)>0).map(m=>`<span class="mat-chip">${MATERIALS[m].icon} ${MATERIALS[m].name} ×${matCount(m)}</span>`).join('');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CRAFT</div>
    <p>Forge gear from what the dungeon gives up — ore, timber, cloth, hide, the parts monsters leave behind, and the <b>cores</b> torn out of them. Brighter cores come from deeper floors and stand in for duller ones. Legendary gear needs its <b>blueprint</b> and Boss Cores.</p>
    <div class="mat-line">${CORE_ORDER.filter(t=>coreCount(t)>0).map(t=>`<span class="core-chip">${coreIcon(t,18)} ${CORE_TIERS[t].name} ×${coreCount(t)}</span>`).join('') || '<span class="muted">No cores yet.</span>'}</div>
    <div class="mat-line">${matLine || '<span class="muted">No materials yet — clear floors to gather them.</span>'}</div>
  </div>`));
  if(App.craftNote){ outer.appendChild(el(`<div class="px-panel"><div class="feedback-msg good">${escapeHtml(App.craftNote)}</div></div>`)); App.craftNote = null; }

  function recipeRow(line, kind){
    const cost = CRAFT_COST[line.rarity];
    const need = craftRequirement(line);
    const locked = ch.highestFloor < cost.minFloor-1;
    const needsBp = cost.blueprint && !hasBlueprint(line.lineId);
    const afford = canAffordCraft(line);
    const statTxt = kind==='weapon'
      ? itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus})
      : ('+'+line.def+' DEF');
    const row = el(`<div class="recipe-row">
      <span class="rarity-${line.rarity}">${escapeHtml(line.name)} <span class="muted-dark">(${line.rarity}) — ${statTxt}</span>
        <span class="recipe-cost">${craftCostLabel(line)}</span></span>
      <span class="recipe-action"></span></div>`);
    const right = row.querySelector('.recipe-action');
    if(locked) right.textContent = 'Requires Floor '+cost.minFloor;
    else {
      const b = el(`<button class="px-btn small" ${afford?'':'disabled'}>Forge</button>`);
      b.addEventListener('click', ()=>craftItem(line.lineId, kind));
      right.appendChild(b);
    }
    return row;
  }

  const known = line => line.rarity!=='legendary' || hasBlueprint(line.lineId);
  const wpanel = el(`<div class="px-panel"><div class="dg-h2">Weapons — ${CLASSES[ch.classId].name} (${CLASSES[ch.classId].weaponType})</div></div>`);
  WEAPON_CATALOG.filter(w=>w.classId===ch.classId).filter(known).forEach(line=>wpanel.appendChild(recipeRow(line,'weapon')));
  outer.appendChild(wpanel);

  const apanel = el(`<div class="px-panel"><div class="dg-h2">Armor</div></div>`);
  ARMOR_CATALOG.filter(known).forEach(line=>apanel.appendChild(recipeRow(line,'armor')));
  outer.appendChild(apanel);

  const bps = Object.keys(ch.blueprints||{});
  const carried = Object.keys(ch.blueprintItems||{});
  const bpPanel = el(`<div class="px-panel"><div class="dg-h2">Learned Legendary Recipes</div><div class="item-grid"></div></div>`);
  const bg = bpPanel.querySelector('.item-grid');
  if(carried.length) bg.appendChild(el(`<div class="muted">You are carrying ${carried.length} unread blueprint${carried.length>1?'s':''} — study ${carried.length>1?'them':'it'} in your Inventory to add ${carried.length>1?'those recipes':'that recipe'} here.</div>`));
  if(!bps.length) bg.appendChild(el(`<div class="muted">No legendary recipes yet. Legendary schematics are carried by a certain dwarf — help him and he may part with one.</div>`));
  legendaryLines().forEach(line=>{
    if(!hasBlueprint(line.lineId)) return;
    bg.appendChild(el(`<div class="item-card"><span class="iname rarity-legendary">📜 ${escapeHtml(line.name)}</span><span class="istat">Blueprint learned — forge it above.</span></div>`));
  });
  outer.appendChild(bpPanel);

  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

/* ============================== INDEX (discovery bestiary/catalog) ============================== */

function indexCard(discovered, artMarkup, name, rarityClass, desc, extra){
  const card = el(`<div class="index-card${discovered?'':' undiscovered'}"></div>`);
  const holder = el('<div class="idx-art"></div>');
  holder.innerHTML = artMarkup;
  card.appendChild(holder);
  card.appendChild(el(`<span class="iname ${discovered?rarityClass:''}">${discovered?escapeHtml(name):'???'}</span>`));
  card.appendChild(el(`<span class="idesc">${discovered?escapeHtml(desc):'Not yet discovered.'}</span>`));
  if(extra) card.appendChild(el(`<span class="idesc">${discovered?escapeHtml(extra):'??'}</span>`));
  return card;
}
function renderIndex(){
  const ch = App.character;
  const outer = document.createDocumentFragment();
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">INDEX</div><p>Weapons, armor, artifacts and monsters you've discovered. Undiscovered entries stay a black-and-white mystery.</p></div>`));
  const tabs = el(`<div class="px-panel" style="margin-bottom:0;"><div class="index-tabs"></div></div>`);
  const tabsEl = tabs.querySelector('.index-tabs');
  [['weapons','Weapons'],['armor','Armor'],['relics','Boss Relics'],['artifacts','Artifacts'],['bestiary','Bestiary']].forEach(([id,label])=>{
    const b = el(`<button class="px-btn small${App.indexTab===id?' active':''}">${label}</button>`);
    b.addEventListener('click', ()=>{ App.indexTab=id; render(); });
    tabsEl.appendChild(b);
  });
  outer.appendChild(tabs);

  const panel = el(`<div class="px-panel"><div class="index-grid"></div></div>`);
  const grid = panel.querySelector('.index-grid');
  if(App.indexTab==='weapons'){
    WEAPON_CATALOG.forEach(line=>{
      const d = !!ch.discovered[line.lineId];
      grid.appendChild(indexCard(d, weaponArt(line.classId, line.rarity), line.name, 'rarity-'+line.rarity,
        `${CLASSES[line.classId].name} ${line.rarity} weapon. ${itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus})}.`,
        'Drop chance: '+RARITY_DROPCHANCE_DISPLAY[line.rarity]));

  } else if(App.indexTab==='armor'){
    ARMOR_CATALOG.forEach(line=>{
      const d = !!ch.discovered[line.lineId];
      grid.appendChild(indexCard(d, armorArt(line.slot, line.rarity), line.name, 'rarity-'+line.rarity,
        `${capitalize(line.slot)} armor, ${line.rarity}. +${line.def} DEF.`, 'Drop chance: '+RARITY_DROPCHANCE_DISPLAY[line.rarity]));
    });
  } else if(App.indexTab==='relics'){
    BOSS_FLOORS.forEach(f=>{
      const bd = BOSS_DEFS[f];
      const d = bd.drop;
      const disc = !!ch.discovered[d.lineId];
      const art = d.kind==='weapon' ? weaponArt(ch.classId, d.rarity) : armorArt(d.slot, d.rarity);
      grid.appendChild(indexCard(disc, art, d.name, 'rarity-'+d.rarity, d.desc,
        'Drops from '+bd.name+' (Floor '+f+') — 25%'));
    });
  } else if(App.indexTab==='artifacts'){
    ARTIFACT_KEYS.forEach(key=>{
      const d = !!ch.discovered['art_'+key];
      const def = ARTIFACT_DEFS[key];
      grid.appendChild(indexCard(d, artifactArt(key), def.name, 'rarity-legendary', def.desc, 'Drop chance: 10% from any 10th-floor boss (repeatable)'));
    });
  } else {
    for(let r=1;r<=10;r++){
      const rd = REGIONS[r-1];
      const dMon = !!ch.discovered['mon_'+r];
      grid.appendChild(indexCard(dMon, creatureArt(rd.arche, rd.color), rd.monster, '', `Common enemy of ${rd.name} (floors ${(r-1)*10+1}-${r*10-1}).`));
      const dBoss = !!ch.discovered['boss_'+r];
      const bd = BOSS_DEFS[r*10];
      grid.appendChild(indexCard(dBoss, creatureArt(bd.sprite, rd.color, {boss:true, palKey:bd.pal}), bd.name, 'rarity-epic',
        `Floor ${r*10} boss. ${bd.abilityName}: ${bd.abilityDesc}`));
    }
    const dFinal = !!ch.discovered['boss_final'];
    const fd = BOSS_DEFS[100];
    grid.appendChild(indexCard(dFinal, creatureArt('tyrant','#8dff9f',{palKey:'tyrant'}), fd.name, 'rarity-legendary',
      `Final boss, Floor 100. ${fd.abilityName}: ${fd.abilityDesc}`));
  }
  outer.appendChild(panel);
  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

function makeGauntletMonster(stage){

  const scale = 1.15 + stage*0.16;

    gauntletAbility:foe.ability, abilityName:foe.abilityName, abilityDesc:foe.abilityDesc,
    isBoss:false, isFinal:false, gauntlet:true, energy:0, energyMax:3};
}
function makeDwarfBoss(){
  const base = monsterStatsForFloor(95, App.character.ngPlus);
  return {name:DWARF_BOSS.name, hp:Math.round(base.hp*1.5), maxHp:Math.round(base.hp*1.5),
    atk:Math.round(base.atk*1.35), def:Math.round(base.def*1.6),

function startDwarfEvent(){

function rollDwarfStock(){
  const ch = App.character;
  const stock = [];
  const unlearned = legendaryLines().filter(l=>!hasBlueprint(l.lineId) && blueprintItemCount(l.lineId)===0);
  if(unlearned.length && chance(35)){
    const line = pick(unlearned);
    stock.push({type:'blueprint', lineId:line.lineId, name:'📜 Blueprint: '+line.name,
      desc:'A sealed schematic. Study it in your inventory to unlock the recipe.', price:randInt(420, 780), precious:true});
  }
  const rarePool = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && (w.rarity==='epic'||w.rarity==='legendary'))
    .concat(ARMOR_CATALOG.filter(a=>a.rarity==='epic'||a.rarity==='legendary'));
  shuffle(rarePool).slice(0, 2).forEach(line=>{
    const precious = line.rarity==='legendary';
    stock.push({type:'gear', lineId:line.lineId, kind:line.kind, name:(line.kind==='weapon'?'⚔ ':'🛡 ')+line.name,
      desc:(line.kind==='weapon'? itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus}) : '+'+line.def+' DEF')
        + (precious ? ' — "This one\'s dear to me, lad. It\'ll cost you."' : ''),
      price: precious ? randInt(500, 900) : randInt(180, 340), precious});
  });
  stock.push({type:'cores', tier:'boss', amount:randInt(2,4), name:'Boss Cores', desc:'Dense cores — good for the forge.', price:randInt(150,260)});
  const matId = pickMaterialId(App.run.floor||1);
  stock.push({type:'mat', matId, amount:randInt(6,12), name:MATERIALS[matId].icon+' '+MATERIALS[matId].name, desc:'Bulk crafting stock.', price:randInt(90,170)});
  return stock;
}
function dwarfBuy(idx){
  const s = App.run.dwarf.stock;
  const item = s[idx];
  if(!item || item.sold) return;
  if((App.run.gold||0) < item.price){ App.run.bossNote = 'The dwarf shakes his head. "Not enough coin."'; render(); return; }
  App.run.gold -= item.price;
  const ch = App.character;
  if(item.type==='blueprint') grantBlueprintItem(item.lineId);
  else if(item.type==='gear'){
    const line = item.kind==='weapon' ? weaponLine(item.lineId) : armorLine(item.lineId);
    const it = item.kind==='weapon' ? makeWeaponInstance(line) : makeArmorInstance(line);
    (item.kind==='weapon'? ch.weapons : ch.armors).push(it);
    markDiscovered(line.lineId);
  }
  else if(item.type==='cores') addCore(item.tier||'boss', item.amount);
  else if(item.type==='mat') addMaterial(item.matId, item.amount);
  item.sold = true;
  saveCharacter(); saveRun(); render();
}
function dwarfGift(){
  const gold = randInt(320, 640);
  App.run.gold = (App.run.gold||0) + gold;

  App.run.dwarf.gift = gold;
  App.dungeonView = 'dwarf_gift';
  saveRun(); render();
}

}

/* ============================== MYSTERIOUS MERCHANT ============================== */
function rollMerchantStock(floor){
  const ch = App.character;
  const stock = [];
  const potPool = shuffle(POTION_IDS).slice(0, 3);
  potPool.forEach(id=>{
    const p = POTIONS[id];
    stock.push({type:'potion', id, name:p.icon+' '+p.name, desc:p.desc, price:Math.round(p.price*(0.85+Math.random()*0.4))});
  });
  if(chance(60)){ const t = coreTierForFloor(floor); stock.push({type:'cores', tier:t, amount:randInt(3,7), name:CORE_TIERS[t].name+'s', desc:CORE_TIERS[t].desc+' Recharges artifacts and binds crafted gear.', price:randInt(60,120)}); }
  if(chance(45)){ const id=pickMaterialId(floor||1); stock.push({type:'mat', matId:id, amount:randInt(3,8), name:MATERIALS[id].icon+' '+MATERIALS[id].name, desc:'Crafting material.', price:randInt(50,110)}); }
  const learnable = Object.keys(MONSTER_BOOKS).map(k=>MONSTER_BOOKS[k])
    .filter(sid=>{ const s=SKILLS[sid]; return s && (!s.classes || s.classes.indexOf(ch.classId)>=0) && !(ch.learnedSkills||{})[sid]; });
  if(learnable.length && chance(70)){
    const sid = pick(learnable);
    stock.push({type:'book', id:sid, name:'📕 '+SKILLS[sid].name+' — Skill Book', desc:SKILLS[sid].desc+' (usable by your class)', price:randInt(140,260)});
  }
  return stock;
}
function merchantBuy(idx){
  const m = App.run.merchant;
  if(!m) return;
  const item = m.stock[idx];
  if(!item || item.sold) return;
  if((App.run.gold||0) < item.price){ App.run.bossNote = 'Not enough gold.'; render(); return; }
  App.run.gold -= item.price;
  const ch = App.character;
  if(item.type==='potion') addPotion(item.id, 1);
  else if(item.type==='cores') addCore(item.tier||'t1', item.amount);
  else if(item.type==='mat') addMaterial(item.matId, item.amount);
  else if(item.type==='book'){ ch.learnedSkills = ch.learnedSkills||{}; ch.learnedSkills[item.id] = true; }
  item.sold = true;
  saveCharacter(); saveRun(); render();
}
function learnBookFromBag(sid){
  const ch = App.character;
  if(!(ch.books||{})[sid]) return;
  const s = SKILLS[sid];
  if(s.classes && s.classes.indexOf(ch.classId)<0) return;
  ch.books[sid]--;
  ch.learnedSkills = ch.learnedSkills||{};
  ch.learnedSkills[sid] = true;
  saveCharacter(); render();
}
function leaveMerchant(){
  App.run.merchant = null;
  const floor = App.run.floor;
  saveRun();
  startFloor(floor+1);
}
function renderMerchant(){

  const grid = panel.querySelector('.item-grid');
  m.stock.forEach((item,i)=>{
    const card = el(`<div class="item-card${item.sold?' sold':''}">

      <span class="istat">${escapeHtml(item.desc)}</span>
      <span class="istat" style="color:var(--gold);">${item.price} gold</span></div>`);
    if(item.sold) card.appendChild(el(`<div class="istat" style="margin-top:8px;color:var(--jade);">Purchased</div>`));

      const b = el(`<button class="btn-pixel-sm primary" style="margin-top:8px;" ${(App.run.gold||0)<item.price?'disabled':''}>Buy</button>`);
      b.addEventListener('click', ()=>merchantBuy(i));
      card.appendChild(b);
    }
    grid.appendChild(card);
  });
  c.appendChild(panel);
  if(App.run.bossNote){ c.appendChild(el(`<div class="px-panel"><div class="feedback-msg bad">${escapeHtml(App.run.bossNote)}</div></div>`)); App.run.bossNote=null; }

  go.addEventListener('click', leaveMerchant);

/* ============================== CHARACTERS (class select + skill tree) ============================== */
function canAllocate(node, prog){
  if(prog.allocated[node.id]) return false;
  if(prog.skillPoints < node.cost) return false;
  if(node.tier===3 && prog.evolution && prog.evolution!==node.branch) return false;
  return node.requires.every(r=>prog.allocated[r]);
}
function allocateNode(nodeId){
  const ch = App.character; const prog = classProg();
  const node = findSkillNode(ch.classId, nodeId);
  if(!canAllocate(node, prog)) return;
  prog.allocated[nodeId] = true;
  prog.skillPoints -= node.cost;
  if(node.tier===3) prog.evolution = node.branch;
  saveCharacter(); render();
}
function resetSkillTree(){
  const prog = classProg();
  let refund = 0;
  Object.keys(prog.allocated).forEach(id=>{ const n=findSkillNode(App.character.classId,id); if(n) refund+=n.cost; });
  prog.allocated = {}; prog.evolution = null; prog.skillPoints += refund;
  saveCharacter(); render();
}
function selectClass(classId){ App.character.classId = classId; saveCharacter(); render(); }
function renderCharactersScreen(){
  const ch = App.character;
  const outer = el('<div class="dg-wrap"></div>');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CHARACTERS</div><p>Pick a class — each keeps its own level and skill tree, so you can freely switch and experiment.</p>
    <p class="muted">You are building the hero of <b>${escapeHtml(realmIcon()+' '+realmName())}</b>. Levels and skill trees belong to this realm alone — switch realms from <b>Play</b> and you build a separate hero there.</p></div>`));

  const cgrid = el(`<div class="px-panel"><div class="class-grid"></div></div>`);
  const cg = cgrid.querySelector('.class-grid');
  Object.values(CLASSES).forEach(cls=>{
    const prog = ch.classProgress[cls.id];
    const card = el(`<div class="class-card${ch.classId===cls.id?' active':''}"><div class="cc-art"></div><span class="cname">${cls.name}</span>${prog.evolution?`<span class="cevo">${evolutionName(cls.id,prog.evolution)}</span>`:''}<span class="istat">Lv ${prog.level}</span><span class="idesc">${cls.role}</span>${cls.passiveDesc?`<span class="idesc passive-line">${escapeHtml(cls.passiveDesc)}</span>`:''}</div>`);
    setArt(card.querySelector('.cc-art'), classArt(cls.id));
    const b = el(`<button class="px-btn small" style="margin-top:8px;">${ch.classId===cls.id?'Active':'Select'}</button>`);
    if(ch.classId!==cls.id) b.addEventListener('click', ()=>selectClass(cls.id));
    else b.disabled = true;
    card.appendChild(b);
    cg.appendChild(card);
  });
  outer.appendChild(cgrid);

  const prog = classProg();
  const tree = el(`<div class="px-panel"><div class="dg-h2">${CLASSES[ch.classId].name} Skill Tree — ${prog.skillPoints} skill point(s) available</div></div>`);
  [1,2,3].forEach(tier=>{
    const row = el(`<div class="tree-tier"><div class="tt-label">TIER ${tier}${tier===3?' — EVOLUTION (pick one)':''}</div><div class="tree-row"></div></div>`);
    const rowEl = row.querySelector('.tree-row');
    CLASSES[ch.classId].tree.filter(n=>n.tier===tier).forEach(node=>{
      const allocated = !!prog.allocated[node.id];
      const available = canAllocate(node, prog);
      const locked = !allocated && !available;
      const btn = el(`<button class="node-btn ${allocated?'allocated':''} ${locked?'locked':''}"><span class="nname">${node.name}</span><span class="ndesc">${node.desc}</span><span class="ncost">${allocated?'Allocated':('Cost: '+node.cost+' pt'+(node.requires.length?' · requires: '+node.requires.map(r=>findSkillNode(ch.classId,r).name).join(', '):''))}</span></button>`);
      if(available) btn.addEventListener('click', ()=>allocateNode(node.id));
      else if(!allocated) btn.disabled = true;
      rowEl.appendChild(btn);
    });
    tree.appendChild(row);
  });
  const learned = Object.keys(ch.learnedSkills||{}).filter(id=>{ const s=SKILLS[id]; return s && (!s.classes || s.classes.indexOf(ch.classId)>=0); });
  if(learned.length){
    const lp = el(`<div class="tree-tier"><div class="tt-label">LEARNED MONSTER SKILLS</div><div class="tree-row"></div></div>`);
    const lr = lp.querySelector('.tree-row');
    learned.forEach(id=>{
      const s = SKILLS[id];
      lr.appendChild(el(`<div class="node-btn allocated"><span class="nname">${escapeHtml(s.name)}</span><span class="ndesc">${escapeHtml(s.desc)}</span><span class="ncost">${s.cost} energy · from a skill book</span></div>`));
    });
    tree.appendChild(lp);
  }
  const resetBtn = el(`<button class="px-btn red">Reset Skill Tree (Free)</button>`);
  resetBtn.addEventListener('click', resetSkillTree);
  tree.appendChild(resetBtn);
  outer.appendChild(tree);
  return outer;
}

/* ============================== BOOTSTRAP ============================== */
async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    App.subjects = defaultSubjects();
    App.activeSubjectId = App.subjects[0].id;
    App.discovered = App.discovered || {};
    App.profiles = {};
    App.profileId = App.subjects[0].id;
    const p = realmData(App.profileId);
    App.character = p.character;
    App.run = p.run;
    App.dungeonView = 'select';
  }
  render();
}
init();
