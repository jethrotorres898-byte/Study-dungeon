<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dungeon — Tower of Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f3f1eb; --card:#ffffff; --ink:#211d2b; --muted:#726c85; --line:#e6e2f0;
  --accent:#6d5bd0; --accent-ink:#fff; --good:#2f9e5b; --bad:#d1495b; --warn:#d99a2b;
  --sans:'Inter',system-ui,sans-serif; --serif:'Lora',Georgia,serif;
  --dk-bg:#150f24; --dk-panel:#241a3c; --dk-panel2:#2e2050; --dk-border:#0a0714;
  --dk-gold:#f4c542; --dk-text:#ece6ff; --dk-muted:#a89bd4;
  --px:'Press Start 2P',monospace; --vt:'VT323',monospace;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--dk-bg);color:var(--ink);font-family:var(--sans);}
#root{min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit;}

/* ===== Always-present dark retro shell: top tabs + quick stats ===== */
.shell-nav{background:var(--dk-panel);border-bottom:4px solid var(--dk-border);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.brand{font-family:var(--px);color:var(--dk-gold);font-size:13px;margin-right:14px;letter-spacing:1px;text-shadow:2px 2px 0 #000;}
.navtab{background:var(--dk-panel2);color:var(--dk-text);border:3px solid var(--dk-border);padding:8px 14px;font-family:var(--px);font-size:10px;box-shadow:3px 3px 0 #000;}
.navtab.active{background:var(--dk-gold);color:#241a3c;}
.navtab:hover{filter:brightness(1.15);}
.quickstats{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--vt);font-size:16px;color:var(--dk-text);}
.qstat{background:#1b1330;border:2px solid var(--dk-border);padding:4px 10px;border-radius:3px;}
.subject-bar{background:#1b1330;border-bottom:3px solid var(--dk-border);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.subject-chip{background:var(--dk-panel2);color:var(--dk-text);border:2px solid var(--dk-border);padding:6px 12px;font-family:var(--vt);font-size:16px;box-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:6px;}
.subject-chip.active{background:var(--accent);color:#fff;}
.subject-chip button.mini{background:transparent;border:none;color:inherit;opacity:.7;font-size:14px;padding:0 2px;}
.subject-chip button.mini:hover{opacity:1;}
.inline-form{display:flex;gap:6px;align-items:center;background:#120c22;border:2px dashed #4a3d78;padding:6px 8px;}
.inline-form input{background:#1b1330;color:var(--dk-text);border:2px solid var(--dk-border);padding:5px 8px;font-family:var(--vt);font-size:16px;}
.btn-pixel-sm{background:var(--dk-panel2);color:var(--dk-text);border:2px solid var(--dk-border);padding:5px 10px;font-family:var(--vt);font-size:15px;box-shadow:2px 2px 0 #000;}
.btn-pixel-sm.primary{background:var(--good);color:#fff;}
.btn-pixel-sm.danger{background:var(--bad);color:#fff;}

/* ===== Content panel ===== */
#panel{flex:1;background:var(--bg);padding:22px;}
#panel.light .card{background:var(--card);border-radius:14px;box-shadow:0 4px 18px rgba(30,20,60,.08);padding:22px;max-width:980px;margin:0 auto 18px;}
#panel.light h1{font-family:var(--sans);font-weight:800;font-size:26px;margin:0 0 6px;}
#panel.light h2{font-family:var(--sans);font-weight:700;font-size:19px;margin:0 0 10px;}
#panel.light p, #panel.light li{font-family:var(--serif);font-size:16.5px;line-height:1.65;color:#2c2740;}
#panel.light .muted{color:var(--muted);font-family:var(--sans);font-size:13.5px;}
#panel.light .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-family:var(--sans);font-weight:600;font-size:14px;}
#panel.light .btn:hover{filter:brightness(1.08);}
#panel.light .btn.secondary{background:#eee9fb;color:var(--accent);}
#panel.light .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
#panel.light .btn.danger{background:var(--bad);color:#fff;}
#panel.light .btn:disabled{opacity:.45;cursor:not-allowed;}
#panel.light input[type=text],#panel.light input[type=password],#panel.light textarea,#panel.light select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:14.5px;background:#fcfbff;}
#panel.light textarea{font-family:var(--serif);font-size:16px;min-height:120px;resize:vertical;}
#panel.light .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
#panel.light .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
#panel.light .subject-card{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:#fdfcff;}
#panel.light .subject-card h3{margin:0 0 6px;font-size:16px;}
#panel.light .badge{display:inline-block;background:#eee9fb;color:var(--accent);border-radius:20px;padding:3px 10px;font-size:12px;font-family:var(--sans);font-weight:600;}
#panel.light .notesbox{white-space:pre-wrap;font-family:var(--serif);font-size:16.5px;line-height:1.7;background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:18px;max-height:520px;overflow:auto;}
#panel.light .log{font-family:'Menlo',monospace;font-size:12.5px;background:#14101f;color:#c9c2e6;border-radius:10px;padding:12px;max-height:220px;overflow:auto;white-space:pre-wrap;}
#panel.light .filerow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px;}
#panel.light .checkbox-row{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;color:var(--muted);}
#panel.light .empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-family:var(--sans);}
#panel.light .studytabs{display:flex;gap:8px;flex-wrap:wrap;max-width:980px;margin:0 auto 14px;}
#panel.light .studytabs button{background:#eee9fb;color:var(--accent);border:none;border-radius:8px;padding:8px 14px;font-family:var(--sans);font-weight:600;font-size:13.5px;}
#panel.light .studytabs button.active{background:var(--accent);color:#fff;}
#panel.light .mastery-bar{height:8px;border-radius:4px;background:#eee9fb;overflow:hidden;}
#panel.light .mastery-fill{height:100%;background:linear-gradient(90deg,#8f7ee8,#4a3aa8);}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.fc-card{width:min(520px,90vw);height:300px;perspective:1200px;}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.fc-inner.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;font-family:var(--serif);font-size:20px;background:#fff;box-shadow:0 6px 20px rgba(30,20,60,.10);}
.fc-face.back{transform:rotateY(180deg);background:#f4f1fe;}
.fc-nav{display:flex;gap:14px;align-items:center;font-family:var(--sans);flex-wrap:wrap;justify-content:center;}

/* ===== Dungeon: full pixel-retro ===== */
#panel.dungeon{background:var(--dk-bg);padding:0;}
.dg-wrap{font-family:var(--vt);color:var(--dk-text);min-height:70vh;}
.dg-h1{font-family:var(--px);font-size:16px;color:var(--dk-gold);text-shadow:2px 2px 0 #000;margin:0 0 14px;letter-spacing:1px;}
.dg-h2{font-family:var(--px);font-size:11px;color:var(--dk-text);margin:0 0 10px;}
.px-panel{background:var(--dk-panel);border:3px solid var(--dk-border);box-shadow:6px 6px 0 #000;padding:18px;margin:16px;overflow-x:auto;}
.px-btn{font-family:var(--px);font-size:11px;background:var(--dk-panel2);color:var(--dk-text);border:3px solid var(--dk-border);box-shadow:4px 4px 0 #000;padding:12px 16px;transition:transform .05s;}
.px-btn:hover:not(:disabled){filter:brightness(1.2);}
.px-btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #000;}
.px-btn:disabled{opacity:.4;cursor:not-allowed;}
.px-btn.gold{background:var(--dk-gold);color:#241a3c;}
.px-btn.red{background:#a83248;}
.px-btn.green{background:#2f7a4f;}
.px-btn.small{font-size:9px;padding:8px 10px;box-shadow:3px 3px 0 #000;}
.px-btn.block{display:block;width:100%;text-align:left;margin-bottom:10px;}
.px-input{font-family:var(--vt);font-size:18px;background:#1b1330;color:var(--dk-text);border:3px solid var(--dk-border);padding:8px 10px;}

/* loading screen */
.dg-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:22px;}
.pxbar-outer{width:340px;max-width:80vw;height:26px;border:3px solid var(--dk-border);background:#0d0918;box-shadow:4px 4px 0 #000;}
.pxbar-fill{height:100%;background:repeating-linear-gradient(90deg,#f4c542,#f4c542 8px,#e08a2b 8px,#e08a2b 16px);width:0%;transition:width .1s linear;}

/* Hub */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:16px 0;}
.hub-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;}
.stat-box{background:#1b1330;border:2px solid var(--dk-border);padding:10px;font-size:16px;}
.stat-box .lbl{font-family:var(--px);font-size:8px;color:var(--dk-muted);display:block;margin-bottom:6px;}
.bossrush-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}

/* battle scene */
.battle-scene{position:relative;min-height:440px;margin:16px;border:3px solid var(--dk-border);box-shadow:6px 6px 0 #000;overflow:hidden;
  background-image:
    radial-gradient(ellipse at 20% 30%, var(--rtint1,rgba(255,150,50,.18)), transparent 40%),
    radial-gradient(ellipse at 80% 25%, var(--rtint2,rgba(255,150,50,.18)), transparent 40%),
    repeating-linear-gradient(0deg,#2a2440,#2a2440 34px,#221d38 34px,#221d38 36px),
    repeating-linear-gradient(90deg,#332c4d,#332c4d 60px,#2a2440 60px,#2a2440 64px);
  background-color:#221d38;
}
.battle-scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,20,.15),rgba(10,7,20,.65) 85%);pointer-events:none;}
.battle-scene.shake{animation:screenshake .4s;}
@keyframes screenshake{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,3px);}40%{transform:translate(5px,-4px);}60%{transform:translate(-4px,4px);}80%{transform:translate(4px,-2px);}}
.combatant{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:2;}
.combatant.player{left:8%;bottom:12%;}
.combatant.monster{right:8%;bottom:12%;}
.combatant.monster.boss{right:50%;transform:translateX(50%);bottom:10%;}
.combatant.monster.boss .sprite-box{transform:scale(2);margin-top:22px;}
.namebar{font-family:var(--px);font-size:9px;color:#fff;text-shadow:2px 2px #000;margin-bottom:4px;text-align:center;}
.hpbar-wrap{width:170px;}
.hpbar-outer{position:relative;height:20px;border-radius:12px;background:#0a0714;border:3px solid var(--dk-gold);box-shadow:0 0 0 2px #000;overflow:hidden;width:100%;}
.hpbar-bg{position:absolute;inset:0;background:#9fb8c9;}
.hpbar-fill{position:absolute;inset:0;background:linear-gradient(180deg,#ff6b6b,#b5262f);width:100%;transition:width .4s ease;}
.hpbar-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--vt);font-size:14px;color:#fff;text-shadow:1px 1px 0 #000;z-index:3;}
.sprite-box{width:96px;height:96px;position:relative;margin-top:8px;image-rendering:pixelated;}
.sprite-box canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}
.sprite-flip{position:absolute;inset:0;}
.sprite-flip.mirror{transform:scaleX(-1);}
.combatant.player .sprite-box.dash{animation:dashfwd .3s;}
@keyframes dashfwd{0%{transform:translateX(0);}40%{transform:translateX(26px);}100%{transform:translateX(0);}}
.combatant.player .sprite-box.crouch{animation:crouchdown .35s;}
@keyframes crouchdown{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(8px) scaleY(.85);}}
.combatant .sprite-box.hitflash{animation:hitflash .3s;}
@keyframes hitflash{0%,100%{filter:none;}50%{filter:brightness(3) saturate(0);}}
.slashfx{position:absolute;width:110px;height:110px;top:10%;left:50%;pointer-events:none;opacity:0;z-index:5;}
.slashfx.show{animation:slashpop .3s ease-out;}
@keyframes slashpop{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-10deg);}30%{opacity:1;}60%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(-10deg);}100%{opacity:0;transform:translate(-50%,0) scale(1.3) rotate(-10deg);}}
.slashfx.x2{transform:translate(-50%,0) rotate(90deg);}
.dust-particle{position:absolute;width:6px;height:6px;background:#c9b98a;bottom:10%;left:50%;border-radius:1px;opacity:0;pointer-events:none;z-index:5;}
.dust-particle.go{animation:dustpuff .5s ease-out forwards;}
@keyframes dustpuff{0%{opacity:1;transform:translate(0,0);}100%{opacity:0;transform:translate(var(--dx),-46px) scale(.4);}}
.giant-sword{position:absolute;width:64px;height:64px;top:-10%;left:50%;transform:translate(-50%,-50%) scale(.2) rotate(0deg);opacity:0;pointer-events:none;z-index:6;}
.giant-sword.go{animation:giantswing .7s ease-in forwards;}
@keyframes giantswing{0%{opacity:1;transform:translate(-50%,-140%) scale(.4) rotate(-40deg);}60%{opacity:1;transform:translate(-50%,-30%) scale(1.6) rotate(60deg);}100%{opacity:0;transform:translate(-50%,10%) scale(1.8) rotate(90deg);}}
.impact-burst{position:absolute;width:90px;height:90px;border-radius:50%;top:20%;left:50%;transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,#fff6c9,#f4c542 40%,transparent 70%);opacity:0;pointer-events:none;z-index:7;}
.impact-burst.go{animation:impactpop .45s ease-out forwards;}
@keyframes impactpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);}30%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6);}}
.energy-row{display:flex;gap:6px;align-items:center;margin-top:8px;}
.energy-seg{width:22px;height:22px;border:2px solid var(--dk-border);background:#3a3450;display:flex;align-items:center;justify-content:center;font-size:12px;}
.energy-seg.filled{background:linear-gradient(180deg,#ffd35c,#e07b1f);box-shadow:0 0 8px 2px rgba(255,180,60,.75);}
.energy-seg.mfilled{background:linear-gradient(180deg,#c98cff,#6a2ea8);box-shadow:0 0 8px 2px rgba(160,80,220,.75);}
.energy-seg.mini{width:14px;height:14px;}
.charging-tag{font-family:var(--px);font-size:8px;color:#ff8a8a;margin-top:4px;animation:blink 1s infinite;}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:.25;}}
.floatnum{position:absolute;font-family:var(--px);font-size:13px;color:#fff;text-shadow:2px 2px 0 #000;z-index:8;pointer-events:none;animation:floatup 1s ease-out forwards;}
.floatnum.crit{color:#ffd35c;font-size:16px;}
.floatnum.heal{color:#7ee08a;}
@keyframes floatup{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}

/* boss bar top-center */
.boss-bar-top{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:82%;max-width:640px;z-index:9;text-align:center;}
.boss-bar-top .bname{font-family:var(--px);font-size:12px;color:var(--dk-gold);text-shadow:2px 2px 0 #000;margin-bottom:6px;}
.boss-bar-top .hpbar-outer{height:34px;border-radius:6px;}
.boss-bar-top .hpbar-num{font-size:17px;}
.boss-bar-top .energy-row{justify-content:center;margin-top:6px;}

/* question / controls panel below scene */
.controls-panel{margin:16px;}
.qbody{background:var(--dk-panel2);border:3px solid var(--dk-border);padding:16px;box-shadow:4px 4px 0 #000;}
.qtag{font-family:var(--px);font-size:8px;color:var(--dk-gold);display:block;margin-bottom:8px;}
.qtext{font-size:24px;margin-bottom:12px;}
.mcq-opt{display:block;width:100%;text-align:left;background:#1b1330;color:var(--dk-text);border:2px solid var(--dk-border);padding:10px 12px;margin-bottom:8px;font-family:var(--vt);font-size:18px;}
.mcq-opt:hover:not(:disabled){background:#332757;}
.mcq-opt.correct{background:#2f7a4f;}
.mcq-opt.wrong{background:#a83248;}
.skillbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px;}
.skillbtn{background:var(--dk-panel2);border:3px solid var(--dk-border);box-shadow:4px 4px 0 #000;padding:12px;text-align:left;color:var(--dk-text);}
.skillbtn:disabled{opacity:.4;}
.skillbtn .sname{font-family:var(--px);font-size:10px;color:var(--dk-gold);display:block;margin-bottom:6px;}
.skillbtn .sest{font-size:17px;display:block;}
.feedback-msg{font-size:20px;margin:10px 0;padding:10px;border:2px dashed var(--dk-muted);}
.feedback-msg.good{color:#7ee08a;}
.feedback-msg.bad{color:#ff8a8a;}
.artifact-inline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

/* inventory / craft / character / index */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.item-card{background:var(--dk-panel2);border:3px solid var(--dk-border);box-shadow:4px 4px 0 #000;padding:12px;}
.item-card .iname{font-family:var(--px);font-size:9px;display:block;margin-bottom:6px;}
.rarity-common{color:#c9c2e6;} .rarity-rare{color:#5fc2e0;} .rarity-epic{color:#c07be0;} .rarity-legendary{color:#f4c542;}
.item-card .istat{font-size:16px;color:var(--dk-text);display:block;}
.tbl{width:100%;border-collapse:collapse;font-size:16px;}
.tbl th,.tbl td{border:2px solid var(--dk-border);padding:6px 8px;text-align:left;}
.tbl th{background:var(--dk-panel2);font-family:var(--px);font-size:8px;color:var(--dk-gold);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px;}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dk-muted);font-family:var(--sans);}

.paperdoll{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.doll-figure{width:140px;height:140px;background:#1b1330;border:3px solid var(--dk-border);position:relative;flex-shrink:0;}
.doll-figure canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.3);image-rendering:pixelated;}
.doll-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:280px;}
.slot-box{background:var(--dk-panel2);border:3px dashed var(--dk-border);padding:10px;min-height:70px;cursor:pointer;}
.slot-box:hover{filter:brightness(1.15);}
.slot-box .slbl{font-family:var(--px);font-size:8px;color:var(--dk-gold);display:block;margin-bottom:6px;}
.slot-box .slname{font-size:16px;}
.slot-box.filled{border-style:solid;}
.stash-tabs{display:flex;gap:8px;margin-bottom:10px;}
.stash-tabs button.active{background:var(--dk-gold);color:#241a3c;}
.artifact-card{background:var(--dk-panel2);border:3px solid var(--dk-border);box-shadow:4px 4px 0 #000;padding:12px;}
.charge-row{display:flex;gap:4px;margin:6px 0;}
.charge-pip{width:16px;height:16px;border:2px solid var(--dk-border);background:#3a3450;}
.charge-pip.on{background:linear-gradient(180deg,#ffd35c,#e07b1f);}
.equip-toggle{margin-top:8px;}
.picker-overlay{background:#0d0918;border:3px solid var(--dk-gold);padding:14px;margin:0 16px 16px;}
.picker-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #332a52;font-size:16px;}

.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.index-card{background:var(--dk-panel2);border:3px solid var(--dk-border);box-shadow:4px 4px 0 #000;padding:12px;text-align:center;}
.index-card canvas{image-rendering:pixelated;margin-bottom:6px;}
.index-card.undiscovered{filter:grayscale(1) brightness(.55);}
.index-card .iname{font-family:var(--px);font-size:9px;display:block;margin:4px 0;}
.index-card .idesc{font-size:15px;color:var(--dk-muted);}
.index-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.index-tabs button.active{background:var(--dk-gold);color:#241a3c;}

.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px;}

<script>
/* ============================== STORAGE ============================== */
const Storage = {
  async get(key, fallback){
    try{
      if(window.storage && typeof window.storage.get==='function'){
        const v = await window.storage.get(key);
        return (v===undefined||v===null) ? fallback : v;
      }
    }catch(e){}
    try{
      const raw = localStorage.getItem('sd_'+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{
      if(window.storage && typeof window.storage.set==='function'){
        await window.storage.set(key, value);
        return;
      }
    }catch(e){}
    try{ localStorage.setItem('sd_'+key, JSON.stringify(value)); }catch(e){}
  }
};

/* ============================== UTILS ============================== */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function randInt(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(pct){ return Math.random()*100 < pct; }
function weightedPick(items){ // items: [{v, w}]
  const total = items.reduce((s,i)=>s+i.w,0);
  let r = Math.random()*total;
  for(const it of items){ if(r<it.w) return it.v; r-=it.w; }
  return items[items.length-1].v;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wordCount(s){ return (String(s||'').trim().match(/\S+/g)||[]).length; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function playAnim(element, className, durationMs){
  return new Promise(resolve=>{
    if(!element){ resolve(); return; }
    element.classList.add(className);
    setTimeout(()=>{ element.classList.remove(className); resolve(); }, durationMs);
  });
}
function capitalize(s){ return String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normText(s){ return String(s||'').toLowerCase().trim().replace(/[.,!?;:'"()\-]/g,'').replace(/\s+/g,' '); }
function fuzzyMatch(input, correct){
  const a = normText(input), b = normText(correct);
  if(!a) return false;
  if(a===b) return true;
  const aw = new Set(a.split(' ').filter(w=>w.length>2));
  const bw = new Set(b.split(' ').filter(w=>w.length>2));
  if(bw.size===0) return a===b;
  let hit=0; bw.forEach(w=>{ if(aw.has(w)) hit++; });
  return hit/bw.size >= 0.7;
}

/* ============================== AI CALL (Claude API, user-supplied key) ============================== */
let API_KEY_CACHE = null;
async function getApiKey(){
  if(API_KEY_CACHE!==null) return API_KEY_CACHE;
  API_KEY_CACHE = await Storage.get('apiKey','');
  return API_KEY_CACHE;
}
async function setApiKey(k){ API_KEY_CACHE = k||''; await Storage.set('apiKey', API_KEY_CACHE); }
async function callClaude(userText, imageParts){
  const apiKey = await getApiKey();
  if(!apiKey) throw new Error('No API key set — add one in Study \u2192 AI Settings to enable live AI notes/flashcards. Using the offline generator instead.');
  try{
    const content = [];
    if(imageParts && imageParts.length){
      for(const img of imageParts){
        content.push({type:'image', source:{type:'base64', media_type:'image/png', data: img}});
      }
    }
    content.push({type:'text', text:userText});
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens:1400,
        messages:[{role:'user', content}]
      })
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('AI request failed ('+res.status+'): '+t.slice(0,200));
    }
    const data = await res.json();
    const blk = (data.content||[]).find(b=>b.type==='text');
    return blk ? blk.text : '';
  }catch(err){
    throw new Error('AI call error: '+(err && err.message ? err.message : String(err)));
  }
}

/* ============================== PDF EXTRACTION ============================== */
if(window.pdfjsLib){
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
}
async function extractPdfText(arrayBuffer, onProgress){
  const doc = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
    if(onProgress) onProgress(i, doc.numPages);
  }
  return {text, doc};
}
async function renderPdfPageToImage(doc, pageNum, scale){
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({scale: scale||1.3});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport}).promise;
  return canvas.toDataURL('image/png').split(',')[1];
}
function chunkWords(text, wordsPerChunk){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const chunks = [];
  for(let i=0;i<words.length;i+=wordsPerChunk){
    chunks.push(words.slice(i,i+wordsPerChunk).join(' '));
  }
  return chunks.length ? chunks : [''];
}

/* ============================== LOCAL (OFFLINE) STUDY ANALYZER ============================== */
const STOPWORDS = new Set('a an the of to in on for and or but is are was were be been being this that these those it its as at by with from not no yes you your i we our they their he she his her them can will would should could may might into out about over under above below than then so such very more most also just only than'.split(' '));
function splitSentences(text){
  return String(text||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z0-9])/).map(s=>s.trim()).filter(s=>s.length>0);
}
function localAnalyze(text){
  const sentences = splitSentences(text).filter(s=>{ const wc=wordCount(s); return wc>=4 && wc<=42; });
  const freq = {};
  sentences.forEach(s=>{
    s.toLowerCase().match(/[a-z0-9']+/g)?.forEach(w=>{ if(!STOPWORDS.has(w) && w.length>2) freq[w]=(freq[w]||0)+1; });
  });
  const scored = sentences.map((s,idx)=>{
    const words = s.toLowerCase().match(/[a-z0-9']+/g)||[];
    const score = words.reduce((sum,w)=>sum+(freq[w]||0),0) / Math.max(1,words.length);
    return {s, idx, score};
  });
  const topN = clamp(Math.round(sentences.length*0.4), 4, 18);
  const top = scored.slice().sort((a,b)=>b.score-a.score).slice(0,topN).sort((a,b)=>a.idx-b.idx);
  const notes = top.length ? top.map(t=>'• '+t.s).join('\n') : (text||'').slice(0,600);

  // term:definition pattern flashcards
  const flashcards = [];
  const lines = String(text||'').split(/\n+/);
  lines.forEach(line=>{
    const m = line.match(/^\s*([A-Z][A-Za-z0-9 '\-]{2,40})\s*[:\-–]\s*(.{6,160})$/);
    if(m && flashcards.length<20){ flashcards.push({id:uid(), front:'Define/explain: '+m[1].trim(), back:m[2].trim(), mastery:0, dueAt:0}); }
  });
  // cloze-deletion fallback from top sentences
  if(flashcards.length<6){
    top.forEach(t=>{
      if(flashcards.length>=16) return;
      const words = t.s.match(/[A-Za-z][A-Za-z0-9'\-]{3,}/g)||[];
      if(!words.length) return;
      const candidates = words.filter(w=>!STOPWORDS.has(w.toLowerCase()));
      if(!candidates.length) return;
      const target = candidates.reduce((a,b)=> b.length>a.length?b:a);
      const re = new RegExp('\\b'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
      if(!re.test(t.s)) return;
      const blanked = t.s.replace(re, '_____');
      flashcards.push({id:uid(), front:'Fill in the blank: '+blanked, back:target, mastery:0, dueAt:0});
    });
  }
  return {notes, flashcards};
}

      });

}
function buildArmorCatalog(){

      });

}

function backfill(target, defaults){
  if(!target || typeof target!=='object') return JSON.parse(JSON.stringify(defaults));
  for(const k in defaults){
    if(!(k in target)){ target[k] = JSON.parse(JSON.stringify(defaults[k])); }
    else if(defaults[k] && typeof defaults[k]==='object' && !Array.isArray(defaults[k]) && typeof target[k]==='object'){
      backfill(target[k], defaults[k]);
    }
  }
  target.version = SAVE_VERSION;
  return target;
}

/* ============================== PIXEL ART ENGINE ============================== */
function makeGrid(w,h){ return Array.from({length:h}, ()=>Array(w).fill('.')); }
function fillRect(g,x,y,w,h,tok){
  for(let j=Math.round(y); j<Math.round(y+h); j++){
    if(!g[j]) continue;
    for(let i=Math.round(x); i<Math.round(x+w); i++){ if(i>=0 && i<g[j].length) g[j][i]=tok; }
  }
}
function fillCircle(g,cx,cy,r,tok){
  const h=g.length, w=g[0].length;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=x-cx+0.5, dy=(y-cy+0.5)*1.1;
    if(dx*dx+dy*dy<=r*r) g[y][x]=tok;
  }
}
function setCell(g,x,y,tok){ if(g[y] && x>=0 && x<g[y].length) g[y][x]=tok; }
function fillWedge(g,x0,y0,rows,thickness,tok){
  for(let i=0;i<rows;i++) fillRect(g,x0+i,y0+i,rows-i,thickness,tok);
}
function shade(hex, pct){
  const c = hex.replace('#','');
  const num = parseInt(c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  const t = pct<0?0:255, p = Math.abs(pct);
  r = Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
function drawPixelSprite(canvas, grid, colorMap){
  const h = grid.length, w = grid[0].length;
  const cell = 4;
  canvas.width = w*cell; canvas.height = h*cell;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const filled = (x,y)=> y>=0 && y<h && x>=0 && x<w && grid[y][x] !== '.';
  ctx.fillStyle = '#0a0a12';
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!filled(x,y)) continue;
    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny])=>{
      if(nx>=0 && nx<w && ny>=0 && ny<h && !filled(nx,ny)) ctx.fillRect(nx*cell,ny*cell,cell,cell);
    });
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const tok = grid[y][x];
    if(tok==='.') continue;
    ctx.fillStyle = colorMap[tok] || '#ff00ff';
    ctx.fillRect(x*cell,y*cell,cell,cell);
  }
}

/* ============================== GAMEPLAY HELPERS: LEVEL / STATS ============================== */
function xpToNext(level){ return 40 + (level-1)*22; }
function classProg(){ return App.character.classProgress[App.character.classId]; }
function levelStats(classId, level){
  const c = CLASSES[classId];
  return { hp: c.base.hp + c.growth.hp*(level-1), atk: c.base.atk + c.growth.atk*(level-1), def: c.base.def + c.growth.def*(level-1), energyMax: c.base.energyMax };
}
function getEquippedItem(slot){
  const ch = App.character;
  const id = ch.equipped[slot];
  if(!id) return null;
  if(slot==='weapon') return ch.weapons.find(w=>w.id===id) || null;
  return ch.armors.find(a=>a.id===id) || null;
}
function artifactSlots(){ return ['artifact1','artifact2']; }
function isArtifactEquipped(key){ return App.character.equipped.artifact1===key || App.character.equipped.artifact2===key; }
function isArtifactActive(key){
  const art = App.character.artifacts[key];
  return !!(art && art.owned && art.charges>0 && isArtifactEquipped(key));
}
function avgMasteryPct(){
  let total=0, count=0;
  App.subjects.forEach(s=> (s.flashcards||[]).forEach(c=>{ total+=(c.mastery||0); count++; }));
  if(!count) return 0;
  return (total/count)/5*100;
}
function combatStats(){
  const ch = App.character;
  const prog = classProg();
  const cls = CLASSES[ch.classId];
  const lvl = levelStats(ch.classId, prog.level);
  let atk=lvl.atk, def=lvl.def, hp=lvl.hp, critChance=5, energyMax=lvl.energyMax, lifestealPct=0;
  let atkPct=0, defPct=0, hpPct=0, energyGainPct=0;
  Object.keys(prog.allocated).forEach(nodeId=>{
    const node = findSkillNode(ch.classId, nodeId);
    if(!node) return;
    const e = node.effect||{};
    if(e.atk) atk+=e.atk;
    if(e.def) def+=e.def;
    if(e.hp) hp+=e.hp;
    if(e.critChance) critChance+=e.critChance;
    if(e.mods){
      atkPct += e.mods.atkPct||0; defPct += e.mods.defPct||0; hpPct += e.mods.hpPct||0;
      critChance += (e.mods.critChancePct||0); lifestealPct += (e.mods.lifestealPct||0); energyGainPct += (e.mods.energyGainPct||0);
    }
  });
  const weapon = getEquippedItem('weapon');
  if(weapon){ atk += weapon.atk; critChance += weapon.critBonus||0; lifestealPct += weapon.lifeBonus||0; }
  ['head','chest','legs'].forEach(slot=>{ const a=getEquippedItem(slot); if(a) def+=a.def; });
  atk += ch.strength*2; hp += ch.maxHpBonus*10;
  if(isArtifactActive('titan')){
    if(ch.titanStat==='hp') hpPct+=0.15;
    if(ch.titanStat==='atk') atkPct+=0.12;
    if(ch.titanStat==='def') defPct+=0.12;
    if(ch.titanStat==='energy') energyMax+=1;
  }
  critChance += Math.floor(avgMasteryPct()/20);
  atk = Math.round(atk*(1+atkPct));
  def = Math.round(def*(1+defPct));
  hp = Math.round(hp*(1+hpPct));
  return {atk, def, maxHp:hp, critChance:clamp(critChance,0,90), energyMax, lifestealPct, energyGainPct, weapon};
}
function activeSkillId(){
  const ch = App.character;
  const prog = classProg();
  const node2 = findSkillNode(ch.classId, ch.classId+'_t2_skill');
  const baseSkill = prog.allocated[node2.id] ? node2.effect.unlockSkill : null;
  if(!baseSkill) return null;
  if(prog.evolution){
    const evoNode = findSkillNode(ch.classId, ch.classId+'_t3_'+prog.evolution);
    if(evoNode && prog.allocated[evoNode.id]) return evoNode.effect.evoSkill;
  }
  return baseSkill;
}

  let cap = ARTIFACT_DEFS[key].maxCharges;
  const prog = App.character.classProgress.rogue;
  if(App.character.classId==='rogue' && prog.evolution==='B' && prog.allocated['rogue_t3_B']) cap += 1;
  return cap;
}
function grantXp(amount){
  const prog = classProg();
  prog.xp += amount;
  while(prog.xp >= xpToNext(prog.level)){
    prog.xp -= xpToNext(prog.level);
    prog.level++;
    prog.skillPoints++;
  }
}

function scrambleAnswer(back){
  const n = parseFloat(back);
  if(!isNaN(n) && /^-?\d+(\.\d+)?$/.test(String(back).trim())){
    const delta = Math.max(1, Math.round(Math.abs(n)*0.15))||1;
    return String(Math.round(n + (chance(50)?1:-1)*randInt(1,delta+2)));
  }
  const words = String(back).split(' ');
  if(words.length>1) return shuffle(words).join(' ');
  return back+' (variant)';
}
function cardWeight(card){
  const now = Date.now();
  const dueBonus = (card.dueAt||0) <= now ? 40 : 4;
  return dueBonus + (5-(card.mastery||0))*8 + 1;
}
function pickWeightedCard(pool){
  return weightedPick(pool.map(c=>({v:c, w:cardWeight(c)})));
}
function questionPool(){
  const s = activeSubject();
  return (s && s.flashcards && s.flashcards.length) ? s.flashcards : STARTER_DECK;
}
function isUsingDemoDeck(){ const s = activeSubject(); return !(s && s.flashcards && s.flashcards.length); }
function buildQuestion(){
  const pool = questionPool();
  const card = pickWeightedCard(pool);
  const others = pool.filter(c=>c.id!==card.id);
  let mode='mcq', options=[];
  if(others.length>=3){
    options = shuffle([card.back, ...shuffle(others.map(c=>c.back)).slice(0,3)]);
  } else if(others.length>0){
    const distractors = shuffle(others.map(c=>c.back));
    while(distractors.length<3) distractors.push(scrambleAnswer(card.back));
    options = shuffle([card.back, ...distractors.slice(0,3)]);
  } else {
    mode='text';
  }
  return {id:uid(), cardId:card.id, prompt:card.front, correct:card.back, mode, options, hintUsed:false, eliminatedIdx:null};
}
function updateCardMastery(cardId, correct){
  const pool = questionPool();
  const card = pool.find(c=>c.id===cardId);
  if(!card) return;
  const intervals = [5*60000, 30*60000, 3*3600000, 1*86400000, 3*86400000, 7*86400000];
  if(correct){ card.mastery = clamp((card.mastery||0)+1, 0, 5); card.dueAt = Date.now()+intervals[clamp(card.mastery-1,0,5)]; }
  else { card.mastery = clamp((card.mastery||0)-1, 0, 5); card.dueAt = Date.now(); }
  if(!isUsingDemoDeck()) saveSubjects();
}

const DEFAULT_INSTRUCTION = 'Produce study notes and flashcards from the SOURCE TEXT below. Reply in EXACTLY this format, no extra commentary:\nNOTES:\n<concise study notes as headings and bullet points, highlighting key terms/definitions/facts>\nFLASHCARDS_JSON:\n<a strict JSON array like [{"q":"...","a":"..."}] with 6-14 short question/answer flashcards testing the material>';
function parseAiAnalysis(raw){
  const idx = raw.indexOf('FLASHCARDS_JSON:');
  let notes = raw, flashcards = [];
  if(idx>=0){
    notes = raw.slice(0, idx).replace(/^NOTES:\s*/i,'').trim();
    const jsonPart = raw.slice(idx+'FLASHCARDS_JSON:'.length);
    const start = jsonPart.indexOf('['), end = jsonPart.lastIndexOf(']');
    if(start>=0 && end>start){
      try{
        const arr = JSON.parse(jsonPart.slice(start,end+1));
        arr.forEach(item=>{ if(item && item.q && item.a) flashcards.push({id:uid(), front:String(item.q), back:String(item.a), mastery:0, dueAt:0}); });
      }catch(e){}

  }
  return {notes, flashcards};
}

async function processUploadBatch(container, log){
  const q = App.uploadQueue;
  if(!q) return;
  const s = activeSubject();
  const BATCH = 10;
  const end = Math.min(q.chunks.length, q.idx+BATCH);
  for(let i=q.idx; i<end; i++){
    const ch = q.chunks[i];
    log(`Analyzing chunk ${i+1}/${q.chunks.length}${ch.source?(' ('+ch.source+')'):''}...`);
    let result = null;
    try{
      const prompt = `${q.instruction}\n\n---\nSOURCE TEXT:\n${ch.text}`;
      const raw = await callClaude(prompt, ch.images);
      result = parseAiAnalysis(raw);
      if(!result.notes && !result.flashcards.length) throw new Error('empty AI response');
      log('  ✓ AI analysis done ('+result.flashcards.length+' flashcards).');
    }catch(err){
      log('  ⚠ '+err.message+' — using offline generator instead.');
      result = localAnalyze(ch.text);
      log('  ✓ offline analysis done ('+result.flashcards.length+' flashcards).');
    }
    s.notes = (s.notes ? s.notes+'\n\n' : '') + (result.notes||'').trim();
    const existingFronts = new Set(s.flashcards.map(c=>normText(c.front)));
    (result.flashcards||[]).forEach(fc=>{ if(!existingFronts.has(normText(fc.front))){ s.flashcards.push(fc); existingFronts.add(normText(fc.front)); } });
    await saveSubjects();
  }
  q.idx = end;
  const continueBtn = container.querySelector('#up-continue');
  if(q.idx < q.chunks.length){
    log(`Paused after batch — ${q.chunks.length-q.idx} chunk(s) remaining.`);
    if(continueBtn) continueBtn.style.display = '';
  } else {
    log('All chunks analyzed. Notes and flashcards updated — they now appear as combat questions in the Dungeon too.');
    App.uploadQueue = null;
    if(continueBtn) continueBtn.style.display = 'none';
  }
}

function rarityWeightsForRegion(region){
  const t = clamp((region-1)/9,0,1);
  return [ {v:'common',w:58-50*t}, {v:'rare',w:30-6*t}, {v:'epic',w:10+26*t}, {v:'legendary',w:2+30*t} ];
}
function rollRarityForRegion(region){ return weightedPick(rarityWeightsForRegion(region)); }
function makeWeaponInstance(line){ return {id:uid(), kind:'weapon', lineId:line.lineId, classId:line.classId, rarity:line.rarity, name:line.name, atk:line.atk, critBonus:line.critBonus||0, lifeBonus:line.lifeBonus||0}; }
function makeArmorInstance(line){ return {id:uid(), kind:'armor', lineId:line.lineId, slot:line.slot, rarity:line.rarity, name:line.name, def:line.def}; }
function rollFloorLoot(floor){
  const ch = App.character;
  const region = regionForFloor(floor);
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const loot = [];
  let crystalAmt = final ? 30 : (boss ? randInt(8,15) : randInt(1,3));
  ch.crystals += crystalAmt;
  loot.push({kind:'crystal', label:'+'+crystalAmt+' Charge Crystals'});
  if(chance(boss?60:20)){ const amt = boss?randInt(3,6):randInt(1,2); ch.scrap+=amt; loot.push({kind:'scrap', label:'+'+amt+' Scrap'}); }
  let itemChance = boss ? 70 : 22;
  if(isArtifactActive('fortune')) itemChance = Math.min(100, itemChance*1.15);
  if(chance(itemChance)){
    const rarity = rollRarityForRegion(region);
    if(chance(50)){
      const opts = WEAPON_CATALOG.filter(w=>w.classId===ch.classId && w.rarity===rarity);
      if(opts.length){ const line=pick(opts); const w=makeWeaponInstance(line); ch.weapons.push(w); markDiscovered(line.lineId); loot.push({kind:'weapon', label:w.name+' ('+rarity+')'}); }
    } else {
      const opts = ARMOR_CATALOG.filter(a=>a.rarity===rarity);
      if(opts.length){ const line=pick(opts); const a=makeArmorInstance(line); ch.armors.push(a); markDiscovered(line.lineId); loot.push({kind:'armor', label:a.name+' ('+rarity+')'}); }
    }
  }
  if(boss){
    let artChance = 10;
    if(isArtifactActive('fortune')) artChance *= 1.15;
    if(chance(artChance)){
      const notOwned = ARTIFACT_KEYS.filter(k=>!ch.artifacts[k].owned);
      if(notOwned.length){ const key=pick(notOwned); ch.artifacts[key]={owned:true,charges:ARTIFACT_DEFS[key].maxCharges}; markDiscovered('art_'+key); loot.push({kind:'artifact', label:'✨ '+ARTIFACT_DEFS[key].name+'!'}); }
      else { ch.crystals+=10; loot.push({kind:'crystal', label:'+10 bonus Crystals (all artifacts already owned)'}); }
    }
    ['fortune','titan'].forEach(k=>{ if(isArtifactEquipped(k) && ch.artifacts[k].owned && ch.artifacts[k].charges>0) ch.artifacts[k].charges--; });
    if(!ch.bossFloorsCleared.includes(floor) && floor<MAX_FLOOR) ch.bossFloorsCleared.push(floor);
  }
  ch.highestFloor = Math.max(ch.highestFloor, floor);
  return loot;
}
function bestiaryKeyFor(monster){
  if(monster.isFinal) return 'boss_final';
  if(monster.isBoss) return 'boss_'+monster.region;
  return 'mon_'+monster.region;
}

/* ============================== COMBAT ORCHESTRATION ============================== */
function computeHit(atk, mult, monsterDef, defPierce){
  const variance = 0.85+Math.random()*0.3;
  const raw = atk*mult*variance;
  const reduction = (monsterDef||0)*(1-(defPierce||0));
  return Math.max(1, Math.round(raw-reduction));
}
function enterDungeonLoading(afterFn){
  App.dungeonView = 'loading';
  render();
  let pct = 0;
  const bar = document.querySelector('.pxbar-fill');
  const t = setInterval(()=>{
    pct += 8+Math.random()*10;
    if(bar) bar.style.width = Math.min(100,pct)+'%';
    if(pct>=100){ clearInterval(t); afterFn(); }
  }, 90);
}
function startRun(){
  const st = combatStats();
  App.run = Object.assign(defaultRun(), {active:true, floor:1, hp:st.maxHp, maxHp:st.maxHp, energy:0});
  saveRun();
  startFloor(1);
}
function startBossRush(floor){
  const st = combatStats();
  App.run = Object.assign(defaultRun(), {active:true, floor, hp:st.maxHp, maxHp:st.maxHp, energy:0, bossRush:true, bossRushFloor:floor});
  saveRun();
  startFloor(floor);
}
function startFloor(floor){
  App.run.floor = floor;
  const st = combatStats();
  App.run.maxHp = st.maxHp;
  App.run.hp = Math.min(App.run.hp, st.maxHp);
  App.run.monster = generateMonster(floor, App.character.ngPlus);
  App.run.burn = {turnsLeft:0, perTurn:0};
  App.run.shieldPct = 0; App.run.nullifyNextWrong = false;
  markDiscovered(bestiaryKeyFor(App.run.monster));
  App.dungeonView = 'battle';
  saveRun(); saveCharacter();
  startNewTurn();
}
function startNewTurn(){
  if(App.run.monster && App.run.monster.hp<=0){ handleVictory(); return; }
  if(App.run.burn && App.run.burn.turnsLeft>0){
    const m = App.run.monster;
    m.hp = clamp(m.hp - App.run.burn.perTurn, 0, m.maxHp);
    App.run.burn.turnsLeft--;
    saveRun();
    if(m.hp<=0){ handleVictory(); return; }
  }
  App.currentQuestion = buildQuestion();
  if(App.run.freeHintNext){ applyHintToQuestion(App.currentQuestion); App.run.freeHintNext = false; }
  App.currentPhase = 'question';
  render();
}
function applyHintToQuestion(q){
  q.hintUsed = true;
  if(q.mode==='mcq'){
    if(q.eliminatedIdx==null){
      const wrongIdxs = q.options.map((v,i)=>i).filter(i=>q.options[i]!==q.correct);
      if(wrongIdxs.length) q.eliminatedIdx = pick(wrongIdxs);
    }
  } else {
    q.hintText = String(q.correct).slice(0, Math.max(1,Math.ceil(String(q.correct).length*0.3)));
  }
}
function useHintArtifact(){
  const q = App.currentQuestion;
  if(!q || q.hintUsed || !isArtifactActive('lens')) return;
  App.character.artifacts.lens.charges--;
  applyHintToQuestion(q);
  saveCharacter();
  render();
}
async function submitAnswer(rawValue){
  const q = App.currentQuestion;
  if(!q) return;
  const correct = q.mode==='mcq' ? (rawValue===q.correct) : fuzzyMatch(rawValue, q.correct);
  App.lastAnswerCorrect = correct;
  App.currentPhase = 'reveal';
  render();
  await sleep(500);
  updateCardMastery(q.cardId, correct);
  App.character.totalAnswered++;
  if(correct){ App.character.correctAnswerCount++; grantXp(4+(chance(25)?2:0)); }
  await saveCharacter();
  if(correct) await resolvePlayerHit(1.0, {}, false);
  else await resolveMonsterHit();
}
async function resolvePlayerHit(mult, opts, isSkill){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  await playAnim(battleEls.playerSprite, 'dash', 280);
  triggerSlash(battleEls.slashfx, !!opts.guaranteedCrit);
  let dmg = computeHit(st.atk, mult, m.def, opts.defPierce);
  let crit = false;
  if(opts.guaranteedCrit){ crit = true; dmg = Math.round(dmg*1.6); }
  else if(chance(st.critChance)){ crit = true; dmg = Math.round(dmg*1.6); }
  if(opts.executeBelowPct && (m.hp/m.maxHp) < opts.executeBelowPct){ dmg = Math.round(dmg*opts.executeMult); }
  let heal = 0;
  if(st.lifestealPct>0) heal += Math.round(dmg*st.lifestealPct/100);
  if(opts.healPct) heal += Math.round(st.maxHp*opts.healPct);
  if(opts.selfDmgPct){ App.run.hp = clamp(App.run.hp - Math.round(App.run.hp*opts.selfDmgPct), 1, st.maxHp); }
  m.hp = clamp(m.hp - dmg, 0, m.maxHp);
  if(opts.burnTurns){ App.run.burn = {turnsLeft:opts.burnTurns, perTurn: Math.max(1,Math.round(m.maxHp*opts.burnPct/opts.burnTurns))}; }
  if(opts.shieldPct){ App.run.shieldPct = opts.shieldPct; }
  if(opts.nullifyNextWrong){ App.run.nullifyNextWrong = true; }
  if(opts.freeHintNext){ App.run.freeHintNext = true; }
  if(opts.energyRefundOnCrit && crit){ App.run.energy = clamp(App.run.energy+opts.energyRefundOnCrit, 0, st.energyMax); }
  if(heal>0) App.run.hp = clamp(App.run.hp+heal, 0, st.maxHp);
  triggerImpact(battleEls.monsterHost);
  await playAnim(battleEls.monsterSprite, 'hitflash', 300);
  updateHpBar(battleEls.monsterHpFill, battleEls.monsterHpNum, m.hp, m.maxHp);
  if(heal>0) updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp);
  showFloatingNumber(battleEls.monsterHost, '-'+dmg, crit);
  if(heal>0) showFloatingNumber(battleEls.playerHost, '+'+heal, false, true);
  tickMonsterEnergy(false);
  await sleep(400);
  await saveRun(); await saveCharacter();
  if(m.hp<=0){ await handleVictory(); return; }
  App.currentPhase = isSkill ? 'skillresult' : 'postattack';
  render();
}
function tickMonsterEnergy(wasAttack){
  const m = App.run.monster;
  if(!m) return false;
  m.energy++;
  if(m.energy>=m.energyMax){ m.energy=0; return true; }
  return false;
}
async function resolveMonsterHit(){
  const battleEls = getBattleEls();
  const st = combatStats();
  const m = App.run.monster;
  const charged = tickMonsterEnergy(true);
  let dmg = Math.max(1, Math.round(m.atk*(0.85+Math.random()*0.3) - st.def*0.5));
  if(charged) dmg = Math.round(dmg*1.6);
  let nullified = false, shielded = false;
  if(App.run.nullifyNextWrong){ dmg = 0; nullified = true; App.run.nullifyNextWrong = false; }
  else if(App.run.shieldPct>0){ dmg = Math.round(dmg*(1-App.run.shieldPct)); shielded = true; App.run.shieldPct = 0; }
  App.run.hp = clamp(App.run.hp - dmg, 0, st.maxHp);
  if(battleEls.scene) battleEls.scene.classList.add('shake');
  await playAnim(battleEls.playerSprite, 'hitflash', 300);
  updateHpBar(battleEls.playerHpFill, battleEls.playerHpNum, App.run.hp, st.maxHp);
  showFloatingNumber(battleEls.playerHost, nullified?'Blocked!':(charged?('-'+dmg+' CHARGED!'):('-'+dmg)), charged);
  await sleep(450);
  if(battleEls.scene) battleEls.scene.classList.remove('shake');
  await saveRun();
  if(App.run.hp<=0){ await handleDeath(); return; }
  App.currentPhase = 'postattack';
  render();
}
async function useActiveSkill(){
  const skillId = activeSkillId();
  if(!skillId) return;
  const skill = SKILLS[skillId];
  const st = combatStats();
  if(App.run.energy < st.energyMax) return;
  App.run.energy = 0;
  const battleEls = getBattleEls();
  triggerWeaponIcon(battleEls.monsterHost, App.character.classId);
  await resolvePlayerHit(skill.mult, skill, true);
}
async function handleDeath(){
  const ch = App.character;
  if(isArtifactActive('phoenix') && ch.artifacts.phoenix.charges>0){
    ch.artifacts.phoenix.charges--;
    const st = combatStats();
    App.run.hp = Math.max(1, Math.round(st.maxHp*0.3));
    App.reviveFlash = true;
    await saveCharacter(); await saveRun();
    App.currentPhase = 'revived';
    render();
    return;
  }
  App.run.active = false;
  App.dungeonView = 'death';
  await saveRun();
  render();
}
async function handleVictory(){
  const floor = App.run.floor;
  grantXp(isFinalFloor(floor) ? 300 : (isBossFloor(floor) ? 50+floor : 12+Math.round(floor*0.5)));
  const loot = rollFloorLoot(floor);
  App.run.lastLoot = loot;
  await saveCharacter();
  App.dungeonView = 'loot';
  await saveRun();
  render();
}
function continueAfterLoot(){
  const floor = App.run.floor;
  if(App.run.bossRush){ App.run.active=false; goToHub(); return; }
  if(isFinalFloor(floor)){ App.run.active=false; App.dungeonView='victory'; saveRun(); render(); return; }
  if(isBossFloor(floor)){ App.dungeonView='checkpoint'; App.checkpointResult=null; render(); return; }
  startFloor(floor+1);
}
function doScavenge(){
  const result = weightedPick([{v:'greater',w:5},{v:'hp',w:30},{v:'none',w:65}]);
  let msg;
  if(result==='greater'){ App.character.potions.greaterHp++; msg='You found a Greater HP Potion! (+60 heal)'; }
  else if(result==='hp'){ App.character.potions.hp++; msg='You found an HP Potion! (+30 heal)'; }
  else msg='You scavenge the area but find nothing.';
  App.checkpointResult = msg; saveCharacter(); render();
}
function doTrain(){

  if(chance(50)){ App.character.strength++; msg='Training complete: +1 base Attack!'; }
  else { App.character.maxHpBonus++; msg='Training complete: +10 base Max HP!'; }
  App.checkpointResult = msg; saveCharacter(); render();
}
function checkpointContinue(){ App.checkpointResult=null; startFloor(App.run.floor+1); }
function retryRun(){ startRun(); }
function newGamePlus(){ App.character.ngPlus++; App.character.highestFloor=0; App.character.bossFloorsCleared=[]; saveCharacter(); startRun(); }
function goToHub(){ App.dungeonView='hub'; render(); }
function fleeRun(){ App.run.active=false; saveRun(); goToHub(); }
async function usePotionInCombat(kind){
  const st = combatStats();
  if(kind==='hp' && App.character.potions.hp>0){ App.character.potions.hp--; App.run.hp=clamp(App.run.hp+30,0,st.maxHp); }
  else if(kind==='greater' && App.character.potions.greaterHp>0){ App.character.potions.greaterHp--; App.run.hp=clamp(App.run.hp+60,0,st.maxHp); }

  await saveCharacter(); await saveRun();
  render();
}

/* ============================== INVENTORY (paperdoll / backpack / stash / shrine) ============================== */
function itemStatLine(it){
  if(it.kind==='weapon'){ let s=`+${it.atk} ATK`; if(it.critBonus) s+=`, +${it.critBonus}% crit`; if(it.lifeBonus) s+=`, +${it.lifeBonus}% lifesteal`; return s; }
  return `+${it.def} DEF`;
}
function findItem(id){ const ch=App.character; return ch.weapons.find(w=>w.id===id) || ch.armors.find(a=>a.id===id) || null; }
function equipItem(slot, id){
  App.character.equipped[slot] = id;
  const it = findItem(id);
  if(it) markDiscovered(it.lineId);
  App.slotPicker = null; saveCharacter(); render();
}
function unequipSlot(slot){ App.character.equipped[slot] = null; render_and_save(); }
function render_and_save(){ saveCharacter(); render(); }
function moveToStash(id, kind){
  const ch = App.character;
  Object.keys(ch.equipped).forEach(slot=>{ if(ch.equipped[slot]===id) ch.equipped[slot]=null; });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(item) ch.stash.push(item);
  saveCharacter(); render();
}
function moveToBackpack(id){
  const ch = App.character;
  const item = ch.stash.find(i=>i.id===id);
  if(!item) return;
  ch.stash = ch.stash.filter(i=>i.id!==id);
  if(item.kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  saveCharacter(); render();
}
function salvageItem(id, kind){
  const ch = App.character;
  Object.keys(ch.equipped).forEach(slot=>{ if(ch.equipped[slot]===id) ch.equipped[slot]=null; });
  let item;
  if(kind==='weapon'){ item = ch.weapons.find(w=>w.id===id); ch.weapons = ch.weapons.filter(w=>w.id!==id); }
  else { item = ch.armors.find(a=>a.id===id); ch.armors = ch.armors.filter(a=>a.id!==id); }
  if(!item) return;
  const idx = RARITY_ORDER.indexOf(item.rarity);
  ch.scrap += (idx>=0?idx+1:1);
  ch.crystals += 1;
  saveCharacter(); render();
}
function equipArtifact(key, slotName){
  const ch = App.character;
  if(!ch.artifacts[key].owned) return;
  if(isArtifactEquipped(key)) return;
  ch.equipped[slotName] = key;
  saveCharacter(); render();
}
function unequipArtifactSlot(slotName){ App.character.equipped[slotName]=null; saveCharacter(); render(); }
function rechargeArtifact(key){
  const ch = App.character;
  const art = ch.artifacts[key];
  const cap = artifactChargeCap(key);
  const cost = ARTIFACT_DEFS[key].rechargeCost;
  if(!art.owned || art.charges>=cap || ch.crystals<cost) return;
  ch.crystals -= cost; art.charges++;
  saveCharacter(); render();
}
function pickTitanStat(stat){ if(App.character.titanStat) return; App.character.titanStat=stat; saveCharacter(); render(); }

/* ============================== CRAFT ============================== */
const CRAFT_COST = {
  common:{crystals:15, scrap:0, minFloor:1},
  rare:{crystals:10, scrap:5, minFloor:1},
  epic:{crystals:20, scrap:15, minFloor:40},
  legendary:{crystals:40, scrap:30, minFloor:80},
};
function craftItem(lineId, kind){
  const ch = App.character;
  const line = kind==='weapon' ? weaponLine(lineId) : armorLine(lineId);
  if(!line) return;
  const cost = CRAFT_COST[line.rarity];
  if(ch.highestFloor < cost.minFloor-1 || ch.crystals<cost.crystals || ch.scrap<cost.scrap) return;
  ch.crystals -= cost.crystals; ch.scrap -= cost.scrap;
  const item = kind==='weapon' ? makeWeaponInstance(line) : makeArmorInstance(line);
  if(kind==='weapon') ch.weapons.push(item); else ch.armors.push(item);
  markDiscovered(line.lineId);
  saveCharacter(); render();
}
function renderCraft(){
  const ch = App.character;
  const outer = document.createDocumentFragment();
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CRAFT</div><p>Turn Crystals and Scrap into weapons and armor. Higher rarities need a deeper Highest Floor reached. 💎 ${ch.crystals} &nbsp; ⚙ ${ch.scrap}</p></div>`));

  const wpanel = el(`<div class="px-panel"><div class="dg-h2">Weapons — ${CLASSES[ch.classId].name} (${CLASSES[ch.classId].weaponType})</div></div>`);
  WEAPON_CATALOG.filter(w=>w.classId===ch.classId).forEach(line=>{
    const cost = CRAFT_COST[line.rarity];
    const locked = ch.highestFloor < cost.minFloor-1;
    const afford = ch.crystals>=cost.crystals && ch.scrap>=cost.scrap;
    const row = el(`<div class="recipe-row"><span class="rarity-${line.rarity}">${escapeHtml(line.name)} (${line.rarity}) — ${itemStatLine({kind:'weapon',atk:line.atk,critBonus:line.critBonus,lifeBonus:line.lifeBonus})}</span><span></span></div>`);
    const right = row.lastElementChild;
    if(locked){ right.textContent = 'Requires Floor '+cost.minFloor; }
    else {
      const b = el(`<button class="px-btn small" ${afford?'':'disabled'}>Craft (${cost.crystals}💎${cost.scrap?' + '+cost.scrap+'⚙':''})</button>`);
      b.addEventListener('click', ()=>craftItem(line.lineId,'weapon'));
      right.appendChild(b);
    }
    wpanel.appendChild(row);
  });
  outer.appendChild(wpanel);

  const apanel = el(`<div class="px-panel"><div class="dg-h2">Armor</div></div>`);
  ARMOR_CATALOG.forEach(line=>{
    const cost = CRAFT_COST[line.rarity];
    const locked = ch.highestFloor < cost.minFloor-1;
    const afford = ch.crystals>=cost.crystals && ch.scrap>=cost.scrap;
    const row = el(`<div class="recipe-row"><span class="rarity-${line.rarity}">${escapeHtml(line.name)} (${line.rarity}) — +${line.def} DEF</span><span></span></div>`);
    const right = row.lastElementChild;
    if(locked){ right.textContent = 'Requires Floor '+cost.minFloor; }
    else {
      const b = el(`<button class="px-btn small" ${afford?'':'disabled'}>Craft (${cost.crystals}💎${cost.scrap?' + '+cost.scrap+'⚙':''})</button>`);
      b.addEventListener('click', ()=>craftItem(line.lineId,'armor'));
      right.appendChild(b);
    }
    apanel.appendChild(row);
  });
  outer.appendChild(apanel);

  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

  } else if(App.indexTab==='artifacts'){
    ARTIFACT_KEYS.forEach(key=>{
      const d = !!ch.discovered['art_'+key];
      const def = ARTIFACT_DEFS[key];
      grid.appendChild(indexCard(d, cv=>drawArtifactIcon(cv,key), def.name, 'rarity-legendary', def.desc, 'Drop chance: 10% from any 10th-floor boss (repeatable)'));
    });
  } else {
    for(let r=1;r<=10;r++){
      const rd = REGIONS[r-1];
      const dMon = !!ch.discovered['mon_'+r];
      grid.appendChild(indexCard(dMon, cv=>drawMonsterSprite(cv, rd.arche, rd.color), rd.monster, '', `Common enemy of ${rd.name} (floors ${(r-1)*10+1}-${r*10-1}).`));
      const dBoss = !!ch.discovered['boss_'+r];
      grid.appendChild(indexCard(dBoss, cv=>drawMonsterSprite(cv, rd.arche, rd.color), rd.boss, 'rarity-epic', `Boss of ${rd.name} (Floor ${r*10}). Repeatable via Boss Rush.`));
    }
    const dFinal = !!ch.discovered['boss_final'];
    grid.appendChild(indexCard(dFinal, cv=>drawMonsterSprite(cv,'dragon','#e0522b'), 'Flame Dragon', 'rarity-legendary', 'The final boss of the Study Dungeon (Floor 100).'));
  }
  outer.appendChild(panel);
  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

/* ============================== CHARACTERS (class select + skill tree) ============================== */
function canAllocate(node, prog){
  if(prog.allocated[node.id]) return false;
  if(prog.skillPoints < node.cost) return false;
  if(node.tier===3 && prog.evolution && prog.evolution!==node.branch) return false;
  return node.requires.every(r=>prog.allocated[r]);
}
function allocateNode(nodeId){
  const ch = App.character; const prog = classProg();
  const node = findSkillNode(ch.classId, nodeId);
  if(!canAllocate(node, prog)) return;
  prog.allocated[nodeId] = true;
  prog.skillPoints -= node.cost;
  if(node.tier===3) prog.evolution = node.branch;
  saveCharacter(); render();
}
function resetSkillTree(){
  const prog = classProg();
  let refund = 0;
  Object.keys(prog.allocated).forEach(id=>{ const n=findSkillNode(App.character.classId,id); if(n) refund+=n.cost; });
  prog.allocated = {}; prog.evolution = null; prog.skillPoints += refund;
  saveCharacter(); render();
}
function selectClass(classId){ App.character.classId = classId; saveCharacter(); render(); }
function renderCharactersScreen(){
  const ch = App.character;
  const outer = el('<div class="dg-wrap"></div>');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CHARACTERS</div><p>Pick a class — each keeps its own level and skill tree, so you can freely switch and experiment.</p></div>`));

  const cgrid = el(`<div class="px-panel"><div class="class-grid"></div></div>`);
  const cg = cgrid.querySelector('.class-grid');
  Object.values(CLASSES).forEach(cls=>{
    const prog = ch.classProgress[cls.id];
    const card = el(`<div class="class-card${ch.classId===cls.id?' active':''}"><canvas width="48" height="52"></canvas><span class="cname">${cls.name}</span>${prog.evolution?`<span class="cevo">${evolutionName(cls.id,prog.evolution)}</span>`:''}<span class="istat">Lv ${prog.level}</span><span class="idesc">${cls.role}</span></div>`);
    drawClassSprite(card.querySelector('canvas'), cls.id);
    const b = el(`<button class="px-btn small" style="margin-top:8px;">${ch.classId===cls.id?'Active':'Select'}</button>`);
    if(ch.classId!==cls.id) b.addEventListener('click', ()=>selectClass(cls.id));
    else b.disabled = true;
    card.appendChild(b);
    cg.appendChild(card);
  });
  outer.appendChild(cgrid);

  const prog = classProg();
  const tree = el(`<div class="px-panel"><div class="dg-h2">${CLASSES[ch.classId].name} Skill Tree — ${prog.skillPoints} skill point(s) available</div></div>`);
  [1,2,3].forEach(tier=>{
    const row = el(`<div class="tree-tier"><div class="tt-label">TIER ${tier}${tier===3?' — EVOLUTION (pick one)':''}</div><div class="tree-row"></div></div>`);
    const rowEl = row.querySelector('.tree-row');
    CLASSES[ch.classId].tree.filter(n=>n.tier===tier).forEach(node=>{
      const allocated = !!prog.allocated[node.id];
      const available = canAllocate(node, prog);
      const locked = !allocated && !available;
      const btn = el(`<button class="node-btn ${allocated?'allocated':''} ${locked?'locked':''}"><span class="nname">${node.name}</span><span class="ndesc">${node.desc}</span><span class="ncost">${allocated?'Allocated':('Cost: '+node.cost+' pt'+(node.requires.length?' · requires: '+node.requires.map(r=>findSkillNode(ch.classId,r).name).join(', '):''))}</span></button>`);
      if(available) btn.addEventListener('click', ()=>allocateNode(node.id));
      else if(!allocated) btn.disabled = true;
      rowEl.appendChild(btn);
    });
    tree.appendChild(row);
  });
  const resetBtn = el(`<button class="px-btn red">Reset Skill Tree (Free)</button>`);
  resetBtn.addEventListener('click', resetSkillTree);
  tree.appendChild(resetBtn);
  outer.appendChild(tree);
  return outer;
}

/* ============================== BOOTSTRAP ============================== */
async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    App.subjects = [{id:uid(), name:'General Studies', notes:'', flashcards:[]}];
    App.activeSubjectId = App.subjects[0].id;
    App.character = defaultCharacter();
    App.run = defaultRun();
  }
  render();
}
init();
</script>
