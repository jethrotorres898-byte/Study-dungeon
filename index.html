/* ============================== CHARACTERS (class select + skill tree) ============================== */
function canAllocate(node, prog){
  if(prog.allocated[node.id]) return false;
  if(prog.skillPoints < node.cost) return false;
  if(node.tier===3 && prog.evolution && prog.evolution!==node.branch) return false;
  return node.requires.every(r=>prog.allocated[r]);
}
function allocateNode(nodeId){
  const ch = App.character; const prog = classProg();
  const node = findSkillNode(ch.classId, nodeId);
  if(!canAllocate(node, prog)) return;
  prog.allocated[nodeId] = true;
  prog.skillPoints -= node.cost;
  if(node.tier===3) prog.evolution = node.branch;
  saveCharacter(); render();
}
function resetSkillTree(){
  const prog = classProg();
  let refund = 0;
  Object.keys(prog.allocated).forEach(id=>{ const n=findSkillNode(App.character.classId,id); if(n) refund+=n.cost; });
  prog.allocated = {}; prog.evolution = null; prog.skillPoints += refund;
  saveCharacter(); render();
}
function selectClass(classId){ App.character.classId = classId; saveCharacter(); render(); }
function renderCharactersScreen(){
  const ch = App.character;
  const outer = el('<div class="dg-wrap"></div>');
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">CHARACTERS</div><p>Pick a class — each keeps its own level and skill tree, so you can freely switch and experiment.</p></div>`));

  const cgrid = el(`<div class="px-panel"><div class="class-grid"></div></div>`);
  const cg = cgrid.querySelector('.class-grid');
  Object.values(CLASSES).forEach(cls=>{
    const prog = ch.classProgress[cls.id];
    const card = el(`<div class="class-card${ch.classId===cls.id?' active':''}"><div class="cc-art"></div><span class="cname">${cls.name}</span>${prog.evolution?`<span class="cevo">${evolutionName(cls.id,prog.evolution)}</span>`:''}<span class="istat">Lv ${prog.level}</span><span class="idesc">${cls.role}</span></div>`);
    setArt(card.querySelector('.cc-art'), classArt(cls.id));
    const b = el(`<button class="px-btn small" style="margin-top:8px;">${ch.classId===cls.id?'Active':'Select'}</button>`);
    if(ch.classId!==cls.id) b.addEventListener('click', ()=>selectClass(cls.id));
    else b.disabled = true;
    card.appendChild(b);
    cg.appendChild(card);
  });
  outer.appendChild(cgrid);

  const prog = classProg();
  const tree = el(`<div class="px-panel"><div class="dg-h2">${CLASSES[ch.classId].name} Skill Tree — ${prog.skillPoints} skill point(s) available</div></div>`);
  [1,2,3].forEach(tier=>{
    const row = el(`<div class="tree-tier"><div class="tt-label">TIER ${tier}${tier===3?' — EVOLUTION (pick one)':''}</div><div class="tree-row"></div></div>`);
    const rowEl = row.querySelector('.tree-row');
    CLASSES[ch.classId].tree.filter(n=>n.tier===tier).forEach(node=>{
      const allocated = !!prog.allocated[node.id];
      const available = canAllocate(node, prog);
      const locked = !allocated && !available;
      const btn = el(`<button class="node-btn ${allocated?'allocated':''} ${locked?'locked':''}"><span class="nname">${node.name}</span><span class="ndesc">${node.desc}</span><span class="ncost">${allocated?'Allocated':('Cost: '+node.cost+' pt'+(node.requires.length?' · requires: '+node.requires.map(r=>findSkillNode(ch.classId,r).name).join(', '):''))}</span></button>`);
      if(available) btn.addEventListener('click', ()=>allocateNode(node.id));
      else if(!allocated) btn.disabled = true;
      rowEl.appendChild(btn);
    });
    tree.appendChild(row);
  });
  const resetBtn = el(`<button class="px-btn red">Reset Skill Tree (Free)</button>`);
  resetBtn.addEventListener('click', resetSkillTree);
  tree.appendChild(resetBtn);
  outer.appendChild(tree);
  return outer;
}

/* ============================== BOOTSTRAP ============================== */
async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    App.subjects = [{id:uid(), name:'General Studies', notes:'', flashcards:[]}];
    App.activeSubjectId = App.subjects[0].id;
    App.character = defaultCharacter();
    App.run = defaultRun();
  }
  render();
}
init();
</script>
