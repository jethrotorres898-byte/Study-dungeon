<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dungeon — Tower of Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ===================================================================
   STUDY DUNGEON — design system
   Modern dark-fantasy UI: glass stone panels, torchlit cavern backdrop,
   gold/violet accents, soft depth instead of hard pixel borders.
   =================================================================== */
:root{
  /* surfaces */
  --void:#05050b; --stone-900:#0c0b15; --stone-800:#14121f; --stone-700:#1d1a2c;
  --stone-600:#282438; --glass:rgba(30,27,45,.72); --glass-2:rgba(22,20,34,.78);
  --hairline:rgba(255,255,255,.08); --hairline-strong:rgba(255,255,255,.16);
  /* accents */
  --violet:#8b7cf6; --violet-soft:rgba(139,124,246,.35); --violet-deep:#5b45c9;
  --gold:#e8b64c; --gold-soft:rgba(232,182,76,.35); --amber:#f0a028; --ember:#ff6b35;
  --jade:#3fcf8e; --crimson:#f04668; --sky:#5fc2e0;
  /* text */
  --text:#eae7f7; --text-dim:#a8a2c6; --text-faint:#6f6a8c; --ink:#231f31;
  /* type */
  --display:'Cinzel',Georgia,serif;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
  --read:'Lora',Georgia,serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  /* legacy aliases still referenced by older rules */
  --sans:var(--ui); --serif:var(--read); --px:var(--display); --vt:var(--ui);
  --dk-text:var(--text); --dk-muted:var(--text-dim); --dk-gold:var(--gold);
  --dk-panel:var(--glass); --dk-panel2:var(--glass-2); --dk-border:var(--hairline);
  --bg:transparent; --card:#faf7f0; --muted:#6f6885; --line:#e7e2f2;
  --accent:#6d5bd0; --good:#2f9e5b; --bad:#d1495b; --warn:#d99a2b;
  --radius:16px; --radius-sm:11px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--void);color:var(--text);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
#root{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--violet-soft);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.3);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3a3355,#231f36);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4b4270,#2c2744);background-clip:padding-box;}

/* ===================== UNDERGROUND CAVERN BACKDROP ===================== */
body::before{ /* depth + torch pools */
  content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(58% 42% at 10% 14%, rgba(255,146,54,.13), transparent 72%),
    radial-gradient(52% 38% at 90% 10%, rgba(139,124,246,.14), transparent 72%),
    radial-gradient(90% 55% at 50% 104%, rgba(255,122,40,.09), transparent 70%),
    linear-gradient(180deg,#04040a 0%,#0a0912 32%,#100d1d 66%,#060610 100%);
}
body::after{ /* rock strata, chisel speckle, vignette */
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    repeating-linear-gradient(96deg, rgba(255,255,255,.016) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(-2deg, rgba(0,0,0,.28) 0 1px, transparent 1px 30px),
    repeating-linear-gradient(78deg, rgba(0,0,0,.16) 0 1px, transparent 1px 120px),
    radial-gradient(125% 85% at 50% 45%, transparent 42%, rgba(0,0,0,.8) 100%);
}
.cave-fx{ /* drifting dust motes caught in torchlight */
  position:fixed;left:0;right:0;top:-15%;height:130%;z-index:-1;pointer-events:none;opacity:.45;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 20%, rgba(255,214,160,.8), transparent 60%),
    radial-gradient(1.3px 1.3px at 27% 62%, rgba(200,190,255,.65), transparent 60%),
    radial-gradient(1.8px 1.8px at 44% 33%, rgba(255,206,140,.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 61% 78%, rgba(220,200,255,.6), transparent 60%),
    radial-gradient(1.7px 1.7px at 74% 26%, rgba(255,214,160,.7), transparent 60%),
    radial-gradient(1.4px 1.4px at 88% 58%, rgba(210,195,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 33% 88%, rgba(255,210,150,.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 54% 8%,  rgba(230,215,255,.6), transparent 60%);
  animation:motes 34s linear infinite;
}
@keyframes motes{from{transform:translate3d(0,0,0);}to{transform:translate3d(-18px,-180px,0);}}
@media (prefers-reduced-motion:reduce){ .cave-fx{animation:none;} }

/* ===================== SHELL: TOP NAV ===================== */
.shell-nav{
  position:sticky;top:0;z-index:40;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px 20px;background:linear-gradient(180deg,rgba(14,12,24,.94),rgba(10,9,18,.86));
  border-bottom:1px solid var(--hairline);backdrop-filter:blur(16px);
  box-shadow:0 14px 34px -22px #000;
}
.brand{
  font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;
  margin-right:16px;background:linear-gradient(180deg,#fbe6a6,#e8b64c 55%,#b8822a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(232,182,76,.25));white-space:nowrap;
}
.navtab{
  font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--text-dim);
  padding:9px 18px;border-radius:999px;border:1px solid transparent;background:rgba(255,255,255,.04);
  transition:color .18s,background .18s,border-color .18s,box-shadow .18s,transform .18s;
}
.navtab:hover{color:var(--text);background:rgba(255,255,255,.08);transform:translateY(-1px);}
.navtab.active{
  color:#1b1406;background:linear-gradient(180deg,#f5d585,#e0a838);border-color:rgba(255,238,190,.5);
  box-shadow:0 10px 22px -12px rgba(232,182,76,.9),0 0 20px -6px var(--gold-soft);
}
.quickstats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.qstat{
  font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--text-dim);
  background:rgba(255,255,255,.05);border:1px solid var(--hairline);border-radius:999px;padding:6px 13px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.qstat:nth-child(3){color:#9fe3ff;} .qstat:nth-child(4){color:#f0cf8a;}

/* subject bar (study) */
.subject-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;
  background:rgba(10,9,18,.7);border-bottom:1px solid var(--hairline);backdrop-filter:blur(12px);
}
.subject-chip{
  display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--hairline);color:var(--text-dim);
  font-size:13.5px;font-weight:500;transition:all .18s;cursor:pointer;
}
.subject-chip:hover{color:var(--text);border-color:var(--hairline-strong);}
.subject-chip.active{
  color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-deep));
  border-color:rgba(174,160,255,.55);box-shadow:0 10px 22px -14px var(--violet),0 0 18px -8px var(--violet-soft);
}
.subject-chip span{cursor:pointer;}
.subject-chip button.mini{opacity:.65;font-size:13px;padding:0 2px;}
.subject-chip button.mini:hover{opacity:1;}
.inline-form{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.4);border:1px dashed rgba(139,124,246,.4);border-radius:12px;padding:7px 10px;}
.inline-form input{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--hairline);border-radius:8px;padding:7px 11px;font-size:13.5px;outline:none;}
.inline-form input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft);}
.btn-pixel-sm{
  font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--text);padding:7px 13px;border-radius:9px;
  background:rgba(255,255,255,.07);border:1px solid var(--hairline);transition:all .16s;
}
.btn-pixel-sm:hover:not(:disabled){background:rgba(255,255,255,.13);transform:translateY(-1px);}
.btn-pixel-sm:disabled{opacity:.4;cursor:not-allowed;}
.btn-pixel-sm.primary{background:linear-gradient(135deg,#3fcf8e,#1f9e68);color:#05231a;border-color:rgba(150,255,210,.4);}
.btn-pixel-sm.danger{background:linear-gradient(135deg,#f7607f,#c42a4c);color:#fff;border-color:rgba(255,160,180,.35);}

/* ===================== LAYOUT PANEL ===================== */
#panel{flex:1;background:transparent;padding:0;}
#panel.light{padding:26px 20px 40px;}

/* ===================== DUNGEON (game) SURFACES ===================== */
.dg-wrap{color:var(--text);min-height:70vh;max-width:1180px;margin:0 auto;padding:22px 20px 44px;}
.dg-h1{
  font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.1em;text-transform:uppercase;
  margin:0 0 16px;background:linear-gradient(180deg,#fbe7ab,#e8b64c 60%,#b07f26);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(232,182,76,.22));
}
.dg-h2{
  font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.dg-h2::before{content:'';width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--ember));flex-shrink:0;}
.px-panel{
  background:linear-gradient(158deg,var(--glass),var(--glass-2));backdrop-filter:blur(14px);
  border:1px solid var(--hairline);border-radius:var(--radius);padding:22px;margin:0 0 18px;
  box-shadow:0 26px 50px -30px #000, inset 0 1px 0 rgba(255,255,255,.05);
  overflow-x:auto;
}
.px-btn{
  font-family:var(--ui);font-weight:600;font-size:13.5px;letter-spacing:.02em;color:var(--text);
  padding:13px 20px;border-radius:12px;border:1px solid var(--hairline);
  background:linear-gradient(180deg,rgba(62,55,92,.85),rgba(30,27,46,.9));
  box-shadow:0 14px 26px -18px #000, inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,border-color .16s,filter .16s;
}
.px-btn:hover:not(:disabled){
  transform:translateY(-2px);border-color:rgba(139,124,246,.5);
  box-shadow:0 20px 32px -18px #000, 0 0 24px -8px var(--violet-soft), inset 0 1px 0 rgba(255,255,255,.1);
}
.px-btn:active:not(:disabled){transform:translateY(0);}
.px-btn:disabled{opacity:.38;cursor:not-allowed;}
.px-btn.gold{
  background:linear-gradient(180deg,#f6d98d,#dda435);color:#1f1503;border-color:rgba(255,238,186,.55);
  box-shadow:0 16px 28px -18px #000, 0 0 26px -10px rgba(232,182,76,.75);
}
.px-btn.gold:hover:not(:disabled){box-shadow:0 22px 34px -18px #000, 0 0 34px -8px rgba(232,182,76,.9);}
.px-btn.red{background:linear-gradient(180deg,#f2617f,#b32745);color:#fff;border-color:rgba(255,168,188,.4);}
.px-btn.green{background:linear-gradient(180deg,#4cd99a,#1e8f61);color:#04241a;border-color:rgba(160,255,215,.45);}
.px-btn.small{font-size:12px;padding:9px 14px;border-radius:10px;}
.px-btn.block{display:block;width:100%;text-align:left;margin-bottom:10px;}
.px-btn.active{background:linear-gradient(180deg,#f6d98d,#dda435);color:#1f1503;border-color:rgba(255,238,186,.55);}
.px-input{
  font-family:var(--ui);font-size:14.5px;color:var(--text);background:rgba(0,0,0,.35);
  border:1px solid var(--hairline);border-radius:11px;padding:12px 14px;outline:none;transition:border-color .16s,box-shadow .16s;
}
.px-input::placeholder{color:var(--text-faint);}
.px-input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft);}

/* loading */
.dg-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;gap:26px;}
.pxbar-outer{
  width:min(420px,84vw);height:14px;border-radius:999px;background:rgba(0,0,0,.6);
  border:1px solid var(--hairline);overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.8);
}
.pxbar-fill{height:100%;width:0%;border-radius:999px;transition:width .18s ease;
  background:linear-gradient(90deg,#e8b64c,#ff8a3d);box-shadow:0 0 20px rgba(240,160,40,.6);}

/* ===================== HUB ===================== */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:6px 0 22px;}
.hub-grid .px-btn{padding:22px 18px;font-size:14.5px;text-align:center;}
.hub-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:16px;}
.stat-box{
  background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:13px;padding:14px 16px;
  font-size:15px;font-weight:600;color:var(--text);
}
.stat-box .lbl{
  font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);display:block;margin-bottom:7px;
}
.bossrush-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;}
.bossrush-grid .px-btn{text-align:center;line-height:1.7;}

/* ===================== BATTLE SCENE (cavern room) ===================== */
.battle-scene{
  position:relative;min-height:470px;margin:0 0 18px;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--hairline);
  box-shadow:0 34px 66px -34px #000, inset 0 0 130px rgba(0,0,0,.8);
  background:
    radial-gradient(72% 46% at 50% -12%, var(--rtint1,rgba(255,150,60,.22)), transparent 74%),
    radial-gradient(26% 34% at 8% 26%, rgba(255,150,60,.2), transparent 72%),
    radial-gradient(26% 34% at 92% 26%, var(--rtint2,rgba(150,110,255,.2)), transparent 72%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 2px, transparent 2px 70px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 2px, transparent 2px 42px),
    linear-gradient(180deg,#0c0a17 0%,#171328 52%,#0a0813 100%);
}
.battle-scene::before{ /* cavern floor */
  content:'';position:absolute;left:0;right:0;bottom:0;height:26%;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(46,38,68,.92),rgba(14,11,23,.98)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 1px, transparent 1px 58px);
  box-shadow:inset 0 14px 32px -14px rgba(0,0,0,.95);
}
.battle-scene::after{ /* haze + vignette */
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(118% 80% at 50% 46%, transparent 44%, rgba(3,2,8,.78) 100%),
    linear-gradient(180deg,rgba(10,7,20,.26),rgba(6,4,12,.5) 92%);
}
.battle-scene.shake{animation:screenshake .4s;}
@keyframes screenshake{0%,100%{transform:translate(0,0);}20%{transform:translate(-7px,3px);}40%{transform:translate(6px,-4px);}60%{transform:translate(-4px,4px);}80%{transform:translate(4px,-2px);}}
.combatant{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:3;}
.combatant::after{ /* ground shadow */
  content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:78px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 72%);
}
.combatant.player{left:12%;bottom:12%;}
.combatant.monster{right:12%;bottom:12%;}
.combatant.monster.boss{right:50%;transform:translateX(50%);bottom:13%;}
.combatant.monster.boss .sprite-box{transform:scale(1.95);margin-top:30px;transform-origin:bottom center;}
.combatant.monster.boss::after{width:130px;height:22px;bottom:-16px;}
.namebar{
  font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.92);text-shadow:0 2px 8px rgba(0,0,0,.9);margin-bottom:7px;text-align:center;
}
.hpbar-wrap{width:184px;}
.hpbar-outer{
  position:relative;height:15px;border-radius:999px;background:rgba(4,3,9,.9);
  border:1px solid rgba(255,255,255,.14);overflow:hidden;width:100%;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.9), 0 2px 10px -4px rgba(0,0,0,.8);
}
.hpbar-bg{position:absolute;inset:0;background:rgba(255,255,255,.045);}
.hpbar-fill{
  position:absolute;inset:0;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#ff5468,#ff8e4d);box-shadow:0 0 16px rgba(255,84,104,.45);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.combatant.player .hpbar-fill{background:linear-gradient(90deg,#2fc98a,#7fe6a6);box-shadow:0 0 16px rgba(63,207,142,.4);}
.hpbar-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.95);
}
.sprite-box{width:152px;height:152px;position:relative;margin-top:2px;}
.sprite-box svg,.sprite-box .sprite-flip{position:absolute;inset:0;width:100%;height:100%;}
.sprite-box svg{filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));overflow:visible;}
.sprite-flip{position:absolute;inset:0;}
.sprite-flip.mirror{transform:scaleX(-1);}
.combatant.player .sprite-box.dash{animation:dashfwd .3s;}
@keyframes dashfwd{0%{transform:translateX(0);}40%{transform:translateX(30px);}100%{transform:translateX(0);}}
.combatant.player .sprite-box.crouch{animation:crouchdown .35s;}
@keyframes crouchdown{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(8px) scaleY(.85);}}
.combatant .sprite-box.hitflash{animation:hitflash .3s;}
@keyframes hitflash{0%,100%{filter:none;}50%{filter:brightness(3) saturate(.2);}}
.slashfx{position:absolute;width:118px;height:118px;top:12%;left:50%;pointer-events:none;opacity:0;z-index:6;filter:drop-shadow(0 0 12px rgba(255,240,200,.8));}
.slashfx.show{animation:slashpop .3s ease-out;}
@keyframes slashpop{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-10deg);}30%{opacity:1;}60%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(-10deg);}100%{opacity:0;transform:translate(-50%,0) scale(1.32) rotate(-10deg);}}
.slashfx.x2{transform:translate(-50%,0) rotate(90deg);}
.dust-particle{position:absolute;width:5px;height:5px;background:#d8c79a;bottom:12%;left:50%;border-radius:50%;opacity:0;pointer-events:none;z-index:5;}
.dust-particle.go{animation:dustpuff .5s ease-out forwards;}
@keyframes dustpuff{0%{opacity:1;transform:translate(0,0);}100%{opacity:0;transform:translate(var(--dx),-48px) scale(.4);}}
.giant-sword{position:absolute;width:76px;height:84px;top:-10%;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:7;filter:drop-shadow(0 0 16px rgba(255,220,150,.9));}
.giant-sword.go{animation:giantswing .7s ease-in forwards;}
@keyframes giantswing{0%{opacity:1;transform:translate(-50%,-140%) scale(.4) rotate(-40deg);}60%{opacity:1;transform:translate(-50%,-30%) scale(1.6) rotate(60deg);}100%{opacity:0;transform:translate(-50%,10%) scale(1.85) rotate(90deg);}}
.impact-burst{position:absolute;width:110px;height:110px;border-radius:50%;top:20%;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fffaf0 0%,#ffd98a 35%,rgba(255,140,60,.5) 58%,transparent 72%);}
.impact-burst.go{animation:impactpop .45s ease-out forwards;}
@keyframes impactpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);}28%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7);}}
.energy-row{display:flex;gap:6px;align-items:center;margin-top:10px;}
.energy-seg{
  width:19px;height:19px;border-radius:6px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:10px;
  transition:background .25s,box-shadow .25s,transform .25s;
}
.energy-seg.filled{background:linear-gradient(180deg,#ffe08a,#ef9420);border-color:rgba(255,225,160,.6);
  box-shadow:0 0 14px 2px rgba(255,180,60,.55);transform:translateY(-1px);color:transparent;}
.energy-seg.mfilled{background:linear-gradient(180deg,#cf9bff,#7a35c9);border-color:rgba(215,175,255,.5);
  box-shadow:0 0 14px 2px rgba(160,80,220,.5);}
.energy-seg.mini{width:13px;height:13px;border-radius:4px;}
.charging-tag{
  font-family:var(--ui);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#ff9a9a;display:inline-flex;align-items:center;gap:8px;animation:pulseglow 1.1s ease-in-out infinite;
}
@keyframes pulseglow{0%,100%{opacity:1;text-shadow:0 0 14px rgba(255,90,90,.7);}50%{opacity:.55;text-shadow:none;}}
.floatnum{
  position:absolute;font-family:var(--mono);font-weight:700;font-size:15px;color:#fff;z-index:9;pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.95);animation:floatup 1s ease-out forwards;
}
.floatnum.crit{color:#ffd869;font-size:19px;text-shadow:0 0 16px rgba(255,200,80,.9),0 2px 6px #000;}
.floatnum.heal{color:#7ee8a4;}
@keyframes floatup{0%{opacity:1;transform:translateY(0) scale(1);}30%{transform:translateY(-16px) scale(1.12);}100%{opacity:0;transform:translateY(-56px) scale(.95);}}

/* boss bar — top center, larger and ornate */
.boss-bar-top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:84%;max-width:680px;z-index:10;text-align:center;}
.boss-bar-top .bname{
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:9px;
  background:linear-gradient(180deg,#fff0c4,#e8b64c 60%,#b98229);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.9));
}
.boss-bar-top .hpbar-outer{
  height:26px;border-radius:999px;border:1px solid rgba(232,182,76,.55);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.9), 0 0 26px -10px rgba(232,182,76,.8);
}
.boss-bar-top .hpbar-fill{background:linear-gradient(90deg,#c21f3a,#ff5468 55%,#ff9a4d);}
.boss-bar-top .hpbar-num{font-size:12.5px;letter-spacing:.06em;}
.boss-bar-top .energy-row{justify-content:center;margin-top:9px;}

/* ===================== COMBAT CONTROLS ===================== */
.controls-panel{margin:0;}
.qbody{
  background:linear-gradient(158deg,var(--glass),var(--glass-2));backdrop-filter:blur(14px);
  border:1px solid var(--hairline);border-radius:var(--radius);padding:24px;
  box-shadow:0 26px 50px -30px #000, inset 0 1px 0 rgba(255,255,255,.05);
}
.qtag{
  font-family:var(--ui);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);display:block;margin-bottom:12px;
}
.qtext{font-family:var(--ui);font-weight:600;font-size:clamp(18px,2.4vw,23px);line-height:1.45;margin-bottom:20px;color:#fff;}
.mcq-opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;
  background:rgba(255,255,255,.045);border:1px solid var(--hairline);border-radius:12px;
  padding:15px 18px;font-size:15.5px;color:var(--text);transition:all .16s cubic-bezier(.2,.8,.3,1);
}
.mcq-opt:hover:not(:disabled){background:rgba(139,124,246,.16);border-color:rgba(139,124,246,.5);transform:translateX(4px);}
.mcq-opt:disabled{opacity:.35;cursor:not-allowed;}
.mcq-opt.correct{background:linear-gradient(135deg,rgba(63,207,142,.3),rgba(31,158,104,.2));border-color:var(--jade);}
.mcq-opt.wrong{background:linear-gradient(135deg,rgba(240,70,104,.3),rgba(180,40,70,.2));border-color:var(--crimson);}
.skillbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px;}
.skillbtn{
  background:linear-gradient(158deg,var(--glass),var(--glass-2));border:1px solid var(--hairline);border-radius:13px;
  padding:15px;text-align:left;color:var(--text);transition:all .16s;
}
.skillbtn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(139,124,246,.5);}
.skillbtn:disabled{opacity:.4;}
.skillbtn .sname{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:7px;}
.skillbtn .sest{font-size:14.5px;display:block;color:var(--text-dim);}
/* ----- difficulty pick ----- */
.qdiff{font-weight:800;letter-spacing:.14em;}
.qdiff.easy{color:var(--jade);}
.qdiff.medium{color:var(--gold);}
.qdiff.hard{color:#ff8aa0;}
.diff-pick .qtext{margin-bottom:14px;}
.diffbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.diffbtn{
  background:linear-gradient(158deg,var(--glass),var(--glass-2));border:1px solid var(--hairline);border-radius:14px;
  padding:17px 16px;text-align:left;color:var(--text);transition:all .18s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;
}
.diffbtn::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--text-faint);}
.diffbtn:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px #000;}
.diffbtn .dname{font-family:var(--ui);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:7px;}
.diffbtn .dstat{display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-bottom:7px;}
.diffbtn .ddesc{display:block;font-size:13px;color:var(--text-faint);line-height:1.45;}
.diffbtn.easy::before{background:var(--jade);} .diffbtn.easy .dname{color:#8ff0bb;}
.diffbtn.easy:hover{border-color:rgba(63,207,142,.55);}
.diffbtn.medium::before{background:var(--gold);} .diffbtn.medium .dname{color:var(--gold);}
.diffbtn.medium:hover{border-color:rgba(214,178,90,.55);}
.diffbtn.hard::before{background:var(--crimson);} .diffbtn.hard .dname{color:#ffa3b5;}
.diffbtn.hard:hover{border-color:rgba(240,70,104,.55);}

/* ----- realm picker ----- */
.realm-intro p{max-width:760px;line-height:1.6;}
.realm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.realm-card{
  display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px 18px;color:var(--text);
  background:linear-gradient(158deg,var(--glass),var(--glass-2));border:1px solid var(--hairline);border-radius:16px;
  transition:all .18s cubic-bezier(.2,.8,.3,1);box-shadow:0 20px 38px -28px #000;
}
.realm-card:hover{transform:translateY(-4px);border-color:rgba(214,178,90,.5);box-shadow:0 28px 50px -26px #000;}
.realm-card.current{border-color:rgba(214,178,90,.65);box-shadow:0 0 0 1px rgba(214,178,90,.25),0 24px 44px -28px #000;}
.realm-card .rc-icon{font-size:30px;line-height:1;}
.realm-card .rc-name{font-family:var(--display);font-size:20px;font-weight:700;color:#fff;letter-spacing:.02em;}
.realm-card .rc-src{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.realm-card .rc-stats{font-size:12.5px;color:var(--text-faint);line-height:1.5;}
.realm-card .rc-cta{
  margin-top:8px;font-family:var(--ui);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
}
.realm-card.infinity{background:linear-gradient(158deg,rgba(139,124,246,.18),rgba(20,18,32,.85));border-color:rgba(139,124,246,.38);}
.realm-card.infinity:hover{border-color:rgba(139,124,246,.7);}
.realm-card.infinity .rc-icon{color:var(--violet);font-size:36px;}
.realm-card.infinity .rc-cta{color:#b9aeff;}
.realm-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.realm-bar .rb-left{display:flex;align-items:center;gap:12px;}
.realm-bar .rb-icon{font-size:26px;}
.realm-bar .rb-text{display:flex;flex-direction:column;line-height:1.35;}
.realm-bar .rb-text b{font-family:var(--display);font-size:17px;color:#fff;}
.realm-bar .rb-text .muted{font-family:var(--mono);font-size:11px;}
.feedback-msg{
  font-size:16px;font-weight:500;margin:0 0 16px;padding:15px 18px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--hairline);border-left:3px solid var(--text-faint);
}
.feedback-msg.good{color:#8ff0bb;border-left-color:var(--jade);background:linear-gradient(90deg,rgba(63,207,142,.14),rgba(255,255,255,.03));}
.feedback-msg.bad{color:#ffa3b5;border-left-color:var(--crimson);background:linear-gradient(90deg,rgba(240,70,104,.14),rgba(255,255,255,.03));}
.artifact-inline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

/* ===================== CARDS / GRIDS ===================== */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}
.item-card,.artifact-card{
  background:linear-gradient(158deg,rgba(38,34,56,.75),rgba(20,18,32,.82));border:1px solid var(--hairline);
  border-radius:14px;padding:16px;transition:transform .18s,border-color .18s,box-shadow .18s;
  box-shadow:0 18px 34px -26px #000;
}
.item-card:hover,.artifact-card:hover{transform:translateY(-3px);border-color:var(--hairline-strong);box-shadow:0 26px 44px -26px #000;}
.item-card .iname,.artifact-card .iname{
  font-family:var(--ui);font-weight:700;font-size:13.5px;letter-spacing:.02em;display:block;margin-bottom:8px;line-height:1.35;
}
.item-card .istat,.artifact-card .istat{font-size:14px;color:var(--text-dim);display:block;line-height:1.6;}
.rarity-common{color:#c6c1e0;} .rarity-rare{color:#6fd0ec;} .rarity-epic{color:#c98cf0;} .rarity-legendary{color:var(--gold);}
.item-card:has(.rarity-rare){border-color:rgba(111,208,236,.3);}
.item-card:has(.rarity-epic){border-color:rgba(201,140,240,.32);}
.item-card:has(.rarity-legendary){border-color:rgba(232,182,76,.4);box-shadow:0 18px 34px -26px #000,0 0 24px -14px var(--gold-soft);}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;}
.tbl th,.tbl td{border-bottom:1px solid var(--hairline);padding:11px 12px;text-align:left;}
.tbl th{font-family:var(--ui);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:rgba(255,255,255,.03);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px;}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-dim);}

/* paperdoll */
.paperdoll{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}
.doll-figure{
  width:168px;height:190px;flex-shrink:0;position:relative;border-radius:14px;overflow:hidden;
  border:1px solid var(--hairline);
  background:
    radial-gradient(70% 45% at 50% 12%, rgba(255,160,70,.18), transparent 72%),
    radial-gradient(60% 40% at 50% 100%, rgba(139,124,246,.16), transparent 70%),
    linear-gradient(180deg,#151223,#0b0a14);
  box-shadow:inset 0 0 50px rgba(0,0,0,.7);
}
.doll-figure::after{content:'';position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:92px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 72%);}
.doll-figure .doll-art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:150px;}
.doll-figure .doll-art svg{width:100%;height:100%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.65));}
.doll-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;flex:1;min-width:290px;}
.slot-box{
  background:rgba(255,255,255,.035);border:1px dashed rgba(255,255,255,.16);border-radius:13px;
  padding:14px;min-height:82px;cursor:pointer;transition:all .16s;
}
.slot-box:hover{background:rgba(139,124,246,.12);border-color:rgba(139,124,246,.5);transform:translateY(-2px);}
.slot-box.filled{border-style:solid;background:rgba(255,255,255,.055);}
.slot-box .slbl{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);display:block;margin-bottom:8px;}
.slot-box .slname{font-size:14px;font-weight:500;line-height:1.4;}
.stash-tabs,.index-tabs{display:flex;gap:9px;flex-wrap:wrap;}
.charge-row{display:flex;gap:5px;margin:10px 0;}
.charge-pip{width:15px;height:15px;border-radius:5px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);}
.charge-pip.on{background:linear-gradient(180deg,#ffe08a,#ef9420);border-color:rgba(255,225,160,.6);box-shadow:0 0 12px rgba(255,180,60,.5);}
.equip-toggle{margin-top:10px;margin-left:8px;}
.picker-overlay{
  background:linear-gradient(158deg,rgba(30,26,48,.92),rgba(16,14,26,.95));backdrop-filter:blur(16px);
  border:1px solid rgba(232,182,76,.35);border-radius:var(--radius);padding:20px;margin:0 0 18px;
  box-shadow:0 30px 60px -30px #000, 0 0 40px -22px var(--gold-soft);
}
.picker-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hairline);font-size:14.5px;}
.picker-row:last-of-type{border-bottom:none;}

/* index */
.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.index-card{
  background:linear-gradient(158deg,rgba(38,34,56,.72),rgba(20,18,32,.82));border:1px solid var(--hairline);
  border-radius:14px;padding:18px 14px;text-align:center;transition:transform .18s,border-color .18s,box-shadow .18s;
}
.index-card:hover{transform:translateY(-3px);border-color:var(--hairline-strong);}
.index-card .idx-art{height:78px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px;}
.index-card .idx-art svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
.index-card.undiscovered{filter:grayscale(1) brightness(.42) contrast(.9);opacity:.85;}
.index-card .iname{font-family:var(--ui);font-weight:700;font-size:13px;display:block;margin:6px 0;line-height:1.35;}
.index-card .idesc{font-size:13px;color:var(--text-dim);display:block;line-height:1.55;}

/* class cards */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px;}
.class-card{
  background:
    radial-gradient(80% 50% at 50% 0%, rgba(139,124,246,.14), transparent 70%),
    linear-gradient(158deg,rgba(38,34,56,.75),rgba(18,16,30,.85));
  border:1px solid var(--hairline);border-radius:16px;padding:20px 16px;text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.class-card:hover{transform:translateY(-4px);border-color:rgba(139,124,246,.45);box-shadow:0 28px 48px -28px #000;}
.class-card.active{
  border-color:rgba(232,182,76,.6);
  background:radial-gradient(80% 50% at 50% 0%, rgba(232,182,76,.16), transparent 70%),linear-gradient(158deg,rgba(44,38,62,.8),rgba(20,17,32,.88));
  box-shadow:0 26px 46px -28px #000, 0 0 34px -16px var(--gold-soft);
}
.class-card .cc-art{height:112px;display:flex;align-items:flex-end;justify-content:center;}
.class-card .cc-art svg{width:104px;height:112px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));transition:transform .25s;}
.class-card:hover .cc-art svg{transform:translateY(-4px) scale(1.04);}
.class-card .cname{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:block;margin:12px 0 4px;}
.class-card .cevo{font-family:var(--ui);font-weight:700;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--jade);display:block;margin-bottom:6px;}
.class-card .istat{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--text-faint);}
.class-card .idesc{display:block;margin-top:10px;font-size:13px;line-height:1.6;color:var(--text-dim);}

/* skill tree */
.tree-tier{margin-bottom:22px;}
.tree-tier .tt-label{font-family:var(--ui);font-weight:700;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);margin-bottom:11px;display:flex;align-items:center;gap:10px;}
.tree-tier .tt-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--hairline),transparent);}
.tree-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px;}
.node-btn{
  background:linear-gradient(158deg,rgba(36,32,54,.72),rgba(18,16,30,.82));border:1px solid var(--hairline);
  border-radius:14px;padding:16px;text-align:left;color:var(--text);transition:all .18s;position:relative;overflow:hidden;
}
.node-btn:not(:disabled):hover{transform:translateY(-3px);border-color:rgba(139,124,246,.55);box-shadow:0 22px 40px -26px #000,0 0 26px -14px var(--violet-soft);}
.node-btn.allocated{
  background:linear-gradient(158deg,rgba(47,122,79,.42),rgba(20,48,34,.6));border-color:rgba(63,207,142,.55);
  box-shadow:0 0 28px -16px rgba(63,207,142,.8);
}
.node-btn.allocated::before{content:'✓';position:absolute;top:12px;right:14px;color:var(--jade);font-weight:700;font-size:14px;}
.node-btn.locked{opacity:.4;}
.node-btn .nname{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.04em;display:block;margin-bottom:7px;color:var(--gold);}
.node-btn.allocated .nname{color:#b6f5d4;}
.node-btn .ndesc{font-size:14px;display:block;line-height:1.5;}
.node-btn .ncost{font-size:12px;color:var(--text-faint);display:block;margin-top:8px;font-family:var(--mono);}

.recipe-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 2px;border-bottom:1px solid var(--hairline);font-size:14.5px;}
.recipe-row:last-child{border-bottom:none;}
.titan-pick{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}

/* overlays */
.overlay-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:58vh;text-align:center;padding:24px;}
.overlay-center p{font-size:16px;line-height:1.7;color:var(--text-dim);max-width:560px;margin:0;}
.overlay-center .px-panel{min-width:min(420px,90vw);}
.loot-item-row{
  background:rgba(255,255,255,.05);border:1px solid var(--hairline);border-radius:11px;
  padding:13px 16px;margin:8px 0;font-size:15px;text-align:left;
}

/* ===================== STUDY (torchlit parchment) ===================== */
#panel.light .studytabs{display:flex;gap:9px;flex-wrap:wrap;max-width:1000px;margin:0 auto 18px;}
#panel.light .studytabs button{
  background:rgba(255,255,255,.06);color:var(--text-dim);border:1px solid var(--hairline);border-radius:999px;
  padding:9px 17px;font-weight:600;font-size:13px;transition:all .18s;
}
#panel.light .studytabs button:hover{color:var(--text);background:rgba(255,255,255,.1);}
#panel.light .studytabs button.active{
  background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;border-color:rgba(174,160,255,.5);
  box-shadow:0 12px 24px -14px var(--violet),0 0 20px -10px var(--violet-soft);
}
#panel.light .card{
  background:linear-gradient(170deg,#fdfaf3,#f4efe4);border:1px solid rgba(120,100,70,.18);border-radius:18px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.85), 0 0 60px -30px rgba(255,170,80,.22), inset 0 1px 0 rgba(255,255,255,.7);
  padding:26px;max-width:1000px;margin:0 auto 20px;color:var(--ink);
}
#panel.light h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,28px);letter-spacing:.02em;margin:0 0 8px;color:#2b2337;}
#panel.light h2{font-family:var(--ui);font-weight:700;font-size:17px;margin:0 0 12px;color:#332b42;}
#panel.light p,#panel.light li{font-family:var(--read);font-size:16px;line-height:1.7;color:#3a3350;}
#panel.light .muted{color:var(--muted);font-family:var(--ui);font-size:13.5px;line-height:1.6;}
#panel.light .btn{
  background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;border:none;border-radius:10px;
  padding:11px 20px;font-family:var(--ui);font-weight:600;font-size:14px;
  box-shadow:0 12px 22px -14px var(--violet-deep);transition:transform .16s,box-shadow .16s,filter .16s;
}
#panel.light .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 28px -14px var(--violet-deep);}
#panel.light .btn.secondary{background:#efeafd;color:var(--violet-deep);box-shadow:none;}
#panel.light .btn.secondary:hover{background:#e5dcfb;}
#panel.light .btn.ghost{background:transparent;color:var(--violet-deep);border:1.5px solid rgba(91,69,201,.45);box-shadow:none;}
#panel.light .btn.danger{background:linear-gradient(135deg,#f0577a,#c22a4c);box-shadow:0 12px 22px -14px #c22a4c;}

.giant-sword svg{width:100%;height:100%;}
.art{display:block;overflow:visible;}
.scene-bg{position:absolute;inset:0;z-index:0;pointer-events:none;}
.scene-light{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(26% 40% at 15% 34%, rgba(255,168,72,.72), transparent 72%),
    radial-gradient(26% 40% at 85% 34%, rgba(255,168,72,.72), transparent 72%),
    radial-gradient(46% 30% at 50% 96%, var(--rtint1,rgba(255,150,60,.18)), transparent 72%);
  animation:lightbreathe 4.6s ease-in-out infinite;}
@keyframes lightbreathe{0%,100%{opacity:.92;}50%{opacity:.72;}}
.scene-bg-svg{width:100%;height:100%;display:block;}
.torch-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.6s ease-in-out infinite;}
.torch-flame.f2{animation-duration:1.1s;}
.torch-flame.f3{animation-duration:1.45s;animation-delay:-.4s;}
.torch-flame.f4{animation-duration:1.25s;animation-delay:-.7s;}
@keyframes flicker{0%,100%{transform:scale(1,1);opacity:.95;}35%{transform:scale(.9,1.14);opacity:1;}70%{transform:scale(1.08,.92);opacity:.85;}}
.torch-glow{animation:torchpulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%;}
@keyframes torchpulse{0%,100%{opacity:.9;}50%{opacity:.62;}}
/* ===================== RIGGED SPRITE MOTION ===================== */
.rig .part{transform-box:view-box;}
/* idle: nothing is ever completely still */
.rig .p-torso  {animation:rigBreathe 3.4s ease-in-out infinite;}
.rig .p-head   {animation:rigHead    3.4s ease-in-out infinite;}
.rig .p-armF   {animation:rigArmF    3.4s ease-in-out infinite;}
.rig .p-armB   {animation:rigArmB    3.4s ease-in-out infinite;}
.rig .p-weapon {animation:rigWeapon  3.4s ease-in-out infinite;}
.rig .p-offhand{animation:rigArmB    3.4s ease-in-out infinite;}
.rig .p-shield {animation:rigArmB    3.4s ease-in-out infinite;}
.rig .p-cape,.rig .p-robe,.rig .p-sash{animation:rigCape 4.6s ease-in-out infinite;}
.rig .p-plume,.rig .p-hat{animation:rigPlume 3.1s ease-in-out infinite;}
.rig .p-tail  {animation:rigTail 2.6s ease-in-out infinite;}
.rig .p-wingB {animation:rigWingB 1.5s ease-in-out infinite;}
.rig .p-wingF {animation:rigWingF 1.5s ease-in-out infinite;}
.rig .p-jaw   {animation:rigJaw 3.8s ease-in-out infinite;}
.rig .p-legB,.rig .p-legF{animation:rigLeg 3.4s ease-in-out infinite;}
.rig .p-legF{animation-delay:-1.7s;}
@keyframes rigBreathe{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(-.35px) scaleY(1.02);}}
@keyframes rigHead   {0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-.6px) rotate(-1.6deg);}}
@keyframes rigArmF   {0%,100%{transform:rotate(0deg);}50%{transform:rotate(-3.5deg);}}
@keyframes rigArmB   {0%,100%{transform:rotate(0deg);}50%{transform:rotate(3deg);}}
@keyframes rigWeapon {0%,100%{transform:rotate(0deg);}50%{transform:rotate(-4deg);}}
@keyframes rigCape   {0%,100%{transform:rotate(0deg) skewX(0deg);}34%{transform:rotate(1.5deg) skewX(2.2deg);}70%{transform:rotate(-1.1deg) skewX(-1.6deg);}}
@keyframes rigPlume  {0%,100%{transform:rotate(0deg);}30%{transform:rotate(-5deg);}65%{transform:rotate(3.5deg);}}
@keyframes rigLeg    {0%,100%{transform:rotate(0deg);}50%{transform:rotate(.8deg);}}
@keyframes rigTail   {0%,100%{transform:rotate(-5deg);}50%{transform:rotate(6deg);}}
@keyframes rigWingB  {0%,100%{transform:rotate(6deg) scaleY(1);}50%{transform:rotate(-13deg) scaleY(.9);}}
@keyframes rigWingF  {0%,100%{transform:rotate(-7deg) scaleY(1);}50%{transform:rotate(14deg) scaleY(.9);}}
@keyframes rigJaw    {0%,80%,100%{transform:rotate(0deg);}88%{transform:rotate(7deg) translateY(.5px);}}

/* melee: plant, wind the weapon back, then bring it down */
.sprite-box.dash .p-weapon{animation:swingWeapon .32s cubic-bezier(.2,.8,.3,1);}
.sprite-box.dash .p-armF  {animation:swingArm    .32s cubic-bezier(.2,.8,.3,1);}
.sprite-box.dash .p-torso {animation:leanFwd     .32s cubic-bezier(.2,.8,.3,1);}
.sprite-box.dash .p-head  {animation:leanFwd     .32s cubic-bezier(.2,.8,.3,1);}
.sprite-box.dash .p-cape,.sprite-box.dash .p-robe{animation:capeFlare .42s ease-out;}
@keyframes swingWeapon{0%{transform:rotate(0deg);}28%{transform:rotate(-58deg);}62%{transform:rotate(74deg);}100%{transform:rotate(0deg);}}
@keyframes swingArm   {0%{transform:rotate(0deg);}28%{transform:rotate(-26deg);}62%{transform:rotate(34deg);}100%{transform:rotate(0deg);}}
@keyframes leanFwd    {0%{transform:rotate(0deg);}30%{transform:rotate(-4deg);}62%{transform:rotate(7deg);}100%{transform:rotate(0deg);}}
@keyframes capeFlare  {0%{transform:skewX(0deg);}40%{transform:skewX(-13deg) rotate(-3deg);}100%{transform:skewX(0deg);}}

/* rush: close the distance, then throw everything forward */
.combatant.player .sprite-box.rush{animation:rushfwd .44s cubic-bezier(.3,.9,.3,1);}
@keyframes rushfwd{0%{transform:translateX(0);}22%{transform:translateX(-10px);}55%{transform:translateX(56px);}100%{transform:translateX(0);}}
.sprite-box.rush .p-armF  {animation:punchF .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-armB  {animation:punchB .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-weapon{animation:punchF .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-offhand{animation:punchB .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-torso {animation:rushLean .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-head  {animation:rushLean .44s cubic-bezier(.3,.9,.3,1);}
.sprite-box.rush .p-legB  {animation:rushLegB .44s ease-out;}
.sprite-box.rush .p-legF  {animation:rushLegF .44s ease-out;}
.sprite-box.rush .p-cape,.sprite-box.rush .p-sash{animation:capeFlare .5s ease-out;}
@keyframes punchF {0%{transform:rotate(0deg) translateX(0);}22%{transform:rotate(24deg) translateX(-2px);}52%{transform:rotate(-64deg) translateX(6px);}100%{transform:rotate(0deg) translateX(0);}}
@keyframes punchB {0%{transform:rotate(0deg) translateX(0);}22%{transform:rotate(-20deg);}52%{transform:rotate(40deg) translateX(-3px);}100%{transform:rotate(0deg) translateX(0);}}
@keyframes rushLean{0%{transform:rotate(0deg);}22%{transform:rotate(6deg);}55%{transform:rotate(-11deg);}100%{transform:rotate(0deg);}}
@keyframes rushLegB{0%{transform:rotate(0deg);}30%{transform:rotate(-16deg);}60%{transform:rotate(20deg);}100%{transform:rotate(0deg);}}
@keyframes rushLegF{0%{transform:rotate(0deg);}30%{transform:rotate(18deg);}60%{transform:rotate(-22deg);}100%{transform:rotate(0deg);}}

/* cast: feet stay planted, the staff comes up and the spell leaves it */
.combatant.player .sprite-box.cast{animation:castrock .46s ease-in-out;}
@keyframes castrock{0%,100%{transform:translateX(0);}45%{transform:translateX(-9px) translateY(-3px);}}
.sprite-box.cast .p-weapon{animation:castStaff .46s cubic-bezier(.3,.9,.3,1);}
.sprite-box.cast .p-armF  {animation:castArm   .46s cubic-bezier(.3,.9,.3,1);}
.sprite-box.cast .p-armB  {animation:castArmB  .46s ease-in-out;}
.sprite-box.cast .p-torso {animation:castLean  .46s ease-in-out;}
.sprite-box.cast .p-head  {animation:castLean  .46s ease-in-out;}
.sprite-box.cast .p-robe,.sprite-box.cast .p-cape{animation:capeFlare .56s ease-out;}
@keyframes castStaff{0%{transform:rotate(0deg);}35%{transform:rotate(-30deg) translateY(-2px);}70%{transform:rotate(16deg);}100%{transform:rotate(0deg);}}
@keyframes castArm  {0%{transform:rotate(0deg);}35%{transform:rotate(-42deg);}70%{transform:rotate(12deg);}100%{transform:rotate(0deg);}}
@keyframes castArmB {0%{transform:rotate(0deg);}40%{transform:rotate(22deg);}100%{transform:rotate(0deg);}}
@keyframes castLean {0%{transform:rotate(0deg);}40%{transform:rotate(4deg);}75%{transform:rotate(-3deg);}100%{transform:rotate(0deg);}}

/* the spell itself */
.projectile{
  position:absolute;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:7;
  transform:translate(0,0) scale(.5);opacity:.2;margin:-10px 0 0 -10px;
  transition:transform .3s cubic-bezier(.35,0,.7,1), opacity .12s linear;
}
.projectile.big{width:30px;height:30px;margin:-15px 0 0 -15px;}
.projectile.arcane{background:radial-gradient(circle at 38% 34%,#fff,#8af2ff 42%,#443099 78%);
  box-shadow:0 0 16px 5px rgba(138,242,255,.65), -16px 0 22px -6px rgba(98,72,196,.75);}
.projectile.holy{background:radial-gradient(circle at 38% 34%,#fff,#fff3c4 44%,#e8b64c 80%);
  box-shadow:0 0 16px 5px rgba(255,243,196,.7), -16px 0 22px -6px rgba(232,182,76,.7);}
.projectile.ember{background:radial-gradient(circle at 38% 34%,#fff2c4,#ff9b3d 44%,#b02a12 82%);
  box-shadow:0 0 16px 5px rgba(255,155,61,.7), -16px 0 22px -6px rgba(176,42,18,.75);}
.projectile.venom{background:radial-gradient(circle at 38% 34%,#eaffe0,#8ef5a8 44%,#2c6b33 82%);
  box-shadow:0 0 16px 5px rgba(142,245,168,.65), -16px 0 22px -6px rgba(44,107,51,.7);}

/* monster wind-up when it is about to land a charged hit */
.combatant.monster .sprite-box.telegraph{animation:telegraph .6s ease-in-out;}
@keyframes telegraph{0%,100%{transform:translateX(0) scale(1);filter:none;}
  45%{transform:translateX(12px) scale(1.06);filter:brightness(1.5) saturate(1.3) drop-shadow(0 0 10px rgba(255,120,90,.8));}}
.combatant.monster.boss .sprite-box.telegraph{animation-name:telegraphBoss;}
@keyframes telegraphBoss{0%,100%{transform:scale(1.95);}45%{transform:scale(2.08) translateX(10px);filter:brightness(1.45) drop-shadow(0 0 14px rgba(255,110,80,.85));}}
.combatant.monster .sprite-box.lunge{animation:monlunge .34s cubic-bezier(.3,.9,.3,1);}
@keyframes monlunge{0%{transform:translateX(0);}50%{transform:translateX(-40px);}100%{transform:translateX(0);}}
.combatant.monster.boss .sprite-box.lunge{animation-name:monlungeBoss;}
@keyframes monlungeBoss{0%,100%{transform:scale(1.95);}50%{transform:scale(1.95) translateX(-22px);}}

.combatant.player .sprite-box svg{animation:idlebob 3.2s ease-in-out infinite;}
.combatant.monster .sprite-box svg{animation:idlebob 2.7s ease-in-out infinite;animation-delay:-.9s;}
@keyframes idlebob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@media (prefers-reduced-motion:reduce){.torch-flame,.torch-glow,.combatant .sprite-box svg,.rig .part{animation:none;}}

<script>
/* ============================== STORAGE ============================== */
const Storage = {
  async get(key, fallback){
    try{
      if(window.storage && typeof window.storage.get==='function'){
        const v = await window.storage.get(key);
        return (v===undefined||v===null) ? fallback : v;
      }
    }catch(e){}
    try{
      const raw = localStorage.getItem('sd_'+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{
      if(window.storage && typeof window.storage.set==='function'){
        await window.storage.set(key, value);
        return;
      }
    }catch(e){}
    try{ localStorage.setItem('sd_'+key, JSON.stringify(value)); }catch(e){}
  }
};

/* ============================== UTILS ============================== */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function randInt(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(pct){ return Math.random()*100 < pct; }
function weightedPick(items){ // items: [{v, w}]
  const total = items.reduce((s,i)=>s+i.w,0);
  let r = Math.random()*total;
  for(const it of items){ if(r<it.w) return it.v; r-=it.w; }
  return items[items.length-1].v;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wordCount(s){ return (String(s||'').trim().match(/\S+/g)||[]).length; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function playAnim(element, className, durationMs){
  return new Promise(resolve=>{
    if(!element){ resolve(); return; }
    element.classList.add(className);
    setTimeout(()=>{ element.classList.remove(className); resolve(); }, durationMs);
  });
}
function capitalize(s){ return String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normText(s){ return String(s||'').toLowerCase().trim().replace(/[.,!?;:'"()\-]/g,'').replace(/\s+/g,' '); }
function fuzzyMatch(input, correct){
  const a = normText(input), b = normText(correct);
  if(!a) return false;
  if(a===b) return true;
  const aw = new Set(a.split(' ').filter(w=>w.length>2));
  const bw = new Set(b.split(' ').filter(w=>w.length>2));
  if(bw.size===0) return a===b;
  let hit=0; bw.forEach(w=>{ if(aw.has(w)) hit++; });
  return hit/bw.size >= 0.7;
}

/* ============================== AI CALL (Claude API, user-supplied key) ============================== */
let API_KEY_CACHE = null;
async function getApiKey(){
  if(API_KEY_CACHE!==null) return API_KEY_CACHE;
  API_KEY_CACHE = await Storage.get('apiKey','');
  return API_KEY_CACHE;
}
async function setApiKey(k){ API_KEY_CACHE = k||''; await Storage.set('apiKey', API_KEY_CACHE); }
async function callClaude(userText, imageParts){
  const apiKey = await getApiKey();
  if(!apiKey) throw new Error('No API key set — add one in Study \u2192 AI Settings to enable live AI notes/flashcards. Using the offline generator instead.');
  try{
    const content = [];
    if(imageParts && imageParts.length){
      for(const img of imageParts){
        content.push({type:'image', source:{type:'base64', media_type:'image/png', data: img}});
      }
    }
    content.push({type:'text', text:userText});
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens:1400,
        messages:[{role:'user', content}]
      })
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('AI request failed ('+res.status+'): '+t.slice(0,200));
    }
    const data = await res.json();
    const blk = (data.content||[]).find(b=>b.type==='text');
    return blk ? blk.text : '';
  }catch(err){
    throw new Error('AI call error: '+(err && err.message ? err.message : String(err)));
  }
}

/* ============================== PDF EXTRACTION ============================== */
if(window.pdfjsLib){
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
}
async function extractPdfText(arrayBuffer, onProgress){
  const doc = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
    if(onProgress) onProgress(i, doc.numPages);
  }
  return {text, doc};
}
async function renderPdfPageToImage(doc, pageNum, scale){
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({scale: scale||1.3});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport}).promise;
  return canvas.toDataURL('image/png').split(',')[1];
}
function chunkWords(text, wordsPerChunk){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const chunks = [];
  for(let i=0;i<words.length;i+=wordsPerChunk){
    chunks.push(words.slice(i,i+wordsPerChunk).join(' '));
  }
  return chunks.length ? chunks : [''];
}

/* ============================== LOCAL (OFFLINE) STUDY ANALYZER ============================== */
const STOPWORDS = new Set('a an the of to in on for and or but is are was were be been being this that these those it its as at by with from not no yes you your i we our they their he she his her them can will would should could may might into out about over under above below than then so such very more most also just only than'.split(' '));
function splitSentences(text){
  return String(text||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z0-9])/).map(s=>s.trim()).filter(s=>s.length>0);
}
function localAnalyze(text){
  const sentences = splitSentences(text).filter(s=>{ const wc=wordCount(s); return wc>=4 && wc<=42; });
  const freq = {};
  sentences.forEach(s=>{
    s.toLowerCase().match(/[a-z0-9']+/g)?.forEach(w=>{ if(!STOPWORDS.has(w) && w.length>2) freq[w]=(freq[w]||0)+1; });
  });
  const scored = sentences.map((s,idx)=>{
    const words = s.toLowerCase().match(/[a-z0-9']+/g)||[];
    const score = words.reduce((sum,w)=>sum+(freq[w]||0),0) / Math.max(1,words.length);
    return {s, idx, score};
  });
  const topN = clamp(Math.round(sentences.length*0.4), 4, 18);
  const top = scored.slice().sort((a,b)=>b.score-a.score).slice(0,topN).sort((a,b)=>a.idx-b.idx);
  const notes = top.length ? top.map(t=>'• '+t.s).join('\n') : (text||'').slice(0,600);

  // term:definition pattern flashcards
  const flashcards = [];
  const lines = String(text||'').split(/\n+/);
  lines.forEach(line=>{
    const m = line.match(/^\s*([A-Z][A-Za-z0-9 '\-]{2,40})\s*[:\-–]\s*(.{6,160})$/);
    if(m && flashcards.length<20){ flashcards.push({id:uid(), front:'Define/explain: '+m[1].trim(), back:m[2].trim(), mastery:0, dueAt:0}); }
  });
  // cloze-deletion fallback from top sentences
  if(flashcards.length<6){
    top.forEach(t=>{
      if(flashcards.length>=16) return;
      const words = t.s.match(/[A-Za-z][A-Za-z0-9'\-]{3,}/g)||[];
      if(!words.length) return;
      const candidates = words.filter(w=>!STOPWORDS.has(w.toLowerCase()));
      if(!candidates.length) return;
      const target = candidates.reduce((a,b)=> b.length>a.length?b:a);
      const re = new RegExp('\\b'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
      if(!re.test(t.s)) return;
      const blanked = t.s.replace(re, '_____');
      flashcards.push({id:uid(), front:'Fill in the blank: '+blanked, back:target, mastery:0, dueAt:0});
    });
  }
  return {notes, flashcards};
}

function buildWeaponCatalog(){
  const list = [];
  Object.keys(WEAPON_NAME_LINES).forEach(classId=>{
    WEAPON_NAME_LINES[classId].forEach((name,i)=>{
      const rarity = RARITY_ORDER[i];
      const mult = RARITY_MULT[rarity];
      list.push({
        lineId:'w_'+classId+'_'+rarity, kind:'weapon', classId, rarity, name,
        atk: Math.round(6*mult), critBonus: RARITY_BONUS[rarity].crit, lifeBonus: RARITY_BONUS[rarity].life,
        floorMin: RARITY_FLOOR_MIN[rarity],
        desc: `${CLASSES[classId].name}-line ${CLASSES[classId].weaponType.toLowerCase()}. +${Math.round(6*mult)} Attack${RARITY_BONUS[rarity].crit?`, +${RARITY_BONUS[rarity].crit}% Crit`:''}${RARITY_BONUS[rarity].life?`, +${RARITY_BONUS[rarity].life}% Lifesteal`:''}.`,
      });
    });
  });
  return list;
}
function buildArmorCatalog(){
  const list = [];
  ARMOR_SLOTS.forEach(slot=>{
    RARITY_ORDER.forEach(rarity=>{
      const mult = RARITY_MULT[rarity];
      const name = ARMOR_NAME_PREFIX[rarity]+' '+ARMOR_SLOT_LABEL[slot];
      list.push({
        lineId:'a_'+slot+'_'+rarity, kind:'armor', slot, rarity, name,
        def: Math.round(4*mult), pierceResist: RARITY_BONUS[rarity].pierce,
        floorMin: RARITY_FLOOR_MIN[rarity],
        desc: `${capitalize(slot)} armor. +${Math.round(4*mult)} Defense.`,
      });
    });
  });
  return list;
}

function regionForFloor(floor){ return Math.min(10, Math.ceil(floor/10)); }
function isBossFloor(floor){ return floor%10===0; }
function isFinalFloor(floor){ return floor===MAX_FLOOR; }
function monsterEnergyMaxForFloor(floor){ if(isFinalFloor(floor)) return 5; if(isBossFloor(floor)) return 4; return 3; }
function monsterStatsForFloor(floor, ngPlus){
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const ngMult = 1 + (ngPlus||0)*0.5;
  let hp = (30 + floor*7) * ngMult, atk = (4 + floor*1.15) * ngMult, def = (1 + floor*0.35) * ngMult;
  if(boss){ hp*=2.8; atk*=1.7; def*=1.5; }
  if(final){ hp*=1.7; atk*=1.5; def*=1.4; }
  return {hp:Math.round(hp), atk:Math.round(atk), def:Math.round(def)};
}
function generateMonster(floor, ngPlus){
  const region = regionForFloor(floor);
  const rd = REGIONS[region-1];
  const boss = isBossFloor(floor), final = isFinalFloor(floor);
  const bd = boss ? bossDefForFloor(floor) : null;
  const name = bd ? bd.name : rd.monster;
  const arche = bd ? bd.sprite : rd.arche;
  const s = monsterStatsForFloor(floor, ngPlus);
  return {name, hp:s.hp, maxHp:s.hp, atk:s.atk, def:s.def, region, regionName:rd.name,
    color: final?'#8dff9f':rd.color, arche, palKey: bd ? bd.pal : null, bossFloor: boss ? floor : null,
    abilityName: bd ? bd.abilityName : null, abilityDesc: bd ? bd.abilityDesc : null,
    isBoss:boss, isFinal:final, energy:0, energyMax:monsterEnergyMaxForFloor(floor)};
}
function bossFloorsUpTo(floor){ const list=[]; for(let f=10;f<=Math.min(90,floor);f+=10) list.push(f); return list; }

  if(m && m.gauntletAbility) return m.gauntletAbility;
  if(!m || !m.isBoss) return null;
  const d = bossDefForFloor(m.bossFloor || m.floor);
  return d ? d.ability : null;
}
function bossModifyIncomingDamage(dmg, isSkill){
  const ab = bossAbility();
  if(ab==='heroOfOld') return Math.max(1, Math.round(dmg*0.5));
  if(ab==='boneArmor' && (App.run.bossTurn||0) % 2 === 0) return Math.max(1, Math.round(dmg*0.55));
  if(ab==='stoneskin') return Math.max(1, Math.round(dmg*(isSkill?1.6:1)) - (isSkill?0:8));
  return dmg;
}
function bossAfterPlayerHit(dmg){
  const ab = bossAbility();
  const st = combatStats();
  if(ab==='moltenCore'){
    const back = Math.max(1, Math.round(dmg*0.2));
    App.run.hp = clamp(App.run.hp - back, 0, st.maxHp);
    return {reflect:back};
  }
  return {};
}
function bossUnbound(){
  const m = App.run.monster;
  return bossAbility()==='devour' && m && m.hp/m.maxHp < 0.5;
}
function bossModifyOutgoingDamage(dmg, charged){
  const ab = bossAbility();
  const m = App.run.monster;
  let hits = 1, notes = [];
  if(ab==='devour' && bossUnbound()){ dmg = Math.round(dmg*1.45); notes.push('Unbound!'); }
  if(ab==='stormcall' && charged){ hits = 2; notes.push('Stormcall — twice!'); }
  if(ab==='heroOfOld' && charged){ hits = 2; notes.push('Twin axes!'); }
  if(ab==='darkRitual'){ dmg = Math.round(dmg * (1 + 0.08*(App.run.bossTurn||0))); }
  if(ab==='infernalBreath' && m && m.hp/m.maxHp < 0.3){ dmg = Math.round(dmg*1.5); notes.push('Enraged!'); }
  return {dmg, hits, notes};
}
function bossAfterMonsterHit(totalDamage, charged){
  const ab = bossAbility();
  const m = App.run.monster;
  const notes = [];
  if(ab==='soulHarvest' && m){
    const heal = Math.max(1, Math.round(totalDamage*0.3));
    m.hp = clamp(m.hp + heal, 0, m.maxHp);
    notes.push('+'+heal+' drained');
  }
  if(ab==='venom'){ App.run.poison = {turnsLeft:2, perTurn: Math.max(2, Math.round(totalDamage*0.25))}; notes.push('Poisoned!'); }
  if(ab==='deepFreeze' && charged){ App.run.frozen = true; notes.push('Frozen!'); }
  if(ab==='infernalBreath' && charged){ App.run.playerBurn = {turnsLeft:3, perTurn: Math.max(3, Math.round(totalDamage*0.2))}; notes.push('Burning!'); }
  if(ab==='devour' && bossUnbound() && charged){ App.run.playerBurn = {turnsLeft:2, perTurn: Math.max(3, Math.round(totalDamage*0.18))}; notes.push('Seared by void-script!'); }
  return notes;
}
function bossTurnTick(){
  const ab = bossAbility();
  App.run.bossTurn = (App.run.bossTurn||0) + 1;
  if(ab==='devour' && App.run.bossTurn % 3 === 0){
    const m = App.run.monster;
    const heal = Math.max(5, Math.round(m.maxHp*0.05));
    m.hp = clamp(m.hp + heal, 0, m.maxHp);
    App.run.hintsSealed = true;
    return 'Malakor devours a memory — +'+heal+' HP, hints sealed this turn!';
  }
  if(ab==='heroOfOld'){
    const m = App.run.monster;
    if(m && m.hp/m.maxHp < 0.5 && !App.run.dwarfHealed){
      App.run.dwarfHealed = true;
      const heal = Math.round(m.maxHp*0.25);
      m.hp = clamp(m.hp + heal, 0, m.maxHp);
      return 'Durin drains a draught — +'+heal+' HP!';
    }
  }
  if(ab==='constrict' && App.run.bossTurn % 3 === 0){
    App.run.energy = Math.max(0, App.run.energy - 2);
    return 'Constricted — 2 Energy drained!';
  }
  return null;
}

/* Recipes eat far more iron than anything else, so the commons are weighted by
   what the forge actually asks for, and stacks grow with depth so late recipes
   stay reachable. Signature materials only come from the family that carries them. */
const COMMON_MAT_WEIGHTS = [{v:'iron',w:38},{v:'leather',w:23},{v:'cloth',w:21},{v:'wood',w:18}];
function pickCommonMat(){ return weightedPick(COMMON_MAT_WEIGHTS); }
function matDepthBonus(floor){ return clamp(Math.floor((floor||1)/25), 0, 3); }
function pickMaterialId(floor){
  if(chance(68)) return pickCommonMat();
  const reach = clamp(regionForFloor(floor||1), 1, REGIONS.length);
  const sigs = REGIONS.slice(0, reach).map(r=>MONSTER_MATERIALS[r.arche]).filter(Boolean);
  return sigs.length ? pick(sigs) : pickCommonMat();
}
function rollMaterialDrops(floor, arche, boss){
  const drops = {};
  const depth = matDepthBonus(floor);
  const sig = MONSTER_MATERIALS[arche];
  if(sig && chance(boss?95:58)) drops[sig] = randInt(1, boss?4:2) + depth;
  const picks = (boss?3:1) + (chance(50)?1:0) + (floor>=50?1:0);
  for(let i=0;i<picks;i++){
    const id = pickCommonMat();
    drops[id] = (drops[id]||0) + randInt(1, boss?3:2) + depth;
  }
  return drops;
}

}

function coreTierForFloor(floor){
  if(floor>=76) return 't4';
  if(floor>=51) return 't3';
  if(floor>=26) return 't2';

function coreIcon(tier, size){
  const t = CORE_TIERS[tier] || CORE_TIERS.t1;
  const s = size||22, g = artId('core');
  const bright = shade(t.hue, .55), deep = shade(t.hue, -.5);
  const glowOpacity = 0.15 + t.glow*0.5;
  return `<svg class="core-icon" width="${s}" height="${s}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${g}"><stop offset="0" stop-color="${bright}"/><stop offset=".55" stop-color="${t.hue}"/><stop offset="1" stop-color="${deep}"/></radialGradient></defs>
    ${t.glow>0?`<circle cx="16" cy="16" r="15" fill="${t.hue}" opacity="${glowOpacity}"/>`:''}
    <circle cx="16" cy="16" r="11" fill="url(#${g})" stroke="${deep}" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6.5" fill="none" stroke="${bright}" stroke-width="1.2" opacity="${0.35+t.glow*0.5}"/>
    <ellipse cx="12.5" cy="12" rx="3.4" ry="2.4" fill="#ffffff" opacity="${0.5+t.glow*0.35}" transform="rotate(-30 12.5 12)"/>
    ${t.glow>0.6?`<circle cx="16" cy="16" r="11" fill="none" stroke="${bright}" stroke-width="1" opacity=".8"/>`:''}
  </svg>`;
}
function addCoreTo(ch, tier, n){ ch.cores = ch.cores || {}; ch.cores[tier] = (ch.cores[tier]||0) + (n||1); }
function coreCount(tier){ return (App.character.cores && App.character.cores[tier]) || 0; }
function totalCorePower(includeBoss){
  return CORE_ORDER.reduce((sum,t)=>{
    if(t==='boss' && !includeBoss) return sum;
    return sum + coreCount(t)*CORE_TIERS[t].power;
  }, 0);
}
function tierRank(t){ return ['t1','t2','t3','t4','boss'].indexOf(t); }
function coresAtOrAbove(tier){
  const min = tierRank(tier);
  return CORE_ORDER.reduce((n,t)=> (tierRank(t)>=min && t!=='boss') ? n+coreCount(t) : n, 0);
}
function spendCoresAtOrAbove(tier, count){
  // spends the dullest qualifying cores first, keeping the bright ones back
  const ch = App.character, min = tierRank(tier);
  let left = count;
  for(const t of ['t1','t2','t3','t4']){
    if(tierRank(t) < min) continue;
    const take = Math.min(left, coreCount(t));
    ch.cores[t] -= take;
    left -= take;
    if(left<=0) break;
  }
  return left<=0;
}
function spendCorePower(amount){
  // drains the dullest cores first so the bright ones stay for legendary work
  const ch = App.character;
  let left = amount;
  for(const t of ['t1','t2','t3','t4']){
    while(left > 0 && coreCount(t) > 0){
      ch.cores[t]--;
      left -= CORE_TIERS[t].power;
    }
    if(left <= 0) break;
  }
  return left <= 0;
}
function addCore(tier, n){ addCoreTo(App.character, tier, n); }
function addFloorCore(floor, n){ const t = coreTierForFloor(floor); addCore(t, n); return t; }

function backfill(target, defaults, nested){
  if(!target || typeof target!=='object') return JSON.parse(JSON.stringify(defaults));
  for(const k in defaults){
    if(!(k in target)){ target[k] = JSON.parse(JSON.stringify(defaults[k])); }
    else if(defaults[k] && typeof defaults[k]==='object' && !Array.isArray(defaults[k]) && typeof target[k]==='object'){
      backfill(target[k], defaults[k], true);
    }
  }
  // only the save root is version-stamped — stamping nested maps would inject a
  // bogus "version" entry into count maps like potions/books/materials
  if(!nested) target.version = SAVE_VERSION;
  return target;
}
// scrub the bogus "version" key older builds wrote into count maps
const COUNT_MAPS = ['potions','books','learnedSkills','materials','blueprints','blueprintItems','runBonuses','cores','classProgress','equipped'];
function scrubCountMaps(character){
  COUNT_MAPS.forEach(k=>{ const m = character[k]; if(m && typeof m==='object' && 'version' in m) delete m.version; });
  return character;
}

function migrateCharacter(character){
  character = backfill(character, defaultCharacter());
  if(!CLASSES[character.classId]) character.classId = 'warrior';
  if(character.crystals){ addCoreTo(character,'t1', character.crystals); delete character.crystals; }
  if(character.diamonds){ character.gems = (character.gems||0) + character.diamonds; delete character.diamonds; }
  if(character.cores && character.cores.monster){ addCoreTo(character,'t1', character.cores.monster); delete character.cores.monster; }
  if(character.scrap){ character.materials = character.materials||{}; character.materials.iron = (character.materials.iron||0) + character.scrap; delete character.scrap; }
  scrubCountMaps(character);
  if(character.discovered){ Object.assign(App.discovered, character.discovered); delete character.discovered; }
  // the Index is global: reads/writes on any character hit the one shared map,
  // and it is non-enumerable so it never gets copied into a realm's save blob.
  Object.defineProperty(character, 'discovered', {
    get(){ return App.discovered; }, enumerable:false, configurable:true,
  });
  return character;
}
function freshRealm(){ return {character: migrateCharacter(defaultCharacter()), run: defaultRun()}; }
function realmExists(id){ return !!App.profiles[id]; }
function realmData(id){
  let p = App.profiles[id];
  if(!p){ p = App.profiles[id] = freshRealm(); return p; }
  if(!p.__live){
    p.character = migrateCharacter(p.character);
    p.run = backfill(p.run, defaultRun());
    p.__live = true;
  }
  return p;
}

async function loadAll(){
  const subjects = await Storage.get('subjects', null);
  App.subjects = (subjects && subjects.length) ? subjects.map(normalizeSubject) : defaultSubjects();
  if(!App.subjects.some(s=>s.builtin==='multiplication')){
    // older saves had a single empty placeholder subject — give them Mathematics
    const placeholder = App.subjects.length===1 && !App.subjects[0].flashcards.length && !App.subjects[0].notes;
    if(placeholder) App.subjects = defaultSubjects();
    else App.subjects = defaultSubjects().concat(App.subjects);
  }
  await getApiKey();

  App.discovered = (await Storage.get('discovered', null)) || {};
  let profiles = await Storage.get('profiles', null);
  if(!profiles){
    // migrate the old single-character save into the realm that was being played
    profiles = {};
    const legacyChar = await Storage.get('character', null);
    const legacyRun = await Storage.get('run', null);
    if(legacyChar){
      const legacyActive = await Storage.get('activeSubjectId', null);
      const target = (legacyActive && App.subjects.find(s=>s.id===legacyActive)) ? legacyActive : App.subjects[0].id;
      profiles[target] = {character: legacyChar, run: legacyRun || defaultRun()};
    }
  }
  App.profiles = profiles;
  Object.keys(App.profiles).forEach(k=>{
    const c = App.profiles[k] && App.profiles[k].character;
    if(c && c.discovered) Object.assign(App.discovered, c.discovered);
  });

  App.activeSubjectId = await Storage.get('activeSubjectId', App.subjects[0].id);
  if(!App.subjects.find(s=>s.id===App.activeSubjectId)) App.activeSubjectId = App.subjects[0].id;

  let pid = await Storage.get('profileId', null);
  if(pid!==INFINITY_ID && !App.subjects.find(s=>s.id===pid)) pid = null;
  App.profileId = pid || App.subjects[0].id;
  const p = realmData(App.profileId);
  App.character = p.character;
  App.run = p.run;
  App.dungeonView = 'select';
  await saveProfiles(); await saveDiscovered();
}

async function saveDiscovered(){ await Storage.set('discovered', App.discovered); }
async function saveProfiles(){
  if(App.profileId){
    const p = App.profiles[App.profileId] || (App.profiles[App.profileId] = {});
    p.character = App.character; p.run = App.run; p.__live = true;
  }

}

/* ============================== PIXEL ART ENGINE ==============================
   Hand-authored sprites. Each sprite is a small grid of palette keys drawn with
   pixel-exact runs; the renderer adds a 1px dark outline and paints at integer
   scale so everything stays crisp.
   ========================================================================== */
function shade(hex, pct){
  const c = String(hex||'#888').replace('#','');
  const num = parseInt(c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  const t = pct<0?0:255, p = Math.abs(pct);
  r = Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
let __artSeq = 0;
function artId(prefix){ return prefix+(++__artSeq); }
function pxGrid(w,h){ const g=Array.from({length:h},()=>Array(w).fill('.')); g.w=w; g.h=h; return g; }
function P(g,y,x,str){ for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch==='.'||ch===' ') continue; if(g[y] && x+i>=0 && x+i<g.w) g[y][x+i]=ch; } }
function R(g,x,y,w,h,ch){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++){ if(g[j] && i>=0 && i<g.w) g[j][i]=ch; } }
function pxFromRows(rows, w, h){
  const g = pxGrid(w, h);
  for(let y=0;y<rows.length && y<h;y++) P(g, y, 0, rows[y]);
  return g;
}
function renderPixels(grid, palette, outline){
  const w=grid.w, h=grid.h;
  const out = outline===false ? null : (outline||'#0b0910');
  const cells = [];
  const filled=(x,y)=> y>=0&&y<h&&x>=0&&x<w&&grid[y][x]!=='.';
  let svg = `<svg class="pxart" viewBox="${out?-1:0} ${out?-1:0} ${w+(out?2:0)} ${h+(out?2:0)}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">`;
  if(out){
    let d='';
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(filled(x,y)) continue;
      if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1)||filled(x-1,y-1)||filled(x+1,y-1)||filled(x-1,y+1)||filled(x+1,y+1))
        d += `M${x} ${y}h1v1h-1z`;
    }
    svg += `<path d="${d}" fill="${out}"/>`;
  }
  const byColor = {};
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const k = grid[y][x];
    if(k==='.') continue;
    const col = palette[k] || '#ff00ff';
    (byColor[col] = byColor[col] || []).push(`M${x} ${y}h1v1h-1z`);
  }
  Object.keys(byColor).forEach(col=>{ svg += `<path d="${byColor[col].join('')}" fill="${col}"/>`; });
  return svg + '</svg>';
}
function setArt(host, markup){ if(host) host.innerHTML = markup; }

/* ============================== RIGGED SPRITES ==============================
   A rig is one pixel grid cut into named parts. Each part becomes its own <g>
   with a pivot in viewBox units, so CSS can rotate a shoulder or a jaw without
   the rest of the body following. Outlines are computed against the WHOLE grid,
   so the seams between parts stay invisible while the silhouette keeps its
   1px border.
   parts: [{name, x, y, w, h, px, py}]  — px/py are the joint, in grid units.
   Earlier entries render first (further back). Cells claimed by an earlier part
   are not redrawn by a later one, so parts may overlap freely.
   ========================================================================== */
function rigPart(name, x, y, w, h, px, py){ return {name, x, y, w, h, px, py}; }
function renderRig(grid, palette, parts, opts){
  opts = opts || {};
  const w = grid.w, h = grid.h;
  const out = opts.outline===false ? null : (opts.outline || '#0b0910');
  const filled = (x,y)=> y>=0 && y<h && x>=0 && x<w && grid[y][x]!=='.';
  // Claim front-to-back (reverse of draw order): a hand owns its own pixels even
  // though the cloak's box covers it, and the cloak keeps only what is left.
  const owner = Array.from({length:h}, ()=>Array(w).fill(-1));
  for(let i=parts.length-1; i>=0; i--){
    const p = parts[i];
    for(let y=p.y; y<p.y+p.h; y++){
      for(let x=p.x; x<p.x+p.w; x++){
        if(!filled(x,y)) continue;
        if(owner[y][x]===-1) owner[y][x] = i;
      }
    }
  }
  // any pixel no part claimed belongs to the body, so nothing is ever dropped
  const fallback = Math.max(0, parts.findIndex(p=>p.name==='torso'));
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(filled(x,y) && owner[y][x]===-1) owner[y][x] = fallback; }

  const pad = 2;
  let svg = `<svg class="pxart rig" viewBox="${-pad} ${-pad} ${w+pad*2} ${h+pad*2}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">`;
  parts.forEach((p,i)=>{
    const byColor = {};
    let od = '';
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(owner[y][x]!==i) continue;
      const col = palette[grid[y][x]] || '#ff00ff';
      (byColor[col] = byColor[col] || []).push(`M${x} ${y}h1v1h-1z`);
    }
    if(out){
      const mine = (x,y)=> y>=0 && y<h && x>=0 && x<w && owner[y][x]===i;
      for(let y=-1;y<=h;y++) for(let x=-1;x<=w;x++){
        if(filled(x,y)) continue;          // never outline into the body itself
        if(mine(x-1,y)||mine(x+1,y)||mine(x,y-1)||mine(x,y+1)||
           mine(x-1,y-1)||mine(x+1,y-1)||mine(x-1,y+1)||mine(x+1,y+1))
          od += `M${x} ${y}h1v1h-1z`;
      }
    }
    if(!od && !Object.keys(byColor).length) return;
    svg += `<g class="part p-${p.name}" style="transform-origin:${p.px}px ${p.py}px">`;
    if(od) svg += `<path d="${od}" fill="${out}"/>`;
    Object.keys(byColor).forEach(col=>{ svg += `<path d="${byColor[col].join('')}" fill="${col}"/>`; });
    svg += `</g>`;
  });
  return svg + '</svg>';
}

const CREATURE_ART = {tyrant:creTyrant, devourer:creDevourer, warden:creWarden, colossus:creColossus, roc:creRoc, reaper:creReaper, overseer:creOverseer, serpent:creSerpent, golem:creGolem, rimewraith:creRimeWraith, matriarch:creMatriarch,

function bossPalette(pal){
  const out = {};
  Object.keys(pal).forEach(k=>{ out[k] = 'EGW'.includes(k) ? pal[k] : shade(pal[k], -0.14); });
  return out;
}
function creatureArt(kind, color, opts){
  opts = opts || {};
  const fn = CREATURE_ART[kind] || creSkeleton;
  let [g, pal] = fn();
  if(opts.palKey && typeof BOSS_PALETTES!=='undefined' && BOSS_PALETTES[opts.palKey]){
    pal = Object.assign({}, pal, BOSS_PALETTES[opts.palKey]);
  }
  const dedicated = ['warden','serpent','golem','rimewraith','matriarch','colossus','roc','reaper','overseer','dragon'].indexOf(kind)>=0;
  if(!opts.boss || dedicated) return renderPixels(g, pal);
  let top = g.h, left = g.w, right = 0;
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    if(g[y][x]==='.') continue;
    if(y<top) top=y;
    if(x<left) left=x; if(x>right) right=x;
  }
  const cx = Math.round((left+right)/2);
  const cp = Object.assign({}, bossPalette(pal), {'Y':'#ffe066','y':'#c9962a'});
  if(top>=3){
    P(g, top-2, cx-4, 'Y.Y.Y.Y.Y');
    P(g, top-1, cx-4, 'YYYYYYYYY');
    P(g, top-1+1===top?top:top-1, cx-4, '');
    P(g, top-0-1, cx-4, 'YYYYYYYYY');
    P(g, top-1, cx-4, 'YyYYYyYYY');
  }
  return renderPixels(g, cp);
}
