/* ---- Drop Editor ---- */
function deleteCustomDrop(id){ App.character.customDrops = App.character.customDrops.filter(e=>e.id!==id); saveCharacter(); render(); }
function renderDropEditor(){
  const outer = document.createDocumentFragment();
  outer.appendChild(el(`<div class="px-panel"><div class="dg-h1">DROP EDITOR</div><p>Add fully custom drop-table entries. They roll independently every floor clear where the current floor falls in range.</p></div>`));

  const form = el(`<div class="px-panel">
    <div class="dg-h2">New Entry</div>
    <div class="form-grid">
      <label>Name <input class="px-input" id="de-name" type="text"></label>
      <label>Kind <select class="px-input" id="de-kind">
        <option value="weapon">Weapon</option><option value="armor">Armor</option><option value="rune">Rune</option><option value="crystal">Charge Crystal</option><option value="artifact">Artifact</option>
      </select></label>
      <label>Floor Min <input class="px-input" id="de-min" type="number" min="1" max="100" value="1"></label>
      <label>Floor Max <input class="px-input" id="de-max" type="number" min="1" max="100" value="100"></label>
      <label>Chance % <input class="px-input" id="de-chance" type="number" min="0" max="100" value="10"></label>
    </div>
    <div class="form-grid" id="de-kindfields"></div>
    <button class="px-btn gold" id="de-add">Add Entry</button>
  </div>`);
  const kindSel = form.querySelector('#de-kind');
  const kindFields = form.querySelector('#de-kindfields');
  function renderKindFields(){
    const k = kindSel.value;
    kindFields.innerHTML = '';
    if(k==='weapon'){
      kindFields.appendChild(el(`<label>Trait <select class="px-input" id="de-trait"><option value="plain">Plain</option><option value="lifesteal">Lifesteal</option><option value="crit">Crit</option></select></label>`));
      kindFields.appendChild(el(`<label>Damage <input class="px-input" id="de-dmg" type="number" value="10"></label>`));
      kindFields.appendChild(el(`<label>Lifesteal % <input class="px-input" id="de-lifesteal" type="number" value="0"></label>`));
      kindFields.appendChild(el(`<label>Crit Chance % <input class="px-input" id="de-critc" type="number" value="0"></label>`));
      kindFields.appendChild(el(`<label>Crit Dmg % <input class="px-input" id="de-critd" type="number" value="0"></label>`));
    } else if(k==='armor'){
      kindFields.appendChild(el(`<label>Slot <select class="px-input" id="de-slot"><option value="helmet">Helmet</option><option value="chest">Chest</option><option value="legs">Legs</option><option value="boots">Boots</option></select></label>`));
      kindFields.appendChild(el(`<label>Trait <select class="px-input" id="de-trait"><option value="plain">Plain</option><option value="reflect">Reflect</option><option value="heavydef">Heavy Defense</option></select></label>`));
      kindFields.appendChild(el(`<label>Defense % <input class="px-input" id="de-def" type="number" value="10"></label>`));
      kindFields.appendChild(el(`<label>Reflect % <input class="px-input" id="de-refl" type="number" value="0"></label>`));
    } else if(k==='rune'){
      kindFields.appendChild(el(`<label>Element <select class="px-input" id="de-element"><option value="fire">Fire</option><option value="water">Water</option><option value="light">Light</option><option value="nature">Nature</option><option value="dark">Dark</option></select></label>`));
      kindFields.appendChild(el(`<label>Dmg Bonus <input class="px-input" id="de-runedmg" type="number" value="5"></label>`));
    } else if(k==='artifact'){
      kindFields.appendChild(el(`<label>Which Artifact <select class="px-input" id="de-artifact"><option value="phoenix">Phoenix Charm</option><option value="oracle">Oracle's Lens</option></select></label>`));
    }
  }
  kindSel.addEventListener('change', renderKindFields);
  renderKindFields();
  form.querySelector('#de-add').addEventListener('click', ()=>{
    const name = form.querySelector('#de-name').value.trim() || 'Custom Item';
    const kind = kindSel.value;
    const entry = {
      id: uid(), name, kind,
      floorMin: clamp(parseInt(form.querySelector('#de-min').value)||1,1,100),
      floorMax: clamp(parseInt(form.querySelector('#de-max').value)||100,1,100),
      chance: clamp(parseFloat(form.querySelector('#de-chance').value)||10,0,100),
    };
    if(kind==='weapon'){
      entry.trait = form.querySelector('#de-trait').value;
      entry.dmg = parseFloat(form.querySelector('#de-dmg').value)||0;
      entry.lifestealPct = parseFloat(form.querySelector('#de-lifesteal').value)||0;
      entry.critChance = parseFloat(form.querySelector('#de-critc').value)||0;
      entry.critDmg = parseFloat(form.querySelector('#de-critd').value)||0;
    } else if(kind==='armor'){
      entry.slot = form.querySelector('#de-slot').value;
      entry.trait = form.querySelector('#de-trait').value;
      entry.defensePct = parseFloat(form.querySelector('#de-def').value)||0;
      entry.reflectPct = parseFloat(form.querySelector('#de-refl').value)||0;
    } else if(kind==='rune'){
      entry.element = form.querySelector('#de-element').value;
      entry.dmgBonus = parseFloat(form.querySelector('#de-runedmg').value)||0;
    } else if(kind==='artifact'){
      entry.artifact = form.querySelector('#de-artifact').value;
    }
    App.character.customDrops.push(entry);
    saveCharacter();
    render();
  });
  outer.appendChild(form);

  const list = el(`<div class="px-panel"><div class="dg-h2">Existing Entries</div><table class="tbl"><tr><th>Name</th><th>Kind</th><th>Floors</th><th>Chance</th><th></th></tr></table></div>`);
  const tbl = list.querySelector('.tbl');
  (App.character.customDrops||[]).forEach(entry=>{
    const row = el(`<tr><td>${escapeHtml(entry.name)}</td><td>${entry.kind}</td><td>${entry.floorMin}-${entry.floorMax}</td><td>${entry.chance}%</td><td></td></tr>`);
    const delBtn = el('<button class="btn-pixel-sm danger">Delete</button>');
    delBtn.addEventListener('click', ()=>deleteCustomDrop(entry.id));
    row.lastElementChild.appendChild(delBtn);
    tbl.appendChild(row);
  });
  if(!App.character.customDrops || !App.character.customDrops.length) tbl.appendChild(el('<tr><td colspan="5" class="muted">No custom entries yet.</td></tr>'));
  outer.appendChild(list);

  outer.appendChild(backHubBtn());
  const o = el('<div></div>'); o.appendChild(outer);
  return o;
}

/* ============================== BOOTSTRAP ============================== */
async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    App.subjects = [{id:uid(), name:'General Studies', notes:'', flashcards:[]}];
    App.activeSubjectId = App.subjects[0].id;
    App.character = defaultCharacter();
    App.run = defaultRun();
  }
  App.dungeonView = App.run.active ? 'hub' : 'hub';
  render();
}
init();
